name: Cache bust F6-F8 desk assets

on:
  push:
    branches: [ui/f6-f8-desks]
    paths:
      - '.github/workflows/cache-bust-f6-f8-desks.yml'

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/f6-f8-desks
      - name: Bump dashboard asset version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('runner.html')
          s=p.read_text()
          old='report-dashboard-vigscope.js?v=20260821-1621'
          new='report-dashboard-vigscope.js?v=20260821-1631'
          if old in s:
              p.write_text(s.replace(old,new))
          elif new not in s:
              raise SystemExit('runner dashboard asset tag not found')
          PY
      - name: Commit cache bust
        shell: bash
        run: |
          if git diff --quiet -- runner.html; then
            echo 'runner.html already updated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add -- runner.html
          git commit -m 'Cache bust F6-F8 desk navigation'
          git push origin ui/f6-f8-desks
