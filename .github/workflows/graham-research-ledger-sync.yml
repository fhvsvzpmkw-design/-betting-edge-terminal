name: Graham research ledger sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/graham-research-ledger-sync.yml'
      - 'tools/graham-research-ledger-sync.py'
      - 'tests/graham-research-ledger-sync.test.py'
      - 'data/walters/nfl/20*/week-*-research-events/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graham-research-ledger-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify append-only transport
        run: python tests/graham-research-ledger-sync.test.py
      - name: Append research sweeps without changing boards
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python tools/graham-research-ledger-sync.py --write > /tmp/graham-research-ledger-sync.json
            cat /tmp/graham-research-ledger-sync.json
            git add -- 'data/walters/nfl/20*/week-*-research-ledger.json'
            if git diff --cached --quiet; then
              echo 'No research-ledger additions required.'
              exit 0
            fi
            git commit -m 'Append Graham research events to weekly ledgers'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Concurrent writes prevented research-ledger publication; retry recomputed against latest main.' >&2
          exit 1
