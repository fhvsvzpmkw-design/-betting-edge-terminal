name: Walters QB Stage 3D Bootstrap

on:
  push:
    paths:
      - ".github/workflows/walters-qb-stage3d-bootstrap.yml"
      - ".stage3d/walters-qb-stage3d-package.tgz"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: walters-qb-stage3d-bootstrap
  cancel-in-progress: false

jobs:
  install-stage3d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and statically verify Stage 3D package
        run: |
          set -euo pipefail
          tar -xzf .stage3d/walters-qb-stage3d-package.tgz -C .
          python -m json.tool data/walters/nfl/qb-performance/stage3d-contract-v1.json >/dev/null
          python -m py_compile tools/build-walters-qb-performance-stage3d.py
          python tools/build-walters-qb-performance-stage3d.py --self-test
          node --check tools/validate-walters-qb-performance-stage3d.mjs
          node --check tests/walters-qb-performance-stage3d.test.mjs

      - name: Commit package and remove bootstrap assets
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            data/walters/nfl/qb-performance/stage3d-contract-v1.json \
            tools/build-walters-qb-performance-stage3d.py \
            tools/validate-walters-qb-performance-stage3d.mjs \
            tests/walters-qb-performance-stage3d.test.mjs \
            .github/workflows/walters-qb-performance-stage3.yml
          git rm --ignore-unmatch \
            .github/workflows/walters-qb-stage3d-bootstrap.yml \
            .stage3d/walters-qb-stage3d-package.tgz
          rmdir .stage3d 2>/dev/null || true
          git commit -m "Install Walters QB performance Stage 3D acceptance package"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Stage 3D bootstrap push attempt ${attempt} failed; retrying."
            sleep $((attempt * 2))
          done
          exit 1
