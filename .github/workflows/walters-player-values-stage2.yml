name: Walters player values Stage 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/walters-player-values-stage2.yml
      - tools/build-walters-player-values.py
      - data/walters/nfl/personnel-calibration-v1.json
      - data/walters/nfl/madden27/madden27-current.json
      - data/walters/nfl/madden27/madden27-normalized-*.json
  workflow_dispatch:

concurrency:
  group: walters-player-values-stage2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build player value registry and audit
        run: python tools/build-walters-player-values.py

      - name: Verify Stage 2 isolation and outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/walters/nfl/player-values')
          current=json.loads((root/'stage2-current.json').read_text())
          registry=json.loads((root/'player-values-2026-v1.json').read_text())
          audit=json.loads((root/'calibration-audit-v1.json').read_text())
          assert len(registry['players']) == 2364, len(registry['players'])
          assert registry['marketViewed'] is False
          assert registry['operationalAuthority'] is False
          assert current['stage3Authority'] is False
          assert current['productionAuthority'] is False
          assert current['marketViewed'] is False
          assert audit['marketViewed'] is False
          assert audit['sourcePlayerCount'] == 2364
          assert all(p.get('calibrationId') == current['calibrationId'] for p in registry['players'])
          print(f"WALTERS STAGE 2 VERIFY: PASS // AUDIT={audit['state']} // 2364 SOURCE RECORDS // PRODUCTION AUTHORITY FALSE")
          PY

      - name: Publish Stage 2 outputs
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/walters/nfl/player-values
          if git diff --cached --quiet; then
            echo "No Stage 2 output changes to publish."
            exit 0
          fi
          git commit -m "Build Walters Stage 2 player value registry"
          git push origin HEAD:main
