name: Eddie V3 restore title seal once

on:
  push:
    paths:
      - '.github/workflows/eddie-v3-restore-title-seal-once.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Muddy Numbers title and move badge to seal position
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('syndicates/generated/eddie-numbers/hotline.html')
          s = p.read_text()

          s = s.replace(
              '.brandrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:16px 20px;align-items:center;padding:15px 16px 12px}.ey{color:var(--cyan);font-size:8px;font-weight:900;letter-spacing:.14em}.brandcopy h2{margin:5px 0 0;font:900 clamp(22px,3.2vw,32px)/1.05 system-ui,sans-serif;letter-spacing:.09em}.brandcopy p{max-width:720px;margin:10px 0 0;color:#cbd9e1;font:650 12px/1.5 system-ui,sans-serif}.brandnote{color:#d6bd77;font-size:7px;font-weight:900;letter-spacing:.08em;margin-top:8px}.logo{text-align:right}.logo img{display:block;width:100%;max-width:300px;margin-left:auto;filter:drop-shadow(0 13px 26px #000b)}',
              '.brandrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(175px,240px);gap:12px 20px;align-items:start;padding:15px 16px 12px}.ey{color:var(--cyan);font-size:8px;font-weight:900;letter-spacing:.14em}.brandcopy h1{margin:4px 0 0;font:italic clamp(46px,6.8vw,72px)/.86 Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif}.brandcopy h1 span{color:var(--gold)}.brandcopy h2{margin:8px 0 0;font:900 clamp(18px,2.5vw,25px)/1.05 system-ui,sans-serif;letter-spacing:.09em}.brandcopy p{max-width:720px;margin:10px 0 0;color:#cbd9e1;font:650 12px/1.5 system-ui,sans-serif}.brandnote{color:#d6bd77;font-size:7px;font-weight:900;letter-spacing:.08em;margin-top:8px}.logo{align-self:start;text-align:right;padding-top:6px}.logo img{display:block;width:100%;max-width:225px;margin-left:auto;filter:drop-shadow(0 10px 22px #000b)}',
              1,
          )

          old = '<div class="brandcopy"><div class="ey">HALL OF FAME LEDGER ANALYST // LAS VEGAS MAIN SHEET</div><h2>LEDGER DESK // THE MAIN SHEET</h2>'
          new = '<div class="brandcopy"><div class="ey">HALL OF FAME LEDGER ANALYST // LAS VEGAS MAIN SHEET</div><h1><span>MUDDY</span> NUMBERS</h1><h2>LEDGER DESK // THE MAIN SHEET</h2>'
          if old not in s:
              raise SystemExit('Expected Eddie compact title block not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              '@media(max-width:900px){.brandrow{grid-template-columns:minmax(0,1fr) 220px}',
              '@media(max-width:900px){.brandrow{grid-template-columns:minmax(0,1fr) 190px}',
              1,
          )
          s = s.replace(
              '@media(max-width:700px){.brandrow,.grid2,.read{grid-template-columns:1fr}.logo{text-align:left}.logo img{max-width:230px;margin:0}',
              '@media(max-width:700px){.brandrow,.grid2,.read{grid-template-columns:1fr}.logo{text-align:left;padding-top:0}.logo img{max-width:190px;margin:0}',
              1,
          )

          p.write_text(s)
          PY
      - name: Verify title and seal placement
        run: |
          grep -F '<h1><span>MUDDY</span> NUMBERS</h1>' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'max-width:225px' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'LEDGER DESK // THE MAIN SHEET' syndicates/generated/eddie-numbers/hotline.html
      - name: Commit adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syndicates/generated/eddie-numbers/hotline.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore Muddy Numbers title and reposition badge seal"
          git push
