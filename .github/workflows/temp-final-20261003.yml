name: Temporary final morning producer 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-final-20261003.yml

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build, validate, freeze and stage exact candidate
        run: |
          set -euo pipefail
          node .temp-final-20261003-build.mjs
          node tools/report-run.mjs start --checkpoint data/report-production/checkpoints/20261003-final-0930.json --report /tmp/final-report.json --sidecar /tmp/final-sidecar.json
          node tools/report-run.mjs retime --checkpoint data/report-production/checkpoints/20261003-final-0930.json --expected-revision 1 --at 2026-10-03T09:46:24-07:00
          node .temp-final-20261003-populate.mjs
          node tools/report-run.mjs checkpoint --checkpoint data/report-production/checkpoints/20261003-final-0930.json --expected-revision 2 --report /tmp/final-populated-report.json --sidecar /tmp/final-populated-sidecar.json
          node tools/report-run.mjs prepare --checkpoint data/report-production/checkpoints/20261003-final-0930.json --expected-revision 3
          node tools/report-run.mjs freeze --checkpoint data/report-production/checkpoints/20261003-final-0930.json --expected-revision 4
          node tools/report-run.mjs stage --checkpoint data/report-production/checkpoints/20261003-final-0930.json --expected-revision 5
          test "$(jq -r '.frozen.blobSha' data/report-production/checkpoints/20261003-final-0930.json)" = 470be05a48b6f8efe247bc27dff45091ede6fd1f
      - name: Commit exact staged bytes and remove temporary producer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/history/staging/report-bundle.json data/report-production/checkpoints/20261003-final-0930.json
          git rm .temp-final-20261003-build.mjs .temp-final-20261003-populate.mjs .github/workflows/temp-final-20261003.yml
          git commit -m "Stage Betting Edge final morning 2026-10-03"
          git push origin main
