name: Install schedule profile architecture
# installer version 1 — profile-aware odds/history/UI migration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-schedule-profile-architecture.yml

permissions:
  contents: write

concurrency:
  group: betting-edge-schedule-profile-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install schedule profile architecture
        run: node tools/install-schedule-profile-architecture.mjs

      - name: Validate schedule profiles
        run: node tests/schedule-profile.test.mjs

      - name: Verify report history remains valid
        run: node tools/report-publication.mjs verify

      - name: Run existing history regressions
        run: |
          node tests/runner-history-session-applicability.test.js
          node tests/runner-session-strip-applicability.test.js

      - name: Publish installation
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            runner.html \
            assets/schedule-profile-ui.js \
            .github/workflows/odds-refresh.yml \
            .github/workflows/odds-history-index.yml \
            .github/workflows/runner-history-regression.yml \
            tools/report-publication.mjs \
            run-history.json
          if git diff --cached --quiet; then
            echo "Schedule profile architecture already installed."
            exit 0
          fi
          git commit -m "Install seasonal Betting Edge schedule profiles"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Could not publish schedule architecture after retries." >&2
          exit 1
