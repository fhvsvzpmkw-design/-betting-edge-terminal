name: Manual 15:15 recovery builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-1515-recovery-builder.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fresh evening recovery candidate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { evaluate, loadProductionFramework, matchCondition } from './tools/core-handicap-framework.mjs';
          import { normalizeDerivedSidecarFields, verifyDerivedSidecarFields } from './tools/report-sidecar-contract.mjs';

          const file='data/history/staging/report-bundle.json';
          const bundle=JSON.parse(fs.readFileSync(file,'utf8'));
          if(bundle.candidateId!=='2026-08-31T15:22:30.000-07:00|4') throw new Error(`Recovery source candidate changed: ${bundle.candidateId}`);
          const feed=JSON.parse(fs.readFileSync('data/live-odds.json','utf8'));
          if(feed.generatedAt!==bundle.report.feedGeneratedAt) throw new Error('Current feed does not match the rejected 15:15 candidate');
          const now=new Date();
          const age=now.getTime()-Date.parse(feed.generatedAt);
          if(!(age>=0 && age<=75*60*1000)) throw new Error(`Recovery feed stale: ${Math.round(age/60000)} minutes`);

          function vancouverIso(date){
            const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Vancouver',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',timeZoneName:'longOffset'});
            const p=Object.fromEntries(fmt.formatToParts(date).map(x=>[x.type,x.value]));
            const off=(p.timeZoneName||'GMT-07:00').replace('GMT','');
            return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}.${String(date.getUTCMilliseconds()).padStart(3,'0')}${off}`;
          }
          const ts=vancouverIso(now);
          const reportMs=Date.parse(ts);
          const oldRecs=bundle.report.recs;
          const keep=[];
          for(let i=0;i<oldRecs.length;i++){
            const eventMs=Date.parse(oldRecs[i]?.feed?.eventDate||'');
            if(Number.isFinite(eventMs) && eventMs>reportMs) keep.push(i);
          }
          const expected=new Set(['Milwaukee Brewers moneyline','Detroit Tigers moneyline','Athletics moneyline','Chicago White Sox moneyline','Panama moneyline']);
          const keptTitles=new Set(keep.map(i=>oldRecs[i].title));
          for(const title of expected){ if(!keptTitles.has(title)) throw new Error(`Expected recovery card no longer pregame: ${title}`); }
          if(keep.length!==5) throw new Error(`Expected exactly five still-pregame recovery cards, got ${keep.length}`);

          bundle.report.recs=keep.map(i=>structuredClone(oldRecs[i]));
          bundle.sidecar.recommendations=keep.map(i=>structuredClone(bundle.sidecar.recommendations[i]));
          bundle.report.ts=ts;
          bundle.report.label='15:15 EVENING';
          bundle.report.risk=0;
          bundle.candidateId=`${ts}|4`;
          bundle.phase='4';
          bundle.state='READY';

          const recoverySources={
            'Milwaukee Brewers moneyline': {origin:'Reuters Brewers personnel update, August 31',url:'https://www.reuters.com/sports/brewers-activate-rhp-abner-uribe-put-rhp-bryse-wilson-il--flm-2026-08-31/',fact:'Recovery check confirmed Abner Uribe activated from the IL and Bryse Wilson placed on the IL; bullpen depth improved but the +105 action requirement did not change.'},
            'Detroit Tigers moneyline': {origin:'MLB Tigers starting lineups, August 31',url:'https://www.mlb.com/tigers/roster/starting-lineups',fact:'Recovery check reconfirmed Jackson Jobe, Taj Bradley and both starting lineups.'},
            'Athletics moneyline': {origin:'Texas Rangers lineup, August 31',url:'https://www.lonestarball.com/rangers-game-day-lineups/93387/texas-rangers-lineup-for-august-31-2026',fact:'Recovery check reconfirmed Gage Jump versus Jacob deGrom and the right-heavy Texas lineup.'},
            'Chicago White Sox moneyline': {origin:'MLB White Sox starting lineups, August 31',url:'https://www.mlb.com/whitesox/roster/starting-lineups',fact:'Recovery check reconfirmed Anthony Kay versus Peter Lambert; late lineup/rotation uncertainty remains non-BET personnel risk.'},
            'Panama moneyline': {origin:'FIBA confirmed rosters, August 31',url:'https://www.fiba.basketball/en/events/fiba-basketball-world-cup-2027-americas-qualifiers/news/americas-qualifiers-rosters-confirmed-for-august-31',fact:'Recovery check reconfirmed final 12-player rosters for Panama and Bahamas; late rotation/minutes allocation remains unresolved.'}
          };

          for(const rec of bundle.report.recs){
            rec.source=`Recovery ${ts.slice(11,16)} PT; ${rec.source}`;
            const pe=rec.personnelEvidence;
            if(pe){
              pe.stage2CheckedAt=ts;
              const s=recoverySources[rec.title];
              if(s){
                pe.fallbackSources=Array.isArray(pe.fallbackSources)?pe.fallbackSources:[];
                if(!pe.fallbackSources.some(x=>x.url===s.url)) pe.fallbackSources.push({asOf:ts,fact:s.fact,origin:s.origin,url:s.url});
                if(pe.fallbackSources.length>5) pe.fallbackSources=pe.fallbackSources.slice(-5);
                pe.fallbackSourceCount=pe.fallbackSources.length;
                if(!Array.isArray(pe.facts)) pe.facts=[];
                if(rec.title==='Milwaukee Brewers moneyline' && !pe.facts.some(x=>String(x).includes('Abner Uribe'))) pe.facts.push('Abner Uribe was activated from the IL before the game; Bryse Wilson moved to the IL.');
              }
              pe.decisionImpact=`${pe.decisionImpact} Recovery re-check found no status-changing information; the prior fair/playTo/status remains governed.`;
            }
          }

          const framework=loadProductionFramework();
          for(const rec of bundle.report.recs){
            const a=rec.coreAssessment;
            if(!a?.context) throw new Error(`Missing Core context for ${rec.title}`);
            const ids=[...new Set((framework.graduatedResearchRules||[]).filter(rule=>matchCondition(rule.when,a.context)).map(rule=>rule.priorId))].sort();
            a.context.graduatedResearchIds=ids;
            const derived=evaluate(framework,a.context);
            a.modelErrorState=derived.modelErrorState;
            a.betEligibleByModelError=derived.betEligibleByModelError;
            a.effects=derived.effects;
            a.appliedRules=derived.appliedRules;
            a.reasons=derived.reasons;
          }

          const counts={bet:0,lean:0,wait:0,pass:0};
          for(const rec of bundle.report.recs){ const k=String(rec.status||'').toLowerCase(); if(Object.hasOwn(counts,k)) counts[k]++; }
          bundle.report.counts=counts;
          bundle.report.summary=`Manual 15:15 recovery on the unchanged 15:08 PT feed. Started Mets, Reds, Seattle and Washington events were excluded. No BET. Milwaukee -101 remains a price-sensitive LEAN requiring +105 after the fresh personnel re-check; Detroit +109, Athletics +195, White Sox +118 and Panama +1200 remain PASS. No NFL, NCAAF or CFL fixtures were present in the bound feed.`;

          bundle.sidecar.recommendations.forEach((item,i)=>{item.ordinal=i+1;});
          bundle.sidecar=normalizeDerivedSidecarFields(bundle.report,bundle.sidecar);
          verifyDerivedSidecarFields(bundle.report,bundle.sidecar);
          fs.writeFileSync('/tmp/recovery-report.json',JSON.stringify(bundle.report,null,2)+'\n');
          fs.writeFileSync('/tmp/recovery-sidecar.json',JSON.stringify(bundle.sidecar,null,2)+'\n');
          fs.writeFileSync(file,JSON.stringify(bundle,null,2)+'\n');
          console.log(`RECOVERY CANDIDATE BUILT ${bundle.candidateId} cards=${bundle.report.recs.length} ageMinutes=${(age/60000).toFixed(1)}`);
          NODE
          node tools/core-assessment-trace-gate.mjs validate --report /tmp/recovery-report.json
          node tools/report-sidecar-contract.mjs check --report /tmp/recovery-report.json --sidecar /tmp/recovery-sidecar.json
          node tools/core-v14-publication-gate.mjs validate --report /tmp/recovery-report.json --sidecar /tmp/recovery-sidecar.json
      - name: Stage recovery candidate
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/history/staging/report-bundle.json
          git commit -m 'recovery: stage manual 15:15 evening candidate'
          git pull --rebase origin main
          git push origin HEAD:main
