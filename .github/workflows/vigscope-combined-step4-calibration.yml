name: VigScope combined step 4 calibration

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/vigscope-combined-step4-calibration.mjs'
      - '.github/workflows/vigscope-combined-step4-calibration.yml'
      - 'data/vigscope/heat-calibration-step1-current.json'
      - 'data/vigscope/pressure-calibration-step2-current.json'
      - 'data/vigscope/agreement-calibration-step3-current.json'

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calibrate combined VIG Meter thresholds
        env:
          CALIBRATION_START: '2026-08-15'
          CALIBRATION_END: '2026-09-01'
        run: node tools/vigscope-combined-step4-calibration.mjs
