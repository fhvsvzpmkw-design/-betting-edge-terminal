name: Walters QB Performance Stage 4 historical readback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frozen-stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout accepted Stage 4 evidence commit
        uses: actions/checkout@v4
        with:
          ref: 1a8222a1114e3fcfc806fde718c81aaf2b0bfa7f
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frozen Stage 4 evidence without rebuilding it
        run: |
          set -euo pipefail
          python tools/build-walters-qb-performance-stage4.py --self-test
          node tools/validate-walters-qb-performance-stage4.mjs
          node --test tests/walters-qb-performance-stage4.test.mjs
          git diff --exit-code
