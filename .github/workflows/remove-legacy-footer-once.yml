name: Remove legacy footer once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-footer-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy source bar and footer from base terminal
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()

          markup='<div class="f3sourcebar"><b>DATA SOURCES</b> // BET365 · DRAFTKINGS · RESEARCH LIBRARY · OFFICIAL INTEL</div><footer class="foot">VIGSCOPE TERMINAL UI v1.3 // REPORT + ARCHIVE // MARKET PRICE FIRST // ZERO BETS IS A VALID OUTPUT</footer>'
          assert markup in s, 'legacy footer markup not found'
          s=s.replace(markup,'',1)

          base='.foot{border-top:2px solid var(--cyan);padding:12px;color:var(--muted);font-size:11px}'
          assert base in s, 'base footer style not found'
          s=s.replace(base,'',1)

          f3='.f3sourcebar{margin-top:9px;padding:9px 12px;border-top:1px solid #173a63;border-bottom:1px solid #173a63;color:#8ca9c5;font-size:11px;letter-spacing:.03em;background:#050d19}\n.f3sourcebar b{color:var(--blue)}\n.foot{color:#7894ae;border-top-color:#173a63}\n'
          assert f3 in s, 'F3 footer styles not found'
          s=s.replace(f3,'',1)

          assert 'f3sourcebar' not in s
          assert '<footer class="foot">' not in s
          p.write_text(s)

          p=Path('assets/primary-nav-shell.js')
          s=p.read_text()
          compat='    body.${MENU_CLASS} .f3sourcebar,body.${MENU_CLASS} footer.foot{display:none!important}\n'
          assert compat in s, 'menu footer compatibility rule not found'
          s=s.replace(compat,'',1)
          assert 'f3sourcebar' not in s
          p.write_text(s)
          PY
      - name: Commit legacy footer removal
        run: |
          git config user.name "fhvsvzpmkw-design"
          git config user.email "fhvsvzpmkw@privaterelay.appleid.com"
          git add index.html assets/primary-nav-shell.js
          git diff --cached --check
          git commit -m "Remove legacy terminal source footer"
          git push
