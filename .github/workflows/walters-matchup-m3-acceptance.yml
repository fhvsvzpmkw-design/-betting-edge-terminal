name: Walters Matchup M3 Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/walters/nfl/matchup-stage3/m3-acceptance-contract-v1.json'
      - 'data/walters/nfl/matchup-stage2/week-01-shadow-numeric-result.json'
      - 'data/walters/nfl/matchup-stage2/week-01-committee-jacobs-minnesota-result.json'
      - 'data/walters/nfl/matchup-stage2/week-01-pearsall-rams-result.json'
      - 'data/walters/nfl/matchup-stage2/week-01-walker-steelers-result.json'
      - 'tools/run-walters-matchup-m3-acceptance-v2.mjs'
      - '.github/workflows/walters-matchup-m3-acceptance.yml'

permissions:
  contents: write

concurrency:
  group: walters-matchup-m3-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve active Graham week
        run: node tools/graham-active-week.mjs --json >/dev/null

      - name: Run M3 acceptance gate
        run: node tools/run-walters-matchup-m3-acceptance-v2.mjs

      - name: Verify protected live artifacts are untouched
        run: |
          git diff --exit-code -- data/walters/nfl/2026/week-01-current-numbers.json
          git diff --exit-code -- data/walters/nfl/2026/week-01-personnel-ledger.json
          git diff --exit-code -- data/walters/nfl-power-ratings-ledger.json
          git diff --exit-code -- data/walters/nfl/player-values/player-values-2026-v1.json

      - name: Commit M3 acceptance artifacts
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/walters/nfl/matchup-stage3/week-01-acceptance-result.json data/walters/nfl/matchup-stage3/stage3-current.json
          if git diff --cached --quiet; then
            echo "M3 acceptance artifacts unchanged"
            exit 0
          fi
          git commit -m "Record Walters matchup M3 acceptance"
          git push
