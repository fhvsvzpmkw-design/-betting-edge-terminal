name: Polish special desks once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/polish-special-desks-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cohesive desk UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/polish_special_desks_once.py')
          s = p.read_text()
          old = "style_marker = '`;d.head.appendChild(s)}'"
          new = "style_marker = '  `;d.head.appendChild(s)\\n}'"
          if old not in s:
              raise RuntimeError('temporary marker patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python scripts/polish_special_desks_once.py
      - name: Commit cohesive special desk UI
        run: |
          git config user.name "fhvsvzpmkw-design"
          git config user.email "fhvsvzpmkw@privaterelay.appleid.com"
          git add assets/special-desks-ui.js assets/season-previews-ui.js
          git diff --cached --check
          git commit -m "Unify special desk visual system"
          git push
