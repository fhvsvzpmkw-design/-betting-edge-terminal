name: Repair Core 1.4 personnel sourceShortfall encoding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-core-v14-source-shortfall.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: betting-edge-core-v14-source-shortfall-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize current sidecar and publication input
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          sidecar_path = Path("data/history/research-fit/2026-08-26/open-062339.json")
          sidecar = json.loads(sidecar_path.read_text(encoding="utf-8"))
          normalized = 0
          for recommendation in sidecar.get("recommendations", []):
              evidence = recommendation.get("personnelEvidence")
              if isinstance(evidence, dict) and evidence.get("sourceShortfall") is False:
                  evidence["sourceShortfall"] = None
                  normalized += 1
          if normalized != 5:
              raise SystemExit(f"Expected to normalize 5 personnel records, normalized {normalized}")
          sidecar_path.write_text(
              json.dumps(sidecar, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          tool_path = Path("tools/report-publication.mjs")
          tool = tool_path.read_text(encoding="utf-8")
          helper_anchor = "function nonEmptyString(value){return typeof value==='string' && value.trim().length>0;}\n"
          helper = """function normalizePublicationSidecar(sidecar){
            if(!sidecar || typeof sidecar!=='object' || Array.isArray(sidecar)) return sidecar;
            for(const item of Array.isArray(sidecar.recommendations)?sidecar.recommendations:[]){
              const evidence=item?.personnelEvidence;
              if(evidence && evidence.sourceShortfall===false) evidence.sourceShortfall=null;
            }
            return sidecar;
          }
          """
          if "function normalizePublicationSidecar(sidecar)" not in tool:
              if tool.count(helper_anchor) != 1:
                  raise SystemExit("Could not identify the publication helper insertion point")
              tool = tool.replace(helper_anchor, helper_anchor + helper, 1)

          old_publish = "  const sidecar = validateSidecar(readJson(sidecarFile),report,paths.reportPath,{strict:true});"
          new_publish = "  const sidecar = validateSidecar(normalizePublicationSidecar(readJson(sidecarFile)),report,paths.reportPath,{strict:true});"
          if old_publish in tool:
              tool = tool.replace(old_publish, new_publish, 1)
          elif new_publish not in tool:
              raise SystemExit("Could not identify the sidecar publication call")
          tool_path.write_text(tool, encoding="utf-8")
          PY

      - name: Exercise publication path
        run: node tools/report-publication.mjs self-test

      - name: Verify durable report history
        run: node tools/report-publication.mjs verify

      - name: Verify Core 1.4 post-cutover history
        run: node tools/core-v14-publication-gate.mjs verify-history

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- data/history/research-fit/2026-08-26/open-062339.json tools/report-publication.mjs
          if git diff --cached --quiet; then
            echo "Repair already present."
            exit 0
          fi
          git commit -m "Fix Core 1.4 personnel sourceShortfall encoding"
          git pull --rebase origin main
          git push origin HEAD:main
