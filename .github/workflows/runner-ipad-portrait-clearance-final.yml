name: One-time final iPad portrait clearance tune
on:
  push:
    branches: [main]
    paths: [.github/workflows/runner-ipad-portrait-clearance-final.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tune clearance 56 to 44
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('runner.html')
          s=p.read_text(encoding='utf-8')
          old='body.runnerSyndicateLoaded .runnerNavPad{padding-top:56px!important}'
          new='body.runnerSyndicateLoaded .runnerNavPad{padding-top:44px!important}'
          if s.count(old)!=1: raise SystemExit(f'expected one target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'body.runnerSyndicateLoaded .runnerNavPad{padding-top:44px!important}' runner.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runner.html
          git commit -m 'Fine-tune iPad portrait syndicate clearance to 44px'
          git push
