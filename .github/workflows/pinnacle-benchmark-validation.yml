name: Pinnacle benchmark validation

on:
  pull_request:
    paths:
      - core/core-v1.4-production.json
      - core/pinnacle-sharp-benchmark-v1.4.json
      - tools/pinnacle-sharp-benchmark.mjs
      - tools/pinnacle-benchmark-publication-gate.mjs
      - tools/oddspapi-observer.mjs
      - tools/build-graham-current-week.mjs
      - syndicates/generated/graham-mercer/hotline.html
      - tests/oddspapi-retention-horizons.test.mjs
      - tests/graham-terminal-automation.test.mjs
      - .github/workflows/odds-refresh.yml
      - .github/workflows/report-history-staged.yml
      - .github/workflows/pinnacle-benchmark-validation.yml
  push:
    branches: [main]
    paths:
      - core/core-v1.4-production.json
      - core/pinnacle-sharp-benchmark-v1.4.json
      - tools/pinnacle-sharp-benchmark.mjs
      - tools/pinnacle-benchmark-publication-gate.mjs
      - tools/oddspapi-observer.mjs
      - tools/build-graham-current-week.mjs
      - syndicates/generated/graham-mercer/hotline.html
      - tests/oddspapi-retention-horizons.test.mjs
      - tests/graham-terminal-automation.test.mjs
      - .github/workflows/odds-refresh.yml
      - .github/workflows/report-history-staged.yml
      - .github/workflows/pinnacle-benchmark-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check tools/pinnacle-sharp-benchmark.mjs
          node --check tools/pinnacle-benchmark-publication-gate.mjs
          node --check tools/oddspapi-observer.mjs
      - name: Benchmark math and authority tests
        run: |
          node tools/pinnacle-sharp-benchmark.mjs self-test
          node tools/pinnacle-benchmark-publication-gate.mjs self-test
          node tests/oddspapi-retention-horizons.test.mjs
          node tests/graham-terminal-automation.test.mjs
      - name: Validate production JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('core/core-v1.4-production.json','utf8'));JSON.parse(require('fs').readFileSync('core/pinnacle-sharp-benchmark-v1.4.json','utf8'));console.log('Production JSON valid')"
      - name: Preserve pre-cutover history
        run: |
          node tools/pinnacle-benchmark-publication-gate.mjs validate \
            --report data/history/runs/2026-09-01/final_morning-093530.json \
            --sidecar data/history/research-fit/2026-09-01/final_morning-093530.json
      - name: Legacy observer degrades to unavailable
        run: |
          cp data/oddspapi-observer.json /tmp/observer.original
          cat > data/oddspapi-observer.json <<'JSON'
          {
            "schema": 2,
            "mode": "observation-only",
            "authoritative": false,
            "source": "OddsPapi v4",
            "generatedAt": "2026-09-01T17:00:00.000Z",
            "status": "ok",
            "fixtures": []
          }
          JSON
          cat > /tmp/post-cutover-report.json <<'JSON'
          {
            "ts": "2026-09-01T11:00:00-07:00",
            "recs": []
          }
          JSON
          echo '{"schema":3,"provenance":{}}' > /tmp/post-cutover-sidecar.json
          node tools/pinnacle-benchmark-publication-gate.mjs normalize --report /tmp/post-cutover-report.json --sidecar /tmp/post-cutover-sidecar.json
          node - <<'NODE'
          const p=JSON.parse(require('fs').readFileSync('/tmp/post-cutover-sidecar.json','utf8')).provenance;
          if(p.pinnacleBenchmarkState!=='PINNACLE_BENCHMARK_UNAVAILABLE') throw new Error('legacy observer did not degrade to unavailable');
          if(p.pinnacleStatus!=='benchmark-incompatible') throw new Error(`unexpected legacy observer status ${p.pinnacleStatus}`);
          if(p.pinnacleBenchmarkExecutionAuthority!==false) throw new Error('execution authority boundary drifted');
          console.log('Legacy observer fallback passed');
          NODE
          mv /tmp/observer.original data/oddspapi-observer.json
      - name: Existing Core regression
        run: |
          node tools/core-assessment-trace-gate.mjs self-test
          node tools/core-v14-publication-gate.mjs verify-history
