name: VigScope meter production regression

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/runner-core-runtime.js'
      - 'assets/quote-observation.js'
      - 'runner.html'
      - 'runner-app.html'
      - 'runner-core.html'
      - 'tests/runner-quote-observation.test.mjs'
      - 'assets/report-dashboard-vigscope.js.old'
      - 'data/vigscope/meter-calibration-production-v1.json'
      - 'tools/vigscope-meter-production.mjs'
      - 'tools/vigscope-meter-telemetry.mjs'
      - 'tools/vigscope-meter-telemetry-gate.mjs'
      - 'tools/report-publication.mjs'
      - 'tests/vigscope-meter-production.test.mjs'
      - 'tests/vigscope-meter-fallback-safety.test.mjs'
      - 'tests/vigscope-meter-telemetry.test.mjs'
      - 'tests/vigscope-meter-resilient.test.mjs'
      - 'tests/vigscope-meter-sep2-live-fixture.test.mjs'
      - 'tests/runner-issued-session-boundary.test.mjs'
      - '.github/workflows/vigscope-meter-production-regression.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run calibrated meter regression
        run: node tests/vigscope-meter-production.test.mjs
      - name: Run fallback meter safety regression
        run: node tests/vigscope-meter-fallback-safety.test.mjs
      - name: Run observed quote and movement regression
        run: node tests/runner-quote-observation.test.mjs
      - name: Run structured publisher telemetry regression
        run: node tests/vigscope-meter-telemetry.test.mjs
      - name: Run resilient odds-baseline telemetry regression
        run: node tests/vigscope-meter-resilient.test.mjs
      - name: Run Sep 2 production telemetry fixture
        run: node tests/vigscope-meter-sep2-live-fixture.test.mjs
      - name: Run issued-session boundary regression
        run: node tests/runner-issued-session-boundary.test.mjs
      - name: Run durable telemetry gate self-test
        run: node tools/vigscope-meter-telemetry-gate.mjs self-test
      - name: Run report publisher self-test
        run: node tools/report-publication.mjs self-test
      - name: Verify runner production wiring
        run: |
          grep -F '<script src="./assets/quote-observation.js"></script>' runner.html runner-app.html runner-core.html
          grep -F '<script src="./assets/runner-core-runtime.js"></script>' runner.html
          grep -F "HISTORY_KEY='bettingEdge.runnerHistory.v1.4'" assets/runner-core-runtime.js
          grep -F "VIG_METER_TELEMETRY_CUTOVER='2026-09-02T08:43:00-07:00'" assets/runner-core-runtime.js
          grep -F "TELEMETRY INTEGRITY ERROR" assets/runner-core-runtime.js
          grep -F "VIG_METER_CALIBRATION_ID='vigscope-meter-calibration-v1'" assets/runner-core-runtime.js
          grep -F "50+50*Math.tanh(fav/0.028)" assets/runner-core-runtime.js
          grep -F "AGREEMENT UNMEASURED" assets/runner-core-runtime.js
          grep -F "function explicitMovementOddsPairs(v)" assets/runner-core-runtime.js
          grep -F "MARKET STATE UNMEASURED" assets/runner-core-runtime.js
          grep -F "PUBLISHER_BOUND_FEED_V1" assets/runner-core-runtime.js
          grep -F "attachPublisherInstrumentTelemetry" tools/report-publication.mjs
          grep -F "VIG_METER_TELEMETRY_CUTOVER='2026-09-02T08:43:00-07:00'" tools/vigscope-meter-telemetry-gate.mjs
