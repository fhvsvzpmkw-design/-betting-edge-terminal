name: VigScope issued-session boundary repair

on:
  workflow_dispatch:
  push:
    branches:
      - fix/vigscope-issued-session-boundary
    paths:
      - '.github/workflows/vigscope-meter-production-regression.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply issued-report boundary repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path=Path('assets/runner-core-runtime.js')
          s=path.read_text()

          def exact(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              s=s.replace(old,new,1)

          exact("const HISTORY_KEY='bettingEdge.runnerHistory.v1.3';",
                "const HISTORY_KEY='bettingEdge.runnerHistory.v1.4';",
                'history schema bump')
          exact("const LEGACY_HISTORY_KEYS=['bettingEdge.runnerHistory.v1.2.5','bettingEdge.runnerHistory.v1.2.4','bettingEdge.runnerHistory.v1.2.3','bettingEdge.runnerHistory.v1.2.2'];",
                "const LEGACY_HISTORY_KEYS=['bettingEdge.runnerHistory.v1.3','bettingEdge.runnerHistory.v1.2.5','bettingEdge.runnerHistory.v1.2.4','bettingEdge.runnerHistory.v1.2.3','bettingEdge.runnerHistory.v1.2.2'];",
                'legacy cache list')
          exact("const VIG_METER_CALIBRATION_ID='vigscope-meter-calibration-v1';",
                "const VIG_METER_CALIBRATION_ID='vigscope-meter-calibration-v1';\nconst VIG_METER_TELEMETRY_CUTOVER='2026-09-02T08:43:00-07:00';\nconst RUN_HISTORY_URL='./run-history.json';",
                'telemetry cutoff')
          exact("let statusFilter='ALL';",
                "let statusFilter='ALL';\nconst issuedSessionCatalog=new Map();",
                'issued catalog')

          new_normalize=r'''function normalizeRun(run){
  const source=withoutComparison(run)||{},c=source.counts||{},out=deepClone(source)||{};
  out.slot=txt(source.slot,'');
  out.label=txt(source.label,'');
  out.ts=txt(source.ts,'');
  out.bankroll=source.bankroll;
  out.risk=source.risk;
  out.counts={bet:Number(c.bet)||0,lean:Number(c.lean)||0,wait:Number(c.wait)||0,pass:Number(c.pass)||0};
  out.summary=txt(source.summary,'');
  out.feedGeneratedAt=txt(source.feedGeneratedAt,'');
  out.repriceBaseLabel=txt(source.repriceBaseLabel,'');
  out.recs=Array.isArray(source.recs)?deepClone(source.recs):[];
  // prior_runs is a navigation envelope, not part of the individual issued report.
  delete out.prior_runs;
  return out
}'''
          s,n=re.subn(r"function normalizeRun\(run\)\{[^\n]*\}",new_normalize,s,count=1)
          if n!=1: raise SystemExit(f'normalizeRun replacement count {n}')

          exact("function runKey(run){return [txt(run.ts,''),txt(run.slot,''),txt(run.label,'')].join('|')}",
                "function runKey(run){return [txt(run.ts,''),txt(run.slot,''),txt(run.label,'')].join('|')}\nfunction rememberIssuedRun(run,replace=false){\n  if(!run||run.__error||!run.ts)return null;\n  const issued=normalizeRun(run),key=runKey(issued);\n  if(replace||!issuedSessionCatalog.has(key))issuedSessionCatalog.set(key,issued);\n  return deepClone(issuedSessionCatalog.get(key))\n}\nfunction catalogRuns(){return [...issuedSessionCatalog.values()].map(deepClone)}",
                'issued catalog helpers')

          new_safe=r'''function safeHistory(){try{const map=new Map();const raw=localStorage.getItem(HISTORY_KEY),parsed=raw?JSON.parse(raw):[];if(Array.isArray(parsed))parsed.forEach(x=>map.set(runKey(x),x));return [...map.values()]}catch(e){return []}}'''
          s,n=re.subn(r"function safeHistory\(\)\{[^\n]*\}",new_safe,s,count=1)
          if n!=1: raise SystemExit(f'safeHistory replacement count {n}')

          new_save=r'''function saveCurrentRun(run){if(!run||run.__error||!run.ts)return;try{const current=rememberIssuedRun(run)||normalizeRun(run),key=runKey(current);let h=safeHistory().filter(x=>runKey(x)!==key);h.push(current);h.sort((a,b)=>String(a.ts||'').localeCompare(String(b.ts||'')));if(h.length>HISTORY_LIMIT)h=h.slice(-HISTORY_LIMIT);localStorage.setItem(HISTORY_KEY,JSON.stringify(h))}catch(e){console.warn('History save failed',e)}}'''
          s,n=re.subn(r"function saveCurrentRun\(run\)\{[^\n]*\}",new_save,s,count=1)
          if n!=1: raise SystemExit(f'saveCurrentRun replacement count {n}')

          exact("  [...embedded,...safeHistory()].forEach(x=>{if(!x)return;const k=runKey(x);if(!k||k===currentKey)return;if(day&&localDateKey(x.ts)!==day)return;exact.set(k,normalizeRun(withoutComparison(x)))})",
                "  [...embedded,...catalogRuns(),...safeHistory()].forEach(x=>{if(!x)return;const k=runKey(x);if(!k||k===currentKey)return;if(day&&localDateKey(x.ts)!==day)return;if(!exact.has(k))exact.set(k,normalizeRun(x))})",
                'prior-run authority order')

          new_without=r'''function withoutComparison(run){const out=deepClone(run);if(!out)return out;delete out.comparison;delete out.refreshDelta;out.recs=(out.recs||[]).map(r=>{const x={...r};delete x.priceComparison;return x});return out}'''
          s,n=re.subn(r"function withoutComparison\(run\)\{[^\n]*\}",new_without,s,count=1)
          if n!=1: raise SystemExit(f'withoutComparison replacement count {n}')

          integrity=r'''function requiresPublisherTelemetry(run){const t=Date.parse(run?.ts),cut=Date.parse(VIG_METER_TELEMETRY_CUTOVER);return Number.isFinite(t)&&Number.isFinite(cut)&&t>=cut}
function hasPublisherTelemetry(run){
  const t=run?.instrumentTelemetry;
  return Boolean(t&&Number(t.schema)===1&&t.authority==='PUBLISHER_BOUND_FEED_V1'&&t.calibrationId===VIG_METER_CALIBRATION_ID&&t.derivedAt&&t.source?.state==='PINNED'&&t.heat&&t.pressure&&t.agreement)
}
function telemetryIntegrityState(run){return requiresPublisherTelemetry(run)?(hasPublisherTelemetry(run)?'VALID':'ERROR'):'LEGACY'}
async function recoverCanonicalIssuedRun(run){
  if(telemetryIntegrityState(run)!=='ERROR')return null;
  try{
    const indexRes=await fetch(`${RUN_HISTORY_URL}?t=${Date.now()}`,{cache:'no-store'});if(!indexRes.ok)return null;
    const index=await indexRes.json(),entry=(index?.runs||[]).find(x=>String(x?.ts||'')===String(run?.ts||'')&&String(x?.slot||'')===String(run?.slot||''));
    if(!entry?.path)return null;
    const reportRes=await fetch(`./${entry.path}?t=${Date.now()}`,{cache:'no-store'});if(!reportRes.ok)return null;
    const canonical=await reportRes.json();
    if(String(canonical?.ts||'')!==String(run?.ts||'')||String(canonical?.slot||'')!==String(run?.slot||''))return null;
    if(telemetryIntegrityState(canonical)!=='VALID')return null;
    rememberIssuedRun(canonical,true);
    return normalizeRun(canonical)
  }catch(e){return null}
}
function recoverActiveRunIfNeeded(){
  const candidate=activeRun;if(!candidate||telemetryIntegrityState(candidate)!=='ERROR')return;
  recoverCanonicalIssuedRun(candidate).then(recovered=>{
    if(!recovered||runKey(activeRun)!==runKey(candidate))return;
    activeRun=recovered;originalRun=deepClone(recovered);saveCurrentRun(recovered);updateRunnerHash(recovered);
    try{apply(activeRun)}catch(e){console.warn('Canonical run recovery render failed',e)}
  }).catch(e=>console.warn('Canonical run recovery failed',e))
}
'''
          exact("function instrumentAgreement(run){return run?.instrumentTelemetry?.agreement||fallbackAgreement(run)}",
                integrity+"function instrumentAgreement(run){return run?.instrumentTelemetry?.agreement||fallbackAgreement(run)}",
                'integrity helpers')

          exact("function deriveInstrumentReadings(run){\n  const recs=Array.isArray(run?.recs)?run.recs:[],signals=recs.map(r=>({...moveSignal(r),weight:recWeight(r)}));",
                "function deriveInstrumentReadings(run){\n  if(telemetryIntegrityState(run)==='ERROR'){\n    const failure={value:0,rawValue:0,label:'INTEGRITY ERROR',confidence:0};\n    return {heat:{...failure},pressure:{...failure},agreement:{...failure,rawConfidence:0,evidenceQuality:'INTEGRITY ERROR',pairs:0}}\n  }\n  const recs=Array.isArray(run?.recs)?run.recs:[],signals=recs.map(r=>({...moveSignal(r),weight:recWeight(r)}));",
                'fail-closed meter derivation')

          exact("function marketState(run){\n  const r=deriveInstrumentReadings(run);",
                "function marketState(run){\n  if(telemetryIntegrityState(run)==='ERROR')return {emoji:'🔴',label:'TELEMETRY INTEGRITY ERROR',agreementState:'ERROR',agreementRender:'ERROR'};\n  const r=deriveInstrumentReadings(run);",
                'integrity market state')

          old_session=r'''function sessionRuns(run){
  const day=localDateKey(run?.ts),map=new Map();
  const embedded=Array.isArray(run?.prior_runs)?run.prior_runs:[];
  [run,...embedded,...safeHistory()].forEach(x=>{
    const key=sessionKey(x);
    if(!x||x.__error||!key)return;
    if(day&&localDateKey(x.ts)!==day)return;
    if(day&&!sessionWindowApplicable(key,day))return;
    map.set(runKey(x),normalizeRun(withoutComparison(x)))
  });
  return [...map.values()]
}'''
          new_session=r'''function sessionRuns(run){
  const day=localDateKey(run?.ts),map=new Map();
  const embedded=Array.isArray(run?.prior_runs)?run.prior_runs:[];
  [run,...catalogRuns(),...embedded,...safeHistory()].forEach(x=>{
    const key=sessionKey(x);
    if(!x||x.__error||!key)return;
    if(day&&localDateKey(x.ts)!==day)return;
    if(day&&!sessionWindowApplicable(key,day))return;
    const k=runKey(x);if(!map.has(k))map.set(k,normalizeRun(x))
  });
  return [...map.values()]
}'''
          exact(old_session,new_session,'session authority order')
          exact("  activeRun=withoutComparison(selected);",
                "  activeRun=normalizeRun(selected);",
                'session selection')
          exact("  apply(activeRun)\n}",
                "  apply(activeRun);\n  recoverActiveRunIfNeeded()\n}",
                'session recovery hook')

          old_reprice=r'''    activeRun={...deepClone(issued),
      comparison:{checkedAt:now,feedGeneratedAt:feed.generatedAt,schema:feed.schema||1,matched,retained,reasonText},
      refreshDelta:{matched,retained,improved,worsened,unchanged},
      instrumentTelemetry:buildInstrumentTelemetry(recs,feed),
      recs
    };'''
          new_reprice=r'''    activeRun={...deepClone(issued),
      comparison:{checkedAt:now,feedGeneratedAt:feed.generatedAt,schema:feed.schema||1,matched,retained,reasonText,instrumentTelemetry:buildInstrumentTelemetry(recs,feed)},
      refreshDelta:{matched,retained,improved,worsened,unchanged},
      recs
    };'''
          exact(old_reprice,new_reprice,'reprice overlay boundary')

          old_init=r'''activeRun=payload();
if(activeRun&&!activeRun.__error){
  originalRun=withoutComparison(activeRun);
  (Array.isArray(activeRun.prior_runs)?activeRun.prior_runs:[]).forEach(saveCurrentRun);
  saveCurrentRun(originalRun)
}'''
          new_init=r'''activeRun=payload();
if(activeRun&&!activeRun.__error){
  rememberIssuedRun(activeRun);
  (Array.isArray(activeRun.prior_runs)?activeRun.prior_runs:[]).forEach(x=>rememberIssuedRun(x));
  originalRun=normalizeRun(activeRun);
  (Array.isArray(activeRun.prior_runs)?activeRun.prior_runs:[]).forEach(saveCurrentRun);
  saveCurrentRun(originalRun);
  recoverActiveRunIfNeeded()
}'''
          exact(old_init,new_init,'initial issued bundle')

          path.write_text(s)
          PY
      - name: Add issued-session boundary regression
        shell: bash
        run: |
          cat > tests/runner-issued-session-boundary.test.mjs <<'TEST'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          const runtimePath='assets/runner-core-runtime.js';
          const runtimeSource=fs.readFileSync(runtimePath,'utf8');
          const exportMarker='\nactiveRun=payload();';
          assert.ok(runtimeSource.includes(exportMarker),'runtime export injection marker must exist');
          const instrumented=runtimeSource.replace(exportMarker,`\nglobalThis.__runnerBoundary={normalizeRun,withoutComparison,safeHistory,saveCurrentRun,sessionRuns,newestSessionRun,rememberIssuedRun,catalogRuns,telemetryIntegrityState,deriveInstrumentReadings,marketState,sessionKey,recoverCanonicalIssuedRun};${exportMarker}`);

          const store=new Map();
          const app={addEventListener(){}};
          const RealDate=Date;
          class FakeDate extends RealDate{
            constructor(...args){super(...(args.length?args:['2026-09-02T20:30:00-07:00']))}
            static now(){return RealDate.parse('2026-09-02T20:30:00-07:00')}
          }
          const finalMorningPath='data/history/runs/2026-09-02/final_morning-093430.json';
          const mainPath='data/history/runs/2026-09-02/main-080700.json';
          const openPath='data/history/runs/2026-09-02/open-060215.json';
          const finalMorning=JSON.parse(fs.readFileSync(finalMorningPath,'utf8'));
          const main0800=JSON.parse(fs.readFileSync(mainPath,'utf8'));
          const open0600=JSON.parse(fs.readFileSync(openPath,'utf8'));
          const fetchStub=async url=>{
            const u=String(url);
            if(u.startsWith('./run-history.json'))return {ok:true,json:async()=>({runs:[{ts:finalMorning.ts,slot:finalMorning.slot,path:finalMorningPath}]})};
            if(u.startsWith(`./${finalMorningPath}`))return {ok:true,json:async()=>JSON.parse(JSON.stringify(finalMorning))};
            return {ok:false,json:async()=>({})};
          };
          const context={
            console,
            localStorage:{getItem:k=>store.has(k)?store.get(k):null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)},
            location:{hash:'',pathname:'/runner.html',search:''},
            history:{replaceState(){}},
            document:{querySelector:s=>s==='#app'?app:null},
            confirm:()=>true,
            Intl,URLSearchParams,TextDecoder,TextEncoder,Uint8Array,
            atob:s=>Buffer.from(s,'base64').toString('binary'),
            btoa:s=>Buffer.from(s,'binary').toString('base64'),
            Date:FakeDate,
            fetch:fetchStub,
            setTimeout,clearTimeout
          };
          vm.runInNewContext(instrumented,context,{filename:runtimePath});
          const api=context.__runnerBoundary;
          assert.ok(api,'runner boundary exports must be available to the regression');

          assert.equal(finalMorning.instrumentTelemetry?.heat?.value,17);
          assert.equal(finalMorning.instrumentTelemetry?.pressure?.value,52);
          assert.equal(finalMorning.instrumentTelemetry?.agreement?.score,91);

          const futureField={schema:1,name:'future-issued-field',nested:{kept:true}};
          const futureRun={...JSON.parse(JSON.stringify(finalMorning)),futureIssuedField:futureField};
          const normalized=api.normalizeRun(futureRun);
          assert.deepEqual(normalized.instrumentTelemetry,finalMorning.instrumentTelemetry,'normalization must preserve issued telemetry exactly');
          assert.deepEqual(normalized.futureIssuedField,futureField,'normalization must preserve unknown future issued fields');
          assert.equal('prior_runs' in normalized,false,'navigation envelope must not be duplicated into individual cached runs');

          const repriced={...JSON.parse(JSON.stringify(futureRun)),comparison:{instrumentTelemetry:{authority:'REPRICE_COMPARISON_ONLY',agreement:{score:1}}},refreshDelta:{matched:1},recs:futureRun.recs.map((r,i)=>i?{...r}:{...r,priceComparison:{state:'MATCHED'}})};
          const stripped=api.withoutComparison(repriced);
          assert.equal(stripped.comparison,undefined,'comparison overlay must be stripped');
          assert.equal(stripped.refreshDelta,undefined,'refresh delta must be stripped');
          assert.equal(stripped.recs[0].priceComparison,undefined,'recommendation price comparison must be stripped');
          assert.deepEqual(stripped.instrumentTelemetry,finalMorning.instrumentTelemetry,'issued telemetry must never be stripped with comparison data');
          assert.deepEqual(stripped.futureIssuedField,futureField,'unknown issued fields must survive overlay stripping');
          assert.doesNotMatch(runtimeSource,/^\s*instrumentTelemetry:buildInstrumentTelemetry\(recs,feed\),\s*$/m,'REPRICE must not overwrite root issued telemetry');
          assert.match(runtimeSource,/comparison:\{[^\n]*instrumentTelemetry:buildInstrumentTelemetry\(recs,feed\)/,'comparison telemetry may live only inside the transient comparison overlay');

          const contaminated=JSON.parse(JSON.stringify(finalMorning));
          delete contaminated.instrumentTelemetry;
          store.set('bettingEdge.runnerHistory.v1.3',JSON.stringify([contaminated]));
          assert.equal(api.safeHistory().length,0,'v1.3 contaminated browser cache must not be read after the schema bump');

          api.rememberIssuedRun(finalMorning);
          api.rememberIssuedRun(main0800);
          api.rememberIssuedRun(open0600);
          api.saveCurrentRun(finalMorning);
          const selected0800=api.newestSessionRun(finalMorning,'08:00');
          assert.equal(selected0800.ts,main0800.ts);
          api.saveCurrentRun(selected0800);
          const selected0600=api.newestSessionRun(selected0800,'06:00');
          assert.equal(selected0600.ts,open0600.ts);
          api.saveCurrentRun(selected0600);
          const returned0930=api.newestSessionRun(selected0600,'09:30');
          assert.equal(returned0930.ts,finalMorning.ts);
          assert.equal(returned0930.instrumentTelemetry?.heat?.value,17);
          assert.equal(returned0930.instrumentTelemetry?.pressure?.value,52);
          assert.equal(returned0930.instrumentTelemetry?.agreement?.score,91);
          assert.deepEqual(returned0930.instrumentTelemetry,finalMorning.instrumentTelemetry,'09:30 -> 08:00 -> 06:00 -> 09:30 must restore the exact issued receipt');

          store.set('bettingEdge.runnerHistory.v1.4',JSON.stringify([contaminated]));
          const catalogWins=api.newestSessionRun(selected0600,'09:30');
          assert.deepEqual(catalogWins.instrumentTelemetry,finalMorning.instrumentTelemetry,'canonical in-memory issued run must outrank a damaged local duplicate');

          const synthetic=(slot,label,ts,heat,pressure,agreement)=>{
            const run=api.normalizeRun({...futureRun,slot,label,ts});
            run.instrumentTelemetry={...JSON.parse(JSON.stringify(finalMorning.instrumentTelemetry)),derivedAt:ts,heat:{...finalMorning.instrumentTelemetry.heat,value:heat,rawValue:heat},pressure:{...finalMorning.instrumentTelemetry.pressure,value:pressure,rawValue:pressure},agreement:{...finalMorning.instrumentTelemetry.agreement,score:agreement,rawScore:agreement}};
            run.futureIssuedField={slot,kept:true};
            return run
          };
          const run1515=synthetic('evening','15:15 EVENING','2026-09-02T15:15:00.000-07:00',44,61,82);
          const run1815=synthetic('late','18:15 LATE / WEST COAST','2026-09-02T18:15:00.000-07:00',57,48,76);
          api.rememberIssuedRun(run1515);
          api.rememberIssuedRun(run1815);
          const picked1515=api.newestSessionRun(run1815,'15:15');
          assert.equal(picked1515.instrumentTelemetry.heat.value,44,'15:15 must use the same issued-session preservation rule');
          assert.deepEqual(picked1515.futureIssuedField,{slot:'evening',kept:true});
          const returned1815=api.newestSessionRun(picked1515,'18:15');
          assert.equal(returned1815.instrumentTelemetry.heat.value,57,'18:15 must use the same issued-session preservation rule');
          assert.deepEqual(returned1815.futureIssuedField,{slot:'late',kept:true});

          assert.equal(api.telemetryIntegrityState(main0800),'LEGACY','08:00 remains exempt before the cutover');
          assert.equal(api.telemetryIntegrityState(finalMorning),'VALID','09:30 publisher-bound receipt must validate');
          assert.equal(api.telemetryIntegrityState(run1515),'VALID','15:15 publisher-bound receipt must validate generically');
          assert.equal(api.telemetryIntegrityState(run1815),'VALID','18:15 publisher-bound receipt must validate generically');
          assert.equal(api.telemetryIntegrityState(contaminated),'ERROR','post-cutover missing telemetry must fail closed');
          const failedReadings=api.deriveInstrumentReadings(contaminated);
          assert.equal(failedReadings.heat.confidence,0);
          assert.equal(failedReadings.heat.label,'INTEGRITY ERROR');
          assert.equal(api.marketState(contaminated).label,'TELEMETRY INTEGRITY ERROR');

          const recovered=await api.recoverCanonicalIssuedRun(contaminated);
          assert.ok(recovered,'damaged post-cutover URL/session payload should recover from the canonical archive when available');
          assert.deepEqual(recovered.instrumentTelemetry,finalMorning.instrumentTelemetry,'archive recovery must restore the exact publisher-bound receipt');

          console.log(JSON.stringify({state:'PASS',sequence:'09:30 -> 08:00 -> 06:00 -> 09:30',meters:{heat:returned0930.instrumentTelemetry.heat.value,pressure:returned0930.instrumentTelemetry.pressure.value,agreement:returned0930.instrumentTelemetry.agreement.score},futureSlots:['15:15','18:15'],cache:'v1.4',archiveRecovery:'PASS'},null,2));
          TEST
      - name: Restore permanent regression workflow with new boundary test
        shell: bash
        run: |
          cat > .github/workflows/vigscope-meter-production-regression.yml <<'YAML'
          name: VigScope meter production regression

          on:
            workflow_dispatch:
            push:
              paths:
                - 'assets/runner-core-runtime.js'
                - 'data/vigscope/meter-calibration-production-v1.json'
                - 'tools/vigscope-meter-production.mjs'
                - 'tools/vigscope-meter-telemetry.mjs'
                - 'tools/vigscope-meter-telemetry-gate.mjs'
                - 'tools/report-publication.mjs'
                - 'tests/vigscope-meter-production.test.mjs'
                - 'tests/vigscope-meter-fallback-safety.test.mjs'
                - 'tests/vigscope-meter-telemetry.test.mjs'
                - 'tests/vigscope-meter-sep2-live-fixture.test.mjs'
                - 'tests/runner-issued-session-boundary.test.mjs'
                - '.github/workflows/vigscope-meter-production-regression.yml'

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - name: Check out committed main with history
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                - name: Run calibrated meter regression
                  run: node tests/vigscope-meter-production.test.mjs
                - name: Run fallback meter safety regression
                  run: node tests/vigscope-meter-fallback-safety.test.mjs
                - name: Run structured publisher telemetry regression
                  run: node tests/vigscope-meter-telemetry.test.mjs
                - name: Run Sep 2 production telemetry fixture
                  run: node tests/vigscope-meter-sep2-live-fixture.test.mjs
                - name: Run issued-session boundary regression
                  run: node tests/runner-issued-session-boundary.test.mjs
                - name: Run durable telemetry gate self-test
                  run: node tools/vigscope-meter-telemetry-gate.mjs self-test
                - name: Run report publisher self-test
                  run: node tools/report-publication.mjs self-test
                - name: Verify runner production wiring
                  run: |
                    grep -F '<script src="./assets/runner-core-runtime.js"></script>' runner.html
                    grep -F "HISTORY_KEY='bettingEdge.runnerHistory.v1.4'" assets/runner-core-runtime.js
                    grep -F "VIG_METER_CALIBRATION_ID='vigscope-meter-calibration-v1'" assets/runner-core-runtime.js
                    grep -F "VIG_METER_TELEMETRY_CUTOVER='2026-09-02T08:43:00-07:00'" assets/runner-core-runtime.js
                    grep -F "TELEMETRY INTEGRITY ERROR" assets/runner-core-runtime.js
                    grep -F "PUBLISHER_BOUND_FEED_V1" assets/runner-core-runtime.js
                    grep -F "attachPublisherInstrumentTelemetry" tools/report-publication.mjs
                    grep -F "VIG_METER_TELEMETRY_CUTOVER='2026-09-02T08:43:00-07:00'" tools/vigscope-meter-telemetry-gate.mjs
          YAML
      - name: Run focused regression suite before commit
        run: |
          node --check assets/runner-core-runtime.js
          node tests/runner-issued-session-boundary.test.mjs
          node tests/vigscope-meter-sep2-live-fixture.test.mjs
          node tests/vigscope-meter-production.test.mjs
          node tests/vigscope-meter-fallback-safety.test.mjs
          node tests/vigscope-meter-telemetry.test.mjs
          node tools/vigscope-meter-telemetry-gate.mjs self-test
          node tools/report-publication.mjs self-test
      - name: Verify boundary invariants before commit
        shell: bash
        run: |
          grep -F "HISTORY_KEY='bettingEdge.runnerHistory.v1.4'" assets/runner-core-runtime.js
          grep -F "const issuedSessionCatalog=new Map();" assets/runner-core-runtime.js
          grep -F "TELEMETRY INTEGRITY ERROR" assets/runner-core-runtime.js
          grep -F "comparison:{checkedAt:now,feedGeneratedAt:feed.generatedAt,schema:feed.schema||1,matched,retained,reasonText,instrumentTelemetry:buildInstrumentTelemetry(recs,feed)}" assets/runner-core-runtime.js
          ! grep -F "delete out.instrumentTelemetry" assets/runner-core-runtime.js
          ! grep -E '^\s*instrumentTelemetry:buildInstrumentTelemetry\(recs,feed\),\s*$' assets/runner-core-runtime.js
      - name: Commit only if branch has not moved
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git config user.name 'vigscope-boundary-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/runner-core-runtime.js tests/runner-issued-session-boundary.test.mjs .github/workflows/vigscope-meter-production-regression.yml
          git commit -m 'fix: preserve complete issued runs across VigScope sessions'
          git push origin HEAD:"$GITHUB_REF_NAME"
