name: VigScope issued-session boundary repair

on:
  workflow_dispatch:
  push:
    branches:
      - fix/vigscope-issued-session-boundary
    paths:
      - '.github/workflows/vigscope-meter-production-regression.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch production authority
        run: git fetch origin main
      - name: Apply broad issued-session boundary repair
        run: python tools/apply-vigscope-issued-session-boundary.py
      - name: Run focused regression suite
        run: |
          node --check assets/runner-core-runtime.js
          node tests/runner-issued-session-boundary.test.mjs
          node tests/vigscope-meter-sep2-live-fixture.test.mjs
          node tests/vigscope-meter-production.test.mjs
          node tests/vigscope-meter-fallback-safety.test.mjs
          node tests/vigscope-meter-telemetry.test.mjs
          node tools/vigscope-meter-telemetry-gate.mjs self-test
          node tools/report-publication.mjs self-test
      - name: Verify boundary invariants
        run: |
          grep -F "HISTORY_KEY='bettingEdge.runnerHistory.v1.4'" assets/runner-core-runtime.js
          grep -F "const issuedSessionCatalog=new Map();" assets/runner-core-runtime.js
          grep -F "TELEMETRY INTEGRITY ERROR" assets/runner-core-runtime.js
          grep -F "comparison:{checkedAt:now,feedGeneratedAt:feed.generatedAt,schema:feed.schema||1,matched,retained,reasonText,instrumentTelemetry:buildInstrumentTelemetry(recs,feed)}" assets/runner-core-runtime.js
          ! grep -F "delete out.instrumentTelemetry" assets/runner-core-runtime.js
          ! grep -E '^\s*instrumentTelemetry:buildInstrumentTelemetry\(recs,feed\),\s*$' assets/runner-core-runtime.js
      - name: Commit validated repair to isolated branch
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git rm tools/apply-vigscope-issued-session-boundary.py
          git config user.name 'vigscope-boundary-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/runner-core-runtime.js tests/runner-issued-session-boundary.test.mjs .github/workflows/vigscope-meter-production-regression.yml
          git commit -m 'fix: preserve complete issued runs across VigScope sessions'
          git push origin HEAD:"$GITHUB_REF_NAME"
