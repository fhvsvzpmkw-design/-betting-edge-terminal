name: F3 UI polish one-time

on:
  push:
    branches: [main]
    paths:
      - 'tools/f3-cash-premium-once.mjs'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply F3 cash + premium layout
        run: node tools/f3-cash-premium-once.mjs
      - name: Commit F3 UI update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Restore cash ROI and add premium all-in panel'
          git push origin HEAD:main
