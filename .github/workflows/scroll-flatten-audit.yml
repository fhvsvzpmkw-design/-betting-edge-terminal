name: Scroll flatten audit

on:
  push:
    branches:
      - fix/iphone-scroll-flatten
    paths:
      - .github/workflows/scroll-flatten-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-scroll-flatten
      - name: Audit iframe dependencies
        shell: bash
        run: |
          {
            echo '=== contentDocument references ==='
            grep -RIn --exclude-dir=.git --include='*.js' --include='*.html' 'contentDocument' . || true
            echo
            echo '=== app frame references ==='
            grep -RInE --exclude-dir=.git --include='*.js' --include='*.html' "getElementById\\(['\"]app['\"]\\)|#app|runner-core\\.html" . || true
          } > scroll-flatten-audit.txt
      - name: Save audit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/scroll-flatten-audit.yml
          git add scroll-flatten-audit.txt
          git commit -m 'Audit runner iframe dependencies'
          git push origin HEAD:fix/iphone-scroll-flatten
