name: Restore dashboard utility layout

on:
  push:
    branches: [fix/restore-utility-at-dashboard]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-utility-at-dashboard
          fetch-depth: 0
      - name: Restore utility layout in active dashboard renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/report-dashboard-vigscope.js.old')
          s=p.read_text()
          css_anchor="""      #runnerBankrollCompact .runnerNewRiskValue{color:#f4fff9!important}\n\n      /* VIG SCOPE = PICKS + INPUTS + VIG METER */"""
          css_new="""      #runnerBankrollCompact .runnerNewRiskValue{color:#f4fff9!important}\n\n      /* Stable report utility docks below the complete VIG SCOPE instrument. */\n      #runnerLive>.runnerUtilityDock{margin:8px 0 8px!important;display:grid!important;gap:5px!important}\n      #runnerLive>.runnerUtilityDock>.runnerRefresh{margin:0!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important;display:grid!important;grid-template-columns:auto minmax(0,1fr)!important;gap:4px 6px!important;align-items:center!important}\n      #runnerLive>.runnerUtilityDock>.runnerRefresh .runnerRefreshActions{display:block!important;margin:0!important;padding:0!important}\n      #runnerLive>.runnerUtilityDock>.runnerRefresh .runnerRefreshBtn{min-height:22px!important;padding:3px 5px!important;font-size:8px!important;line-height:1!important;white-space:nowrap!important;width:auto!important}\n      #runnerLive>.runnerUtilityDock>.runnerRefresh .runnerRefreshStatus{margin:0!important;padding:0!important;border:0!important;background:transparent!important;font-size:8px!important;line-height:1.3!important;color:var(--muted)!important;text-align:left!important}\n      #runnerLive>.runnerUtilityDock>.runnerRefresh .deltaStrip{grid-column:1/-1!important;margin:2px 0 0!important}\n      #runnerLive>.runnerSessionDock{margin:0 0 8px!important}\n      #runnerLive>.runnerSessionDock>.sessionStrip{margin:0!important;gap:7px!important}\n      #runnerLive>.runnerSessionDock>.sessionStrip .sessionChip{font-size:12px!important;font-weight:950!important;letter-spacing:.045em!important;min-height:40px!important;padding:9px 8px!important}\n      @media(max-width:520px){\n        #runnerLive>.runnerUtilityDock{gap:4px!important;margin-top:7px!important}\n        #runnerLive>.runnerUtilityDock>.runnerRefresh{grid-template-columns:auto minmax(0,1fr)!important;gap:4px 5px!important}\n        #runnerLive>.runnerUtilityDock>.runnerRefresh .runnerRefreshBtn{font-size:8px!important;padding:3px 5px!important;min-height:22px!important}\n        #runnerLive>.runnerUtilityDock>.runnerRefresh .runnerRefreshStatus{font-size:7.5px!important}\n        #runnerLive>.runnerSessionDock>.sessionStrip{gap:5px!important;overflow-x:auto!important}\n        #runnerLive>.runnerSessionDock>.sessionStrip .sessionChip{font-size:11px!important;min-width:64px!important;min-height:38px!important;padding:8px 6px!important}\n      }\n\n      /* VIG SCOPE = PICKS + INPUTS + VIG METER */"""
          if s.count(css_anchor)!=1:
              raise SystemExit(f'css anchor count {s.count(css_anchor)}')
          s=s.replace(css_anchor,css_new,1)

          old="""    if(session){\n      if(head.nextElementSibling!==session)head.insertAdjacentElement('afterend',session);\n      if(session.nextElementSibling!==intel)session.insertAdjacentElement('afterend',intel);\n    }else if(head.nextElementSibling!==intel){\n      head.insertAdjacentElement('afterend',intel);\n    }"""
          new="""    if(intel.parentElement!==live){\n      head.insertAdjacentElement('afterend',intel);\n    }\n\n    const refresh=live.querySelector('.runnerRefresh');\n    let utility=live.querySelector(':scope > .runnerUtilityDock');\n    if(refresh){\n      if(!utility){utility=d.createElement('div');utility.className='runnerUtilityDock'}\n      if(refresh.parentElement!==utility)utility.appendChild(refresh);\n      if(intel.nextElementSibling!==utility)intel.insertAdjacentElement('afterend',utility);\n    }\n\n    if(session){\n      let dock=live.querySelector(':scope > .runnerSessionDock');\n      if(!dock){dock=d.createElement('div');dock.className='runnerSessionDock'}\n      if(session.parentElement!==dock)dock.appendChild(session);\n      const anchor=utility||intel;\n      if(anchor.nextElementSibling!==dock)anchor.insertAdjacentElement('afterend',dock);\n    }"""
          if s.count(old)!=1:
              raise SystemExit(f'placement block count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify narrow UI-only change
        run: |
          node --check assets/report-dashboard-vigscope.js.old
          grep -F "const refresh=live.querySelector('.runnerRefresh');" assets/report-dashboard-vigscope.js.old
          grep -F "runnerSessionDock" assets/report-dashboard-vigscope.js.old
          grep -F "width:auto!important" assets/report-dashboard-vigscope.js.old
          ! grep -F "if(head.nextElementSibling!==session)" assets/report-dashboard-vigscope.js.old
          git diff --check
          test "$(git diff --name-only)" = "assets/report-dashboard-vigscope.js.old"
      - name: Save dashboard layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/report-dashboard-vigscope.js.old
          git commit -m "Restore report controls in dashboard renderer"
          git push origin HEAD:fix/restore-utility-at-dashboard
