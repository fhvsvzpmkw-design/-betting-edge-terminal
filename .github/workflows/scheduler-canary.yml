name: Scheduler Canary

on:
  workflow_dispatch:
  schedule:
    # Diagnostic only: off-peak minutes reduce GitHub scheduler congestion.
    # GitHub Actions cron is UTC; minute-only cadence is timezone-independent.
    - cron: '17,47 * * * *'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm scheduler dispatch
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled=${{ github.event.schedule || 'manual' }}"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Scheduler canary completed. No API requests or repository writes were made."
