name: Temporary Core 1.4 count compatibility patch
on:
  push:
    branches:
      - 'fix/core14-derived-counts'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/core14-derived-counts
          fetch-depth: 0
      - name: Patch display loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = "    const priorRuns=await sameDayPriorRuns(index,entry);\n    const hydrated={...run,prior_runs:priorRuns};"
          repl = """    const priorRuns=await sameDayPriorRuns(index,entry);
    // Display-only compatibility: derive summary counts from the issued recommendations.
    const canonicalCounts={bet:0,lean:0,wait:0,pass:0};
    for(const rec of Array.isArray(run.recs)?run.recs:[]){
      const status=String(rec&&rec.status||'').trim().toLowerCase();
      if(Object.hasOwn(canonicalCounts,status))canonicalCounts[status]++;
    }
    const hydrated={...run,counts:canonicalCounts,prior_runs:priorRuns};"""
          changed=[]
          for name in ('r.html','index.html'):
              p=Path(name)
              if not p.exists():
                  continue
              text=p.read_text()
              if needle in text:
                  p.write_text(text.replace(needle,repl,1))
                  changed.append(name)
          if not changed:
              raise SystemExit('No compatible loader marker found')
          print('patched:', ', '.join(changed))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add r.html index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: derive VigScope display counts from issued recommendations'
          git push origin HEAD:fix/core14-derived-counts
