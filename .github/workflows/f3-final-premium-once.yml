name: F3 final premium pass

on:
  push:
    branches: [main]
    paths:
      - 'tools/f3-final-premium-once.mjs'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final premium styling
        run: node tools/f3-final-premium-once.mjs
      - name: Commit F3 premium polish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Polish F3 cash and premium metrics'
          git push origin HEAD:main
