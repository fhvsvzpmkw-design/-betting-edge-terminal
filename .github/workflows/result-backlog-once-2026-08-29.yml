name: One-off result index finalization 2026-08-29

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/result-backlog-once-2026-08-29.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: result-backlog-once-2026-08-29
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Rebuild results index
        run: |
          node tools/build-results-index.mjs
          node tools/add-results-player-value.mjs
          node tools/add-results-shadow-v2.mjs

      - name: Publish results index
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history/results-index.json
          if git diff --cached --quiet; then
            echo "No results index changes."
            exit 0
          fi
          git commit -m "Rebuild Betting Edge results index after backlog closure"
          git pull --rebase origin main
          git push
