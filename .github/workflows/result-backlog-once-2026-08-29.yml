name: One-off exact result backlog closure 2026-08-29

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/result-backlog-once-2026-08-29.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: result-backlog-once-2026-08-29
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: git pull --ff-only origin main

      - name: Apply exact result verification
        run: |
          V=data/history/verifications/2026-08-29-backlog.json
          node tools/verify-issued-results.mjs data/history/runs/2026-08-25/open-061031.json "$V"
          node tools/verify-issued-results.mjs data/history/runs/2026-08-25/main-080346.json "$V"
          node tools/verify-issued-results.mjs data/history/runs/2026-08-25/final_morning-093741.json "$V"
          node tools/verify-issued-results.mjs data/history/runs/2026-08-25/evening-152443.json "$V"
          node tools/verify-issued-results.mjs data/history/runs/2026-08-25/late-182223.json "$V"
          node tools/verify-issued-results.mjs data/history/runs/2026-08-26/main-082200.json "$V"
          node tools/verify-issued-results.mjs data/history/runs/2026-08-26/final_morning-094246.json "$V"

      - name: Publish closed observations
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history/observations/2026-08-25 data/history/observations/2026-08-26
          if git diff --cached --quiet; then
            echo "No observation changes."
            exit 0
          fi
          git commit -m "Close exact historical result backlog"
          git pull --rebase origin main
          git push
