name: Eddie V3 middle cleanup v2 once

on:
  push:
    paths:
      - '.github/workflows/eddie-v3-middle-cleanup-v2-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify Eddie V3 brand band
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('syndicates/generated/eddie-numbers/hotline.html')
          s = p.read_text()

          new_brand = '''<div class="brandrow"><div class="brandcopy"><div class="ey">HALL OF FAME LEDGER ANALYST // LAS VEGAS MAIN SHEET</div><h2>LEDGER DESK // THE MAIN SHEET</h2><p>Eddie “Muddy” Numbers works the public ledger from the Las Vegas main sheet: exact all-time cash totals from the authoritative public summary, with week, month, sport, book, behaviour and recent-ticket analysis calculated from settled public wager rows.</p><div class="brandnote">FICTIONAL CHARACTER // LIVE NUMBERS FROM THE PUBLIC LEDGER</div></div><div class="logo"><img src="../../../assets/syndicates/03_muddy_numbers_ledger_desk_logo.png" alt="Muddy Numbers Ledger Desk logo"></div><aside class="source" data-zone="issue-meta"><div class="sourceMain"><small>Authority</small><strong>PUBLIC BET HISTORY</strong><div id="status" class="live">LOADING CURRENT LEDGER…</div></div><div class="sourceMetric"><small>Ledger generated</small><b id="gen">—</b></div><div class="sourceMetric"><small>Data through</small><b id="through">—</b></div><div class="sourceMetric"><small>Source file</small><b id="file">—</b></div></aside></div>'''

          pattern = r'<div class="brandrow">.*?</aside></div>(?=</header><div id="err")'
          s2, n = re.subn(pattern, new_brand, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Brand band replacement count {n}')
          s = s2

          overrides = '''
/* Eddie V3 compact brand band */
.brandrow{grid-template-columns:minmax(0,1fr) minmax(220px,320px)!important;gap:16px 20px!important;align-items:center!important;padding:15px 16px 12px!important}
.brandcopy h1{display:none!important}
.brandcopy h2{margin:5px 0 0!important;font:900 clamp(22px,3.2vw,32px)/1.05 system-ui,sans-serif!important;letter-spacing:.09em!important}
.brandcopy p{max-width:720px!important;margin:10px 0 0!important;line-height:1.5!important}
.ey{font-size:8px!important}
.brandnote{font-size:7px!important;margin-top:8px!important}
.logo{text-align:right!important}.logo img{max-width:300px!important;margin-left:auto!important;margin-right:0!important}
.source{grid-column:1/-1!important;display:grid!important;grid-template-columns:minmax(240px,1.3fr) repeat(3,minmax(125px,.7fr))!important;gap:10px 14px!important;align-items:end!important;padding:10px 12px!important}
.sourceMain,.sourceMetric{min-width:0}.sourceMetric{border-left:1px solid #29485b;padding-left:12px}.source b{display:block;margin-top:2px}.source strong{font-size:16px!important}
@media(max-width:900px){.brandrow{grid-template-columns:minmax(0,1fr) 220px!important}.source{grid-template-columns:minmax(210px,1.2fr) repeat(3,minmax(105px,.7fr))!important}}
@media(max-width:700px){.brandrow{grid-template-columns:1fr!important}.logo{text-align:left!important}.logo img{max-width:230px!important;margin:0!important}.source{grid-column:auto!important;grid-template-columns:1fr 1fr!important}.sourceMain{grid-column:1/-1}.sourceMetric{border-left:0;border-top:1px solid #29485b;padding:8px 0 0}}
'''
          if '/* Eddie V3 compact brand band */' not in s:
              s = s.replace('</style>', overrides + '</style>', 1)

          p.write_text(s)
          PY
      - name: Verify cleanup
        run: |
          ! grep -F '<h1><span>MUDDY</span> NUMBERS</h1>' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'HALL OF FAME LEDGER ANALYST // LAS VEGAS MAIN SHEET' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'sourceMetric' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'Eddie V3 compact brand band' syndicates/generated/eddie-numbers/hotline.html
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syndicates/generated/eddie-numbers/hotline.html
          git diff --cached --quiet && exit 0
          git commit -m "Clean up Eddie V3 middle brand band"
          git push
