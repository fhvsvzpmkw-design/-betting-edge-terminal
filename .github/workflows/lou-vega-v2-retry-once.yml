name: Lou Vega V2 Retry Once

on:
  push:
    branches: [main]
    paths:
      - 'tools/lou-vega-v2-retry.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair one-time builder interpolation
        run: |
          python - <<'PY'
          p='tools/lou-vega-v2-once.mjs'
          s=open(p,encoding='utf-8').read()
          if '${m}' not in s:
              raise SystemExit('Expected test interpolation marker not found')
          s=s.replace('${m}', r'\${m}')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Build Vegas by the Slice v2
        run: node tools/lou-vega-v2-once.mjs
      - name: Validate Lou v2
        run: |
          node tests/lou-vega-v2.test.mjs
          node tests/hotline-shells.test.js
      - name: Commit Lou v2 and clean one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            tools/lou-vega-v2-once.mjs \
            tools/lou-vega-v2-retry.trigger \
            .github/workflows/lou-vega-v2-once.yml \
            .github/workflows/lou-vega-v2-retry-once.yml
          git add -A
          git commit -m "Launch Lou Vega Vegas by the Slice v2"
          git push
