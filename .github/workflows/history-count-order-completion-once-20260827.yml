name: Complete durable history count-order fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/history-count-order-completion-once-20260827.yml

permissions:
  contents: write

concurrency:
  group: betting-edge-history-count-order-completion-once-20260827
  cancel-in-progress: false

jobs:
  complete-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Complete count-order fix
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sourcePath = 'tools/report-publication.mjs';
          let source = fs.readFileSync(sourcePath, 'utf8');

          function replaceOnce(oldText, newText, label) {
            const count = source.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`);
            source = source.replace(oldText, newText);
          }

          replaceOnce(
            "function actualCounts(recs){\n  const counts = {bet:0,lean:0,wait:0,pass:0};",
            "function canonicalCounts(counts){\n  assert(counts && typeof counts==='object' && !Array.isArray(counts),'Counts must be an object');\n  const canonical={};\n  for(const key of STATUS_KEYS){\n    assert(Number.isInteger(counts[key]) && counts[key]>=0,`counts.${key} must be a non-negative integer`);\n    canonical[key]=counts[key];\n  }\n  return canonical;\n}\nfunction countsEqual(left,right){\n  if(!left || !right) return false;\n  return STATUS_KEYS.every(key=>left[key]===right[key]);\n}\nfunction normalizeIndexCounts(index){\n  let changed=false;\n  for(const entry of index.runs||[]){\n    const canonical=canonicalCounts(entry.counts);\n    if(normalizedJson(entry.counts)!==normalizedJson(canonical)){\n      entry.counts=canonical;\n      changed=true;\n    }\n  }\n  return changed;\n}\nfunction actualCounts(recs){\n  const counts = {bet:0,lean:0,wait:0,pass:0};",
            'insert canonical count helpers'
          );

          replaceOnce(
            '    counts:report.counts,',
            '    counts:canonicalCounts(report.counts),',
            'canonicalize new index entries'
          );

          replaceOnce(
            "function entryMatches(existing,expected){\n  for(const key of Object.keys(expected)){\n    if(normalizedJson(existing[key])!==normalizedJson(expected[key])) return false;\n  }\n  return true;\n}",
            "function entryMatches(existing,expected){\n  for(const key of Object.keys(expected)){\n    if(key==='counts'){\n      if(!countsEqual(existing.counts,expected.counts)) return false;\n      continue;\n    }\n    if(normalizedJson(existing[key])!==normalizedJson(expected[key])) return false;\n  }\n  return true;\n}",
            'make existing-entry count comparison order-insensitive'
          );

          replaceOnce(
            '  let indexChanged = false;',
            '  let indexChanged = normalizeIndexCounts(index);',
            'normalize legacy index counts during publication'
          );

          replaceOnce(
            '    assert(normalizedJson(entry.counts)===normalizedJson(report.counts),`Index counts do not match report: ${entry.id}`);',
            '    assert(countsEqual(entry.counts,report.counts),`Index counts do not match report: ${entry.id}`);',
            'make verifier count comparison order-insensitive'
          );

          fs.writeFileSync(sourcePath, source, 'utf8');

          const indexPath = 'run-history.json';
          const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
          for (const entry of index.runs || []) {
            const counts = entry.counts || {};
            entry.counts = {
              bet: counts.bet,
              lean: counts.lean,
              wait: counts.wait,
              pass: counts.pass
            };
          }
          fs.writeFileSync(indexPath, JSON.stringify(index, null, 2) + '\n', 'utf8');
          NODE

      - name: Prove publisher and durable history
        run: |
          node tools/report-publication.mjs self-test
          node tools/report-publication.mjs verify

      - name: Commit completed fix and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/history-count-order-completion-once-20260827.yml
          git add tools/report-publication.mjs run-history.json
          git commit -m "history: complete canonical count-order fix"
          git push origin HEAD:main
