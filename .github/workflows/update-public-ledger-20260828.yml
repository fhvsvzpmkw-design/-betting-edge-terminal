name: Update public ledger 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-public-ledger-20260828.yml'

permissions:
  contents: write

jobs:
  update-public-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified sanitized ledger delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('data/ledger/public-ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          if data.get('schema') != 2 or data.get('publicProjection') is not True:
              raise SystemExit('Unexpected public ledger contract')
          wagers = data.get('wagers')
          if not isinstance(wagers, list):
              raise SystemExit('Public wagers missing')
          if any((not isinstance(r, list)) or len(r) < 18 or r[2] is not None for r in wagers):
              raise SystemExit('Public ledger privacy validation failed before update')
          if len(wagers) not in (1624, 1627):
              raise SystemExit(f'Unexpected starting public wager count: {len(wagers)}')

          additions = [
              [1625, 'Bet365', None, '2026-08-27 02:29:47+00', '2026-08-27 02:29:47+00', 'Basketball', 'WNBA', 'TOR Tempo @ SEA Storm - TOR Tempo +6.5 - Point Spread', -110, 5.5, 'Lost', -5.5, 'AFTER START', 0, False, ['Seattle Storm vs Toronto Tempo'], ['TOR Tempo @ SEA Storm - TOR Tempo +6.5 - Point Spread'], '[]'],
              [1626, 'Bet365', None, '2026-08-28 01:02:08+00', '2026-08-28 01:02:08+00', 'Basketball', 'WNBA', 'GS Valkyries @ NY Liberty - GS Valkyries - Money Line', 122, 5.5, 'Won', 6.71, 'AFTER START', -0.0114, False, ['New York Liberty vs Golden State Valkyries'], ['GS Valkyries @ NY Liberty - GS Valkyries - Money Line'], '[]'],
              [1627, 'Bet365', None, '2026-08-28 01:04:56+00', '2026-08-28 01:04:56+00', 'Baseball', 'MLB', 'LA Dodgers @ ATL Braves - LA Dodgers - Money Line', 185, 5.5, 'Lost', -5.5, 'AFTER START', None, False, ['Atlanta Braves vs Los Angeles Dodgers'], ['LA Dodgers @ ATL Braves - LA Dodgers - Money Line'], '[]']
          ]

          if len(wagers) == 1624:
              expected_ids = list(range(1, 1625))
              actual_ids = [int(r[0]) for r in wagers]
              if actual_ids != expected_ids:
                  raise SystemExit('Existing public surrogate IDs are not contiguous 1..1624')
              wagers.extend(additions)
          else:
              tail = wagers[-3:]
              if [int(r[0]) for r in tail] != [1625, 1626, 1627]:
                  raise SystemExit('Existing 1627-wager public ledger has unexpected tail IDs')

          if len(wagers) != 1627:
              raise SystemExit(f'Unexpected ending wager count: {len(wagers)}')
          if any(r[2] is not None for r in wagers):
              raise SystemExit('Sanitized public ledger contains a private reference')

          data['generatedAt'] = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          data['bankrollCad'] = 495.41
          data['validation'] = {
              'uniqueWagers': 1627,
              'pagesAt10Rows': 163,
              'status': 'PASS'
          }
          data['summary'] = {
              'cashBets': 1514,
              'cashRisked': 8921.37,
              'cashProfit': 163.57,
              'cashRoiPercent': 1.83,
              'resultMix': {
                  'Won': 638,
                  'Lost': 851,
                  'CashedOut': 133,
                  'Push': 2,
                  'Cancelled': 3
              }
          }

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Validate and commit canonical public ledger
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('data/ledger/public-ledger.json','utf8'));
          if(j.schema!==2) throw new Error('schema must be 2');
          if(j.publicProjection!==true) throw new Error('publicProjection must be true');
          if(!Array.isArray(j.wagers) || j.wagers.length!==1627) throw new Error('expected 1627 wagers');
          if(j.wagers.some(r=>!Array.isArray(r) || r[2]!==null)) throw new Error('private reference leak');
          if(Number(j.validation?.uniqueWagers)!==1627) throw new Error('validation count mismatch');
          if(Number(j.bankrollCad)!==495.41) throw new Error('bankroll mismatch');
          if(Number(j.summary?.cashProfit)!==163.57) throw new Error('cash profit mismatch');
          console.log('PUBLIC LEDGER UPDATE VALIDATION: PASS');
          NODE
          git config user.name 'betting-edge-public-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- data/ledger/public-ledger.json
          if git diff --cached --quiet; then
            echo 'Canonical public ledger already matches Aug 28 projection.'
            exit 0
          fi
          git commit -m 'ledger: publish sanitized Aug 28 public projection'
          git push origin HEAD:main
