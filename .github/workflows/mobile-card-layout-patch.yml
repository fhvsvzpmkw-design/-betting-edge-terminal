name: One-time mobile card layout patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-card-layout-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore compact iPhone card layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('runner-core.html')
          s = p.read_text()
          old = '''    .runnerTop{grid-template-columns:1fr}\n    .execution{text-align:left}\n    .runnerCounts{grid-template-columns:repeat(2,1fr)}'''
          new = '''    .runnerTop{grid-template-columns:minmax(0,1fr) auto;gap:10px}\n    .runnerTop>div:first-child{min-width:0}\n    .execution{text-align:right;min-width:110px}\n    .decisionLine{grid-template-columns:1fr 1fr}\n    .decisionFact:nth-child(1),.decisionFact:nth-child(2){grid-column:1 / -1}\n    .runnerCounts{grid-template-columns:repeat(2,1fr)}'''
          if old not in s:
              raise SystemExit('Expected mobile CSS block not found; no patch applied')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify scope
        run: |
          git diff --check
          git diff -- runner-core.html
          grep -F '.runnerTop{grid-template-columns:minmax(0,1fr) auto;gap:10px}' runner-core.html
          grep -F '.decisionFact:nth-child(1),.decisionFact:nth-child(2){grid-column:1 / -1}' runner-core.html
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runner-core.html
          git commit -m 'ui: restore compact iPhone card execution layout'
          git push origin HEAD:main
