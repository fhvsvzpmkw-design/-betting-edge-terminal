name: Cache hardening once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-hardening-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harden VigScope cache behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          CACHE_META = '''<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
          <meta http-equiv="Pragma" content="no-cache">
          <meta http-equiv="Expires" content="0">'''

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  print(f'{label}: already applied')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected source text not found in {path}')
              p.write_text(text.replace(old, new, 1))
              print(f'{label}: applied')

          # Browser-level revalidation hints on every HTML layer.
          runner_viewport = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
          replace_once('runner.html', runner_viewport, runner_viewport + '\n' + CACHE_META,
                       'runner cache meta')

          core_viewport = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
          replace_once('runner-core.html', core_viewport, core_viewport + '\n' + CACHE_META,
                       'runner-core cache meta')

          index_viewport = '<meta name="viewport" content="width=device-width,initial-scale=1">'
          replace_once('index.html', index_viewport, index_viewport + '\n' + CACHE_META,
                       'index cache meta')

          # The outer shell must never reuse an old runner-core URL.
          replace_once(
              'runner.html',
              "core.src='./runner-core.html'+location.search+location.hash;",
              "const coreUrl=new URL('./runner-core.html',location.href);for(const [k,v] of new URLSearchParams(location.search))coreUrl.searchParams.set(k,v);coreUrl.searchParams.set('build',String(Date.now()));coreUrl.hash=location.hash;core.src=coreUrl.pathname+coreUrl.search+coreUrl.hash;",
              'runner-core runtime cache bust'
          )

          # Do not give Safari a stable URL for the UI controller; that was the
          # remaining path by which an older Results/F8 presentation could return.
          replace_once(
              'runner.html',
              '<script src="./assets/report-dashboard-vigscope.js?v=20260823-1130"></script>',
              '''<script>\n(()=>{const s=document.createElement('script');s.src=`./assets/report-dashboard-vigscope.js?build=${Date.now()}`;s.async=false;document.head.appendChild(s)})();\n</script>''',
              'dashboard controller runtime cache bust'
          )

          # The current controller already cache-busts Results itself. Extend the
          # same behavior to every dynamically loaded UI module so future visual
          # changes cannot be mixed with older Safari-cached modules.
          replacements = {
              "legacy.src='./assets/report-dashboard-vigscope.js.old';":
                  "legacy.src=`./assets/report-dashboard-vigscope.js.old?b=${UI_CACHE_BUST}`;",
              "schedule.src='./assets/schedule-profile-ui.js?v=3';":
                  "schedule.src=`./assets/schedule-profile-ui.js?v=3&b=${UI_CACHE_BUST}`;",
              "preferences.src='./assets/preferences-framework.js?v=3';":
                  "preferences.src=`./assets/preferences-framework.js?v=3&b=${UI_CACHE_BUST}`;",
              "cardView.src='./assets/card-view-preference.js?v=3';":
                  "cardView.src=`./assets/card-view-preference.js?v=3&b=${UI_CACHE_BUST}`;",
              "specialDesks.src='./assets/special-desks-ui.js?v=4';":
                  "specialDesks.src=`./assets/special-desks-ui.js?v=4&b=${UI_CACHE_BUST}`;",
              "seasonPreviews.src='./assets/season-previews-ui.js?v=6';":
                  "seasonPreviews.src=`./assets/season-previews-ui.js?v=6&b=${UI_CACHE_BUST}`;",
              "script.src='./assets/game-window-intelligence.js?v=5';":
                  "script.src=`./assets/game-window-intelligence.js?v=5&b=${UI_CACHE_BUST}`;",
          }
          controller = Path('assets/report-dashboard-vigscope.js')
          text = controller.read_text()
          for old, new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'controller cache bust: expected source text not found: {old}')
              text = text.replace(old, new, 1)
          controller.write_text(text)
          print('controller child-module runtime cache busts: applied')
          PY

      - name: Commit cache hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.html runner-core.html index.html assets/report-dashboard-vigscope.js
          if git diff --cached --quiet; then
            echo "No cache-hardening changes needed."
          else
            git commit -m "Harden VigScope Safari cache handling"
            git push
          fi
