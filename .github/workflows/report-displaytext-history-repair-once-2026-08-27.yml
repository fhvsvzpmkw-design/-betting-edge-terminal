name: One-time report history display text repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-displaytext-history-repair-once-2026-08-27.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-displaytext-history-repair-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair only canonical displayText drift
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const index = JSON.parse(fs.readFileSync('run-history.json', 'utf8'));
          if (!index || !Array.isArray(index.runs)) {
            throw new Error('run-history.json does not contain a runs array');
          }

          const repairs = [];
          const changedPaths = new Set();

          for (const entry of index.runs) {
            if (!entry?.path || !entry?.researchFitPath) continue;

            const report = JSON.parse(fs.readFileSync(entry.path, 'utf8'));
            const sidecar = JSON.parse(fs.readFileSync(entry.researchFitPath, 'utf8'));
            if (sidecar?.schema !== 3) continue;

            if (sidecar?.reportReference?.reportPath !== entry.path) {
              throw new Error(`Refusing repair: sidecar report path mismatch at ${entry.researchFitPath}`);
            }

            const recs = Array.isArray(report.recs) ? report.recs : [];
            const items = Array.isArray(sidecar.recommendations) ? sidecar.recommendations : [];
            if (items.length !== recs.length) {
              throw new Error(`Refusing repair: recommendation count mismatch at ${entry.researchFitPath}`);
            }

            let fileChanged = false;
            for (let i = 0; i < recs.length; i += 1) {
              const rec = recs[i];
              const item = items[i];
              if (!item || item.ordinal !== i + 1 || item.title !== rec.title || item.status !== rec.status) {
                throw new Error(`Refusing repair: recommendation identity mismatch at ${entry.researchFitPath} ordinal ${i + 1}`);
              }
              if (typeof rec.hist !== 'string' || !rec.hist.trim()) {
                throw new Error(`Refusing repair: report hist is missing at ${entry.path} ordinal ${i + 1}`);
              }
              if (item.displayText !== rec.hist) {
                repairs.push({
                  report: entry.path,
                  sidecar: entry.researchFitPath,
                  ordinal: i + 1,
                  title: rec.title,
                  before: item.displayText,
                  after: rec.hist
                });
                item.displayText = rec.hist;
                fileChanged = true;
              }
            }

            if (fileChanged) {
              fs.writeFileSync(entry.researchFitPath, `${JSON.stringify(sidecar)}\n`, 'utf8');
              changedPaths.add(entry.researchFitPath);
            }
          }

          if (!repairs.length) {
            throw new Error('No displayText drift was found; refusing an empty maintenance commit');
          }

          fs.writeFileSync('/tmp/displaytext-repairs.json', `${JSON.stringify(repairs, null, 2)}\n`, 'utf8');
          fs.writeFileSync('/tmp/displaytext-paths.txt', `${[...changedPaths].join('\n')}\n`, 'utf8');
          console.log(`DISPLAYTEXT REPAIR READY: ${repairs.length} recommendation(s) in ${changedPaths.size} sidecar file(s)`);
          console.log(fs.readFileSync('/tmp/displaytext-repairs.json', 'utf8'));
          NODE

      - name: Verify repaired durable history
        run: |
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history

      - name: Commit repair and remove one-time workflow
        shell: bash
        env:
          WORKFLOW_PATH: .github/workflows/report-displaytext-history-repair-once-2026-08-27.yml
        run: |
          set -euo pipefail
          git config user.name 'betting-edge-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'

          while IFS= read -r file; do
            test -n "$file" || continue
            git add -- "$file"
          done < /tmp/displaytext-paths.txt
          git rm -- "$WORKFLOW_PATH"
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Repair report history display text drift'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Maintenance summary
        if: always()
        shell: bash
        run: |
          if test -f /tmp/displaytext-repairs.json; then
            {
              echo '## Canonical report history display text repair'
              echo
              echo 'Only schema-3 sidecar displayText fields that differed from their immutable report hist fields were changed.'
              echo
              echo '```json'
              cat /tmp/displaytext-repairs.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
