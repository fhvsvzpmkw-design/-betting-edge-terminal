name: Validate V2V2 second splash

on:
  pull_request:
    paths:
      - runner.html
      - assets/splash-02-vigwire-labs-v2v2.png
      - .github/workflows/v2v2-second-splash-guard.yml
  push:
    branches:
      - main
    paths:
      - runner.html
      - assets/splash-02-vigwire-labs-v2v2.png
      - .github/workflows/v2v2-second-splash-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate locked V2V2 splash contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import struct
          import subprocess

          asset_path = Path("assets/splash-02-vigwire-labs-v2v2.png")
          runner_path = Path("runner.html")
          expected_blob = "7a76edbaa2b57c2b5914aa27bc1847e92616d9df"
          expected_src = './assets/splash-02-vigwire-labs-v2v2.png'

          if not asset_path.is_file():
              raise SystemExit(f"Missing locked splash asset: {asset_path}")

          data = asset_path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit("V2V2 splash is not a valid PNG")
          if data[12:16] != b'IHDR':
              raise SystemExit("V2V2 splash is missing a valid IHDR chunk")

          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (1280, 720):
              raise SystemExit(
                  f"Unexpected V2V2 dimensions: {width}x{height}; expected 1280x720"
              )
          if len(data) != 714121:
              raise SystemExit(
                  f"Unexpected V2V2 file size: {len(data)} bytes; expected 714121"
              )

          actual_blob = subprocess.check_output(
              ["git", "hash-object", str(asset_path)], text=True
          ).strip()
          if actual_blob != expected_blob:
              raise SystemExit(
                  f"V2V2 asset changed: {actual_blob}; expected {expected_blob}"
              )

          html = runner_path.read_text(encoding="utf-8")
          required_fragments = (
              f'href="{expected_src}" as="image" type="image/png" fetchpriority="high"',
              f'src="{expected_src}" fetchpriority="high"',
              'const SCREEN2_MIN_MS=3000;',
              'function waitUntilActuallyVisible()',
          )
          for fragment in required_fragments:
              if fragment not in html:
                  raise SystemExit(f"Missing second-splash contract fragment: {fragment}")

          forbidden_fragments = (
              "files.catbox.moe",
              "splash-02-vigwire-labs-v2.webp",
          )
          for fragment in forbidden_fragments:
              if fragment in html:
                  raise SystemExit(f"Forbidden legacy splash reference found: {fragment}")

          print(
              "V2V2 second splash verified: "
              f"{width}x{height}, {len(data)} bytes, blob {actual_blob}"
          )
          PY
