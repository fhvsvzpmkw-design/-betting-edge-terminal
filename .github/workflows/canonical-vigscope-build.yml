name: Canonical VigScope build

on:
  push:
    branches:
      - refactor/canonical-vigscope
    paths:
      - .github/workflows/canonical-vigscope-build.yml
      - tools/build-canonical-vigscope.py
      - tests/canonical-vigscope-smoke.mjs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/canonical-vigscope
          fetch-depth: 0

      - name: Generate canonical app
        run: python3 tools/build-canonical-vigscope.py

      - name: Static checks
        run: |
          node --check assets/runner-core-runtime.js
          grep -q "runner-app.html" runner.html
          grep -q "summaryOverallRoi" runner-app.html
          grep -q "summaryPromoProfit" runner-app.html
          grep -q "id=\"board\"" runner-app.html
          grep -q "id=\"market\"" runner-app.html
          grep -q "id=\"history\"" runner-app.html
          ! grep -q "CORE v1.4 RUN ARCHIVE" runner-app.html
          ! grep -q "NEW YORK LIBERTY @ INDIANA FEVER" runner-app.html
          ! grep -q "SOURCE MONITOR // FREE STACK" runner-app.html
          test "$(grep -o '<iframe' runner-app.html | wc -l)" -eq 0

      - name: Install smoke-test browser client
        run: npm --silent install puppeteer-core@24 >/dev/null 2>&1

      - name: Chromium smoke test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8765 >/tmp/vigscope-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          PAYLOAD=$(python3 -c 'import base64,json; p={"slot":"late","label":"18:15 LATE / WEST COAST","ts":"2026-08-30T18:21:30.000-07:00","bankroll":495.41,"risk":0,"counts":{"bet":0,"lean":0,"wait":0,"pass":5},"summary":"CANONICAL SHELL SMOKE TEST","recs":[]}; print(base64.urlsafe_b64encode(json.dumps(p,separators=(",",":")).encode()).decode().rstrip("="))')
          CHROME="$CHROME" PAYLOAD="$PAYLOAD" node tests/canonical-vigscope-smoke.mjs

      - name: Save canonical app and remove one-time workflow
        run: |
          rm -f .github/workflows/canonical-vigscope-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.html runner-app.html assets/runner-core-runtime.js tools/build-canonical-vigscope.py tests/canonical-vigscope-smoke.mjs .github/workflows/canonical-vigscope-build.yml
          git commit -m "Promote current VigScope UI to canonical app"
          git push origin HEAD:refactor/canonical-vigscope
