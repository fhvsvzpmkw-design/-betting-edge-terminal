name: One-time exhaustive durable-history transition audit

on:
  push:
    branches: [history-wait-repair-20260829]
    paths:
      - .github/workflows/history-durable-audit-once-20260829.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: history-wait-repair-20260829
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair safely derivable WAIT metadata and enumerate every Stage 2 defect
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const CUTOFF = Date.parse('2026-08-25T15:24:44-07:00');
          const MARKET_ONLY = /\b(bet\s*365|draftkings|odds[-\s]?api(?:\.io)?|live[-\s]?odds|sportsbook(?:\s+pair)?|two[-\s]?book|no[-\s]?vig|market consensus|market-derived)\b/i;
          const PERSONNEL_STATES = new Set(['CONFIRMED','STRONG PROJECTION','PARTIAL','UNKNOWN']);
          const SOURCE_CONFLICT_STATES = new Set(['NONE','MINOR','MATERIAL']);
          const index = JSON.parse(fs.readFileSync('run-history.json','utf8'));
          const repaired=[];
          const changedFiles=new Set();
          const issues=[];
          let auditedWaits=0;
          let recommendationCount=0;
          function nonEmpty(v){return typeof v==='string'&&v.trim().length>0;}
          function validQualification(q){
            if(!q||typeof q!=='object'||Array.isArray(q)||q.actionableIfResolved!==true) return false;
            if(!Array.isArray(q.blockers)||!q.blockers.length||q.blockers.some(x=>!nonEmpty(x))) return false;
            if(!Array.isArray(q.independentSignals)||!q.independentSignals.length) return false;
            for(const s of q.independentSignals){if(!s||typeof s!=='object'||Array.isArray(s)||!nonEmpty(s.origin)||!nonEmpty(s.finding)||MARKET_ONLY.test(s.origin)) return false;}
            return nonEmpty(q.rationale);
          }
          function serialize(original,data){return JSON.stringify(data,null,2)+(original.endsWith('\n')?'\n':'');}
          function issue(entry,rec,message,extra=''){issues.push(`${entry.ts} | ${entry.researchFitPath} | #${rec?.ordinal??'?'} ${rec?.title||'UNKNOWN'} | ${message}${extra?` | ${extra}`:''}`);}
          function deriveQualification(rec,entry){
            const e=rec?.personnelEvidence;
            const support=String(rec?.coreAssessment?.context?.independentCurrentSupport||'').toUpperCase();
            if(!e||typeof e!=='object'||Array.isArray(e)) return null;
            if(!['MODERATE','STRONG'].includes(support)) return null;
            const blockers=[...new Set((Array.isArray(e.unresolved)?e.unresolved:[]).filter(nonEmpty).map(x=>String(x).trim()))];
            if(!blockers.length) return null;
            const pool=[...(Array.isArray(e.officialSources)?e.officialSources:[]),...(Array.isArray(e.fallbackSources)?e.fallbackSources:[])];
            const seen=new Set(); const independentSignals=[];
            for(const s of pool){const origin=String(s?.origin||'').trim(); const finding=String(s?.fact||s?.finding||'').trim(); if(!origin||!finding||MARKET_ONLY.test(origin)) continue; const k=origin.toLowerCase().replace(/\s+/g,' '); if(seen.has(k)) continue; seen.add(k); independentSignals.push({origin,finding}); if(independentSignals.length>=2) break;}
            if(!independentSignals.length) return null;
            return {actionableIfResolved:true,blockers,independentSignals,rationale:`Historical WAIT retained because preserved ${support.toLowerCase()} independent current support and the named unresolved gate(s) left a plausible path to materially closer actionability if resolved; fresh re-handicapping, current identity/freshness checks and an executable price were still required.`};
          }
          const entries=(index.runs||[]).filter(e=>e?.researchFitPath&&Number.isFinite(Date.parse(e.ts))&&Date.parse(e.ts)>=CUTOFF).sort((a,b)=>Date.parse(a.ts)-Date.parse(b.ts));
          for(const entry of entries){
            const file=entry.researchFitPath; const original=fs.readFileSync(file,'utf8'); const sidecar=JSON.parse(original); let changed=false;
            for(const rec of sidecar.recommendations||[]){
              recommendationCount++; const status=String(rec?.status||'').toUpperCase();
              if(status==='WAIT'){auditedWaits++; if(!validQualification(rec.waitQualification)){const q=deriveQualification(rec,entry); if(q&&validQualification(q)){rec.waitQualification=q; repaired.push(`${entry.ts} #${rec.ordinal} ${rec.title}`); changed=true;} else issue(entry,rec,'WAIT qualification missing/invalid and cannot be safely derived from preserved evidence');}}
              if(typeof rec.personnelRequired!=='boolean') issue(entry,rec,'personnelRequired is not an explicit boolean');
              if(rec.personnelEvidence&&rec.personnelRequired!==true) issue(entry,rec,'personnelEvidence exists while personnelRequired is not true');
              if(rec.personnelRequired===true){
                const e=rec.personnelEvidence;
                if(!e||typeof e!=='object'||Array.isArray(e)){issue(entry,rec,'missing personnelEvidence'); continue;}
                if(!nonEmpty(e.stage2CheckedAt)||!Number.isFinite(Date.parse(e.stage2CheckedAt))) issue(entry,rec,'invalid stage2CheckedAt');
                if(!nonEmpty(e.dependencyTarget)) issue(entry,rec,'missing dependencyTarget');
                if(!nonEmpty(e.dependencyRationale)) issue(entry,rec,'missing dependencyRationale');
                if(!Array.isArray(e.officialSources)||e.officialSources.length===0){const c=(Array.isArray(e.fallbackSources)?e.fallbackSources:[]).map(s=>`${s?.origin||'?'} ${s?.url||''}`.trim()).join(' ; '); issue(entry,rec,'officialSources has no authoritative source',c?`fallback candidates: ${c}`:'no fallback candidates');}
                if(!Array.isArray(e.fallbackSources)) issue(entry,rec,'fallbackSources is not an array');
                else {const origins=[]; for(let i=0;i<e.fallbackSources.length;i++){const s=e.fallbackSources[i]; if(!s||typeof s!=='object'||Array.isArray(s)) issue(entry,rec,`fallbackSources[${i}] invalid`); else if(!nonEmpty(s.origin)) issue(entry,rec,`fallbackSources[${i}].origin missing`); else origins.push(String(s.origin).trim().toLowerCase().replace(/\s+/g,' '));} if(new Set(origins).size!==origins.length) issue(entry,rec,'fallbackSources contains duplicate origins'); if(!Number.isInteger(e.fallbackSourceCount)||e.fallbackSourceCount<0||e.fallbackSourceCount!==e.fallbackSources.length) issue(entry,rec,'fallbackSourceCount mismatch');}
                if(!(e.sourceShortfall===null||nonEmpty(e.sourceShortfall))) issue(entry,rec,'sourceShortfall invalid');
                if(!Array.isArray(e.facts)) issue(entry,rec,'facts is not an array');
                if(!PERSONNEL_STATES.has(e.personnelState)) issue(entry,rec,`invalid personnelState=${e.personnelState}`);
                if(!SOURCE_CONFLICT_STATES.has(e.sourceConflict)) issue(entry,rec,`invalid sourceConflict=${e.sourceConflict}`);
                if(!Array.isArray(e.unresolved)) issue(entry,rec,'unresolved is not an array');
                if(!nonEmpty(e.decisionSensitivity)) issue(entry,rec,'missing decisionSensitivity');
                if(!nonEmpty(e.preStage2Fair)) issue(entry,rec,'missing preStage2Fair');
                if(!nonEmpty(e.postStage2Fair)) issue(entry,rec,'missing postStage2Fair');
                if(!nonEmpty(e.decisionImpact)) issue(entry,rec,'missing decisionImpact');
                const unresolved=Array.isArray(e.unresolved)?e.unresolved:[]; const fb=Array.isArray(e.fallbackSources)?e.fallbackSources.length:0; const material=e.personnelState!=='CONFIRMED'||unresolved.length>0;
                if(material&&fb<3&&!nonEmpty(e.sourceShortfall)) issue(entry,rec,'unresolved personnel has fewer than 3 fallback sources and no sourceShortfall');
                if(material&&fb<3&&!['PARTIAL','UNKNOWN'].includes(e.personnelState)) issue(entry,rec,`personnelState=${e.personnelState} overstates certainty with fewer than 3 fallback sources`);
                if(e.sourceConflict==='MATERIAL'&&e.personnelState==='STRONG PROJECTION') issue(entry,rec,'STRONG PROJECTION invalid with MATERIAL source conflict');
              }
              if(status==='WAIT'&&!validQualification(rec.waitQualification)) issue(entry,rec,'WAIT qualification remains invalid after safe repair attempt');
              if(status!=='WAIT'&&rec.waitQualification) issue(entry,rec,`waitQualification present on non-WAIT ${status}`);
            }
            if(changed){fs.writeFileSync(file,serialize(original,sidecar),'utf8'); changedFiles.add(file);}
          }
          console.log(`AUDIT RECOMMENDATION COUNT ${recommendationCount}`);
          console.log(`AUDIT WAIT COUNT ${auditedWaits}`);
          console.log(`SAFE WAIT REPAIR COUNT ${repaired.length}`); for(const r of repaired) console.log(`REPAIRED ${r}`);
          console.log(`AUDIT ISSUE COUNT ${issues.length}`); for(const i of issues) console.log(`ISSUE ${i}`);
          console.log(`CHANGED FILE COUNT ${changedFiles.size}`); for(const f of changedFiles) console.log(`CHANGED ${f}`);
          if(issues.length) throw new Error(`Exhaustive transition audit found ${issues.length} remaining issue(s)`);
          NODE
      - name: Verify durable history if audit is clean
        run: |
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history
