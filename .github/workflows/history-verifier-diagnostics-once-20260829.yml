name: One-time history verifier diagnostics upgrade

on:
  push:
    branches: [history-verifier-diagnostics-20260829]
    paths:
      - .github/workflows/history-verifier-diagnostics-once-20260829.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: history-verifier-diagnostics-20260829
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade history verifiers to aggregate archive defects
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(text, from, to, label){
            const first=text.indexOf(from);
            if(first<0) throw new Error(`Cannot find ${label}`);
            if(text.indexOf(from,first+1)>=0) throw new Error(`Ambiguous ${label}`);
            return text.slice(0,first)+to+text.slice(first+from.length);
          }
          function replaceFunction(text,startMarker,endMarker,replacement,label){
            const start=text.indexOf(startMarker);
            if(start<0) throw new Error(`Cannot find ${label} start`);
            const end=text.indexOf(endMarker,start);
            if(end<0) throw new Error(`Cannot find ${label} end`);
            return text.slice(0,start)+replacement+text.slice(end);
          }

          // Report-history verifier: preserve strict publication validation, but collect recommendation
          // defects within a sidecar and bundle/file defects across the complete archive during verify.
          const reportFile='tools/report-publication.mjs';
          let report=fs.readFileSync(reportFile,'utf8');
          report=replaceOnce(
            report,
            'function validateSidecar(sidecar,report,reportPath,{strict=false}={}){',
            'function validateSidecar(sidecar,report,reportPath,{strict=false,collectRecommendationErrors=false}={}){',
            'validateSidecar signature'
          );

          const loopStart='    for(let i=0;i<report.recs.length;i++){' ;
          const loopEndMarker='\n    }\n  }\n  return sidecar;';
          const loopStartIndex=report.indexOf(loopStart,report.indexOf('function validateSidecar'));
          if(loopStartIndex<0) throw new Error('Cannot find validateSidecar recommendation loop');
          const loopEndIndex=report.indexOf(loopEndMarker,loopStartIndex);
          if(loopEndIndex<0) throw new Error('Cannot find validateSidecar recommendation-loop end');
          const newRecommendationLoop=`    const recommendationErrors=[];
    for(let i=0;i<report.recs.length;i++){
      const item = sidecar.recommendations[i];
      const rec = report.recs[i];
      const validateRecommendation=()=>{
        assert(item && typeof item==='object',\`Sidecar recommendation \${i+1} is invalid\`);
        assert(item.ordinal===i+1,\`Sidecar recommendation \${i+1} has invalid ordinal\`);
        assert(item.title===rec.title,\`Sidecar recommendation \${i+1} title does not match report\`);
        assert(item.status===rec.status,\`Sidecar recommendation \${i+1} status does not match report\`);
        assert(item.displayText===rec.hist,\`Sidecar recommendation \${i+1} displayText does not match report hist\`);
        assert(Array.isArray(item.priorIds),\`Sidecar recommendation \${i+1} priorIds must be an array\`);
        assert(Array.isArray(item.synthesisIds),\`Sidecar recommendation \${i+1} synthesisIds must be an array\`);
        assert(Array.isArray(item.clusterIds),\`Sidecar recommendation \${i+1} clusterIds must be an array\`);
        if(stage2Enforced){
          assert(typeof item.personnelRequired==='boolean',\`Sidecar recommendation \${i+1} personnelRequired must be an explicit boolean after the Stage 2 publication-gate cutover\`);
          const textSignal=materialPersonnelSignal(rec);
          if(textSignal){
            assert(item.personnelRequired===true,\`Sidecar recommendation \${i+1} cannot mark personnelRequired=false while the issued card signals material personnel dependence\`);
          }
          if(item.personnelEvidence){
            assert(item.personnelRequired===true,\`Sidecar recommendation \${i+1} cannot carry personnelEvidence while personnelRequired=false\`);
          }
          if(item.personnelRequired){
            validatePersonnelEvidence(item.personnelEvidence,i);
          }
        }
        if(waitQualificationEnforced){
          const status=String(rec.status||'').toUpperCase();
          if(status==='WAIT'){
            validateWaitQualification(item.waitQualification,i);
          }else{
            assert(!item.waitQualification,\`Sidecar recommendation \${i+1} waitQualification is only valid for WAIT status\`);
          }
        }
      };
      if(!collectRecommendationErrors){
        validateRecommendation();
        continue;
      }
      try{validateRecommendation();}
      catch(error){
        recommendationErrors.push(\`recommendation \${i+1} \${rec?.title||item?.title||'UNKNOWN'}: \${error.message}\`);
      }
    }
    if(recommendationErrors.length){
      die(\`Sidecar contains \${recommendationErrors.length} recommendation defect(s):\\n- \${recommendationErrors.join('\\n- ')}\`);
    }`;
          report=report.slice(0,loopStartIndex)+newRecommendationLoop+report.slice(loopEndIndex+'\n    }'.length);

          const verifyStart='function verifyIndex(root,{targetTs}={}){';
          const verifyEnd='\n}\n\nfunction expectValidationFailure';
          const newVerify=`function verifyIndex(root,{targetTs}={}){
  const {index} = loadIndex(root);
  const ids = new Set(), paths = new Set(), shortIds = new Set();
  const errors=[];
  let targetFound = !targetTs;
  const capture=(scope,fn)=>{
    try{return fn();}
    catch(error){errors.push(\`\${scope}: \${error.message}\`);return undefined;}
  };

  for(const [entryIndex,entry] of index.runs.entries()){
    if(targetTs && entry?.ts===targetTs) targetFound=true;
    capture(\`index[\${entryIndex}] \${entry?.id||entry?.path||'UNKNOWN'}\`,()=>{
      assert(entry && typeof entry==='object','Index entry must be an object');
      assert(!ids.has(entry.id),\`Duplicate index ID: \${entry.id}\`); ids.add(entry.id);
      assert(!paths.has(entry.path),\`Duplicate report path in index: \${entry.path}\`); paths.add(entry.path);
      const reportAbs = path.join(root,entry.path);
      assert(fs.existsSync(reportAbs),\`Indexed report is missing: \${entry.path}\`);
      const report = validateReport(verificationReport(readJson(reportAbs)));
      const expected = expectedPaths(report);
      assert(entry.path===expected.reportPath,\`Indexed path does not match report timestamp/slot: \${entry.path}\`);
      assert(entry.id===\`\${report.ts}|\${report.slot}\`,\`Index ID does not match report: \${entry.id}\`);
      assert(entry.date===reportDate(report.ts),\`Index date does not match report: \${entry.id}\`);
      assert(entry.slot===report.slot,\`Index slot does not match report: \${entry.id}\`);
      assert(entry.label===report.label,\`Index label does not match report: \${entry.id}\`);
      assert(entry.ts===report.ts,\`Index ts does not match report: \${entry.id}\`);
      assert(entry.feedGeneratedAt===report.feedGeneratedAt,\`Index feedGeneratedAt does not match report: \${entry.id}\`);
      assert(entry.bankroll===report.bankroll,\`Index bankroll does not match report: \${entry.id}\`);
      assert(entry.risk===report.risk,\`Index risk does not match report: \${entry.id}\`);
      assert(countsEqual(entry.counts,report.counts),\`Index counts do not match report: \${entry.id}\`);
      assert(entry.recCount===report.recs.length,\`Index recCount does not match report: \${entry.id}\`);
      const sid=shortId(report);
      assert(!shortIds.has(sid),\`Duplicate deterministic short ID: \${sid}\`); shortIds.add(sid);

      const strict = Date.parse(report.ts)>=STRICT_BUNDLE_FROM;
      if(strict) assert(entry.researchFitPath===expected.sidecarPath,\`Post-cutover run is missing exact researchFitPath: \${entry.id}\`);
      if(entry.researchFitPath){
        assert(entry.researchFitPath===expected.sidecarPath,\`Sidecar path does not match report timestamp/slot: \${entry.id}\`);
        const sidecarAbs=path.join(root,entry.researchFitPath);
        assert(fs.existsSync(sidecarAbs),\`Indexed sidecar is missing: \${entry.researchFitPath}\`);
        const sidecar=validateSidecar(readJson(sidecarAbs),report,entry.path,{strict,collectRecommendationErrors:true});
        if(sidecar.provenance?.feedBlobSha && entry.feedBlobSha){
          assert(entry.feedBlobSha===sidecar.provenance.feedBlobSha,\`Index feedBlobSha does not match sidecar: \${entry.id}\`);
        }
        if(sidecar.provenance?.researchLibraryVersion && entry.researchLibraryVersion){
          assert(entry.researchLibraryVersion===sidecar.provenance.researchLibraryVersion,\`Index researchLibraryVersion does not match sidecar: \${entry.id}\`);
        }
      }
    });
  }
  if(!targetFound) errors.push(\`target: Target report is not indexed: \${targetTs}\`);

  const payloadFiles=walkJson(path.join(root,'data/history/runs'));
  for(const file of payloadFiles){
    capture(\`stored report \${rel(root,file)}\`,()=>{
      const report=validateReport(verificationReport(readJson(file)));
      const reportPath=rel(root,file);
      const entry=index.runs.find(item=>item.id===\`\${report.ts}|\${report.slot}\`);
      assert(entry,\`Stored issued report is not indexed: \${reportPath}\`);
      assert(entry.path===reportPath,\`Stored issued report index path mismatch: \${reportPath}\`);
    });
  }
  const sidecarFiles=walkJson(path.join(root,'data/history/research-fit'));
  for(const file of sidecarFiles){
    capture(\`stored sidecar \${rel(root,file)}\`,()=>{
      const sidecar=readJson(file);
      const ref=sidecar.reportReference;
      assert(ref && typeof ref.ts==='string' && typeof ref.slot==='string',\`Sidecar has invalid reportReference: \${rel(root,file)}\`);
      const entry=index.runs.find(item=>item.id===\`\${ref.ts}|\${ref.slot}\`);
      assert(entry,\`Sidecar has no indexed report: \${rel(root,file)}\`);
      assert(entry.researchFitPath===rel(root,file),\`Sidecar is not linked by the matching index entry: \${rel(root,file)}\`);
    });
  }
  capture('run-history updated_at',()=>{
    const newest=index.runs.reduce((max,entry)=>String(entry.ts)>max?String(entry.ts):max,'');
    assert(index.updated_at===newest,\`run-history.json updated_at=\${index.updated_at} does not match newest run=\${newest}\`);
  });

  if(errors.length){
    die(\`REPORT HISTORY VERIFY FOUND \${errors.length} defect(s):\\n- \${errors.join('\\n- ')}\`);
  }
  console.log(\`REPORT HISTORY VERIFY OK \${index.runs.length} runs\${targetTs?\` target=\${targetTs}\`:''}\`);
}`;
          report=replaceFunction(report,verifyStart,verifyEnd,newVerify,'verifyIndex');
          fs.writeFileSync(reportFile,report,'utf8');

          // Core 1.4 history verifier: aggregate recommendation defects inside each bundle and
          // then aggregate bad bundles across the complete post-cutover archive.
          const coreFile='tools/core-v14-publication-gate.mjs';
          let core=fs.readFileSync(coreFile,'utf8');
          core=replaceOnce(
            core,
            'function validateBundle(runtime,report,sidecar,{compareCurrent=true,recompute=true}={}){',
            'function validateBundle(runtime,report,sidecar,{compareCurrent=true,recompute=true,collectRecommendationErrors=false}={}){',
            'validateBundle signature'
          );
          const coreLoopStart='  for(let i=0;i<report.recs.length;i++){' ;
          const coreFunctionStart=core.indexOf('function validateBundle');
          const coreLoopStartIndex=core.indexOf(coreLoopStart,coreFunctionStart);
          if(coreLoopStartIndex<0) throw new Error('Cannot find validateBundle recommendation loop');
          const coreLoopEndMarker='\n  }\n  return {core14:true};';
          const coreLoopEndIndex=core.indexOf(coreLoopEndMarker,coreLoopStartIndex);
          if(coreLoopEndIndex<0) throw new Error('Cannot find validateBundle recommendation-loop end');
          const newCoreLoop=`  const recommendationErrors=[];
  for(let i=0;i<report.recs.length;i++){
    const rec={...report.recs[i],__reportTs:report.ts};
    const item=sidecar.recommendations[i];
    const validateRecommendation=()=>{
      assert(String(item?.status||'').toUpperCase()===String(rec?.status||'').toUpperCase(),\`Recommendation \${i+1} status mismatch between report and sidecar\`);
      validateCoreAssessment(runtime,item.coreAssessment,rec,i,{recompute});
      validateWaltersEvidence(runtime,item.waltersEvidence,item.coreAssessment,rec,i,sidecar.provenance.waltersMode);
    };
    if(!collectRecommendationErrors){
      validateRecommendation();
      continue;
    }
    try{validateRecommendation();}
    catch(error){recommendationErrors.push(\`recommendation \${i+1} \${rec?.title||'UNKNOWN'}: \${error.message}\`);}
  }
  if(recommendationErrors.length){
    fail(\`Core 1.4 bundle contains \${recommendationErrors.length} recommendation defect(s):\\n- \${recommendationErrors.join('\\n- ')}\`);
  }`;
          core=core.slice(0,coreLoopStartIndex)+newCoreLoop+core.slice(coreLoopEndIndex+'\n  }'.length);

          const historyStart='function verifyHistory(root){';
          const historyEnd='\n}\n\nfunction main(){';
          const newHistory=`function verifyHistory(root){
  const runtime=loadRuntime(root);
  const index=readJson(path.join(root,'run-history.json'));
  const errors=[];
  let checked=0;
  for(const [entryIndex,entry] of (index.runs||[]).entries()){
    if(Date.parse(entry.ts)<CORE_V14_FROM) continue;
    try{
      const report=readJson(path.join(root,entry.path));
      assert(entry.researchFitPath,\`Core 1.4 indexed report is missing sidecar \${entry.id}\`);
      const sidecar=readJson(path.join(root,entry.researchFitPath));
      const currentFramework=sidecar.provenance?.coreFrameworkBlobSha===gitBlobSha(runtime.frameworkFile);
      validateBundle(runtime,report,sidecar,{compareCurrent:false,recompute:currentFramework,collectRecommendationErrors:true});
      checked++;
    }catch(error){
      errors.push(\`index[\${entryIndex}] \${entry?.id||entry?.ts||'UNKNOWN'}: \${error.message}\`);
    }
  }
  if(errors.length){
    fail(\`CORE 1.4 HISTORY VERIFY FOUND \${errors.length} bundle defect(s):\\n- \${errors.join('\\n- ')}\`);
  }
  console.log(\`CORE 1.4 HISTORY VERIFY OK \${checked} post-cutover bundles\`);
}`;
          core=replaceFunction(core,historyStart,historyEnd,newHistory,'verifyHistory');
          fs.writeFileSync(coreFile,core,'utf8');
          NODE

      - name: Run existing verifier self-tests and clean history
        run: |
          node tools/core-handicap-framework.mjs self-test
          node tools/core-v14-publication-gate.mjs self-test
          node tools/report-publication.mjs self-test
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history

      - name: Regression-test multi-defect reporting
        run: |
          set -euo pipefail
          REPORT_SIDECAR='data/history/research-fit/2026-08-27/evening-152141.json'
          CORE_SIDECAR='data/history/research-fit/2026-08-28/late-181633.json'
          cp "$REPORT_SIDECAR" /tmp/report-sidecar.json
          cp "$CORE_SIDECAR" /tmp/core-sidecar.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportFile='data/history/research-fit/2026-08-27/evening-152141.json';
          const report=JSON.parse(fs.readFileSync(reportFile,'utf8'));
          report.recommendations[1].waitQualification=null;
          report.recommendations[2].waitQualification=null;
          fs.writeFileSync(reportFile,JSON.stringify(report,null,2)+'\n');

          const coreFile='data/history/research-fit/2026-08-28/late-181633.json';
          const core=JSON.parse(fs.readFileSync(coreFile,'utf8'));
          core.recommendations[1].coreAssessment.modelErrorState='HIGH';
          core.recommendations[3].coreAssessment.betEligibleByModelError=false;
          fs.writeFileSync(coreFile,JSON.stringify(core,null,2)+'\n');
          NODE

          set +e
          REPORT_OUTPUT=$(node tools/report-publication.mjs verify 2>&1)
          REPORT_STATUS=$?
          CORE_OUTPUT=$(node tools/core-v14-publication-gate.mjs verify-history 2>&1)
          CORE_STATUS=$?
          set -e

          printf '%s\n' "$REPORT_OUTPUT"
          printf '%s\n' "$CORE_OUTPUT"
          test "$REPORT_STATUS" -ne 0
          test "$CORE_STATUS" -ne 0
          printf '%s' "$REPORT_OUTPUT" | grep -F 'recommendation 2 Luis Lara over 1.5 hits'
          printf '%s' "$REPORT_OUTPUT" | grep -F 'recommendation 3 Leonie Fiebich over 1.5 three-pointers'
          printf '%s' "$CORE_OUTPUT" | grep -F 'recommendation 2 Toronto Tempo moneyline'
          printf '%s' "$CORE_OUTPUT" | grep -F 'recommendation 4 Los Angeles Sparks moneyline'

          mv /tmp/report-sidecar.json "$REPORT_SIDECAR"
          mv /tmp/core-sidecar.json "$CORE_SIDECAR"
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history

      - name: Commit diagnostics upgrade and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/report-publication.mjs tools/core-v14-publication-gate.mjs
          git rm .github/workflows/history-verifier-diagnostics-once-20260829.yml
          git commit -m 'history: aggregate durable-history verifier diagnostics'
          git push origin HEAD:history-verifier-diagnostics-20260829

      - name: Remote read-back verification
        run: |
          git fetch origin history-verifier-diagnostics-20260829
          git reset --hard origin/history-verifier-diagnostics-20260829
          node tools/core-v14-publication-gate.mjs self-test
          node tools/report-publication.mjs self-test
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history
