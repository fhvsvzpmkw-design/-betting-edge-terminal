name: One-time OddsPapi Pinnacle smoke test

on:
  push:
    paths:
      - '.github/workflows/oddspapi-pinnacle-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run Pinnacle-only observer
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          node --check tools/oddspapi-observer.mjs
          node tools/oddspapi-observer.mjs
          node -e 'const j=require("./data/oddspapi-observer.json"); console.log(JSON.stringify({status:j.status,quota:j.quota,fixtures:j.fixtureCount,raw:j.fixtureCountRaw,matches:j.primaryMatches,diagnostics:j.diagnostics},null,2)); if(j.status!=="ok") process.exit(2)'
      - name: Publish smoke snapshot
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/oddspapi-observer.json
          git commit -m "Test Pinnacle OddsPapi observer" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
