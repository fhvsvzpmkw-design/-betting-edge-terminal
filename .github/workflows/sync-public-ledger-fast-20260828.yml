name: Fast public ledger compatibility sync 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-public-ledger-fast-20260828.yml'

permissions:
  contents: write

jobs:
  sync-public-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Copy canonical public ledger to compatibility paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'betting-edge-public-ledger-sync'
          }

          def get_file(path):
              url = f'https://api.github.com/repos/{repo}/contents/{path}?ref=main'
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          canonical = get_file('data/ledger/public-ledger.json')
          raw = base64.b64decode(canonical['content'])
          ledger = json.loads(raw.decode('utf-8'))
          if ledger.get('schema') != 2 or ledger.get('publicProjection') is not True:
              raise SystemExit('Canonical public ledger contract failed')
          if ledger.get('validation', {}).get('uniqueWagers') != 1627:
              raise SystemExit('Canonical public ledger wager count is not 1627')
          if ledger.get('bankrollCad') != 495.41:
              raise SystemExit('Canonical public ledger bankroll is not 495.41')
          if any(r[2] is not None for r in ledger.get('wagers', [])):
              raise SystemExit('Canonical public ledger privacy validation failed')

          encoded = base64.b64encode(raw).decode('ascii')
          for path in ('data/bet-history-public.json', 'api/bet-history'):
              target = get_file(path)
              target_raw = base64.b64decode(target['content'])
              if target_raw == raw:
                  print(path, 'already matches canonical')
                  continue
              body = json.dumps({
                  'message': 'ledger: sync canonical public ledger compatibility paths',
                  'content': encoded,
                  'sha': target['sha'],
                  'branch': 'main'
              }).encode('utf-8')
              url = f'https://api.github.com/repos/{repo}/contents/{path}'
              req = urllib.request.Request(
                  url,
                  data=body,
                  headers={**headers, 'Content-Type': 'application/json'},
                  method='PUT'
              )
              with urllib.request.urlopen(req) as resp:
                  result = json.load(resp)
              print(path, result['content']['sha'])
          PY
