name: VigScope publisher telemetry integration

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-vigscope-publisher-telemetry.mjs'
      - '.github/workflows/vigscope-publisher-telemetry-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigscope-publisher-telemetry-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply publisher and runner integration
        run: node tools/apply-vigscope-publisher-telemetry.mjs
      - name: Test deterministic telemetry
        run: node tests/vigscope-meter-telemetry.test.mjs
      - name: Test calibrated meters
        run: node tests/vigscope-meter-production.test.mjs
      - name: Test fallback safety
        run: node tests/vigscope-meter-fallback-safety.test.mjs
      - name: Test report publisher
        run: node tools/report-publication.mjs self-test
      - name: Syntax check production runtime
        run: node --check assets/runner-core-runtime.js
      - name: Commit production integration
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/report-publication.mjs assets/runner-core-runtime.js; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'betting-edge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/report-publication.mjs assets/runner-core-runtime.js
          git commit -m 'Publish structured VigScope meter telemetry'
          git push origin HEAD:main
      - name: Summary
        if: always()
        run: |
          {
            echo '## VigScope publisher telemetry'
            echo '- Movement uses exact selection identity and the prior report book.'
            echo '- Bet365/DraftKings agreement uses the exact pinned feed snapshot.'
            echo '- Telemetry is display-only and cannot mutate betting decisions.'
            echo '- Structured telemetry overrides prose fallback in the runner.'
          } >> "$GITHUB_STEP_SUMMARY"
