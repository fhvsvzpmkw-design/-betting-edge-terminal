name: Walters QB Performance Stage 3

on:
  workflow_dispatch:
  push:
    paths:
      - "data/walters/nfl/qb-performance/**"
      - "tools/build-walters-qb-performance-stage3b.py"
      - "tools/validate-walters-qb-performance-stage3.mjs"
      - "tests/walters-qb-performance-stage3.test.mjs"
      - ".github/workflows/walters-qb-performance-stage3.yml"
  pull_request:
    paths:
      - "data/walters/nfl/qb-performance/**"
      - "tools/build-walters-qb-performance-stage3b.py"
      - "tools/validate-walters-qb-performance-stage3.mjs"
      - "tests/walters-qb-performance-stage3.test.mjs"
      - ".github/workflows/walters-qb-performance-stage3.yml"

concurrency:
  group: walters-qb-performance-stage3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-validate-stage3b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply reviewed nflverse source-to-normalized field map
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          builder_path = Path("tools/build-walters-qb-performance-stage3b.py")
          text = builder_path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise RuntimeError(f"Stage 3B schema patch anchor missing: {label}")

          replace_once(
              '    "rushing_first_downs",\n]\nSOURCE_FLOAT_FIELDS = ["passing_epa", "rushing_epa"]',
              '    "rushing_first_downs",\n]\nSOURCE_INTEGER_FIELD_MAP = {\n    "interceptions": "passing_interceptions",\n    "sack_yards": "sack_yards_lost",\n}\nSOURCE_FLOAT_FIELDS = ["passing_epa", "rushing_epa"]',
              "integer source field map",
          )
          replace_once(
              '        "recent_team": text_value(source, "recent_team").upper(),',
              '        "recent_team": text_value(source, "team").upper(),',
              "team field alias",
          )
          replace_once(
              '    for field in SOURCE_INTEGER_FIELDS:\n        result[field] = int_value(source, field)',
              '    for field in SOURCE_INTEGER_FIELDS:\n        source_field = SOURCE_INTEGER_FIELD_MAP.get(field, field)\n        result[field] = int_value(source, source_field)',
              "integer normalization aliases",
          )
          replace_once(
              '    required = WEEKLY_ID_FIELDS + SOURCE_INTEGER_FIELDS + SOURCE_FLOAT_FIELDS',
              '    required = list(contract["weeklyFieldWhitelist"])',
              "weekly source whitelist",
          )
          replace_once(
              '    required = [field for field in SEASONAL_ID_FIELDS if field != "season_type"] + SOURCE_INTEGER_FIELDS + SOURCE_FLOAT_FIELDS',
              '    required = list(contract["seasonalFieldWhitelist"])',
              "seasonal source whitelist",
          )
          self_test_anchor = '        add_derived(sample)\n        assert sample["dropbacks"] == 33'
          self_test_block = '''        add_derived(sample)
          source_sample = {
              "player_id": "00-0000001",
              "player_display_name": "Test Quarterback",
              "position": "QB",
              "team": "TST",
              "season": "2025",
              "season_type": "REG",
              "completions": "20",
              "attempts": "30",
              "passing_yards": "250",
              "passing_tds": "2",
              "passing_interceptions": "1",
              "sacks_suffered": "3",
              "sack_yards_lost": "18",
              "sack_fumbles": "1",
              "sack_fumbles_lost": "1",
              "passing_first_downs": "12",
              "passing_epa": "4.5",
              "carries": "4",
              "rushing_yards": "30",
              "rushing_tds": "0",
              "rushing_fumbles": "0",
              "rushing_fumbles_lost": "0",
              "rushing_first_downs": "2",
              "rushing_epa": "1.1",
          }
          normalized = normalized_base_row(source_sample, weekly=False)
          assert normalized["recent_team"] == "TST"
          assert normalized["interceptions"] == 1
          assert normalized["sack_yards"] == 18
          assert sample["dropbacks"] == 33'''
          replace_once(self_test_anchor, self_test_block, "source alias self-test")
          builder_path.write_text(text, encoding="utf-8", newline="\n")

          contract_path = Path("data/walters/nfl/qb-performance/stage3b-contract-v1.json")
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          aliases = {
              "recent_team": "team",
              "interceptions": "passing_interceptions",
              "sack_yards": "sack_yards_lost",
          }
          contract["weeklyFieldWhitelist"] = [aliases.get(field, field) for field in contract["weeklyFieldWhitelist"]]
          contract["seasonalFieldWhitelist"] = [aliases.get(field, field) for field in contract["seasonalFieldWhitelist"]]
          contract["derivedFields"]["nfl_passer_rating"] = (
              "Official component formula derived only from completions, attempts, passing_yards, passing_tds and source "
              "passing_interceptions (normalized as interceptions); null when attempts are zero."
          )
          contract["derivedFields"]["interception_rate"] = (
              "normalized interceptions / attempts; null when attempts are zero."
          )
          contract["sourceToNormalizedFieldMap"] = {
              "team": "recent_team",
              "passing_interceptions": "interceptions",
              "sack_yards_lost": "sack_yards",
          }
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")
          PY

      - name: Run Stage 3B deterministic helper tests
        run: python tools/build-walters-qb-performance-stage3b.py --self-test

      - name: Capture, normalize and identity-audit Stage 3B
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build-walters-qb-performance-stage3b.py

      - name: Validate Stage 3 contracts, source lock and handoff
        id: validate
        continue-on-error: true
        run: node tools/validate-walters-qb-performance-stage3.mjs

      - name: Run Stage 3 guardrail tests
        id: tests
        continue-on-error: true
        run: node --test tests/walters-qb-performance-stage3.test.mjs

      - name: Publish Stage 3B evidence or fail-closed diagnostics
        if: always() && github.event_name != 'pull_request' && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/walters/nfl/qb-performance tools/build-walters-qb-performance-stage3b.py
          if git diff --cached --quiet; then
            echo "No Stage 3B output changes to publish."
            exit 0
          fi
          git commit -m "Build Walters QB performance Stage 3B evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Stage 3B push attempt ${attempt} failed; retrying."
            sleep $((attempt * 2))
          done
          exit 1

      - name: Enforce Stage 3B acceptance result
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          test "$BUILD_OUTCOME" = "success"
          test "$VALIDATE_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
