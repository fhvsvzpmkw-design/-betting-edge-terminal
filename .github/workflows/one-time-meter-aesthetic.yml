name: One-time meter aesthetic upgrade

on:
  push:
    paths:
      - '.github/workflows/one-time-meter-aesthetic.yml'
      - '.github/scripts/patch-meter-aesthetic.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply meter upgrade
        run: python3 .github/scripts/patch-meter-aesthetic.py
      - name: Syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('runner.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/runner.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/runner.js
      - name: Commit runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runner.html
          git commit -m 'Upgrade report meters to full instrument panels'
          git push
