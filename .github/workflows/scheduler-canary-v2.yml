name: Scheduler Canary v2

on:
  workflow_dispatch:
  schedule:
    # Diagnostic contrast: sample the top and middle of each hour.
    # GitHub Actions cron is UTC; minute-only cadence is timezone-independent.
    - cron: '1,31 * * * *'

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm scheduled dispatch
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled=${{ github.event.schedule || 'manual' }}"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Scheduler Canary v2 completed. No API requests or repository writes were made."
