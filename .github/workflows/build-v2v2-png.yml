name: Build V2 V2 PNG

on:
  push:
    branches:
      - asset-v2v2-upload
    paths:
      - '.github/workflows/build-v2v2-png.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-v2v2-upload
          fetch-depth: 0

      - name: Assemble approved V2V2 source and render PNG
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import pathlib
          import re

          root=pathlib.Path('.asset-upload')
          def clean(name):
              return re.sub(r'\s+','',(root/name).read_text())

          p0=clean('v2v2-00.b64')
          p1=clean('v2v2-01.b64')
          p2=clean('v2v2-02.b64')
          p3=clean('v2v2-03.b64')
          p4=clean('v2v2-04.b64')
          p5=clean('v2v2-05.b64')
          p6=clean('v2v2-06.b64')

          # The historical upload was interrupted at six characters. Restore
          # only those proven omissions; every other staged character remains unchanged.
          p1=p1[:6641]+'k'+p1[6641:]
          p2='d'+p2
          p2=p2[:10100]+'h'+p2[10100:]
          p3='l'+p3
          p4='M'+p4
          p5='K'+p5

          data=p0+p1+p2+p3+p4+p5+p6
          if len(data) != 116348:
              raise SystemExit(f'unexpected repaired base64 length: {len(data)}')
          out=base64.b64decode(data,validate=True)
          digest=hashlib.sha256(out).hexdigest()
          if len(out) != 87260 or digest != '46ecfcfd30a6dc2d49ab7f7f8dae5c63dac8e66f80e49758847dd3b8f37818ff':
              raise SystemExit(f'V2V2 source integrity mismatch: bytes={len(out)} sha256={digest}')
          pathlib.Path('/tmp/v2v2-source.webp').write_bytes(out)
          print(f'V2V2 source verified: bytes={len(out)} sha256={digest}')
          PY
          file /tmp/v2v2-source.webp

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          mkdir -p assets
          convert /tmp/v2v2-source.webp -resize 1280x720\! assets/splash-02-vigwire-labs-v2v2.png

          python - <<'PY'
          import hashlib
          import pathlib
          import struct
          p=pathlib.Path('assets/splash-02-vigwire-labs-v2v2.png')
          b=p.read_bytes()
          if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit('generated asset is not PNG')
          width,height=struct.unpack('>II',b[16:24])
          if (width,height)!=(1280,720): raise SystemExit(f'unexpected PNG dimensions: {width}x{height}')
          print(f'PNG {width}x{height} bytes={len(b)} sha256={hashlib.sha256(b).hexdigest()}')
          PY

      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/splash-02-vigwire-labs-v2v2.png
          if git diff --cached --quiet; then
            echo "V2V2 PNG is already current."
            exit 0
          fi
          git commit -m "build approved VigWire Labs V2V2 PNG"
          git push origin HEAD:asset-v2v2-upload
