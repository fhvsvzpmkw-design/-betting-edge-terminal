name: Build V2 V2 PNG

on:
  push:
    branches:
      - asset-v2v2-upload
    paths:
      - '.github/workflows/build-v2v2-png.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-v2v2-upload

      - name: Convert locked Screen 2 artwork to PNG
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          mkdir -p assets
          convert assets/splash-02-vigwire-labs-v2.webp assets/vigwire-labs-v2v2.png
          file assets/vigwire-labs-v2v2.png

      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vigwire-labs-v2v2.png
          git commit -m "build canonical VigWire Labs V2 V2 splash PNG"
          git push origin HEAD:asset-v2v2-upload
