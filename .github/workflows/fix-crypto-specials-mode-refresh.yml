name: Fix Crypto Specials mode refresh

on:
  push:
    branches: [feature/crypto-specials-source-reviews]
    paths:
      - '.github/workflows/fix-crypto-specials-mode-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crypto-specials-source-reviews
      - name: Refresh Crypto panel when analysis preference changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/special-desks-ui.js')
          s=p.read_text()
          old="  const key=JSON.stringify(data||{});if(p.dataset.key!==key){p.dataset.key=key;p.innerHTML=panelHtml(kind,data)}return p;"
          new="  const key=JSON.stringify([data||{},kind==='crypto'?cryptoAnalysisModeLabel():'']);if(p.dataset.key!==key){p.dataset.key=key;p.innerHTML=panelHtml(kind,data)}return p;"
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('ensurePanel key block not found')
          p.write_text(s)
          PY
      - name: Commit refresh fix
        shell: bash
        run: |
          if git diff --quiet -- assets/special-desks-ui.js; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add -- assets/special-desks-ui.js
          git commit -m 'Refresh Crypto Specials analysis mode live'
          git push origin feature/crypto-specials-source-reviews
