name: Graham carried-rating audit

on:
  push:
    branches: [main]
    paths:
      - data/walters/nfl/carried-rating-audit-staging.json
  pull_request:
    paths:
      - .github/workflows/graham-carried-rating-audit.yml
      - tools/apply-graham-carried-rating-audit.mjs
      - tools/graham-weekly-evidence.mjs
      - tools/graham-replacement-model.mjs
      - tools/test-graham-replacement-model.mjs
      - tools/test-graham-weekly-evidence.mjs
      - tools/test-graham-role-chain.mjs
      - data/walters/nfl/**/week-*-weekly-evidence/**
      - GRAHAM_WEEKLY_90_10_AUTHORITY.md
      - data/walters/nfl/carried-rating-audit-staging.json
      - data/walters/nfl/active-week.json
      - data/walters/nfl/home-field/home-field-production-current.json
      - data/walters/nfl/home-field/h4-current.json
      - data/walters/nfl/personnel-production-current.json
      - data/walters/nfl/matchup-production-current.json
      - data/walters/nfl/qb-production-current.json
  workflow_dispatch:

concurrency:
  group: graham-personnel-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate proposed weekly recovery code and evidence
        run: |
          node tools/apply-graham-carried-rating-audit.mjs --self-test
          node tools/test-graham-weekly-evidence.mjs
          node tools/test-graham-replacement-model.mjs
  apply:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate governed audit code
        run: |
          set -euo pipefail
          node --check tools/apply-graham-carried-rating-audit.mjs
          node --check tools/graham-active-week.mjs
          node --check tools/graham-fair-decomposition.mjs
          node tools/graham-active-week.mjs --json >/tmp/graham-active-week.json
          node tools/apply-graham-carried-rating-audit.mjs --self-test
          node - <<'NODE'
          const fs=require('node:fs');
          const active=JSON.parse(fs.readFileSync('/tmp/graham-active-week.json','utf8'));
          const power=JSON.parse(fs.readFileSync('data/walters/nfl-power-ratings-ledger.json','utf8'));
          const protectedPaths=['data/walters/nfl/active-week.json',...Object.values(active.paths).filter(p=>fs.existsSync(p)&&fs.statSync(p).isFile())];
          const protectedFiles=Object.fromEntries(protectedPaths.map(p=>[p,fs.readFileSync(p,'utf8')]));
          fs.writeFileSync('/tmp/graham-audit-before.json',JSON.stringify({teams:power.teams,protectedFiles}));
          NODE

      - name: Apply carried-rating audit
        run: |
          set -euo pipefail
          node tools/apply-graham-carried-rating-audit.mjs data/walters/nfl/carried-rating-audit-staging.json

      - name: Verify fair boundaries and market isolation
        run: |
          set -euo pipefail
          AUDIT_TYPE="$(node -p "require('./data/walters/nfl/carried-rating-audit-staging.json').auditType||''")"
          if [ "$AUDIT_TYPE" = "WALTERS_WEEKLY_90_10" ]; then
            node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const before=JSON.parse(fs.readFileSync('/tmp/graham-audit-before.json','utf8'));
          const staging=JSON.parse(fs.readFileSync('data/walters/nfl/carried-rating-audit-staging.json','utf8'));
          const power=JSON.parse(fs.readFileSync('data/walters/nfl-power-ratings-ledger.json','utf8'));
          const active=JSON.parse(fs.readFileSync('data/walters/nfl/active-week.json','utf8'));
          assert.equal(staging.state,'APPLIED');assert.equal(staging.marketViewed,false);
          assert.equal(active.schema,1);assert.equal(active.state,'ACTIVE');assert.equal(active.authority,'GRAHAM_WEEK_ROLLOVER');
          assert.equal(active.season,staging.season);assert.equal(active.week,staging.targetWeek);
          assert.deepEqual(power.weekly90_10,staging.result.receipt);
          assert.equal(power.weekly90_10.sourceWeek,staging.sourceWeek);assert.equal(power.weekly90_10.targetWeek,staging.targetWeek);
          const changed=new Set(staging.result.ratingChanges.map(c=>c.team));
          for(const old of before.teams){
            const now=power.teams.find(t=>t.abbr===old.abbr);assert.ok(now);assert.equal(now.seedRating,old.seedRating);
            if(changed.has(old.abbr)){assert.deepEqual(now.history.slice(0,old.history.length),old.history);assert.equal(now.history.length,old.history.length+1);}
            else assert.deepEqual(now,old);
          }
          for(const [p,content] of Object.entries(before.protectedFiles))assert.equal(fs.readFileSync(p,'utf8'),content,`Weekly recovery changed protected file: ${p}`);
          const allowed=new Set(['data/walters/nfl-power-ratings-ledger.json','data/walters/nfl/carried-rating-audit-staging.json']);
          const paths=require('node:child_process').execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for(const p of paths)assert.ok(allowed.has(p),`Unexpected weekly output: ${p}`);
          console.log(`WALTERS RECOVERY VERIFIED // ${changed.size} NEW TEAM UPDATES // ${32-changed.size} TEAM RECORDS UNCHANGED // ACTIVE BOARD + RESEARCH + PERSONNEL + MANIFEST BYTE-PRESERVED`);
          NODE
          else
            ACTIVE_NUMBERS="$(node tools/graham-active-week.mjs --path currentNumbers)"
            node tools/graham-fair-decomposition.mjs --path "$ACTIVE_NUMBERS"
            node - <<'NODE'
          const fs=require('node:fs');
          const staging=JSON.parse(fs.readFileSync('data/walters/nfl/carried-rating-audit-staging.json','utf8'));
          const active=JSON.parse(fs.readFileSync('data/walters/nfl/active-week.json','utf8'));
          const h4=JSON.parse(fs.readFileSync('data/walters/nfl/home-field/home-field-production-current.json','utf8'));
          const qb=JSON.parse(fs.readFileSync('data/walters/nfl/qb-production-current.json','utf8'));
          if(staging.state!=='APPLIED'||staging.marketViewed!==false) throw new Error('audit staging readback failed');
          if(active.schema!==1||active.state!=='ACTIVE'||active.authority!=='GRAHAM_WEEK_ROLLOVER'||active.season!==staging.season||active.week!==staging.week) throw new Error('active week changed or invalid');
          if(h4.state!=='OPERATIONAL_SCOPED'||h4.productionAuthority!==true||h4.marketViewed!==false) throw new Error('H4 production invalid');
          if(h4.productionScope?.domesticLeagueBaseline?.homeLocationAdvantagePoints!==2.082||h4.productionScope?.domesticLeagueBaseline?.pointsToHomeSpread!==-2.082) throw new Error('H4 regression');
          if(qb.state!=='OPERATIONAL_SCOPED'||qb.authorityToken!=='APPROVED_WALTERS_QB_PERFORMANCE'||qb.productionAuthority!==true||qb.grahamWritesAllowed!==true||qb.marketViewed!==false) throw new Error('QB production invalid');
          console.log('GRAHAM CARRIED-RATING AUDIT VERIFY: PASS // ACTIVE WEEK + H4 + QB + MARKET ISOLATION');
          NODE
          fi

      - name: Publish governed audit outputs
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          AUDIT_TYPE="$(node -p "require('./data/walters/nfl/carried-rating-audit-staging.json').auditType||''")"
          git add -- data/walters/nfl-power-ratings-ledger.json data/walters/nfl/carried-rating-audit-staging.json
          if [ "$AUDIT_TYPE" != "WALTERS_WEEKLY_90_10" ]; then
            ACTIVE_NUMBERS="$(node tools/graham-active-week.mjs --path currentNumbers)"
            ACTIVE_RESEARCH="$(node tools/graham-active-week.mjs --path researchLedger)"
            git add -- "$ACTIVE_NUMBERS" "$ACTIVE_RESEARCH"
          fi
          if git diff --cached --quiet; then
            echo "No carried-rating audit changes to publish."
            exit 0
          fi
          git commit -m "Apply Graham carried-rating audit"
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          if [ -f data/walters/nfl/carried-rating-audit-staging.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('node:fs');
          const s=JSON.parse(fs.readFileSync('data/walters/nfl/carried-rating-audit-staging.json','utf8'));
          const weekly=s.auditType==='WALTERS_WEEKLY_90_10';
          const displayWeek=weekly?s.targetWeek:s.week;
          console.log('## Graham carried-rating audit');
          console.log(`- Audit: ${s.auditId||'unknown'}`);
          console.log(`- State: ${s.state}`);
          console.log(`- Season/week: ${s.season}/W${String(displayWeek).padStart(2,'0')}`);
          console.log(`- New rating changes: ${(s.result?.ratingChanges||[]).length}`);
          if(weekly){
            console.log(`- Cumulative teams updated: ${s.result?.receipt?.teamsUpdated??'unverified'}`);
            console.log(`- Already-applied games preserved: ${(s.result?.alreadyAppliedGames||[]).length}`);
            console.log(`- Blocked games: ${(s.result?.blockedGames||[]).length}`);
            console.log('- Current-week fair construction: not performed');
          }else console.log(`- Games rebuilt: ${(s.result?.matchupChanges||[]).length}`);
          console.log('- H4, personnel and QB layers: preserved');
          console.log('- Market viewed: false');
          console.log('- BET authority: false');
          NODE
          fi
