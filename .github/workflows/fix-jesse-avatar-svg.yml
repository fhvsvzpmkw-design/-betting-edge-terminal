name: One-time Jesse avatar sizing fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-jesse-avatar-svg.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix embedded portrait sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/syndicates/jesse-bains.svg')
          s=p.read_text(encoding='utf-8')
          old='<image href="data:image/jpeg;base64,'
          new='<image x="0" y="0" width="160" height="184" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,'
          if old not in s:
              raise SystemExit('embedded image target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -q 'width="160" height="184"' assets/syndicates/jesse-bains.svg
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/syndicates/jesse-bains.svg
          git commit -m 'Fix Jesse Bains avatar image sizing'
          git push
