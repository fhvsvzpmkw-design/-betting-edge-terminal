name: Single-document VigScope build

on:
  push:
    branches: [refactor/single-document-vigscope]
    paths:
      - .github/workflows/single-document-vigscope-build.yml
      - tools/build-single-document-vigscope.py
      - tests/single-document-vigscope-smoke.mjs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/single-document-vigscope
          fetch-depth: 0

      - name: Generate single-document runner
        run: python3 tools/build-single-document-vigscope.py

      - name: Static checks
        run: |
          ! grep -q '<iframe' runner.html
          grep -q 'id="core"' runner.html
          grep -q 'id="app"' runner.html
          grep -q 'singleDocumentOuterRuntime' runner.html
          grep -q 'report-dashboard-vigscope.js' runner.html
          grep -q 'summaryOverallRoi' runner.html
          grep -q 'runner-core-runtime.js' runner.html
          ! grep -q 'CORE v1.4 RUN ARCHIVE' runner.html
          ! grep -q 'NEW YORK LIBERTY @ INDIANA FEVER' runner.html

      - name: Install smoke-test browser client
        run: npm --silent install puppeteer-core@24 >/dev/null 2>&1

      - name: Chromium smoke test
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          python3 -m http.server 8765 >/tmp/vigscope-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          PAYLOAD=$(python3 -c 'import base64,json; p={"slot":"late","label":"18:15 LATE / WEST COAST","ts":"2026-08-30T18:21:30.000-07:00","bankroll":495.41,"risk":0,"counts":{"bet":0,"lean":0,"wait":0,"pass":5},"summary":"SINGLE DOCUMENT SMOKE TEST","recs":[]}; print(base64.urlsafe_b64encode(json.dumps(p,separators=(",",":")).encode()).decode().rstrip("="))')
          CHROME="$CHROME" PAYLOAD="$PAYLOAD" node tests/single-document-vigscope-smoke.mjs

      - name: Save single-document runner and remove one-time workflow
        run: |
          rm -f .github/workflows/single-document-vigscope-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.html tools/build-single-document-vigscope.py tests/single-document-vigscope-smoke.mjs .github/workflows/single-document-vigscope-build.yml
          git commit -m "Make VigScope a single scrolling document"
          git push origin HEAD:refactor/single-document-vigscope
