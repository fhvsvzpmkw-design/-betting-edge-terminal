name: Temporary readback final morning 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-readback-final-20261003.yml

permissions:
  contents: write

jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controller authoritative readback
        run: |
          set -euo pipefail
          node tools/report-run.mjs readback --checkpoint data/report-production/checkpoints/20261003-final-0930.json --expected-revision 6
          test "$(jq -r '.phase' data/report-production/checkpoints/20261003-final-0930.json)" = PUBLISHED
          test "$(jq -r '.frozen.blobSha' data/report-production/checkpoints/20261003-final-0930.json)" = 470be05a48b6f8efe247bc27dff45091ede6fd1f
      - name: Persist exact readback checkpoint and remove workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/report-production/checkpoints/20261003-final-0930.json
          git rm .github/workflows/temp-readback-final-20261003.yml
          git commit -m "Record final morning controller readback 2026-10-03"
          git push origin main
