name: Apply approved Core review on isolated branch
on:
  push:
    branches: [fix/core14-decision-paths-20260920]
    paths:
      - tools/apply-core14-review-once.py
      - .github/workflows/apply-core14-review-once.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/core14-decision-paths-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed source delta
        run: python3 tools/apply-core14-review-once.py
      - name: Test status-specific boundaries and integration
        run: |
          node tests/core14-review.test.mjs --integration
          node tests/candidate-assessment.test.mjs
          node tools/core-handicap-framework.mjs self-test
          node tools/core-liquidity-classification.mjs self-test
          node tests/primary-analysis-receipt.test.mjs
      - name: Commit tested non-workflow changes only to isolated branch
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={'.github/workflows/card-evidence-review.yml','BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md','docs/CANDIDATE_ASSESSMENT.md','tools/candidate-assessment.mjs','tools/core-handicap-framework.mjs','tools/core-liquidity-classification.mjs','tools/event-research-plan.mjs','tools/major-sport-market-coverage-gate.mjs','tools/report-evidence-repair.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,(changed,allowed)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          PY
          # Workflow changes are handled by the authorized connector, not this token.
          git restore -- .github/workflows/card-evidence-review.yml
          rm tools/apply-core14-review-once.py
          git add -- BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md docs/CANDIDATE_ASSESSMENT.md tools/candidate-assessment.mjs tools/core-handicap-framework.mjs tools/core-liquidity-classification.mjs tools/event-research-plan.mjs tools/major-sport-market-coverage-gate.mjs tools/report-evidence-repair.mjs tools/apply-core14-review-once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply tested Core 1.4 non-bet support and native-fair corrections'
          git push origin HEAD:refs/heads/fix/core14-decision-paths-20260920
