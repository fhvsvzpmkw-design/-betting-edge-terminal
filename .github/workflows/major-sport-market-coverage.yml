name: Major sport market coverage

on:
  push:
    branches: [main]
    paths:
      - data/major-sport-market-coverage-v1.json
      - BETTING_EDGE_MAJOR_SPORT_MARKET_COVERAGE.md
      - BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md
      - tools/major-sport-market-coverage-gate.mjs
      - tools/odds-refresh-worker-source.yml
      - tests/primary-market-scope.test.mjs
      - tests/report-bundle-preflight.test.mjs
      - tools/report-publication.mjs
      - tools/report-evidence-gate.mjs
      - tools/report-sidecar-contract.mjs
      - tests/report-evidence-gate.test.mjs
      - tests/coverage-summary.test.mjs
      - tests/primary-analysis-receipt.test.mjs
      - tests/vigscope-primary-market-sample.test.mjs
      - tests/primary-report-dashboard.test.mjs
      - tests/report-coverage-summary.test.mjs
      - tests/primary-report-publication.test.mjs
      - tools/report-coverage-summary.mjs
      - tools/vigscope-meter-telemetry.mjs
      - tools/vigscope-meter-telemetry-gate.mjs
      - tools/vigscope-meter-production.mjs
      - tools/core-handicap-framework.mjs
      - tools/personnel-semantic-gate.mjs
      - assets/report-dashboard-vigscope.js
      - assets/report-dashboard-vigscope.js.old
      - assets/runner-core-runtime.js
      - r.html
      - tests/vigscope-meter-telemetry.test.mjs
      - tests/vigscope-meter-resilient.test.mjs
      - tests/vigscope-meter-fallback-safety.test.mjs
      - tests/vigscope-meter-sep2-live-fixture.test.mjs
      - data/vigscope/meter-calibration-production-v1.json
      - docs/VIGSCOPE_METER_BASELINES.md
      - docs/CORE_MARKET_RECOVERY_2026-09-05.md
      - tests/odds-worker-primary-recovery.test.mjs
      - docs/REPORT_EVIDENCE_REQUIREMENTS.md
      - data/history/report-provenance-schema.json
      - BETTING_EDGE_CONTRACT.md
      - tools/selection-continuity.mjs
      - tests/major-sport-market-coverage.test.mjs
      - tests/scheduled-report-authority.test.mjs
      - tests/odds-worker-major-sport-retention.test.mjs
      - .github/workflows/major-sport-market-coverage.yml
      - .github/workflows/report-history-staged.yml
  workflow_dispatch:

concurrency:
  group: major-sport-market-coverage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate major-sport coverage authority
        run: |
          set -euo pipefail
          node tests/major-sport-market-coverage.test.mjs
          node tests/primary-market-scope.test.mjs
          node tests/report-bundle-preflight.test.mjs
          node tests/report-evidence-gate.test.mjs
          node tests/coverage-summary.test.mjs
          node tests/primary-analysis-receipt.test.mjs
          node tests/vigscope-primary-market-sample.test.mjs
          node tests/primary-report-dashboard.test.mjs
          node tests/report-coverage-summary.test.mjs
          node tests/primary-report-publication.test.mjs
          node tests/vigscope-meter-telemetry.test.mjs
          node tests/vigscope-meter-resilient.test.mjs
          node tests/vigscope-meter-fallback-safety.test.mjs
          node tests/vigscope-meter-sep2-live-fixture.test.mjs
          node tools/vigscope-meter-telemetry-gate.mjs self-test
          node tests/odds-worker-primary-recovery.test.mjs
          node tools/report-publication.mjs self-test
          node tools/selection-continuity.mjs self-test
          node tests/scheduled-report-authority.test.mjs
          node tests/odds-worker-major-sport-retention.test.mjs
          node tools/major-sport-market-coverage-gate.mjs self-test

      - name: Verify publisher owns the coverage gate
        run: |
          set -euo pipefail
          grep -q 'Enforce major-sport coverage receipt' .github/workflows/report-history-staged.yml
          grep -q 'major-sport-market-coverage-gate.mjs validate' .github/workflows/report-history-staged.yml

      - name: Summary
        if: always()
        run: |
          {
            echo '## Major sport market coverage'
            echo '- Coverage authority: data/major-sport-market-coverage-v1.json'
            echo '- Scheduled report authority: BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md'
            echo '- Publication: forward-only coverage receipt enforced from 2026-09-02 08:00 PT'
            echo '- Odds worker: broad multi-event market retention protected; deep prop collections supplemental'
            echo '- Scope: MLB / NHL / NBA-WNBA / NFL-NCAAF-CFL'
            echo '- Primary markets: two-sided ML + main spread/run-line/puck-line + total'
            echo '- Props: PAUSED_BY_SCOPE from 2026-09-05 13:00 PT; inventory retained, analysis and cards disabled'
            echo '- Card target: soft with actionable overflow protection'
            echo '- From 2026-09-06 00:00 PT: available primary selections require verified decisions or evidence blockers'
            echo '- Market meters: exact primary quote inventory independent of displayed cards; pinned replay and v1/v2 history protected'
          } >> "$GITHUB_STEP_SUMMARY"
