name: Eddie Public Ledger Retry Once

on:
  push:
    paths:
      - 'tools/eddie-public-ledger-retry.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair one-time updater interpolation
        run: |
          python - <<'PY'
          p='tools/eddie-public-ledger-once.mjs'
          s=open(p,encoding='utf-8').read()
          needle='${marker}'
          if needle not in s:
              raise SystemExit('Expected marker interpolation not found')
          s=s.replace(needle, r'\${marker}', 1)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Re-anchor Eddie to public Bet History
        run: node tools/eddie-public-ledger-once.mjs
      - name: Validate Eddie public ledger desk
        run: node tests/muddy-ledger-desk.test.mjs
      - name: Commit Eddie update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/characters/eddie-numbers.json syndicates/sharp-room/incoming.html tests/muddy-ledger-desk.test.mjs
          if git diff --cached --quiet; then
            echo "No Eddie changes to commit"
          else
            git commit -m "Re-anchor Eddie Numbers to public Bet History"
            git push
          fi
