name: One-time durable-history transition repair

on:
  push:
    branches: [history-wait-repair-20260829]
    paths:
      - .github/workflows/history-wait-qualification-repair-once-20260829.yml

permissions:
  contents: write

concurrency:
  group: betting-edge-history-wait-qualification-repair-once-20260829
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: history-wait-repair-20260829
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit and repair post-cutover WAIT qualification metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const CUTOFF = Date.parse('2026-08-25T15:24:44-07:00');
          const MARKET_ONLY = /\b(bet\s*365|draftkings|odds[-\s]?api(?:\.io)?|live[-\s]?odds|sportsbook(?:\s+pair)?|two[-\s]?book|no[-\s]?vig|market consensus|market-derived)\b/i;
          const index = JSON.parse(fs.readFileSync('run-history.json', 'utf8'));
          const changedFiles = new Set();
          const repaired = [];
          const audited = [];

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }
          function nonEmpty(value) {
            return typeof value === 'string' && value.trim().length > 0;
          }
          function validQualification(q) {
            if (!q || typeof q !== 'object' || Array.isArray(q)) return false;
            if (q.actionableIfResolved !== true) return false;
            if (!Array.isArray(q.blockers) || !q.blockers.length || q.blockers.some(x => !nonEmpty(x))) return false;
            if (!Array.isArray(q.independentSignals) || !q.independentSignals.length) return false;
            for (const signal of q.independentSignals) {
              if (!signal || typeof signal !== 'object' || Array.isArray(signal)) return false;
              if (!nonEmpty(signal.origin) || !nonEmpty(signal.finding)) return false;
              if (MARKET_ONLY.test(signal.origin)) return false;
            }
            return nonEmpty(q.rationale);
          }
          function serialize(original, data) {
            const pretty = original.includes('\n');
            const trailingNewline = original.endsWith('\n');
            return (pretty ? JSON.stringify(data, null, 2) : JSON.stringify(data)) + (trailingNewline ? '\n' : '');
          }
          function deriveQualification(rec, file) {
            const evidence = rec?.personnelEvidence;
            const context = rec?.coreAssessment?.context;
            assert(evidence && typeof evidence === 'object' && !Array.isArray(evidence), `${file} recommendation ${rec?.ordinal} ${rec?.title}: cannot safely repair WAIT without preserved personnelEvidence`);
            const support = String(context?.independentCurrentSupport || '').toUpperCase();
            assert(['MODERATE', 'STRONG'].includes(support), `${file} recommendation ${rec?.ordinal} ${rec?.title}: preserved independentCurrentSupport=${support || 'MISSING'} is insufficient to backfill WAIT qualification`);

            const blockers = [...new Set((Array.isArray(evidence.unresolved) ? evidence.unresolved : [])
              .filter(nonEmpty)
              .map(x => String(x).trim()))];
            assert(blockers.length > 0, `${file} recommendation ${rec?.ordinal} ${rec?.title}: cannot safely repair WAIT without preserved unresolved blockers`);

            const sourcePool = [
              ...(Array.isArray(evidence.officialSources) ? evidence.officialSources : []),
              ...(Array.isArray(evidence.fallbackSources) ? evidence.fallbackSources : [])
            ];
            const seen = new Set();
            const independentSignals = [];
            for (const source of sourcePool) {
              const origin = String(source?.origin || '').trim();
              const finding = String(source?.fact || source?.finding || '').trim();
              if (!origin || !finding || MARKET_ONLY.test(origin)) continue;
              const key = origin.toLowerCase().replace(/\s+/g, ' ');
              if (seen.has(key)) continue;
              seen.add(key);
              independentSignals.push({origin, finding});
              if (independentSignals.length >= 2) break;
            }
            assert(independentSignals.length > 0, `${file} recommendation ${rec?.ordinal} ${rec?.title}: cannot safely repair WAIT without preserved independent non-market evidence`);

            return {
              actionableIfResolved: true,
              blockers,
              independentSignals,
              rationale: `Historical WAIT retained because preserved ${support.toLowerCase()} independent current support and the named unresolved gate(s) left a plausible path to materially closer actionability if resolved; fresh re-handicapping, current identity/freshness checks and an executable price were still required.`
            };
          }

          const entries = (index.runs || [])
            .filter(entry => entry?.researchFitPath && Number.isFinite(Date.parse(entry.ts)) && Date.parse(entry.ts) >= CUTOFF)
            .sort((a, b) => Date.parse(a.ts) - Date.parse(b.ts));

          for (const entry of entries) {
            const file = entry.researchFitPath;
            const original = fs.readFileSync(file, 'utf8');
            const sidecar = JSON.parse(original);
            let changed = false;
            for (const rec of sidecar.recommendations || []) {
              if (String(rec?.status || '').toUpperCase() !== 'WAIT') continue;
              audited.push(`${entry.ts} #${rec.ordinal} ${rec.title}`);
              if (validQualification(rec.waitQualification)) continue;
              rec.waitQualification = deriveQualification(rec, file);
              assert(validQualification(rec.waitQualification), `${file} recommendation ${rec?.ordinal} ${rec?.title}: derived WAIT qualification failed local validation`);
              repaired.push(`${entry.ts} #${rec.ordinal} ${rec.title}`);
              changed = true;
            }
            if (changed) {
              fs.writeFileSync(file, serialize(original, sidecar), 'utf8');
              changedFiles.add(file);
            }
          }

          assert(audited.length > 0, 'No post-cutover WAIT recommendations were found to audit');
          console.log(`WAIT AUDIT COUNT ${audited.length}`);
          for (const line of audited) console.log(`AUDITED ${line}`);
          console.log(`WAIT REPAIR COUNT ${repaired.length}`);
          for (const line of repaired) console.log(`REPAIRED ${line}`);
          console.log(`WAIT REPAIR FILE COUNT ${changedFiles.size}`);
          for (const file of changedFiles) console.log(`CHANGED ${file}`);
          NODE

      - name: Audit all Stage 2 transition metadata before commit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const CUTOFF = Date.parse('2026-08-25T15:24:44-07:00');
          const MARKET_ONLY = /\b(bet\s*365|draftkings|odds[-\s]?api(?:\.io)?|live[-\s]?odds|sportsbook(?:\s+pair)?|two[-\s]?book|no[-\s]?vig|market consensus|market-derived)\b/i;
          const PERSONNEL_STATES = new Set(['CONFIRMED','STRONG PROJECTION','PARTIAL','UNKNOWN']);
          const SOURCE_CONFLICT_STATES = new Set(['NONE','MINOR','MATERIAL']);
          const index = JSON.parse(fs.readFileSync('run-history.json', 'utf8'));
          const issues = [];
          let recommendationCount = 0;
          let personnelCount = 0;
          let waitCount = 0;

          function nonEmpty(value) {
            return typeof value === 'string' && value.trim().length > 0;
          }
          function issue(entry, rec, message, extra='') {
            issues.push(`${entry.ts} | ${entry.researchFitPath} | #${rec?.ordinal ?? '?'} ${rec?.title || 'UNKNOWN'} | ${message}${extra ? ` | ${extra}` : ''}`);
          }
          function validQualification(q) {
            if (!q || typeof q !== 'object' || Array.isArray(q)) return false;
            if (q.actionableIfResolved !== true) return false;
            if (!Array.isArray(q.blockers) || !q.blockers.length || q.blockers.some(x => !nonEmpty(x))) return false;
            if (!Array.isArray(q.independentSignals) || !q.independentSignals.length) return false;
            for (const signal of q.independentSignals) {
              if (!signal || typeof signal !== 'object' || Array.isArray(signal)) return false;
              if (!nonEmpty(signal.origin) || !nonEmpty(signal.finding) || MARKET_ONLY.test(signal.origin)) return false;
            }
            return nonEmpty(q.rationale);
          }

          for (const entry of (index.runs || []).filter(e => e?.researchFitPath && Date.parse(e.ts) >= CUTOFF).sort((a,b)=>Date.parse(a.ts)-Date.parse(b.ts))) {
            const sidecar = JSON.parse(fs.readFileSync(entry.researchFitPath, 'utf8'));
            for (const rec of sidecar.recommendations || []) {
              recommendationCount++;
              const status = String(rec?.status || '').toUpperCase();
              if (typeof rec.personnelRequired !== 'boolean') issue(entry, rec, 'personnelRequired is not an explicit boolean');
              if (rec.personnelEvidence && rec.personnelRequired !== true) issue(entry, rec, 'personnelEvidence exists while personnelRequired is not true');
              if (rec.personnelRequired === true) {
                personnelCount++;
                const e = rec.personnelEvidence;
                if (!e || typeof e !== 'object' || Array.isArray(e)) {
                  issue(entry, rec, 'missing personnelEvidence');
                } else {
                  if (!nonEmpty(e.stage2CheckedAt) || !Number.isFinite(Date.parse(e.stage2CheckedAt))) issue(entry, rec, 'invalid personnelEvidence.stage2CheckedAt');
                  if (!nonEmpty(e.dependencyTarget)) issue(entry, rec, 'missing personnelEvidence.dependencyTarget');
                  if (!nonEmpty(e.dependencyRationale)) issue(entry, rec, 'missing personnelEvidence.dependencyRationale');
                  if (!Array.isArray(e.officialSources) || e.officialSources.length === 0) {
                    const candidates = (Array.isArray(e.fallbackSources) ? e.fallbackSources : [])
                      .map(s => `${s?.origin || '?'} ${s?.url || ''}`.trim())
                      .join(' ; ');
                    issue(entry, rec, 'officialSources has no authoritative source', candidates ? `fallback candidates: ${candidates}` : 'no fallback candidates');
                  }
                  if (!Array.isArray(e.fallbackSources)) {
                    issue(entry, rec, 'fallbackSources is not an array');
                  } else {
                    const origins = [];
                    for (let i=0;i<e.fallbackSources.length;i++) {
                      const source = e.fallbackSources[i];
                      if (!source || typeof source !== 'object' || Array.isArray(source)) issue(entry, rec, `fallbackSources[${i}] is invalid`);
                      else if (!nonEmpty(source.origin)) issue(entry, rec, `fallbackSources[${i}].origin is missing`);
                      else origins.push(String(source.origin).trim().toLowerCase().replace(/\s+/g,' '));
                    }
                    if (new Set(origins).size !== origins.length) issue(entry, rec, 'fallbackSources contains duplicate origins');
                    if (!Number.isInteger(e.fallbackSourceCount) || e.fallbackSourceCount < 0 || e.fallbackSourceCount !== e.fallbackSources.length) issue(entry, rec, 'fallbackSourceCount does not match fallbackSources length');
                  }
                  if (!(e.sourceShortfall === null || nonEmpty(e.sourceShortfall))) issue(entry, rec, 'sourceShortfall must be null or non-empty');
                  if (!Array.isArray(e.facts)) issue(entry, rec, 'facts is not an array');
                  if (!PERSONNEL_STATES.has(e.personnelState)) issue(entry, rec, `invalid personnelState=${e.personnelState}`);
                  if (!SOURCE_CONFLICT_STATES.has(e.sourceConflict)) issue(entry, rec, `invalid sourceConflict=${e.sourceConflict}`);
                  if (!Array.isArray(e.unresolved)) issue(entry, rec, 'unresolved is not an array');
                  if (!nonEmpty(e.decisionSensitivity)) issue(entry, rec, 'missing decisionSensitivity');
                  if (!nonEmpty(e.preStage2Fair)) issue(entry, rec, 'missing preStage2Fair');
                  if (!nonEmpty(e.postStage2Fair)) issue(entry, rec, 'missing postStage2Fair');
                  if (!nonEmpty(e.decisionImpact)) issue(entry, rec, 'missing decisionImpact');
                  const unresolved = Array.isArray(e.unresolved) ? e.unresolved : [];
                  const fallbackCount = Array.isArray(e.fallbackSources) ? e.fallbackSources.length : 0;
                  const unresolvedMaterial = e.personnelState !== 'CONFIRMED' || unresolved.length > 0;
                  if (unresolvedMaterial && fallbackCount < 3 && !nonEmpty(e.sourceShortfall)) issue(entry, rec, 'unresolved personnel has fewer than 3 fallback sources and no sourceShortfall');
                  if (unresolvedMaterial && fallbackCount < 3 && !['PARTIAL','UNKNOWN'].includes(e.personnelState)) issue(entry, rec, `personnelState=${e.personnelState} overstates certainty with fewer than 3 fallback sources`);
                  if (e.sourceConflict === 'MATERIAL' && e.personnelState === 'STRONG PROJECTION') issue(entry, rec, 'STRONG PROJECTION is invalid with MATERIAL source conflict');
                }
              }
              if (status === 'WAIT') {
                waitCount++;
                if (!validQualification(rec.waitQualification)) issue(entry, rec, 'WAIT qualification remains invalid after repair');
              } else if (rec.waitQualification) {
                issue(entry, rec, `waitQualification present on non-WAIT status ${status}`);
              }
            }
          }

          console.log(`STAGE2 AUDIT RECOMMENDATIONS ${recommendationCount}`);
          console.log(`STAGE2 AUDIT PERSONNEL-REQUIRED ${personnelCount}`);
          console.log(`STAGE2 AUDIT WAITS ${waitCount}`);
          console.log(`STAGE2 AUDIT ISSUE COUNT ${issues.length}`);
          for (const line of issues) console.log(`ISSUE ${line}`);
          if (issues.length) throw new Error(`Stage 2 transition audit found ${issues.length} issue(s)`);
          NODE

      - name: Verify complete durable history after repair
        run: |
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history

      - name: Commit repaired sidecars and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/history/research-fit
          git rm .github/workflows/history-wait-qualification-repair-once-20260829.yml
          if git diff --cached --quiet; then
            echo 'No repair changes were required.'
          else
            git commit -m 'history: repair post-cutover durable-history metadata'
            git push origin HEAD:history-wait-repair-20260829
          fi

      - name: Remote read-back verification
        run: |
          git fetch origin history-wait-repair-20260829
          git reset --hard origin/history-wait-repair-20260829
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history

      - name: Summary
        run: |
          {
            echo '## Durable-history transition repair'
            echo
            echo '- Audited every indexed recommendation at or after the 2026-08-25 15:24:44 PDT cutover'
            echo '- Repaired only WAIT qualification metadata derivable from preserved sidecar evidence'
            echo '- Did not change issued report payloads, statuses, prices, fairs, play-to values or stakes'
            echo '- Durable report-history verification passed on the repaired branch'
            echo '- Core 1.4 post-cutover history verification passed on the repaired branch'
          } >> "$GITHUB_STEP_SUMMARY"
