name: Refresh Betting Edge odds

on:
  workflow_dispatch:
    inputs:
      trigger_mode:
        description: Trigger source for this odds refresh
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cloudflare_scheduled
      scheduled_at:
        description: Cloudflare scheduled timestamp (ISO-8601; scheduled mode only)
        required: false
        type: string

concurrency:
  group: betting-edge-odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Cloudflare dispatch envelope
        if: github.event_name == 'workflow_dispatch' && inputs.trigger_mode == 'cloudflare_scheduled'
        env:
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          node <<'NODE'
          const raw=String(process.env.SCHEDULED_AT||'').trim();
          const scheduled=Date.parse(raw);
          if(!raw||!Number.isFinite(scheduled)) throw new Error('Cloudflare scheduled dispatch requires a valid scheduled_at timestamp');
          const ageMinutes=Math.abs(Date.now()-scheduled)/60000;
          if(ageMinutes>35) throw new Error(`Cloudflare scheduled_at is outside the 35-minute dispatch window (${ageMinutes.toFixed(1)}m)`);
          console.log(`Cloudflare dispatch envelope OK // scheduled_at=${raw} // age=${ageMinutes.toFixed(1)}m`);
          NODE

      - name: Resolve active Vancouver schedule profile
        id: schedule
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_MODE: ${{ inputs.trigger_mode || '' }}
        run: |
          if [ "${TRIGGER_MODE}" = "cloudflare_scheduled" ]; then
            export EVENT_NAME=schedule
          else
            export EVENT_NAME="${GITHUB_EVENT_NAME}"
          fi
          node tools/schedule-profile.mjs resolve-workflow >> "$GITHUB_OUTPUT"

      - name: Gate duplicate profile slot
        id: gate
        if: steps.schedule.outputs.should_run == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_MODE: ${{ inputs.trigger_mode || '' }}
          OPERATING_DATE: ${{ steps.schedule.outputs.operating_date }}
          PROFILE_ID: ${{ steps.schedule.outputs.profile_id }}
          CANONICAL_SLOT: ${{ steps.schedule.outputs.canonical_slot }}
          TARGET_MINUTES: ${{ steps.schedule.outputs.target_minutes }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const githubEventName=process.env.GITHUB_EVENT_NAME||'';
          const triggerMode=process.env.TRIGGER_MODE||'';
          const eventName=githubEventName==='workflow_dispatch'&&triggerMode==='cloudflare_scheduled'?'schedule':githubEventName;
          if(eventName==='workflow_dispatch'){
            console.log('execute=true');
            console.log('reason=manual');
            process.exit(0);
          }
          const expectedDate=process.env.OPERATING_DATE||'';
          const expectedProfile=process.env.PROFILE_ID||'';
          const expectedSlot=Number(process.env.CANONICAL_SLOT||0);
          const target=Number(process.env.TARGET_MINUTES||NaN);
          let existing=null;
          try{existing=JSON.parse(fs.readFileSync('data/live-odds.json','utf8'))}catch{}
          const meta=existing?.scheduleMeta||{};
          if(meta.operatingDate===expectedDate&&meta.profileId===expectedProfile&&Number(meta.canonicalSlot)===expectedSlot){
            console.log('execute=false');
            console.log('reason=slot-already-published');
            process.exit(0);
          }
          // Backward-compatible duplicate gate for a same-day snapshot created
          // before scheduleMeta was introduced.
          if(existing?.generatedAt&&Number.isFinite(target)){
            const d=new Date(existing.generatedAt);
            const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Vancouver',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d);
            const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));
            const h=Number(o.hour==='24'?'0':o.hour),m=Number(o.minute);
            const localDate=`${o.year}-${o.month}-${o.day}`;
            const minutes=h*60+m;
            if(localDate===expectedDate&&minutes>=target-2&&minutes<=target+15){
              console.log('execute=false');
              console.log('reason=legacy-slot-already-published');
              process.exit(0);
            }
          }
          console.log('execute=true');
          console.log('reason=profile-slot-due');
          NODE

      - name: Extract known-good odds worker
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('tools/odds-refresh-worker-source.yml').read_text()
          start_marker="          node <<'NODE'\n"
          end_marker="\n          NODE\n"
          start=source.index(start_marker)+len(start_marker)
          end=source.index(end_marker,start)
          worker=textwrap.dedent(source[start:end])
          Path('/tmp/betting-edge-odds-worker.js').write_text(worker)
          print(f'Extracted known-good odds worker: {len(worker)} bytes')
          PY

      - name: Apply Crypto fight-watch priority
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          node tools/apply-crypto-watch-priority.mjs /tmp/betting-edge-odds-worker.js
          node --check /tmp/betting-edge-odds-worker.js

      - name: Pull quota-balanced Bet365 + DraftKings odds
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # The preserved worker treats workflow_dispatch as an intentional
          # accepted run. Seasonal timing/duplicate rejection happened above.
          EVENT_NAME: workflow_dispatch
          EVENT_SCHEDULE: seasonal-profile
        run: node /tmp/betting-edge-odds-worker.js

      - name: Attach schedule provenance
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        env:
          OPERATING_DATE: ${{ steps.schedule.outputs.operating_date }}
          PROFILE_ID: ${{ steps.schedule.outputs.profile_id }}
          PROFILE_LABEL: ${{ steps.schedule.outputs.profile_label }}
          CANONICAL_SLOT: ${{ steps.schedule.outputs.canonical_slot }}
          SLOT_NAME: ${{ steps.schedule.outputs.slot_name }}
          PLANNED_PULSE: ${{ steps.schedule.outputs.planned_pulse_time }}
          PLANNED_REPORT: ${{ steps.schedule.outputs.planned_report_time }}
          FEATURED_VIG: ${{ steps.schedule.outputs.featured_vig_scope }}
          TRIGGER_MODE: ${{ inputs.trigger_mode || '' }}
          TRIGGER_SCHEDULED_AT: ${{ inputs.scheduled_at || '' }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p='data/live-odds.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          const canonicalRaw=String(process.env.CANONICAL_SLOT||'').trim();
          const triggerMode=String(process.env.TRIGGER_MODE||'');
          const triggerSource=triggerMode==='cloudflare_scheduled'?'cloudflare-cron':'manual';
          j.scheduleMeta={
            schema:1,
            operatingDate:process.env.OPERATING_DATE||null,
            profileId:process.env.PROFILE_ID||null,
            profileLabel:process.env.PROFILE_LABEL||null,
            canonicalSlot:canonicalRaw?Number(canonicalRaw):null,
            slot:process.env.SLOT_NAME||null,
            plannedPulseTime:process.env.PLANNED_PULSE||null,
            plannedReportTime:process.env.PLANNED_REPORT||null,
            featuredVigScope:String(process.env.FEATURED_VIG||'').toLowerCase()==='true',
            triggerSource,
            triggerScheduledAt:process.env.TRIGGER_SCHEDULED_AT||null
          };
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          JSON.parse(fs.readFileSync(p,'utf8'));
          console.log('Attached schedule provenance:',JSON.stringify(j.scheduleMeta));
          NODE

      - name: Publish snapshot
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"

          # Preserve the exact snapshot that already passed worker validation.
          # A push collision must never cause another Odds-API pull.
          candidate="$(mktemp)"
          cp data/live-odds.json "$candidate"
          candidate_epoch="$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const t=Date.parse(d.generatedAt||""); if(!Number.isFinite(t)) process.exit(2); process.stdout.write(String(t));' "$candidate")"

          for attempt in 1 2 3 4; do
            git fetch origin main
            remote_epoch="$(git show origin/main:data/live-odds.json 2>/dev/null | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{try{const j=JSON.parse(s); const t=Date.parse(j.generatedAt||""); process.stdout.write(Number.isFinite(t)?String(t):"0")}catch{process.stdout.write("0")}})')"
            if [ "${remote_epoch:-0}" -ge "$candidate_epoch" ]; then
              echo "Remote live odds are already equal/newer; no publish needed."
              exit 0
            fi
            git reset --hard origin/main
            cp "$candidate" data/live-odds.json
            git add -- data/live-odds.json
            if git diff --cached --quiet; then
              echo "No validated odds changes to publish."
              exit 0
            fi
            git commit -m "Refresh Betting Edge live odds"
            if git push origin HEAD:main; then
              echo "Validated seasonal-profile odds snapshot published on attempt $attempt."
              exit 0
            fi
            echo "Publish collision on attempt $attempt; retrying the same validated snapshot."
          done
          echo "Validated odds snapshot could not be published after 4 attempts." >&2
          exit 1

      - name: Schedule summary
        if: always()
        env:
          TRIGGER_MODE: ${{ inputs.trigger_mode || '' }}
        run: |
          if [ "${TRIGGER_MODE}" = "cloudflare_scheduled" ]; then
            trigger_source="cloudflare-cron"
          else
            trigger_source="manual"
          fi
          {
            echo "## Betting Edge odds scheduler"
            echo
            echo "- Trigger: \`${trigger_source}\`"
            echo "- Profile: \`${{ steps.schedule.outputs.profile_label }}\`"
            echo "- Operating day: \`${{ steps.schedule.outputs.operating_date }}\`"
            echo "- Canonical slot: \`${{ steps.schedule.outputs.canonical_slot }}\`"
            echo "- Planned pulse: \`${{ steps.schedule.outputs.planned_pulse_time }} PT\`"
            echo "- Planned report: \`${{ steps.schedule.outputs.planned_report_time }} PT\`"
            echo "- Featured Vig Scope: \`${{ steps.schedule.outputs.featured_vig_scope }}\`"
            echo "- Gate: \`${{ steps.gate.outputs.reason || 'not-due' }}\`"
            echo "- Crypto fight watch: exact-pair priority inside 30 hours"
            echo "- Five-pull daily cap: unchanged"
            echo "- Scheduled clock: Cloudflare only"
          } >> "$GITHUB_STEP_SUMMARY"
