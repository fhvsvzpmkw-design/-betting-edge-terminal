name: Refresh Betting Edge odds

on:
  push:
    branches: [main]
    paths:
      - data/odds-run-request.json
  workflow_dispatch:
    inputs:
      trigger_mode:
        description: Trigger source (cloudflare_scheduled is retired and rejected)
        required: false
        default: manual
        type: choice
        options:
          - manual
          - cloudflare_scheduled
      scheduled_at:
        description: Retired Cloudflare envelope; nonempty values are rejected
        required: false
        type: string

concurrency:
  group: betting-edge-odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Accept report requests or explicit manual pulls only
        id: entry
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TRIGGER_MODE: ${{ inputs.trigger_mode || '' }}
          SCHEDULED_AT: ${{ inputs.scheduled_at || '' }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
            push)
              ;;
            workflow_dispatch)
              if [ "${TRIGGER_MODE:-manual}" != "manual" ] || [ -n "${SCHEDULED_AT}" ]; then
                echo "Retired automatic odds dispatch rejected. Scheduled report tasks own odds requests." >&2
                exit 1
              fi
              ;;
            *)
              echo "Retired odds scheduler event rejected: ${GITHUB_EVENT_NAME}. Scheduled report tasks own odds requests." >&2
              exit 1
              ;;
          esac

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve permanent Main Betting Edge schedule
        id: schedule
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            node tools/odds-run-request.mjs resolve >> "$GITHUB_OUTPUT"
          else
            export EVENT_NAME=workflow_dispatch
            node tools/main-schedule.mjs resolve-workflow >> "$GITHUB_OUTPUT"
          fi

      - name: Gate duplicate Main schedule slot
        id: gate
        if: steps.schedule.outputs.should_run == 'true'
        env:
          EFFECTIVE_EVENT_NAME: ${{ steps.schedule.outputs.effective_event_name || github.event_name }}
          REQUEST_TRIGGER_SOURCE: ${{ steps.schedule.outputs.request_trigger_source || '' }}
          REQUEST_SCHEDULED_AT: ${{ steps.schedule.outputs.request_scheduled_at || '' }}
        run: node tools/odds-slot-state.mjs check >> "$GITHUB_OUTPUT"

      - name: Extract known-good odds worker
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source=Path('tools/odds-refresh-worker-source.yml').read_text()
          start_marker="          node <<'NODE'\n"
          end_marker="\n          NODE\n"
          start=source.index(start_marker)+len(start_marker)
          end=source.index(end_marker,start)
          worker=textwrap.dedent(source[start:end])
          Path('/tmp/betting-edge-odds-worker.js').write_text(worker)
          print(f'Extracted known-good odds worker: {len(worker)} bytes')
          PY

      - name: Apply Crypto fight-watch priority
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          node tools/apply-crypto-watch-priority.mjs /tmp/betting-edge-odds-worker.js
          node --check /tmp/betting-edge-odds-worker.js

      - name: Pull quota-balanced Bet365 + DraftKings odds
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # The preserved worker treats workflow_dispatch as an intentional
          # accepted run. Main-schedule timing/duplicate rejection happened above.
          EVENT_NAME: workflow_dispatch
          EVENT_SCHEDULE: main-betting-edge
        run: node /tmp/betting-edge-odds-worker.js

      - name: Refresh official Pinnacle sharp benchmark
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          node --check tools/pinnacle-sharp-benchmark.mjs
          node --check tools/oddspapi-observer.mjs
          node tools/pinnacle-sharp-benchmark.mjs self-test
          node tools/oddspapi-observer.mjs
          node tools/pinnacle-sharp-benchmark.mjs validate-observer data/oddspapi-observer.json

      - name: Attach schedule provenance
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        env:
          OPERATING_DATE: ${{ steps.schedule.outputs.operating_date }}
          SCHEDULE_ID: ${{ steps.schedule.outputs.schedule_id }}
          SCHEDULE_LABEL: ${{ steps.schedule.outputs.schedule_label }}
          CANONICAL_SLOT: ${{ steps.schedule.outputs.canonical_slot }}
          SLOT_NAME: ${{ steps.schedule.outputs.slot_name }}
          PLANNED_PULSE: ${{ steps.schedule.outputs.planned_pulse_time }}
          PLANNED_REPORT: ${{ steps.schedule.outputs.planned_report_time }}
          FEATURED_VIG: ${{ steps.schedule.outputs.featured_vig_scope }}
          TRIGGER_SCHEDULED_AT: ${{ steps.schedule.outputs.request_scheduled_at || '' }}
          REQUEST_TRIGGER_SOURCE: ${{ steps.schedule.outputs.request_trigger_source || '' }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p='data/live-odds.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          const canonicalRaw=String(process.env.CANONICAL_SLOT||'').trim();
          const triggerSource=process.env.REQUEST_TRIGGER_SOURCE||'manual';
          j.scheduleMeta={
            schema:1,
            operatingDate:process.env.OPERATING_DATE||null,
            // Retain these established field names for report/history compatibility.
            profileId:process.env.SCHEDULE_ID||null,
            profileLabel:process.env.SCHEDULE_LABEL||null,
            canonicalSlot:canonicalRaw?Number(canonicalRaw):null,
            slot:process.env.SLOT_NAME||null,
            plannedPulseTime:process.env.PLANNED_PULSE||null,
            plannedReportTime:process.env.PLANNED_REPORT||null,
            featuredVigScope:String(process.env.FEATURED_VIG||'').toLowerCase()==='true',
            triggerSource,
            triggerScheduledAt:process.env.TRIGGER_SCHEDULED_AT||null
          };
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          JSON.parse(fs.readFileSync(p,'utf8'));
          console.log('Attached schedule provenance:',JSON.stringify(j.scheduleMeta));
          NODE

      - name: Publish snapshot
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.execute == 'true'
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"

          # Preserve the exact snapshots that already passed their worker stages.
          # A push collision must never cause another odds API pull.
          candidate="$(mktemp)"
          cp data/live-odds.json "$candidate"
          candidate_epoch="$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const t=Date.parse(d.generatedAt||""); if(!Number.isFinite(t)) process.exit(2); process.stdout.write(String(t));' "$candidate")"

          observer_candidate="$(mktemp)"
          have_observer=false
          if [ -f data/oddspapi-observer.json ]; then
            cp data/oddspapi-observer.json "$observer_candidate"
            have_observer=true
          fi

          for attempt in 1 2 3 4; do
            git fetch origin main
            remote_epoch="$(git show origin/main:data/live-odds.json 2>/dev/null | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{try{const j=JSON.parse(s); const t=Date.parse(j.generatedAt||""); process.stdout.write(Number.isFinite(t)?String(t):"0")}catch{process.stdout.write("0")}})')"
            if [ "${remote_epoch:-0}" -ge "$candidate_epoch" ]; then
              echo "Remote live odds are already equal/newer; no publish needed."
              exit 0
            fi
            git reset --hard origin/main
            cp "$candidate" data/live-odds.json
            if [ "$have_observer" = true ]; then
              cp "$observer_candidate" data/oddspapi-observer.json
            fi
            node tools/odds-slot-state.mjs record
            git add -- data/live-odds.json
            if [ -d data/odds-pull-receipts ]; then
              git add -- data/odds-pull-receipts
            fi
            if [ "$have_observer" = true ]; then
              git add -- data/oddspapi-observer.json
            fi
            if git diff --cached --quiet; then
              echo "No validated odds changes to publish."
              exit 0
            fi
            git commit -m "Refresh Betting Edge live odds"
            if git push origin HEAD:main; then
              echo "Validated Main Betting Edge odds snapshot published on attempt $attempt."
              exit 0
            fi
            echo "Publish collision on attempt $attempt; retrying the same validated snapshots."
          done
          echo "Validated odds snapshot could not be published after 4 attempts." >&2
          exit 1

      - name: Schedule summary
        if: always()
        env:
          TRIGGER_MODE: ${{ inputs.trigger_mode || '' }}
          REQUEST_TRIGGER_SOURCE: ${{ steps.schedule.outputs.request_trigger_source || '' }}
        run: |
          if [ -n "${REQUEST_TRIGGER_SOURCE}" ]; then
            trigger_source="${REQUEST_TRIGGER_SOURCE}"
          elif [ "${TRIGGER_MODE}" = "cloudflare_scheduled" ]; then
            trigger_source="retired-cloudflare-rejected"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            trigger_source="retired-github-cron-rejected"
          else
            trigger_source="manual"
          fi
          {
            echo "## Betting Edge odds scheduler"
            echo
            echo "- Trigger: \`${trigger_source}\`"
            echo "- Schedule: \`${{ steps.schedule.outputs.schedule_label }}\`"
            echo "- Operating day: \`${{ steps.schedule.outputs.operating_date }}\`"
            echo "- Canonical slot: \`${{ steps.schedule.outputs.canonical_slot }}\`"
            echo "- Planned pulse: \`${{ steps.schedule.outputs.planned_pulse_time }} PT\`"
            echo "- Planned report: \`${{ steps.schedule.outputs.planned_report_time }} PT\`"
            echo "- Featured Vig Scope: \`${{ steps.schedule.outputs.featured_vig_scope }}\`"
            echo "- Gate: \`${{ steps.gate.outputs.reason || 'not-due' }}\`"
            echo "- Crypto fight watch: exact-pair priority inside 30 hours"
            echo "- Pinnacle: official non-executable sharp benchmark via OddsPapi; 25-request reserve protected"
            echo "- Five-pull daily cap: unchanged"
            echo "- Automatic entry: scheduled report-task request; legacy scheduler dispatches rejected"
          } >> "$GITHUB_STEP_SUMMARY"
