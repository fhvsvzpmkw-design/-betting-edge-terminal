name: One-time 3:15 runner snapshot/reprice fix

on:
  push:
    paths:
      - '.github/workflows/one-time-315-runner-fix.yml'

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runner behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('runner.html')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              s = s.replace(old, new, 1)

          # 1) The three meters describe the issued report. A live comparison must not rewrite them.
          replace_once(
              "    const state=marketState(run);",
              "    const issuedMeterRun=run.comparison?(originalRun||withoutComparison(run)):run,state=marketState(issuedMeterRun);",
              'issued meter state'
          )
          replace_once(
              "    right.append(instrumentCluster(d,run),el(d,'div','runnerFresh',freshText));head.append(left,right);box.appendChild(head);",
              "    right.append(instrumentCluster(d,issuedMeterRun),el(d,'div','runnerFresh',freshText));head.append(left,right);box.appendChild(head);",
              'issued meter cluster'
          )

          # 2) Determine whether the report being viewed is the newest same-day session available.
          marker = "function selectSession(run,key){"
          if marker not in s:
              raise SystemExit('latest-report helper: selectSession marker not found')
          helper = """function isLatestSessionRun(run){
            const current=withoutComparison(run),day=localDateKey(current&&current.ts);
            const candidates=sessionRuns(current).filter(x=>!day||localDateKey(x&&x.ts)===day);
            candidates.push(current);
            candidates.sort((a,b)=>(Date.parse(b&&b.ts)||0)-(Date.parse(a&&a.ts)||0));
            const latest=candidates[0]||current;
            return String(current&&current.ts||'')===String(latest&&latest.ts||'')&&String(current&&current.slot||'')===String(latest&&latest.slot||'')
          }
          """
          s = s.replace(marker, helper + marker, 1)

          # 3) Historical snapshots cannot be repriced.
          replace_once(
              "async function refreshAndReprice(statusEl,button){\n  if(refreshBusy||!activeRun)return;",
              "async function refreshAndReprice(statusEl,button){\n  if(refreshBusy||!activeRun)return;\n  if(!isLatestSessionRun(activeRun)){\n    statusEl.textContent='HISTORICAL REPORT — issued snapshot is frozen. Open the newest same-day report to reprice.';\n    return\n  }",
              'historical reprice guard'
          )

          # 4) Reprice only against a snapshot that is actually newer than the report's issued odds.
          replace_once(
              "    const age=feedAgeMinutes(feed);\n    if(age>75){statusEl.textContent=`LIVE ODDS SNAPSHOT IS ${Math.round(age)} MIN OLD — REFRESH THE ODDS WORKFLOW BEFORE REPRICING.`;return}\n    const issued=originalRun||withoutComparison(activeRun);\n    let matched=0,improved=0,worsened=0,unresolved=0;",
              "    const age=feedAgeMinutes(feed);\n    if(age>75){statusEl.textContent=`LIVE ODDS SNAPSHOT IS ${Math.round(age)} MIN OLD — REFRESH THE ODDS WORKFLOW BEFORE REPRICING.`;return}\n    const issued=originalRun||withoutComparison(activeRun);\n    const issuedFeedTime=Date.parse(issued&&issued.feedGeneratedAt),newFeedTime=Date.parse(feed.generatedAt);\n    if(Number.isFinite(issuedFeedTime)&&Number.isFinite(newFeedTime)&&newFeedTime<=issuedFeedTime){\n      statusEl.textContent=`NO NEWER ODDS SNAPSHOT — latest published odds ${vancouverClock(feed.generatedAt)} are not newer than this report. Run or await a new odds pull first.`;\n      return\n    }\n    let matched=0,improved=0,worsened=0,unresolved=0;",
              'newer odds gate'
          )

          # 5) Reprice is a comparison action, not an odds-pull action. Remove the redundant clear button.
          old_controls = """    const refresh=el(d,'div','runnerRefresh'),actions=el(d,'div','runnerRefreshActions');
              const refreshBtn=el(d,'button','runnerRefreshBtn','↻ UPDATE ODDS / REPRICE NOW');
              const restoreBtn=el(d,'button','runnerRestoreBtn','CLEAR COMPARISON');restoreBtn.onclick=restoreOriginal;restoreBtn.disabled=!run.comparison;
              actions.append(refreshBtn,restoreBtn);
              const feedLabel=run.comparison?`Current prices checked ${vancouverClock(run.comparison.feedGeneratedAt)}. The issued report, grades, fair values, stakes, and reasoning are unchanged.`:'Checks the latest published Bet365/DraftKings snapshot as a comparison. The issued report remains unchanged.';
              const refreshStatus=el(d,'div','runnerRefreshStatus',feedLabel);
              refreshBtn.onclick=()=>refreshAndReprice(refreshStatus,refreshBtn);
              refresh.append(actions,refreshStatus);"""
          new_controls = """    const refresh=el(d,'div','runnerRefresh'),latestReport=isLatestSessionRun(run);
              let refreshStatus=null,refreshBtn=null;
              if(latestReport){
                const actions=el(d,'div','runnerRefreshActions');
                refreshBtn=el(d,'button','runnerRefreshBtn','↻ REPRICE NOW');
                actions.append(refreshBtn);
                const feedLabel=run.comparison?`Current prices checked ${vancouverClock(run.comparison.feedGeneratedAt)}. The issued report, grades, fair values, stakes, reasoning, and report meters are unchanged.`:'Checks the latest published Bet365/DraftKings snapshot as a comparison. This does not run an odds pull; the issued report remains unchanged.';
                refreshStatus=el(d,'div','runnerRefreshStatus',feedLabel);
                refreshBtn.onclick=()=>refreshAndReprice(refreshStatus,refreshBtn);
                refresh.append(actions,refreshStatus)
              }else{
                refreshStatus=el(d,'div','runnerRefreshStatus','HISTORICAL REPORT // ISSUED SNAPSHOT FROZEN // Reprice is available only on the newest same-day report.');
                refresh.appendChild(refreshStatus)
              }"""
          replace_once(old_controls, new_controls, 'reprice controls')

          s = s.replace("button.textContent='↻ UPDATE ODDS / REPRICE NOW'", "button.textContent='↻ REPRICE NOW'")

          checks = {
              'issued meter freeze': 'issuedMeterRun=run.comparison?' in s,
              'latest report guard': 'function isLatestSessionRun(run)' in s,
              'newer odds gate': 'NO NEWER ODDS SNAPSHOT' in s,
              'historical freeze message': 'HISTORICAL REPORT // ISSUED SNAPSHOT FROZEN' in s,
              'reprice label': '↻ REPRICE NOW' in s,
              'old combined label removed': 'UPDATE ODDS / REPRICE NOW' not in s,
              'clear comparison removed': 'CLEAR COMPARISON' not in s,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('post-patch checks failed: ' + ', '.join(failed))

          path.write_text(s)
          PY

      - name: Syntax-check runner JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('runner.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/runner.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/runner.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- runner.html; then
            echo 'No runner changes detected.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runner.html
          git commit -m 'Fix 15:15 runner snapshot and reprice behavior'
          git push
