name: Walters QB Performance Stage 5 historical readback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frozen-stage5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout accepted Stage 5 evidence commit
        uses: actions/checkout@v4
        with:
          ref: 774df41143140f9c5cdd7d0bb30519c886132f82
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read back frozen Stage 5 acceptance without rebuilding it
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const review=read('data/walters/nfl/qb-performance/stage5/production-review-v1.json');
          const readiness=read('data/walters/nfl/qb-performance/stage5/activation-readiness-v1.json');
          const regression=read('data/walters/nfl/qb-performance/stage5/regression-audit-v1.json');
          const acceptance=read('data/walters/nfl/qb-performance/stage5-acceptance-v1.json');
          const current=read('data/walters/nfl/qb-performance/stage5-current.json');
          if(current.status!=='STAGE5_PRODUCTION_REVIEW_VALIDATED_NON_OPERATIONAL_NFL_READBACK_PENDING')throw new Error('Stage 5 status mismatch');
          if(regression.passCount!==18||regression.failCount!==0)throw new Error('Stage 5 regression mismatch');
          if(acceptance.productionAuthority!==false||acceptance.activationAuthorized!==false)throw new Error('Historical Stage 5 boundary changed');
          if(readiness.activationAuthorized!==false||current.nflPathVerified!==false)throw new Error('Historical Stage 5 readiness changed');
          if(review.marketBoundary?.marketFieldsUsedByQbFormula!==false)throw new Error('Historical market boundary changed');
          console.log('WALTERS QB STAGE 5 HISTORICAL READBACK: PASS // 18/18 // NON-OPERATIONAL REVIEW PRESERVED');
          NODE
          git diff --exit-code
