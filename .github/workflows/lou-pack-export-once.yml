name: Lou pack export once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lou-pack-export-once.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify staged Lou Vega zip
        shell: bash
        run: |
          set -euo pipefail
          test -f lou-vega-hotline-asset-pack.zip
          unzip -t lou-vega-hotline-asset-pack.zip >/dev/null
      - name: Upload Lou pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: lou-vega-hotline-asset-pack
          path: lou-vega-hotline-asset-pack.zip
          if-no-files-found: error
          retention-days: 1
      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > lou-pack-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lou-pack-run-id.txt
          git commit -m "Publish Lou pack artifact run id"
          git pull --rebase origin main
          git push origin HEAD:main
