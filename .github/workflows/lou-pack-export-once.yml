name: Lou pack export once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lou-pack-export-once.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build downloadable chunks
        shell: bash
        run: |
          set -euo pipefail
          test -f lou-vega-hotline-asset-pack.zip
          rm -rf lou-pack-chunks
          mkdir lou-pack-chunks
          base64 -w 0 lou-vega-hotline-asset-pack.zip | split -b 6000 -d -a 2 - lou-pack-chunks/part-
          printf '%s\n' "$(wc -c < lou-vega-hotline-asset-pack.zip)" > lou-pack-chunks/ZIP-BYTES.txt
      - name: Commit download chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lou-pack-chunks
          git commit -m "Prepare Lou pack download chunks"
          git pull --rebase origin main
          git push origin HEAD:main
