name: Eddie V3 scale bankroll once

on:
  push:
    paths:
      - '.github/workflows/eddie-v3-scale-bankroll-once.yml'

permissions:
  contents: write

jobs:
  scale-bankroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scale displayed bankroll to the same $100 unit basis
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('syndicates/generated/eddie-numbers/hotline.html')
          s = p.read_text()

          replacements = [
            ('<small>Source Bankroll</small><b id="bank">—</b><div class="sub">actual public-ledger CAD // unscaled</div>', '<small>Bankroll <span class="scaledTag">SCALED</span></small><b id="bank">—</b><div class="sub">$100-unit equivalent</div>'),
            ('The source bankroll stays unscaled; every wager and performance dollar is normalized so the current 3% bankroll unit displays as $100, while ROI, counts and percentages remain unchanged.', 'The public ledger is normalized so the current 3% bankroll unit displays as $100. Bankroll, wagers and performance dollars all use the same scale, while ROI, counts and percentages remain unchanged.'),
            ('BANKROLL UNSCALED // PERFORMANCE DOLLARS NORMALIZED TO A $100 UNIT', 'BANKROLL + PERFORMANCE DOLLARS NORMALIZED TO A $100 UNIT'),
            ('Source bankroll remains unscaled. Every displayed wager/performance dollar is normalized by 100 ÷ (current bankroll × 3%), making the current 3% unit equal $100.', 'The source ledger remains untouched. Displayed bankroll, wager and performance dollars are normalized by 100 ÷ (current bankroll × 3%), making the current 3% unit equal $100.'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old[:100]}')
              s = s.replace(old, new, 1)

          old = "set('bank',money(bankroll));set('profit',sm(scaledProfit));"
          new = "let scaledBankroll=bankroll*scale;set('bank',money(scaledBankroll));set('profit',sm(scaledProfit));"
          if old not in s:
              raise SystemExit('Missing bankroll render statement')
          s = s.replace(old, new, 1)

          old = "set('walk',`Source bankroll ${money(bankroll)} remains unscaled. Current 3% source unit ${money(rawUnit)} is normalized to $100 at ×${scale.toFixed(4)}. Normalized cash P/L ${sm(scaledProfit)} at ${pct(j.summary?.cashRoiPercent)} ROI. Public-row week ${sm(Wk.p)}; public-row month ${sm(Mo.p)}.`)"
          new = "set('walk',`Source bankroll ${money(bankroll)} produces a ${money(rawUnit)} 3% unit. At ×${scale.toFixed(4)}, the displayed bankroll is ${money(scaledBankroll)} and the active unit is $100. Normalized cash P/L ${sm(scaledProfit)} at ${pct(j.summary?.cashRoiPercent)} ROI. Public-row week ${sm(Wk.p)}; public-row month ${sm(Mo.p)}.`)"
          if old not in s:
              raise SystemExit('Missing walk text')
          s = s.replace(old, new, 1)

          p.write_text(s)

          prof_path = Path('data/characters/eddie-numbers.json')
          prof = json.loads(prof_path.read_text())
          prof['updatedAt'] = '2026-08-23T20:14:00-07:00'
          ps = prof['authority'].setdefault('presentationScale', {})
          ps['bankrollUnscaled'] = False
          ps['appliesTo'] = 'displayed bankroll plus all displayed wager/performance dollar amounts; source ledger values remain untouched; counts, ROI and percentage ratios are unchanged'
          prof['hotlineStyle']['ledgerRules']['moneyRule'] = 'Do not modify source ledger values. For displayed bankroll and every displayed wager/performance dollar amount, multiply the public-ledger source value by 100 / (bankrollCad × 0.03). Recalculate automatically whenever the public bankroll changes. ROI, counts and percentage ratios remain unchanged.'
          prof['guardrails']['bankrollUnscaled'] = False
          prof['guardrails']['scaledBankrollPresentation'] = 'Displayed bankroll is scaled by the same current-bankroll multiplier as performance dollars so the public 3% unit equals $100; source bankroll in the underlying public ledger remains unchanged.'
          prof_path.write_text(json.dumps(prof, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Verify scaled bankroll presentation
        run: |
          grep -F 'Bankroll <span class="scaledTag">SCALED</span>' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'scaledBankroll=bankroll*scale' syndicates/generated/eddie-numbers/hotline.html
          grep -F '$100-unit equivalent' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'scaledBankrollPresentation' data/characters/eddie-numbers.json
      - name: Commit scaled bankroll
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syndicates/generated/eddie-numbers/hotline.html data/characters/eddie-numbers.json
          git diff --cached --quiet && exit 0
          git commit -m "Scale Eddie bankroll to $100 unit basis"
          git push
