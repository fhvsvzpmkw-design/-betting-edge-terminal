              else:
                out.append(f'''<article class="pick{cls}"><div class="pickhead"><b>{i:02d} // {esc(r['title']).upper()}</b><span>{esc(r['status'])}</span></div><p><strong>{esc(r['book'])}</strong> {esc(r['price'])} // FAIR {esc(r['fair'])} // PLAY TO {esc(r['playTo'])}</p><p>{esc(r['analysis'])} {esc(r['contrary'])}</p></article>''')
            return ''.join(out)
          common_mobile='@media(max-width:700px){main{padding:7px}.grid,.prices{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}'
          jesse=f'''<!doctype html><html lang="en" data-hotline-shell="death-angel-dispatch" data-shell-version="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jesse Bains — Death Angel Dispatch — 09:30 Aug 26</title><style>:root{{--bg:#05070a;--panel:#0b1016;--line:#35404b;--red:#d33131;--text:#d6dbe0;--muted:#7d8993}}*{{box-sizing:border-box}}html,body{{margin:0;background:var(--bg);color:var(--text)}}body{{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:radial-gradient(circle at 50% 0,#251010,#05070a 45%)}}main{{max-width:1050px;margin:auto;padding:14px}}.sheet{{border:1px solid #4d2525;background:#080c11;box-shadow:0 20px 60px #000}}.hero{{display:grid;grid-template-columns:1fr auto;gap:14px;padding:18px;border-bottom:3px double #7b2929}}h1{{margin:0;color:var(--red);font:900 34px Georgia,serif;letter-spacing:.06em}}.sub{{color:var(--muted)}}.stamp{{border:2px solid var(--red);padding:8px;transform:rotate(-2deg);font-weight:900}}.dispatch{{padding:13px;background:#170b0b;border-bottom:1px solid #542929}}.rule{{margin:14px 14px 7px;color:#df6666;font-weight:900;letter-spacing:.12em}}.file{{margin:0 14px 9px;padding:11px;border:1px solid var(--line);background:var(--panel)}}.file.live{{border:2px solid #a74242;background:#1a1010}}.filetop{{display:flex;justify-content:space-between;gap:10px;font-weight:900}}.filetop span{{color:#e26c6c}}.facts{{margin-top:7px;color:#b8c2c9}}.desk{{margin:14px;padding:13px;border:2px solid #6d2d2d;background:#160d0d}}.foot{{padding:12px 14px;color:var(--muted);font-size:9px}}{common_mobile}</style></head><body><main><article class="sheet"><header class="hero"><div><div class="sub">DEATH ANGEL // BACKROOM DISPATCH</div><h1>JESSE BAINS</h1><p>Fresh 09:23 board. Nine files came through the door. One stays open. Eight get stamped and put away.</p></div><div class="stamp">09:30 FINAL MORNING<br>AUG 26 2026<br>0 BET · 1 LEAN · 8 PASS</div></header><section class="dispatch"><b>FRONT DESK NOTE:</b> Boston improved to Bet365 -132, but DraftKings has no exact current moneyline and lineups are unposted. That is a live file, not a ticket. New risk remains $0.</section><h2 class="rule">INCOMING FILES // ALL NINE</h2>{cards('death')}<section class="desk"><b>BAINS // BACKROOM READ</b><p>Boston is the only folder I leave on top. The number improved, but the second window is dark and the lineup sheet is blank. Washington has an unresolved starter. Detroit, Cleveland and Philadelphia are priced past their buying limits. The total has no cushion. The two player props and the cup draw carry too much model or market uncertainty. Nobody gets promoted because the room is quiet.</p><b>DISPOSITION: 0 BET · 1 LEAN · 0 WAIT · 8 PASS · $0 NEW RISK.</b></section><footer class="foot">Authority: Betting Edge 09:30 FINAL MORNING // {esc(ts)} // feed {feed}. Fictional dispatch presentation only; issued Betting Edge status, price, fair, play-to and risk remain authoritative.</footer></article></main></body></html>'''
          alex=f'''<!doctype html><html lang="en" data-hotline-shell="crown-and-lance" data-shell-version="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alex Daventry — Crown & Lance — 09:30 Aug 26</title><style>:root{{--bg:#07120d;--panel:#0d2117;--gold:#d7b968;--cream:#f1ead4;--line:#5e674f;--muted:#a6ad96}}*{{box-sizing:border-box}}html,body{{margin:0;background:var(--bg);color:var(--cream)}}body{{font:13px/1.5 Georgia,serif;background:linear-gradient(135deg,#07120d,#14251b 55%,#0a120d)}}main{{max-width:1100px;margin:auto;padding:14px}}.paper{{border:4px double var(--gold);background:#0b1912;box-shadow:0 22px 60px #000}}.hero{{display:grid;grid-template-columns:1fr auto;gap:16px;padding:20px;border-bottom:1px solid var(--gold)}}h1{{margin:0;color:var(--gold);font-size:38px}}.kicker{{font:900 9px ui-monospace,monospace;letter-spacing:.15em;color:var(--muted)}}.issue{{border:1px solid var(--gold);padding:10px;font:10px ui-monospace,monospace}}.brief{{padding:14px 18px;background:#101f17;border-bottom:1px solid #56604a}}.section{{margin:15px 18px 7px;color:var(--gold);letter-spacing:.08em}}.market{{margin:0 18px 10px;padding:12px;border:1px solid var(--line);background:var(--panel)}}.market.live{{border:2px solid var(--gold)}}.mh{{display:flex;justify-content:space-between;gap:10px;font-weight:900}}.mh span{{color:var(--gold)}}.prices{{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}}.prices div{{border:1px solid #455344;padding:7px;background:#09140e}}small{{display:block;color:var(--muted);font:8px ui-monospace,monospace}}strong{{color:#f5e5a9}}.column{{margin:14px 18px;padding:14px;border-top:3px double var(--gold);border-bottom:3px double var(--gold);background:#101c15}}.foot{{padding:12px 18px;color:var(--muted);font:9px ui-monospace,monospace}}{common_mobile}</style></head><body><main><article class="paper"><header class="hero"><div><div class="kicker">CROWN & LANCE // THE NUMBERS COLUMN</div><h1>ALEX DAVENTRY</h1><p>A morning board with one genuine disagreement and eight reasons not to confuse activity with opportunity.</p></div><aside class="issue"><b>09:30 FINAL MORNING</b><br>AUG 26 2026<br>FEED {feed}<br>0 BET · 1 LEAN · 0 WAIT · 8 PASS · $0</aside></header><section class="brief"><b>THE MORNING LINE:</b> Boston's Bet365 moneyline improves from -141 to -132 and remains inside the published -145-or-better threshold, but single-book execution and unposted lineups prevent a BET. Every other file remains below the required standard.</section><h2 class="section">MARKET BOARD // NINE FILES</h2>{cards('alex')}<section class="column"><h2>DAVENTRY'S COLUMN</h2><p>The temptation is to call Boston a bet because the price moved in our favour. That skips the important part. The price is attractive relative to the -158 matchup fair, but the executable market is incomplete: DraftKings has no exact current quote and the starting lineups are not posted. A LEAN is therefore the correct label. Washington's uncertainty is structural, Detroit and Cleveland are simply too expensive, Philadelphia lacks margin, the Cubs–Arizona total needs a better plus price, and the long-tail props and cup draw do not deserve confidence merely because their prices look dramatic.</p><p><b>Column verdict:</b> keep Boston under review; manufacture nothing else. New risk: $0.</p></section><footer class="foot">Authority: Betting Edge 09:30 FINAL MORNING // {esc(ts)}. Crown & Lance is presentation and interpretation only; it does not alter issued recommendation authority.</footer></article></main></body></html>'''
          larry=f'''<!doctype html><html lang="en" data-hotline-shell="lock-line-geocities" data-shell-version="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Larry Lombardo's Lock Line — 09:30 Aug 26</title><style>:root{{--bg:#000033;--cyan:#00ffff;--pink:#ff39d4;--yellow:#ffff00;--lime:#39ff14;--white:#fff}}*{{box-sizing:border-box}}html,body{{margin:0;background:var(--bg);color:var(--white)}}body{{font:14px/1.45 'Comic Sans MS','Trebuchet MS',sans-serif;background-image:radial-gradient(#222266 1px,transparent 1px);background-size:18px 18px}}main{{max-width:1000px;margin:auto;padding:10px}}.page{{border:5px ridge #c0c0c0;background:#000044}}.top{{text-align:center;padding:14px;border-bottom:5px ridge #c0c0c0}}h1{{margin:2px;color:var(--yellow);text-shadow:2px 2px var(--pink);font-size:38px}}.blink{{color:var(--lime);font-weight:900}}.counter{{display:inline-block;margin:8px;padding:5px 10px;background:#000;color:#0f0;border:2px inset #aaa;font-family:monospace}}.marq{{padding:8px;background:#660066;color:#fff;font-weight:900;text-align:center}}.pick{{margin:10px;padding:11px;border:3px outset #c0c0c0;background:#00105c}}.pick.live{{border-color:var(--yellow);background:#33104f}}.pickhead{{display:flex;justify-content:space-between;gap:10px;color:var(--cyan);font-weight:900}}.pickhead span{{color:var(--yellow)}}.larrybox{{margin:12px;padding:13px;border:5px double var(--pink);background:#220044}}.links{{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px}}.links div{{padding:10px;text-align:center;border:3px outset #aaa;background:#003366;color:var(--yellow)}}.foot{{padding:12px;text-align:center;color:#aaa;font-size:10px}}{common_mobile}</style></head><body><main><article class="page"><header class="top"><div class="blink">★ ★ ★ WELCOME TO LARRY'S WORLD WIDE WEB LOCK LINE ★ ★ ★</div><h1>LARRY LOMBARDO</h1><div><b>THE LOUNGE LIZARD'S 09:30 MORNING BOARD</b></div><div class="counter">VISITOR # 0000930</div><p>Updated Aug 26, 2026 // Feed {feed} // Best viewed with a free coffee and absolutely no expectation that every number is a winner.</p></header><div class="marq">HOT!!! BOSTON -132 IS THE ONLY LEAN // NOT A BET // EIGHT PASSES // $0 NEW RISK</div>{cards('larry')}<section class="larrybox"><h2>★ LARRY'S HOTLINE MESSAGE ★</h2><p>Kid, I got one number worth keeping on the cocktail napkin: Boston -132 at Bet365. The matchup fair says -158 and the target says -145 or better, which sounds like the kind of thing a man in a burgundy sport coat could brag about. Unfortunately, DraftKings doesn't have the exact current moneyline and the lineups aren't posted. So Larry does the hardest thing in show business: he does not oversell it. LEAN only.</p><p>The other eight? File 'em. Washington wants -125 when the buy line says -115. Detroit, Cleveland and Philadelphia are all charging cover at the door. The total needs +110 and we're not there. Sogard, Miller and that Venezuela cup draw have the kind of giant-looking numbers that used to pay for my motel upgrades, but the uncertainty is bigger than the neon.</p><p><b>OFFICIAL LOUNGE COUNT:</b> 0 BET · 1 LEAN · 0 WAIT · 8 PASS · $0 NEW RISK.</p></section><section class="links"><div>UNDER CONSTRUCTION FOREVER</div><div>FREE CASINO WALLPAPER*</div><div>EMAIL LARRY<br>(PLEASE DON'T)</div></section><footer class="foot">*There is no wallpaper. Authority: Betting Edge 09:30 FINAL MORNING // {esc(ts)}. Larry's jokes are fictional presentation; issued prices, statuses, fair values, play-to thresholds and risk are preserved.</footer></article></main></body></html>'''
          files={'syndicates/death-angel/hotline.html':jesse,'syndicates/crown-and-lance/hotline.html':alex,'syndicates/lock-line/hotline.html':larry}
          for p,t in files.items(): (root/p).write_text(t)
          # advance continuity before archive helper
          updates={
            'jesse-bains':('data/characters/jesse-bains.json','Nine fresh 09:30 files: Boston is the lone LEAN at