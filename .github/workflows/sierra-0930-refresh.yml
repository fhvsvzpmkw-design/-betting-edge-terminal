name: Refresh Sierra 09:30 Hotlines
on:
  push:
    paths:
      - '.github/workflows/sierra-0930-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Jesse Alex Larry 09:30 hotlines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, html
          root=pathlib.Path('.')
          report=json.loads((root/'data/history/runs/2026-08-26/final_morning-094246.json').read_text())
          recs=report['recs']
          def e(v): return html.escape(str(v), quote=True)
          def rows(style):
            parts=[]
            for i,r in enumerate(recs,1):
              status=e(r['status']); title=e(r['title']); book=e(r['book']); price=e(r['price']); fair=e(r['fair']); play=e(r['playTo'])
              analysis=e(r.get('analysis','')); extra=e(r.get('contrary') or r.get('support') or '')
              parts.append(f'<article class="card {status.lower()}"><header><b>{i:02d} // {title}</b><span>{status}</span></header><div class="line">{book} {price} · FAIR {fair} · PLAY TO {play}</div><p>{analysis} {extra}</p></article>')
            return ''.join(parts)
          base_css='*{box-sizing:border-box}body{margin:0;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1050px;margin:auto}.hero{padding:18px;border:2px solid currentColor;margin-bottom:12px}.hero h1{margin:0 0 6px}.stamp{font-weight:900}.card{padding:11px;margin:8px 0;border:1px solid currentColor}.card header{display:flex;justify-content:space-between;gap:10px}.line{margin:6px 0;font-weight:700}.lean{border-width:3px}.close{padding:14px;margin-top:12px;border:2px solid currentColor}@media(max-width:700px){body{padding:7px}.card header{display:block}.card header span{display:block;margin-top:4px}}'
          jesse=f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jesse Bains — Death Angel — 09:30</title><style>{base_css}body{{background:#05070a;color:#d7dde2}}.hero,.close{{background:#160c0c;color:#e16b6b}}.card{{background:#0b1016;border-color:#48515a}}.lean{{background:#211010;border-color:#d33131}}h1{{font-family:Georgia,serif;color:#e04444}}</style></head><body><main><section class="hero"><div>DEATH ANGEL // BACKROOM DISPATCH</div><h1>JESSE BAINS</h1><div class="stamp">09:30 FINAL MORNING · AUG 26 2026 · 0 BET · 1 LEAN · 8 PASS · $0 NEW RISK</div><p>Nine files came through. Boston -132 is the only live folder; second-book confirmation and lineups are still missing.</p></section>{rows('jesse')}<section class="close"><b>BAINS // DISPOSITION</b><p>Boston stays on top as a LEAN only. Washington carries starter uncertainty. Detroit, Cleveland and Philadelphia are beyond their buy limits. The total lacks cushion. The two props and cup draw carry too much uncertainty to manufacture action.</p><b>0 BET · 1 LEAN · 0 WAIT · 8 PASS · $0.</b></section></main></body></html>'''
          alex=f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alex Daventry — Crown & Lance — 09:30</title><style>{base_css}body{{background:#07120d;color:#f1ead4;font-family:Georgia,serif}}.hero,.close{{background:#101f17;color:#d7b968}}.card{{background:#0d2117;border-color:#5e674f}}.lean{{border-color:#d7b968}}h1{{color:#d7b968}}</style></head><body><main><section class="hero"><div>CROWN & LANCE // THE NUMBERS COLUMN</div><h1>ALEX DAVENTRY</h1><div class="stamp">09:30 FINAL MORNING · AUG 26 2026 · 0 BET · 1 LEAN · 8 PASS · $0 NEW RISK</div><p>Boston improves to -132 and remains inside the published threshold, but incomplete executable confirmation keeps it below BET status.</p></section>{rows('alex')}<section class="close"><h2>DAVENTRY'S COLUMN</h2><p>The price move on Boston is real value, but price alone is not enough. DraftKings lacks an exact current quote and the starting lineups are unposted. The remaining eight files fail on price, uncertainty, or insufficient margin. The correct morning posture is selective inactivity.</p><b>Column verdict: Boston under review; manufacture nothing else.</b></section></main></body></html>'''
          larry=f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Larry Lombardo's Lock Line — 09:30</title><style>{base_css}body{{background:#000033;color:#fff;font-family:'Comic Sans MS','Trebuchet MS',sans-serif;background-image:radial-gradient(#222266 1px,transparent 1px);background-size:18px 18px}}.hero{{background:#000044;color:#ffff00;border:5px ridge #c0c0c0;text-align:center}}.hero h1{{color:#ffff00;text-shadow:2px 2px #ff39d4;font-size:36px}}.card{{background:#00105c;border:3px outset #c0c0c0}}.lean{{background:#33104f;border-color:#ffff00}}.card header{{color:#00ffff}}.card header span{{color:#ffff00}}.close{{background:#220044;border:5px double #ff39d4;color:#fff}}</style></head><body><main><section class="hero"><div>★ ★ ★ LARRY'S WORLD WIDE WEB LOCK LINE ★ ★ ★</div><h1>LARRY LOMBARDO</h1><div class="stamp">09:30 MORNING BOARD · AUG 26 2026 · 0 BET · 1 LEAN · 8 PASS · $0</div><p>HOT!!! BOSTON -132 IS THE ONLY LEAN // NOT A BET // EIGHT PASSES</p></section>{rows('larry')}<section class="close"><h2>★ LARRY'S HOTLINE MESSAGE ★</h2><p>Kid, Boston -132 is the one number worth keeping on the cocktail napkin. The matchup fair says -158 and the target says -145 or better, but the second book and lineups aren't there yet. So even Larry doesn't oversell it: LEAN only.</p><p>The other eight get filed. Some are too expensive, some are too uncertain, and some just don't have enough edge to pay the cover charge.</p><b>OFFICIAL LOUNGE COUNT: 0 BET · 1 LEAN · 0 WAIT · 8 PASS · $0 NEW RISK.</b></section></main></body></html>'''
          out={
            'syndicates/death-angel/hotline.html':jesse,
            'syndicates/crown-and-lance/hotline.html':alex,
            'syndicates/lock-line/hotline.html':larry,
          }
          for path,text in out.items(): (root/path).write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add syndicates/death-angel/hotline.html syndicates/crown-and-lance/hotline.html syndicates/lock-line/hotline.html
          git commit -m 'Publish Sierra 09:30 hotlines'
          git push
