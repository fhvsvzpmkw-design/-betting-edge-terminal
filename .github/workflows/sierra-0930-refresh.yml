name: Restore Sierra 09:30 Hotlines
on:
  push:
    paths:
      - '.github/workflows/sierra-0930-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore approved shells and apply 09:30 edition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, html
          root=pathlib.Path('.')
          report=json.loads((root/'data/history/runs/2026-08-26/final_morning-094246.json').read_text())
          recs=report['recs']; ts=report['ts']
          def e(v): return html.escape(str(v), quote=True)
          def sub(pattern,repl,text):
              out,n=re.subn(pattern,repl,text,flags=re.S)
              if n!=1: raise SystemExit(f'replacement count {n} for {pattern[:45]}')
              return out
          # JESSE — preserve Delphoria Counter Sheet v2 exactly; refresh edition zones only.
          p=root/'syndicates/death-angel/archive/2026-08-24/1815.html'; j=p.read_text()
          j=sub(r'<title>.*?</title>','<title>Sports Desk // Hotel Delphoria — 09:30 Final Morning — Aug 26</title>',j)
          j=sub(r'<div class="topline">.*?</div>','<div class="topline"><span class="other">LYTTON\'S OTHER PAPER</span><span>COUNTER SHEET // WED AUG 26 2026</span></div>',j)
          jcards=[]
          for r in recs:
              cls=' wait' if r['status']=='WAIT' else ''
              status_cls=' wait' if r['status']=='WAIT' else ''
              jcards.append(f'''<article class="card{cls}"><span class="status{status_cls}">{e(r['status'])}</span><div class="team">{e(r['title']).upper()}</div><div class="facts"><div class="fact"><small>Book</small><b>{e(r['book'])}</b></div><div class="fact"><small>Price</small><b>{e(r['price'])}</b></div><div class="fact"><small>Fair</small><b>{e(r['fair'])}</b></div><div class="fact"><small>Play To</small><b>{e(r['playTo'])}</b></div><div class="fact"><small>Status</small><b>{e(r['status'])}</b></div></div><div class="jesse">JESSE SAYS: {e('“Keep the file open.”' if r['status']=='LEAN' else '“File it.”')}</div><div class="phone"><b>PHONE SLIP:</b> {e(r.get('analysis',''))} {e(r.get('contrary') or '')}</div></article>''')
          j=sub(r'<div class="issue" data-zone="issue-meta">.*?</div>','<div class="issue" data-zone="issue-meta"><span class="stamp">09:30 FINAL MORNING</span><span class="stamp">FEED 09:23 PT</span><span class="stamp">ISSUED 09:42 PT</span><span class="stamp">0 BET / 1 LEAN / 0 WAIT / 8 PASS / $0</span></div>',j)
          j=sub(r'<section class="story" data-zone="story">.*?</section>','''<section class="story" data-zone="story"><h2>One Slip Goes Upstairs</h2><p>By 09:30 the Delphoria counter had nine fresh files. Eight were already headed for the cabinet. One stayed on top: Boston Red Sox moneyline at Bet365 −132.</p><p>The number had improved from the earlier sheet and sat inside the published −145-or-better gate. But the second executable book was still incomplete and the starting lineups were not posted.</p><div class="slip"><b>RUNNER:</b> “Better number.”<br><b>JESSE:</b> “Complete market?”<br><b>RUNNER:</b> “No.”<br><b>JESSE:</b> “Then it stays a lean.”</div><p>Washington still carried starter uncertainty. Detroit, Cleveland and Philadelphia were priced beyond their buying limits. The Cubs–Arizona total lacked the required cushion. The two player props and the Zamora–Real Frontera draw carried enough uncertainty to remain PASS.</p><div class="slip"><b>JESSE:</b> “One live file. No action.”</div></section>''',j)
          j=sub(r'<section class="board" data-zone="recommendations">.*?</section>','<section class="board" data-zone="recommendations"><h2>House Board</h2>'+''.join(jcards)+'</section>',j)
          j=sub(r'<section class="house" data-zone="house-note">.*?</section>','''<section class="house" data-zone="house-note"><div class="house-grid"><img class="prop-img" src="../../assets/syndicates/delphoria-house-badge.png?v=2" alt="Hotel Delphoria house badge"><div><h2>Delphoria House Note</h2><p>The house rule survives another morning: an attractive number is not enough when the executable market and personnel picture are incomplete. Boston stays visible without becoming a ticket.</p></div></div></section>''',j)
          j=sub(r'<section class="back" data-zone="back-room">.*?</section>','''<section class="back" data-zone="back-room"><div class="back-grid"><img class="prop-img" src="../../assets/syndicates/delphoria-phone-badge.png?v=2" alt="Hotel Delphoria phone slip"><div><h2>Back Room</h2><p>Nine files reviewed. Boston remains the only callback: Bet365 −132, inside the price gate, but no exact current DraftKings moneyline and no posted starting lineups. Eight other files are closed as PASS.</p><div class="jesse">“Call when the sheet is complete.”</div></div></div></section>''',j)
          j=sub(r'<section class="last" data-zone="last-word">.*?</section>','<section class="last" data-zone="last-word"><h2>Last Word</h2><p>One LEAN. Eight PASS. Zero BET. Zero WAIT. Zero new risk. The Sports Desk stays open; the betting drawer stays shut.</p></section>',j)
          j=sub(r'<div class="footer" data-zone="footer">.*?</div>',f'<div class="footer" data-zone="footer">Betting Edge 09:30 FINAL MORNING, issued {e(ts)}, is the betting authority. Delphoria narrative and Jesse\'s reactions are fictional presentation only and do not alter issued status, price, buying condition or risk. HOTLINE SHELL: DELPHORIA COUNTER SHEET v2 // EDITABLE.</div>',j)
          (root/'syndicates/death-angel/hotline.html').write_text(j)
          # ALEX — preserve Crown & Lance v1, including logo, hero and character art.
          p=root/'syndicates/crown-and-lance/archive/2026-08-24/1815.html'; a=p.read_text()
          a=sub(r'<title>.*?</title>','<title>The Crown & Lance — Alex Daventry — 09:30 Final Morning — Aug 26</title>',a)
          a=sub(r'<div class="meta" data-zone="issue-meta">.*?</div></div>','<div class="meta" data-zone="issue-meta"><div><small>ISSUE</small><b>09:30 FINAL MORNING // AUG 26 2026</b></div><div><small>FEED / ISSUED</small><b>09:23 PT / 09:42 PT</b></div><div><small>VIGSCOPE BOARD</small><b>0 BET · 1 LEAN · 0 WAIT · 8 PASS · $0</b></div></div></div>',a)
          a=sub(r'<h3 class="section-title">The House Is Full</h3>.*?<div class="arena">.*?</div>','''<h3 class="section-title">The House Is Full</h3><div class="opening-grid"><div class="alex-card"><img src="../../assets/syndicates/alex-daventry.png?v=2" alt="Alex Daventry in his Crown and Lance casino-show costume"></div><section class="story" data-zone="opening"><p><b>Morning performance, same house rules.</b> Alex opens the 09:30 sheet between rehearsals and finds nine files, one of which deserves a second look.</p><p>Boston Red Sox moneyline has improved to Bet365 −132. The number is inside the published −145-or-better gate. But DraftKings does not supply an exact current moneyline and the lineups remain unposted. The edge is interesting; the execution is incomplete.</p></section></div><div class="arena">WEDNESDAY MORNING AT THE CROWN &amp; LANCE · ONE NUMBER IN THE RING · EIGHT SENT BACK THROUGH THE SERVICE GATE</div>''',a)
          a=sub(r'<h3 class="section-title">Chicken &amp; Second Pour</h3>.*?<h3 class="section-title">Between Bouts</h3>','''<h3 class="section-title">Chicken &amp; Second Pour</h3><div class="meal" data-zone="story"><section class="story"><p>The kitchen is prepping the first service while Alex works through the rest of the board. Washington still has unresolved starter uncertainty. Detroit, Cleveland and Philadelphia ask prices beyond their buy limits. The Cubs–Arizona under does not offer the required plus-money cushion.</p><div class="pullquote">“A good show is not improved by adding scenes that do not belong.”</div><p>The remaining player props and the Zamora–Real Frontera draw stay off the program as well. Large-looking prices do not compensate for model, market or personnel uncertainty.</p></section><aside class="menu-card"><div class="course">CROWN &amp; LANCE HOUSE SERVICE</div><h4>MORNING BOARD</h4><p>One LEAN · Eight PASS</p><p><b>Zero BET · $0 new risk</b></p><hr><p style="font-size:12px">Alex's rule: keep only what the next scene requires.</p></aside></div><h3 class="section-title">Between Bouts</h3>''',a)
          a=sub(r'<section class="story" data-zone="between-bouts">.*?</section>','''<section class="story" data-zone="between-bouts"><p>Alex folds the sheet around the Boston file. Price: Bet365 −132. Matchup fair: −158. Published play-to: −145 or better.</p><p>That is enough to keep the number visible, not enough to promote it. The exact DraftKings moneyline is unavailable and starting lineups are not posted.</p><div class="pullquote">“Inside the gate is not the same as through the gate.”</div><p>The correct 09:30 posture is one LEAN, eight PASS, and no manufactured action.</p></section>''',a)
          arows=[]
          for r in recs:
              sc='wait' if r['status'] in ('WAIT','LEAN') else 'pass'
              arows.append(f'<div class="wire-row"><span class="wire-status {sc}">{e(r["status"])}</span><span class="wire-name">{e(r["title"])}</span><span class="wire-price">{e(r["book"])} {e(r["price"])}</span><span class="wire-gate">Fair {e(r["fair"])} · play to {e(r["playTo"])}</span></div>')
          a=sub(r'<p class="wire-intro">.*?</div>\n<h3 class="section-title">Final Fanfare</h3>','<p class="wire-intro"><b>ALEX\'S VIGSCOPE SHEET // 09:30 REVIEW</b> — compact because Betting Edge already did the analysis.</p><div class="wire" data-zone="recommendations"><div class="wire-head"><span>STATUS</span><span>SELECTION</span><span>ISSUED</span><span>GATE</span></div>'+''.join(arows)+'</div><h3 class="section-title">Final Fanfare</h3>',a)
          a=sub(r'<h3 class="section-title">Final Fanfare</h3><section class="story">.*?</section>','''<h3 class="section-title">Final Fanfare</h3><section class="story"><p>The herald calls rehearsal back to order. Alex returns the sheet to his coat with Boston still marked for review and nothing else promoted.</p><p>Prepared does not mean played. A quiet board is allowed to remain quiet.</p></section>''',a)
          a=sub(r'<div class="fanfare">.*?</div>','<div class="fanfare">MORNING HOUSE RESULT: 1 LEAN · 8 PASS · 0 BET · 0 WAIT · $0 NEW RISK. THE SHOW CONTINUES.</div>',a)
          a=sub(r'<div class="foot">.*?</div>',f'<div class="foot">Betting Edge 09:30 FINAL MORNING, issued {e(ts)}, is authoritative. Crown &amp; Lance story and Alex\'s reactions are presentation only; issued status, prices, gates and risk remain unchanged. HOTLINE SHELL: CROWN &amp; LANCE v1.</div>',a)
          (root/'syndicates/crown-and-lance/hotline.html').write_text(a)
          # LARRY — preserve Lizard Line v2 and every approved image module.
          p=root/'syndicates/lock-line/archive/2026-08-24/1815.html'; l=p.read_text()
          l=sub(r'<title>.*?</title>','<title>The Lizard Line!!! — 09:30 Final Morning — Aug 26</title>',l)
          l=sub(r'<div class="marquee">.*?</div>','<div class="marquee">*** 09:30 FINAL MORNING *** ONE LEAN *** EIGHT REJECTIONS *** ZERO ACTUAL DATES *** CAB FARE: STILL ALIVE ***</div>',l)
          l=sub(r'<div class="sub" data-zone="opening">.*?</div>','<div class="sub" data-zone="opening">Larry got nine slips with his morning coffee. Eight said no. Boston at −132 said maybe. Larry immediately called this “momentum.” The waitress called it one LEAN and eight PASS.</div>',l)
          l=sub(r'<div class="status" data-zone="issue-meta">.*?</div>','<div class="status" data-zone="issue-meta"><span class="pill">FEED 09:23 PT</span><span class="pill">ISSUED 09:42 PT</span><span class="pill">1 LEAN</span><span class="pill">8 PASS</span><span class="pill">0 BET</span><span class="pill">0 WAIT</span><span class="pill">$0 RISK</span></div>',l)
          l=sub(r'<div class="hero-cap">.*?</div>','<div class="hero-cap">LOST WAGES MORNING // ONE MAYBE // EIGHT NOS // ONE MAN SOMEHOW CALLING THIS A STREAK</div>',l)
          l=sub(r'<section class="box"><h2>Larry\'s Opening Come-On</h2>.*?</section>','''<section class="box"><h2>Larry's Opening Come-On</h2><div class="opening-grid"><div><div class="opening">Boston Red Sox moneyline improved to Bet365 −132. The published gate is −145 or better and the matchup fair is −158. Larry saw all three minus signs and declared the relationship “serious.”</div><div class="narrator"><b>NARRATOR CORRECTION:</b> DraftKings does not have an exact current moneyline and starting lineups are not posted. Boston remains LEAN, not BET.</div></div><div class="badge-panel"><img src="../../assets/syndicates/lizard-line-lost-wages-badge.png?v=2" alt="Lost Wages neon Lizard Line badge"></div></div></section>''',l)
          lcards=[]
          for r in recs:
              cls=' wait' if r['status'] in ('WAIT','LEAN') else ''
              punch='Keep the number. Lose the confidence.' if r['status']=='LEAN' else 'Next number.'
              lcards.append(f'''<article class="card{cls}"><b>{e(r['title']).upper()} // {e(r['status'])}</b><p>{e(r['book'])} {e(r['price'])} · fair {e(r['fair'])} · play to {e(r['playTo'])}.</p><div class="larry">LARRY: “{e(punch)}”<br>PAGE: {e(r.get('analysis',''))} {e(r.get('contrary') or '')}</div></article>''')
          l=sub(r'<section class="box"><h2>Tonight\'s Rejections // Plus Two “Maybe Later” Notes</h2>.*?</section>','<section class="box"><h2>Morning Rejections // Plus One “Maybe Later” Note</h2><div class="cards" data-zone="recommendations">'+''.join(lcards)+'</div></section>',l)
          l=sub(r'<section class="pickup" data-zone="character-voice">.*?</section>','''<section class="pickup" data-zone="character-voice"><b>LARRY'S PICKUP LINE</b><p>“Are you an exact second-book moneyline? Because everybody says I need confirmation.”</p><div style="color:var(--cyan)"><b>NARRATOR:</b> For once, everybody is correct.</div></section>''',l)
          l=sub(r'<div class="aside" data-zone="sidebar">.*?</div>\n<section class="lastcall"','''<div class="aside" data-zone="sidebar"><section class="cheap"><img class="mini-badge" src="../../assets/syndicates/lizard-line-lost-wages-badge.png?v=2" alt="Lost Wages badge"><h3>LOUNGE LIZARD NOTE</h3><p>Boston is the only slip still sitting beside Larry's coffee. Everything else has already been returned to sender.</p></section><section class="cheap"><h3>CAB-FARE CHECK</h3><p>New betting risk remains <strong>$0</strong>. Larry has again spent more on breakfast than VigScope has spent on wagers.</p></section><section class="cheap"><h3>VISITOR COUNTER</h3><p class="counter">000026</p><p>Nine morning visitors. One said maybe. Eight said no. Larry's database lists nine “active conversations.”</p></section><section class="cheap"><h3>UNDER CONSTRUCTION FOREVER</h3><p>Coming soon: LARRY'S SECOND-BOOK CONFIRMATION SERVICE. Exact prices preferred. Lineups required.</p></section></div><section class="lastcall"''',l)
          l=sub(r'<section class="lastcall" data-zone="last-call">.*?</section>','<section class="lastcall" data-zone="last-call"><h2>LAST CALL</h2><p class="opening">One LEAN, eight PASS. Boston Red Sox moneyline remains LEAN at Bet365 −132, inside the −145-or-better gate but without exact current DraftKings confirmation or posted starting lineups. Everything else is PASS. Zero BET, zero WAIT, zero new risk. Larry remains optimistic for reasons not supported by the report.</p></section>',l)
          l=sub(r'<footer data-zone="footer">.*?</footer>',f'<footer data-zone="footer">Betting Edge 09:30 FINAL MORNING, issued {e(ts)}, is authoritative. Larry\'s Lost Wages lounge story is presentation only; issued statuses, prices, buying conditions and $0 risk remain unchanged. HOTLINE SHELL: LIZARD LINE v2 // EDITABLE.</footer>',l)
          (root/'syndicates/lock-line/hotline.html').write_text(l)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add syndicates/death-angel/hotline.html syndicates/crown-and-lance/hotline.html syndicates/lock-line/hotline.html
          git commit -m 'Restore approved Sierra shells for 09:30 editions'
          git push
