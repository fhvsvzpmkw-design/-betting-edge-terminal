                out.append(f'''<article class="file{cls}"><div class="filetop"><b>FILE {i:02d} // {esc(r['title']).upper()}</b><span>{esc(r['status'])}</span></div><div class="facts"><b>WINDOW:</b> {esc(r['book'])} // {esc(r['price'])}<br><b>THRESHOLD:</b> {esc(r['playTo'])}<br><b>FAIR:</b> {esc(r['fair'])}</div><p>{esc(r['analysis'])} {esc(r['contrary'])}</p></article>''')
