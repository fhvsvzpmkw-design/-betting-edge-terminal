name: F3 All-In Advantage Once

on:
  push:
    paths:
      - 'tools/f3-all-in-advantage-once.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply F3 All-In Advantage
        run: node tools/f3-all-in-advantage-once.mjs
      - name: Commit F3 update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No F3 changes to commit"
          else
            git commit -m "Add F3 all-in advantage metric"
            git push
          fi
