name: Game Day coverage regression

on:
  push:
    branches: [main]
    paths:
      - 'tools/odds-refresh-worker-source.yml'
      - '.github/workflows/odds-refresh.yml'
      - 'data/main-schedule.json'
      - 'tools/main-schedule.mjs'
      - 'tools/odds-run-request.mjs'
      - 'tools/odds-slot-state.mjs'
      - 'tools/primary-sport-identity.mjs'
      - 'tools/primary-feed-health.mjs'
      - 'tools/oddspapi-observer.mjs'
      - 'tools/major-sport-market-coverage-gate.mjs'
      - 'tools/report-inputs.mjs'
      - 'tools/report-snapshot.mjs'
      - 'core/core-v1.5-production.json'
      - 'BETTING_EDGE_MAIN_SCHEDULE.md'
      - 'README.md'
      - 'docs/OPERATIONS.md'
      - 'docs/MAIN_SCHEDULE.md'
      - 'cloudflare-worker/**'
      - 'tests/main-schedule.test.mjs'
      - 'tests/odds-primary-entry.test.mjs'
      - 'tests/odds-run-request.test.mjs'
      - 'tests/odds-slot-state.test.mjs'
      - 'tests/primary-feed-health.test.mjs'
      - 'tests/pinnacle-nhl-coverage.test.mjs'
      - 'tests/pinnacle-observation-freshness.test.mjs'
      - 'tests/oddspapi-quota-reserve.test.mjs'
      - 'tools/apply-crypto-watch-priority.mjs'
      - 'tools/opinion-review.mjs'
      - 'tools/candidate-assessment.mjs'
      - 'tools/report-evidence-repair.mjs'
      - 'tools/report-evidence-gate.mjs'
      - 'tools/selection-continuity.mjs'
      - 'tools/event-research-plan.mjs'
      - 'tools/forecast-follow-ups.mjs'
      - 'tools/forecast-lead-routing.mjs'
      - 'data/report-production/forecast-follow-ups.json'
      - 'tests/forecast-follow-ups.test.mjs'
      - 'tests/known-forecast-follow-up-routing.test.mjs'
      - 'tests/forecast-follow-up-pipeline.test.mjs'
      - 'tests/nhl-corroboration-follow-up.test.mjs'
      - 'tests/odds-worker-*.test.mjs'
      - 'tests/opinion-review.test.mjs'
      - 'tests/game-day-history-replay.test.mjs'
      - 'tests/candidate-assessment.test.mjs'
      - 'BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md'
      - 'docs/GAME_DAY_COVERAGE_REPAIR.md'
      - '.github/workflows/game-day-coverage-regression.yml'
  pull_request:
    paths:
      - 'tools/odds-refresh-worker-source.yml'
      - '.github/workflows/odds-refresh.yml'
      - 'data/main-schedule.json'
      - 'tools/main-schedule.mjs'
      - 'tools/odds-run-request.mjs'
      - 'tools/odds-slot-state.mjs'
      - 'tools/primary-sport-identity.mjs'
      - 'tools/primary-feed-health.mjs'
      - 'tools/oddspapi-observer.mjs'
      - 'tools/major-sport-market-coverage-gate.mjs'
      - 'tools/report-inputs.mjs'
      - 'tools/report-snapshot.mjs'
      - 'core/core-v1.5-production.json'
      - 'BETTING_EDGE_MAIN_SCHEDULE.md'
      - 'README.md'
      - 'docs/OPERATIONS.md'
      - 'docs/MAIN_SCHEDULE.md'
      - 'cloudflare-worker/**'
      - 'tests/main-schedule.test.mjs'
      - 'tests/odds-primary-entry.test.mjs'
      - 'tests/odds-run-request.test.mjs'
      - 'tests/odds-slot-state.test.mjs'
      - 'tests/primary-feed-health.test.mjs'
      - 'tests/pinnacle-nhl-coverage.test.mjs'
      - 'tests/pinnacle-observation-freshness.test.mjs'
      - 'tests/oddspapi-quota-reserve.test.mjs'
      - 'tools/apply-crypto-watch-priority.mjs'
      - 'tools/opinion-review.mjs'
      - 'tools/candidate-assessment.mjs'
      - 'tools/report-evidence-repair.mjs'
      - 'tools/report-evidence-gate.mjs'
      - 'tools/selection-continuity.mjs'
      - 'tools/event-research-plan.mjs'
      - 'tools/forecast-follow-ups.mjs'
      - 'tools/forecast-lead-routing.mjs'
      - 'data/report-production/forecast-follow-ups.json'
      - 'tests/forecast-follow-ups.test.mjs'
      - 'tests/known-forecast-follow-up-routing.test.mjs'
      - 'tests/forecast-follow-up-pipeline.test.mjs'
      - 'tests/nhl-corroboration-follow-up.test.mjs'
      - 'tests/odds-worker-*.test.mjs'
      - 'tests/opinion-review.test.mjs'
      - 'tests/game-day-history-replay.test.mjs'
      - 'tests/candidate-assessment.test.mjs'
      - 'BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md'
      - 'docs/GAME_DAY_COVERAGE_REPAIR.md'
      - '.github/workflows/game-day-coverage-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current configuration and snapshot intake
        run: |
          node tests/main-schedule.test.mjs
          node tests/odds-primary-entry.test.mjs
          node tests/odds-run-request.test.mjs
          node tests/odds-slot-state.test.mjs
          node tests/core15-release.test.mjs
          node tests/report-inputs.test.mjs
          node tests/primary-feed-health.test.mjs
          node tests/pinnacle-nhl-coverage.test.mjs
          node tests/pinnacle-observation-freshness.test.mjs
          node tests/oddspapi-quota-reserve.test.mjs
          node tests/report-snapshot.test.mjs
      - name: Verify acquisition without live odds requests
        run: |
          node tests/odds-worker-primary-recovery.test.mjs
          node tests/odds-worker-major-sport-retention.test.mjs
      - name: Verify directional judgment and immutable history
        run: |
          node tests/scheduled-report-authority.test.mjs
          node --test tests/opinion-review.test.mjs tests/candidate-assessment.test.mjs tests/forecast-lean.test.mjs tests/forecast-lead-routing.test.mjs
          node tests/game-day-history-replay.test.mjs
          node tests/event-research-plan.test.mjs
          node tools/selection-continuity.mjs self-test
      - name: Verify decision routes and customer output
        run: |
          node --test tests/forecast-lean-default.test.mjs tests/forecast-wait.test.mjs tests/nhl-forecast-corroboration.test.mjs
          node tests/american-odds-display.test.mjs
          node tests/vigscope-meter-production.test.mjs
      - name: Verify known source handoff and corroboration closeout
        run: node --test tests/forecast-follow-ups.test.mjs tests/known-forecast-follow-up-routing.test.mjs tests/forecast-follow-up-pipeline.test.mjs tests/nhl-corroboration-follow-up.test.mjs
