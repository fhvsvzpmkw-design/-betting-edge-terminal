name: Graham research completion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/graham-research-completion.yml
      - data/walters/nfl/graham-research-completion-policy-v1.json
      - data/walters/nfl/graham-research-runtime-policy-v1.json
      - data/walters/nfl/research-completion-staging.json
      - tools/validate-graham-research-completion.mjs
      - tests/fixtures/graham-research-completion-no-change.json
      - tests/graham-research-completion-time.test.mjs
  workflow_dispatch:

concurrency:
  group: graham-research-completion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate completion gate and no-change regression
        run: |
          node --check tools/validate-graham-research-completion.mjs
          node tests/graham-research-completion-time.test.mjs
          node tools/validate-graham-research-completion.mjs \
            --fixture tests/fixtures/graham-research-completion-no-change.json \
            --receipt-out /tmp/graham-no-change-receipt.json
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('/tmp/graham-no-change-receipt.json','utf8'));
          if(r.state!=='VERIFIED')throw new Error('fixture receipt not VERIFIED');
          if(r.runEventId!=='graham-delta-1645-2026-w01-20260901T164500-0700')throw new Error('fixture runEventId mismatch');
          if(r.taskKey!=='DELTA_1645'||r.completionResult!=='NO_MATERIAL_CHANGE'||r.marketViewed!==false)throw new Error('fixture receipt semantics mismatch');
          console.log('GRAHAM NO-CHANGE COMPLETION RECEIPT: PASS');
          NODE

      - name: Resolve staging state
        id: staging
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const s=JSON.parse(fs.readFileSync('data/walters/nfl/research-completion-staging.json','utf8'));
          console.log(`ready=${s.state==='READY'?'true':'false'}`);
          NODE

      - name: Verify exact active-week research sweep
        if: steps.staging.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ACTIVE_RESEARCH="$(node tools/graham-active-week.mjs --path researchLedger)"
          STAGED_RESEARCH="$(node -p "JSON.parse(require('fs').readFileSync('data/walters/nfl/research-completion-staging.json','utf8')).ledgerPath")"
          if [ "$ACTIVE_RESEARCH" != "$STAGED_RESEARCH" ]; then
            echo "Active research path: $ACTIVE_RESEARCH"
            echo "Staged research path: $STAGED_RESEARCH"
            exit 1
          fi
          node tools/validate-graham-research-completion.mjs \
            --ledger "$ACTIVE_RESEARCH" \
            --receipt-out data/walters/nfl/research-completion-current.json
          LEDGER_BLOB="$(git rev-parse "HEAD:$ACTIVE_RESEARCH")"
          export LEDGER_BLOB
          node - <<'NODE'
          const fs=require('node:fs');
          const p='data/walters/nfl/research-completion-current.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.ledgerBlobSha=process.env.LEDGER_BLOB;
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

      - name: Publish verified completion receipt
        if: steps.staging.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          cp data/walters/nfl/research-completion-staging.json /tmp/graham-completion-intent.json
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            if ! cmp -s data/walters/nfl/research-completion-staging.json /tmp/graham-completion-intent.json; then
              echo "Completion staging superseded; this older receipt was not published."
              exit 0
            fi
            ACTIVE_RESEARCH="$(node tools/graham-active-week.mjs --path researchLedger)"
            node tools/validate-graham-research-completion.mjs \
              --ledger "$ACTIVE_RESEARCH" \
              --receipt-out data/walters/nfl/research-completion-current.json
            LEDGER_BLOB="$(git rev-parse "HEAD:$ACTIVE_RESEARCH")"
            export LEDGER_BLOB
            node - <<'NODE'
          const fs=require('node:fs');
          const p='data/walters/nfl/research-completion-current.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.ledgerBlobSha=process.env.LEDGER_BLOB;
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE
            git add data/walters/nfl/research-completion-current.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Verify Graham research completion"
            if git push origin HEAD:main; then
              echo "Completion receipt published on attempt $attempt."
              exit 0
            fi
            echo "Completion publish collision; reverify against latest main."
          done
          echo "Completion receipt could not publish after four attempts." >&2
          exit 1

      - name: Idle installation result
        if: steps.staging.outputs.ready != 'true'
        run: |
          echo "GRAHAM RESEARCH COMPLETION: POLICY/REGRESSION PASS // STAGING IDLE"
