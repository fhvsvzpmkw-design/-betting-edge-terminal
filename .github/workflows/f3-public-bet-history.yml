name: Build public F3 bet history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/betting-ledger.json'
      - 'tools/build-public-bet-history.mjs'
      - '.github/workflows/f3-public-bet-history.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build sanitized public F3 dataset
        run: node tools/build-public-bet-history.mjs

      - name: Validate public projection
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('data/bet-history-public.json','utf8'));
          if(!p.publicProjection) throw new Error('publicProjection flag missing');
          if(!Array.isArray(p.wagers)) throw new Error('wagers missing');
          if(p.wagers.some(r=>r[2]!==null)) throw new Error('sportsbook reference leaked');
          for(const k of ['sourceFile','sourceRows','duplicateLegRowsCollapsed']){
            if(Object.prototype.hasOwnProperty.call(p.validation||{},k)) throw new Error(`private validation field leaked: ${k}`);
          }
          const html=fs.readFileSync('index.html','utf8');
          if(html.includes('./data/betting-ledger.json')) throw new Error('index still references raw ledger');
          if(!html.includes('./data/bet-history-public.json')) throw new Error('index missing public F3 dataset');
          console.log(`Validated ${p.wagers.length} public wagers.`);
          NODE

      - name: Publish public F3 projection
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/bet-history-public.json index.html
          if git diff --cached --quiet; then
            echo "Public F3 projection already current."
            exit 0
          fi
          git commit -m "Publish sanitized F3 bet history"
          git push origin HEAD:main
