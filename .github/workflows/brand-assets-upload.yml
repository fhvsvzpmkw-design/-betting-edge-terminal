name: Assemble brand assets

on:
  push:
    paths:
      - 'brand-upload/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Build VigWire brand assets
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib
          from PIL import Image, ImageDraw, ImageFont

          src = Path('brand-upload')
          dst = Path('assets/brand')
          dst.mkdir(parents=True, exist_ok=True)

          # Decode the approved VW master icon from small text chunks.
          parts = sorted(src.glob('master.b64.*'))
          if not parts:
              raise SystemExit('Missing VigWire master icon chunks')
          encoded = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(encoded, validate=True)
          if len(data) != 15937:
              raise SystemExit(f'Icon size mismatch: {len(data)} != 15937')
          digest = hashlib.sha256(data).hexdigest()
          expected = 'c4ae9ecf07eafd4cb51ea721d034e3301678c032789a63383d570b73b30788e7'
          if digest != expected:
              raise SystemExit(f'Icon SHA256 mismatch: {digest} != {expected}')
          icon_path = dst / 'vigwire-icon.png'
          icon_path.write_bytes(data)

          icon = Image.open(icon_path).convert('RGB')

          # Apple touch icon: same approved VW mark, fixed 180x180 filename.
          apple = icon.resize((180, 180), Image.Resampling.LANCZOS)
          apple.save(dst / 'apple-touch-icon.png', format='PNG', optimize=True)

          # Browser favicon with standard embedded sizes.
          icon.save(dst / 'favicon.ico', format='ICO', sizes=[(16,16), (32,32), (48,48)])

          # Social/share card: same logo, terminal presentation, fixed 1200x630 filename.
          W, H = 1200, 630
          card = Image.new('RGB', (W, H), '#01060a')
          draw = ImageDraw.Draw(card)
          for y in range(2, H, 4):
              draw.line((0, y, W, y), fill='#03100e', width=1)
          draw.rounded_rectangle((24, 24, W-24, H-24), radius=28, outline='#0b594d', width=2)
          draw.line((52, 505, W-52, 505), fill='#0b594d', width=2)

          logo = icon.resize((470, 470), Image.Resampling.LANCZOS)
          card.paste(logo, (62, 80))

          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf'
          font_title = ImageFont.truetype(bold, 64)
          font_sub = ImageFont.truetype(regular, 31)
          font_small = ImageFont.truetype(regular, 23)

          x = 570
          draw.text((x, 178), 'VIGWIRE LABS', font=font_title, fill='#63ff74')
          draw.line((x, 263, 1138, 263), fill='#20c86b', width=3)
          draw.text((x, 300), 'VigScope // Market Intelligence', font=font_sub, fill='#73f8ef')
          draw.text((x, 366), 'Betting Edge // Live Runner', font=font_small, fill='#4fa98d')
          draw.text((x, 526), 'vigwirelabs.com', font=font_small, fill='#63ff74')
          card.save(dst / 'vigwire-share-card.png', format='PNG', optimize=True)

          # Fail closed if any fixed deliverable is missing or malformed.
          checks = {
              'vigwire-icon.png': (256, 256),
              'apple-touch-icon.png': (180, 180),
              'vigwire-share-card.png': (1200, 630),
          }
          for name, expected_size in checks.items():
              with Image.open(dst / name) as im:
                  if im.size != expected_size:
                      raise SystemExit(f'{name} dimensions {im.size} != {expected_size}')
          if not (dst / 'favicon.ico').exists() or (dst / 'favicon.ico').stat().st_size < 1000:
              raise SystemExit('favicon.ico was not created correctly')

      - name: Commit brand assets and remove upload scaffolding
        run: |
          rm -rf brand-upload
          rm -f .github/workflows/brand-assets-upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/brand brand-upload .github/workflows/brand-assets-upload.yml
          git commit -m "Add VigWire brand assets"
          git push
