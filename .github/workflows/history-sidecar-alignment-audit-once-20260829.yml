name: One-time complete sidecar/report alignment audit

on:
  push:
    branches: [history-wait-repair-20260829]
    paths:
      - .github/workflows/history-sidecar-alignment-audit-once-20260829.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: history-wait-repair-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate all sidecar/report alignment defects
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index=JSON.parse(fs.readFileSync('run-history.json','utf8'));
          const issues=[]; let checked=0; let recs=0;
          function issue(entry,msg){issues.push(`${entry.ts} | ${entry.researchFitPath||entry.path} | ${msg}`);}
          function eq(a,b){return JSON.stringify(a)===JSON.stringify(b);}
          for(const entry of index.runs||[]){
            if(!entry.researchFitPath) continue;
            checked++;
            const report=JSON.parse(fs.readFileSync(entry.path,'utf8'));
            const sidecar=JSON.parse(fs.readFileSync(entry.researchFitPath,'utf8'));
            const ref=sidecar.reportReference;
            if(!ref||typeof ref!=='object') {issue(entry,'missing reportReference'); continue;}
            if(ref.slot!==report.slot) issue(entry,`reportReference.slot ${ref.slot} != ${report.slot}`);
            if(ref.label!==report.label) issue(entry,`reportReference.label ${ref.label} != ${report.label}`);
            if(ref.ts!==report.ts) issue(entry,`reportReference.ts ${ref.ts} != ${report.ts}`);
            if(ref.reportPath!==entry.path) issue(entry,`reportReference.reportPath ${ref.reportPath} != ${entry.path}`);
            if(ref.feedGeneratedAt!==report.feedGeneratedAt) issue(entry,`reportReference.feedGeneratedAt ${ref.feedGeneratedAt} != ${report.feedGeneratedAt}`);
            const items=Array.isArray(sidecar.recommendations)?sidecar.recommendations:[];
            const reportRecs=Array.isArray(report.recs)?report.recs:[];
            if(items.length!==reportRecs.length) issue(entry,`recommendation length ${items.length} != ${reportRecs.length}`);
            const n=Math.min(items.length,reportRecs.length);
            for(let i=0;i<n;i++){
              recs++;
              const item=items[i], rec=reportRecs[i];
              if(item.ordinal!==i+1) issue(entry,`#${i+1} ordinal=${item.ordinal}`);
              if(item.title!==rec.title) issue(entry,`#${i+1} title sidecar=${JSON.stringify(item.title)} report=${JSON.stringify(rec.title)}`);
              if(item.status!==rec.status) issue(entry,`#${i+1} status sidecar=${JSON.stringify(item.status)} report=${JSON.stringify(rec.status)}`);
              if(item.displayText!==rec.hist) issue(entry,`#${i+1} DISPLAY_TEXT_MISMATCH title=${rec.title} sidecar=${JSON.stringify(item.displayText)} reportHist=${JSON.stringify(rec.hist)}`);
              if(!Array.isArray(item.priorIds)) issue(entry,`#${i+1} priorIds not array`);
              if(!Array.isArray(item.synthesisIds)) issue(entry,`#${i+1} synthesisIds not array`);
              if(!Array.isArray(item.clusterIds)) issue(entry,`#${i+1} clusterIds not array`);
            }
            if(sidecar.provenance?.feedBlobSha&&entry.feedBlobSha&&sidecar.provenance.feedBlobSha!==entry.feedBlobSha) issue(entry,'feedBlobSha index/sidecar mismatch');
            if(sidecar.provenance?.researchLibraryVersion&&entry.researchLibraryVersion&&sidecar.provenance.researchLibraryVersion!==entry.researchLibraryVersion) issue(entry,'researchLibraryVersion index/sidecar mismatch');
          }
          console.log(`ALIGNMENT SIDECARS ${checked}`);
          console.log(`ALIGNMENT RECOMMENDATIONS ${recs}`);
          console.log(`ALIGNMENT ISSUE COUNT ${issues.length}`);
          for(const x of issues) console.log(`ISSUE ${x}`);
          if(issues.length) throw new Error(`Alignment audit found ${issues.length} issue(s)`);
          NODE
