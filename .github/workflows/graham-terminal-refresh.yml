name: Refresh Graham NFL terminal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/graham-terminal-refresh.yml
      - data/walters/nfl/active-week.json
      - data/walters/nfl/20*/week-*-current-numbers.json
      - data/walters/nfl/graham-fair-decomposition-policy-v1.json
      - data/walters/nfl/graham-schedule-authority-v1.json
      - data/walters/nfl-power-ratings-ledger.json
      - tools/graham-active-week.mjs
      - tools/graham-fair-decomposition.mjs
      - tools/graham-schedule-authority.mjs
      - tools/build-graham-current-week.mjs
      - tools/capture-graham-daily-pinnacle.mjs
  workflow_run:
    workflows:
      - Refresh Betting Edge odds
      - Graham personnel production
      - Graham matchup production
      - Walters Matchup M5 Catch-up
      - Walters Home Field H4 Activation
      - Apply Graham research input
      - Graham research ledger sync
      - Graham schedule metadata
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: graham-nfl-terminal-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify active-week resolver and simulated next week
        run: |
          set -euo pipefail
          node --check tools/graham-active-week.mjs
          node --check tools/graham-fair-decomposition.mjs
          node --check tools/graham-schedule-authority.mjs
          node tools/graham-schedule-authority.mjs --manifest
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {resolveGrahamActiveWeek,grahamWeekPaths} from './tools/graham-active-week.mjs';

          const active=resolveGrahamActiveWeek();
          const nextWeek=active.week+1;
          const next=grahamWeekPaths(active.season,nextWeek);
          const token=String(nextWeek).padStart(2,'0');
          const expected={
            currentNumbers:`data/walters/nfl/${active.season}/week-${token}-current-numbers.json`,
            researchLedger:`data/walters/nfl/${active.season}/week-${token}-research-ledger.json`,
            dailyMarketLedger:`data/walters/nfl/${active.season}/week-${token}-daily-market-ledger.json`,
            personnelLedger:`data/walters/nfl/${active.season}/week-${token}-personnel-ledger.json`,
            researchEventsDir:`data/walters/nfl/${active.season}/week-${token}-research-events`
          };
          for(const [key,value] of Object.entries(expected)){
            if(next.relative[key]!==value)throw new Error(`next-week path mismatch for ${key}: ${next.relative[key]} != ${value}`);
          }

          const tmp=fs.mkdtempSync(path.join(os.tmpdir(),'graham-week-test-'));
          try{
            const nflDir=path.join(tmp,'data/walters/nfl');
            const seasonDir=path.join(nflDir,String(active.season));
            fs.mkdirSync(seasonDir,{recursive:true});
            const manifest={schema:1,state:'ACTIVE',season:active.season,week:nextWeek,timezone:'America/Vancouver',authority:'GRAHAM_WEEK_ROLLOVER'};
            fs.writeFileSync(path.join(nflDir,'active-week.json'),JSON.stringify(manifest,null,2)+'\n');
            for(const key of ['currentNumbers','researchLedger','dailyMarketLedger']){
              const rel=next.relative[key];
              const file=path.join(tmp,rel);
              fs.mkdirSync(path.dirname(file),{recursive:true});
              fs.writeFileSync(file,JSON.stringify({schema:1,season:active.season,week:nextWeek},null,2)+'\n');
            }
            const simulated=resolveGrahamActiveWeek({root:tmp});
            if(simulated.season!==active.season||simulated.week!==nextWeek)throw new Error('simulated next-week resolver returned wrong season/week');
            if(simulated.paths.currentNumbers!==expected.currentNumbers||simulated.paths.dailyMarketLedger!==expected.dailyMarketLedger)throw new Error('simulated next-week resolver returned wrong paths');
          } finally {
            fs.rmSync(tmp,{recursive:true,force:true});
          }

          console.log(`GRAHAM WEEK RESOLVER TEST: PASS // ACTIVE ${active.season} W${active.weekToken} // SIMULATED ${next.season} W${next.weekToken}`);
          NODE

      - name: Rebuild and publish Graham terminal
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"

          TRIGGER_EVENT="${{ github.event_name }}"
          TRIGGER_WORKFLOW="${{ github.event.workflow_run.name }}"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            node tools/graham-active-week.mjs
            ACTIVE_MARKET_LEDGER="$(node tools/graham-active-week.mjs --path dailyMarketLedger)"
            ACTIVE_NUMBERS="$(node tools/graham-active-week.mjs --path currentNumbers)"

            # The Nineteenth Hole may only rebuild from a board whose schedule
            # metadata and fair explanation both match their controlled authorities.
            node tools/graham-schedule-authority.mjs --path "$ACTIVE_NUMBERS"
            node tools/graham-fair-decomposition.mjs --path "$ACTIVE_NUMBERS"

            if [ "$TRIGGER_EVENT" = "workflow_run" ] && [ "$TRIGGER_WORKFLOW" = "Refresh Betting Edge odds" ]; then
              node tools/capture-graham-daily-pinnacle.mjs
            else
              echo "GRAHAM RESEARCH REFRESH // preserving existing Pinnacle snapshot and timestamp"
            fi

            node tools/build-graham-current-week.mjs

            git add -- data/walters/nfl/current-week-terminal.json
            git add -- "$ACTIVE_MARKET_LEDGER"

            if git diff --cached --quiet; then
              echo "Graham terminal already current."
              exit 0
            fi

            git commit -m "Refresh Graham NFL terminal"
            if git push origin HEAD:main; then
              echo "Graham terminal published on attempt $attempt."
              exit 0
            fi
            echo "Graham terminal publish collision on attempt $attempt; rebuilding from latest main."
          done

          echo "Graham terminal could not be published after 4 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          ACTIVE="$(node tools/graham-active-week.mjs 2>/dev/null || true)"
          {
            echo "## Graham Mercer // The Nineteenth Hole"
            echo
            echo "- Trigger: odds refresh or Graham research/personnel/matchup/home-field/active-week/schedule publication"
            echo "- Active week: ${ACTIVE:-unresolved}"
            echo "- Active-week resolver regression: live week + simulated next week checked"
            echo "- Schedule metadata guard: active board must match graham-schedule-metadata-v1"
            echo "- Fair explanation guard: governed decomposition must match exact/display fair before terminal rebuild"
            echo "- External API calls: none"
            echo "- Live board: repository active NFL week"
            echo "- Graham fair: rebuilt immediately after governed Graham research changes"
            echo "- Pinnacle on research-only refresh: latest committed snapshot preserved with its original timestamp"
            echo "- Pinnacle on odds refresh: refreshed comparison consumed after the odds workflow completes"
            echo "- Official daily Pinnacle capture: 15:15 odds-refresh path only, when an independent Graham number exists"
            echo "- Market isolation: football information moves Graham; market refresh changes only the comparison"
          } >> "$GITHUB_STEP_SUMMARY"
