name: Refresh Graham NFL terminal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/graham-terminal-refresh.yml
      - data/walters/nfl/active-week.json
      - data/walters/nfl/20*/week-*-current-numbers.json
      - data/walters/nfl-power-ratings-ledger.json
      - tools/graham-active-week.mjs
      - tools/build-graham-current-week.mjs
      - tools/capture-graham-daily-pinnacle.mjs
  workflow_run:
    workflows:
      - Refresh Betting Edge odds
      - Graham personnel production
      - Apply Graham research input
      - Graham research ledger sync
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: graham-nfl-terminal-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and publish Graham terminal
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"

          TRIGGER_EVENT="${{ github.event_name }}"
          TRIGGER_WORKFLOW="${{ github.event.workflow_run.name }}"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            node tools/graham-active-week.mjs
            ACTIVE_MARKET_LEDGER="$(node tools/graham-active-week.mjs --path dailyMarketLedger)"

            # No external API calls occur here. The terminal always rebuilds from
            # committed Graham and market state. Only a genuine odds-refresh
            # completion may perform the governed 15:15 daily Pinnacle capture.
            if [ "$TRIGGER_EVENT" = "workflow_run" ] && [ "$TRIGGER_WORKFLOW" = "Refresh Betting Edge odds" ]; then
              node tools/capture-graham-daily-pinnacle.mjs
            else
              echo "GRAHAM RESEARCH REFRESH // preserving existing Pinnacle snapshot and timestamp"
            fi

            node tools/build-graham-current-week.mjs

            git add -- data/walters/nfl/current-week-terminal.json
            git add -- "$ACTIVE_MARKET_LEDGER"

            if git diff --cached --quiet; then
              echo "Graham terminal already current."
              exit 0
            fi

            git commit -m "Refresh Graham NFL terminal"
            if git push origin HEAD:main; then
              echo "Graham terminal published on attempt $attempt."
              exit 0
            fi
            echo "Graham terminal publish collision on attempt $attempt; rebuilding from latest main."
          done

          echo "Graham terminal could not be published after 4 attempts." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          ACTIVE="$(node tools/graham-active-week.mjs 2>/dev/null || true)"
          {
            echo "## Graham Mercer // The Nineteenth Hole"
            echo
            echo "- Trigger: odds refresh or Graham research/personnel/active-week publication"
            echo "- Active week: ${ACTIVE:-unresolved}"
            echo "- External API calls: none"
            echo "- Live board: repository active NFL week"
            echo "- Graham fair: rebuilt immediately after governed Graham research changes"
            echo "- Pinnacle on research-only refresh: latest committed snapshot preserved with its original timestamp"
            echo "- Pinnacle on odds refresh: refreshed comparison consumed after the odds workflow completes"
            echo "- Official daily Pinnacle capture: 15:15 odds-refresh path only, when an independent Graham number exists"
            echo "- Market isolation: football information moves Graham; market refresh changes only the comparison"
          } >> "$GITHUB_STEP_SUMMARY"
