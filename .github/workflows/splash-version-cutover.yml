name: One-time opening splash version cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/splash-version-cutover.yml'

permissions:
  contents: write

jobs:
  update-splash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align r.html version labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('r.html')
          s = p.read_text()
          replacements = {
              '<div class="brand-version">CONTRACT // v0.9</div>': '<div class="brand-version">CONTRACT // v1.0</div>',
              'terminalTitle:`${BRAND_CONFIG.terminalName} v1.3`': 'terminalTitle:`${BRAND_CONFIG.terminalName} v1.5`',
              "version:'CONTRACT // v0.9'": "version:'CONTRACT // v1.0'",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected splash version text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -F 'CONTRACT // v1.0' r.html
          grep -F 'terminalTitle:`${BRAND_CONFIG.terminalName} v1.5`' r.html
          ! grep -F 'CONTRACT // v0.9' r.html
      - name: Commit splash alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r.html
          git commit -m 'Align opening splash with v1.0 and UI v1.5'
          git push origin HEAD:main
