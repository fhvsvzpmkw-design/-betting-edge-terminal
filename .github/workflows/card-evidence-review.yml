name: Card evidence application review
on:
  push:
    branches: [main]
    paths:
      - tools/review-card-evidence.mjs
      - tools/assemble-card-evidence.mjs
      - tools/card-evidence-identity.mjs
      - tools/forecast-evidence.mjs
      - tools/report-evidence-repair.mjs
      - tools/event-research-plan.mjs
      - tests/event-research-plan.test.mjs
      - tools/candidate-assessment.mjs
      - tools/market-method-shadow.mjs
      - tools/report-publication.mjs
      - tools/build-results-index.mjs
      - research/market-method-shadow-v1.json
      - tests/candidate-assessment.test.mjs
      - tests/candidate-publication.test.mjs
      - tests/market-method-shadow.test.mjs
      - docs/CANDIDATE_ASSESSMENT.md
      - research/forecast-source-registry.json
      - tests/forecast-evidence.test.mjs
      - tests/card-evidence-assembly.test.mjs
      - tests/card-evidence-identity.test.mjs
      - tests/report-evidence-repair.test.mjs
      - tools/major-sport-market-coverage-gate.mjs
      - tests/card-evidence-review.test.mjs
      - tests/primary-research-progress.test.mjs
      - docs/REPORT_CARD_EVIDENCE.md
      - BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md
      - .github/workflows/card-evidence-review.yml
  pull_request:
    paths:
      - tools/review-card-evidence.mjs
      - tools/assemble-card-evidence.mjs
      - tools/card-evidence-identity.mjs
      - tools/forecast-evidence.mjs
      - tools/report-evidence-repair.mjs
      - tools/event-research-plan.mjs
      - tests/event-research-plan.test.mjs
      - tools/candidate-assessment.mjs
      - tools/market-method-shadow.mjs
      - tools/report-publication.mjs
      - tools/build-results-index.mjs
      - research/market-method-shadow-v1.json
      - tests/candidate-assessment.test.mjs
      - tests/candidate-publication.test.mjs
      - tests/market-method-shadow.test.mjs
      - docs/CANDIDATE_ASSESSMENT.md
      - research/forecast-source-registry.json
      - tests/forecast-evidence.test.mjs
      - tests/card-evidence-assembly.test.mjs
      - tests/card-evidence-identity.test.mjs
      - tests/report-evidence-repair.test.mjs
      - tools/major-sport-market-coverage-gate.mjs
      - tests/card-evidence-review.test.mjs
      - tests/primary-research-progress.test.mjs
      - docs/REPORT_CARD_EVIDENCE.md
      - BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md
      - .github/workflows/card-evidence-review.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/card-evidence-review.test.mjs
      - run: node tests/forecast-evidence.test.mjs
      - run: node tests/card-evidence-assembly.test.mjs
      - run: node tests/card-evidence-identity.test.mjs
      - run: node tests/report-evidence-repair.test.mjs
      - run: node tests/event-research-plan.test.mjs --integration
      - run: node tests/candidate-assessment.test.mjs
      - run: node tests/candidate-publication.test.mjs
      - run: node tests/candidate-publication.test.mjs --tonight
      - run: node tests/primary-report-dashboard.test.mjs
      - run: node tests/market-method-shadow.test.mjs
      - run: node tests/primary-report-publication.test.mjs
      - run: node tests/partial-research-publication.test.mjs
      - run: node tests/results-performance-populations.test.mjs
      - run: node tests/primary-research-progress.test.mjs
      - run: node tools/major-sport-market-coverage-gate.mjs self-test
