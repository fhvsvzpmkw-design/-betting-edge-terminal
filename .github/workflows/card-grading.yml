name: Isolated historical card grading

on:
  push:
    branches: [main]
    paths:
      - 'data/history/grading/request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-grading
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate request and historical grader
        run: |
          node --check tools/grade-issued-card-history.mjs
          node tools/grade-issued-card-history.mjs --self-test
          node - <<'NODE'
          const fs = require('fs'), cp = require('child_process'), assert = require('assert/strict');
          const file = 'data/history/grading/request.json';
          const request = JSON.parse(fs.readFileSync(file, 'utf8'));
          assert.equal(request.schema, 1); assert.equal(request.state, 'READY');
          assert.match(request.requestId, /^[a-zA-Z0-9_-]{1,100}$/);
          if (process.env.GITHUB_EVENT_NAME === 'push') {
            const submitted = JSON.parse(cp.execFileSync('git', ['show', `${process.env.GITHUB_SHA}:${file}`], {encoding:'utf8'}));
            assert.deepEqual(request, submitted, 'Request superseded: do not process another request under this run');
          }
          assert.ok(!fs.existsSync(`data/history/grading/receipts/${request.requestId}.json`), 'Request already has a durable receipt; use a new requestId for an additional pass');
          assert.equal(cp.execFileSync('git', ['status', '--porcelain'], {encoding:'utf8'}).trim(), '', 'Clean checkout required');
          NODE
      - name: Grade requested day and older missing or unresolved observations
        run: node tools/grade-issued-card-history.mjs data/history/grading/request.json
      - name: Rebuild downstream results index
        run: |
          node tools/build-results-index.mjs
          node tools/add-results-player-value.mjs
          node tools/add-results-shadow-v2.mjs
      - name: Reconcile settlements and prepare durable receipt
        run: |
          node - <<'NODE'
          const fs = require('fs'), cp = require('child_process'), assert = require('assert/strict');
          const read = p => JSON.parse(fs.readFileSync(p,'utf8'));
          const runtime = read('/tmp/card-grading-runtime.json'), idx = read('data/history/results-index.json');
          const root = `data/history/runs/${runtime.targetDate}`;
          const tally = {issued:0,complete:0,unresolved:0,grades:{WIN:0,LOSS:0,PUSH:0,VOID:0,HALF_WIN:0,HALF_LOSS:0}};
          const targetObservations = [];
          for (const file of fs.existsSync(root) ? fs.readdirSync(root).filter(x=>x.endsWith('.json')).sort() : []) {
            const source = `${root}/${file}`, run = read(source), op = source.replace('/runs/','/observations/');
            const obs = fs.existsSync(op) ? read(op) : null;
            if (obs) { assert.equal(obs.sourceRun,source); assert.equal(obs.recommendations.length,(run.recs||[]).length); targetObservations.push(op); }
            for (const [i,rec] of (run.recs||[]).entries()) {
              if (!['BET','LEAN','WAIT','PASS'].includes(String(rec.status).toUpperCase())) continue;
              tally.issued++;
              const row = obs?.recommendations?.[i];
              if (row) assert.equal(row.selectionKey||null,rec.feed?.selectionKey||null);
              const c = row?.completion;
              if (c?.state === 'complete') {
                assert.equal(c.verificationState,'verified'); assert.ok(c.source?.name && c.source?.url,'Source required for complete settlement');
                assert.ok(Object.hasOwn(tally.grades,c.grade),'Unknown settlement grade');
                assert.equal(c.official,String(rec.status).toUpperCase()==='BET');
                assert.equal(c.hypothetical,!c.official);
                tally.complete++; tally.grades[c.grade]++;
              } else tally.unresolved++;
            }
          }
          assert.equal(tally.issued,runtime.issuedCards);
          const dateStats = (idx.byDate||[]).find(x=>x.name===runtime.targetDate)||null;
          if (tally.issued) {
            assert.ok(dateStats,'Target missing from results index');
            assert.equal(dateStats.issued,tally.issued); assert.equal(dateStats.complete,tally.complete);
            assert.equal(dateStats.unresolved,tally.unresolved);
            for (const [grade,count] of Object.entries(tally.grades)) assert.equal(dateStats.grades?.[grade]||0,count);
          }
          const older = (idx.unresolved||[]).filter(x=>String(x.date||'')<runtime.targetDate);
          const receiptPath = `data/history/grading/receipts/${runtime.requestId}.json`;
          const outputPaths = [...new Set([...runtime.observationPaths,'data/history/results-index.json'])].sort();
          const outputBlobs = Object.fromEntries(outputPaths.map(p=>[p,cp.execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim()]));
          const receipt = {schema:1,state:tally.unresolved||older.length?'PARTIAL_UNRESOLVED':'COMPLETE',requestId:runtime.requestId,targetDate:runtime.targetDate,preparedAt:new Date().toISOString(),workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:process.env.GITHUB_RUN_ATTEMPT,triggerCommit:process.env.GITHUB_SHA,inputCommit:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),runtime,target:tally,targetIndex:dateStats,coverage:idx.coverage,olderRemainingCards:older.length,olderRemainingEvents:new Set(older.map(x=>String(x.eventId||x.cardId))).size,targetObservations,outputBlobs,isolation:'Only historical observations, downstream results index and this receipt. No live odds, issued reports, report production or betting ledger changes.'};
          fs.mkdirSync('data/history/grading/receipts',{recursive:true}); fs.writeFileSync(receiptPath,JSON.stringify(receipt,null,2)+'\n');
          fs.writeFileSync('/tmp/card-grading-paths.json',JSON.stringify([...outputPaths,receiptPath]));
          const allowed = new Set([...outputPaths,receiptPath]);
          const changed = cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const untracked = cp.execFileSync('git',['ls-files','--others','--exclude-standard'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for (const p of [...changed,...untracked]) assert.ok(allowed.has(p),`Unexpected change outside grading outputs: ${p}`);
          const message = `Grade ${runtime.targetDate} historical cards; ${runtime.requestId}\n\n${JSON.stringify({target:tally,index:dateStats,olderRemainingCards:older.length,isolation:'historical-only'})}\n`;
          fs.writeFileSync('/tmp/card-grading-commit.txt',message); console.log(JSON.stringify(receipt,null,2));
          NODE
      - name: Commit only verified historical outputs
        run: |
          git config user.name 'betting-edge-bot'
          git config user.email 'betting-edge-bot@users.noreply.github.com'
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const paths=JSON.parse(fs.readFileSync('/tmp/card-grading-paths.json','utf8'));
          cp.execFileSync('git',['add','--',...paths],{stdio:'inherit'});
          NODE
          git commit -F /tmp/card-grading-commit.txt
          git pull --rebase origin main
          git push origin main
      - name: Independently read back committed outputs
        run: |
          git fetch origin main
          node - <<'NODE'
          const fs=require('fs'),cp=require('child_process'),assert=require('assert/strict');
          const req=JSON.parse(fs.readFileSync('data/history/grading/request.json','utf8'));
          const p=`data/history/grading/receipts/${req.requestId}.json`;
          const remote=JSON.parse(cp.execFileSync('git',['show',`origin/main:${p}`],{encoding:'utf8',maxBuffer:16*1024*1024}));
          assert.equal(remote.requestId,req.requestId); assert.equal(remote.targetDate,req.targetDate);
          for(const [file,sha] of Object.entries(remote.outputBlobs)) {
            const actual=cp.execFileSync('git',['rev-parse',`origin/main:${file}`],{encoding:'utf8'}).trim();
            assert.equal(actual,sha,`Remote readback mismatch: ${file}`);
          }
          console.log('DURABLE GRADING READBACK VERIFIED'); console.log(JSON.stringify({requestId:remote.requestId,state:remote.state,target:remote.target,coverage:remote.coverage,olderRemainingCards:remote.olderRemainingCards},null,2));
          NODE
