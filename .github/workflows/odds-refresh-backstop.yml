name: Betting Edge odds scheduler backstop

on:
  schedule:
    # Five-minute backstop for every configured Vancouver pulse across PDT/PST.
    # The profile resolver below decides whether the current operating profile is actually due.
    - cron: '10 1,2,19,20,22,23 * * *'
    - cron: '25 16,17 * * *'
    - cron: '55 0,1,12,13,14,15,16,17,18,20,21,22,23 * * *'

concurrency:
  group: betting-edge-odds-scheduler-backstop
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  backstop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve active Vancouver schedule profile
        id: schedule
        env:
          EVENT_NAME: schedule
        run: node tools/schedule-profile.mjs resolve-workflow >> "$GITHUB_OUTPUT"

      - name: Check whether canonical slot already published
        id: gate
        if: steps.schedule.outputs.should_run == 'true'
        env:
          OPERATING_DATE: ${{ steps.schedule.outputs.operating_date }}
          PROFILE_ID: ${{ steps.schedule.outputs.profile_id }}
          CANONICAL_SLOT: ${{ steps.schedule.outputs.canonical_slot }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          let existing=null;
          try { existing=JSON.parse(fs.readFileSync('data/live-odds.json','utf8')); } catch {}
          const meta=existing?.scheduleMeta||{};
          const alreadyPublished=
            meta.operatingDate===process.env.OPERATING_DATE &&
            meta.profileId===process.env.PROFILE_ID &&
            Number(meta.canonicalSlot)===Number(process.env.CANONICAL_SLOT);
          console.log(`dispatch=${alreadyPublished?'false':'true'}`);
          console.log(`reason=${alreadyPublished?'slot-already-published':'scheduled-slot-missing'}`);
          NODE

      - name: Dispatch protected odds refresh
        if: steps.schedule.outputs.should_run == 'true' && steps.gate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          scheduled_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -nc --arg scheduled_at "$scheduled_at" '{ref:"main",inputs:{trigger_mode:"cloudflare_scheduled",scheduled_at:$scheduled_at}}')"
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/odds-refresh.yml/dispatches" \
            --data "$payload"
          echo "BACKSTOP DISPATCH // ${{ steps.schedule.outputs.operating_date }} ${{ steps.schedule.outputs.planned_pulse_time }} PT // ${{ steps.schedule.outputs.profile_id }} // SLOT ${{ steps.schedule.outputs.canonical_slot }}"

      - name: Backstop summary
        if: always()
        run: |
          {
            echo '## Betting Edge odds scheduler backstop'
            echo
            echo '- Primary clock: `Cloudflare`'
            echo '- Backstop delay: `5 minutes`'
            echo '- Profile: `${{ steps.schedule.outputs.profile_label }}`'
            echo '- Operating day: `${{ steps.schedule.outputs.operating_date }}`'
            echo '- Canonical slot: `${{ steps.schedule.outputs.canonical_slot }}`'
            echo '- Planned pulse: `${{ steps.schedule.outputs.planned_pulse_time }} PT`'
            echo '- Gate: `${{ steps.gate.outputs.reason || 'not-due' }}`'
            echo '- Odds API cap: `unchanged — target workflow retains duplicate/profile gates`'
          } >> "$GITHUB_STEP_SUMMARY"
