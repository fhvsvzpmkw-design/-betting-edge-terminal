name: Core 1.4 production promotion

on:
  push:
    branches: [main]
    paths:
      - 'tools/promote-core-v14-contract.mjs'
      - '.github/workflows/core-v14-production-promotion.yml'
  workflow_dispatch:

concurrency:
  group: core-v14-production-promotion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate operational Core 1.4 framework
        run: node tools/core-handicap-framework.mjs self-test
      - name: Validate Core 1.4 publication gate
        run: node tools/core-v14-publication-gate.mjs self-test
      - name: Patch production contract and provenance schema
        run: node tools/promote-core-v14-contract.mjs
      - name: Parse updated provenance schema
        run: node -e "JSON.parse(require('fs').readFileSync('data/history/report-provenance-schema.json','utf8')); console.log('PROVENANCE SCHEMA JSON OK')"
      - name: Commit production integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BETTING_EDGE_CONTRACT.md data/history/report-provenance-schema.json
          if git diff --cached --quiet; then
            echo 'Core 1.4 governance/provenance integration already applied.'
            exit 0
          fi
          git commit -m 'Activate Core 1.4 production governance'
          git push origin HEAD:main
      - name: Remote read-back
        run: |
          git fetch origin main
          git reset --hard origin/main
          grep -q 'Betting Edge core runner v1.4' BETTING_EDGE_CONTRACT.md
          grep -q 'Core 1.4 — operational handicap/model-error and Walters authority' BETTING_EDGE_CONTRACT.md
          node -e "const s=require('./data/history/report-provenance-schema.json'); if(!s.recommendations.coreAssessment||!s.recommendations.waltersEvidence) process.exit(1); console.log('CORE 1.4 PROVENANCE READ-BACK OK')"
          node tools/core-v14-publication-gate.mjs self-test
