name: Apply split bookmaker odds migration

on:
  push:
    paths:
      - '.github/workflows/apply-split-book-pull.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production odds refresh
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/odds-refresh.yml')
          s = p.read_text()

          s = s.replace(
              '      - name: Pull quota-balanced Bet365 + DraftKings odds',
              '      - name: Pull separate quota-balanced Bet365 + DraftKings odds',
              1,
          )
          s = s.replace('          const REQUEST_BUDGET = 70;', '          const REQUEST_BUDGET = 90;', 1)
          s = s.replace('          const DEEP_REQUEST_TARGET = 20;', '          const DEEP_REQUEST_TARGET = 6;', 1)
          s = s.replace(
              "                'broad discovery; balanced core ranking; deep markets by league/start-time priority'",
              "                'broad discovery; separate Bet365/DraftKings core pulls; merged by event identity; deep markets by league/start-time priority'",
              1,
          )

          anchor = '''          function sameEventIdentity(candidate, returned) {
            if (!candidate || !returned) return false;
            if (String(candidate.id) !== String(returned.id)) return false;

            const ch = normalized(candidate.home);
            const ca = normalized(candidate.away);
            const rh = normalized(returned.home);
            const ra = normalized(returned.away);

            if (ch && rh && ch !== rh) return false;
            if (ca && ra && ca !== ra) return false;

            return true;
          }
'''
          helper = anchor + '''
          function mergeCoreEvent(map, incoming) {
            if (!incoming?.id) return;
            const key = String(incoming.id);
            const current = map.get(key);
            if (!current) {
              map.set(key, {
                ...incoming,
                urls: { ...(incoming.urls || {}) },
                bookmakerIds: { ...(incoming.bookmakerIds || {}) },
                bookmakers: { ...(incoming.bookmakers || {}) }
              });
              return;
            }
            map.set(key, {
              ...current,
              ...incoming,
              urls: { ...(current.urls || {}), ...(incoming.urls || {}) },
              bookmakerIds: { ...(current.bookmakerIds || {}), ...(incoming.bookmakerIds || {}) },
              bookmakers: { ...(current.bookmakers || {}), ...(incoming.bookmakers || {}) }
            });
          }
'''
          if 'function mergeCoreEvent' not in s:
              if anchor not in s:
                  raise SystemExit('merge helper anchor not found')
              s = s.replace(anchor, helper, 1)

          start = s.find('            const coreRequestStart = requestsUsed;')
          end_marker = '''            snapshot.diagnostics.coreRequestsUsed =
              requestsUsed - coreRequestStart;
'''
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('core odds block not found')
          end += len(end_marker)

          new_block = '''            const coreRequestStart = requestsUsed;
            let coreBatchesUsed = 0;
            const coreEventMap = new Map();

            core_pull:
            for (const batch of chunks(coreSelected, 10)) {
              if (coreBatchesUsed >= CORE_REQUEST_TARGET) break;

              const remainingForDeep = Math.max(0, DEEP_REQUEST_TARGET);
              if (
                remainingBudget() <=
                SAFETY_RESERVE + remainingForDeep + BOOKMAKERS.length
              ) {
                break;
              }

              const eventIds = batch.map(event => event.id).join(',');
              if (!eventIds) continue;

              for (const bookmaker of BOOKMAKERS) {
                try {
                  const odds = await fetchJson(
                    apiUrl('/odds/multi', {
                      eventIds,
                      bookmakers: bookmaker
                    }),
                    {
                      attempts: 3,
                      stage: `odds-multi:${bookmaker}`
                    }
                  );

                  if (Array.isArray(odds)) {
                    for (const event of odds) {
                      mergeCoreEvent(coreEventMap, event);
                    }
                  }
                } catch (error) {
                  snapshot.errors.push({
                    stage: `odds-multi:${bookmaker}`,
                    bookmaker,
                    eventIds,
                    message: String(error?.message || error)
                  });

                  if (
                    error?.code === 'RATE_LIMIT' ||
                    error?.code === 'LOCAL_BUDGET_STOP'
                  ) {
                    break core_pull;
                  }
                }
              }

              coreBatchesUsed++;
            }

            snapshot.events = [...coreEventMap.values()];

            snapshot.diagnostics.coreRequestsUsed =
              requestsUsed - coreRequestStart;
'''
          s = s[:start] + new_block + s[end:]

          old_log = '''            console.log(
              `DraftKings verification: ${snapshot.diagnostics.draftKingsStatus}; ` +
              `${snapshot.diagnostics.draftKingsEvents} events and ` +
              `${snapshot.diagnostics.draftKingsMarkets} markets returned.`
            );
'''
          new_log = '''            const dkCoveragePct = snapshot.diagnostics.bet365Events > 0
              ? Math.round(
                  1000 * snapshot.diagnostics.draftKingsEvents /
                  snapshot.diagnostics.bet365Events
                ) / 10
              : 0;

            console.log(
              `DraftKings verification: ${snapshot.diagnostics.draftKingsStatus}; ` +
              `${snapshot.diagnostics.draftKingsEvents} events and ` +
              `${snapshot.diagnostics.draftKingsMarkets} markets returned; ` +
              `coverage ${dkCoveragePct}% versus Bet365 event coverage.`
            );
'''
          if old_log in s:
              s = s.replace(old_log, new_log, 1)

          p.write_text(s)
          PY

      - name: Validate migration
        run: |
          grep -q "const REQUEST_BUDGET = 90;" .github/workflows/odds-refresh.yml
          grep -q "const DEEP_REQUEST_TARGET = 6;" .github/workflows/odds-refresh.yml
          grep -q "bookmakers: bookmaker" .github/workflows/odds-refresh.yml
          grep -q "attempts: 3" .github/workflows/odds-refresh.yml
          grep -q 'stage: `odds-multi:${bookmaker}`' .github/workflows/odds-refresh.yml
          grep -q "mergeCoreEvent" .github/workflows/odds-refresh.yml

      - name: Commit production migration and clean up
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/one-shot-split-book-pull.yml
          rm -f .github/workflows/apply-split-book-pull.yml
          git add -A .github/workflows
          git commit -m "Split core odds pulls by bookmaker with retries"
          git push origin HEAD:main
