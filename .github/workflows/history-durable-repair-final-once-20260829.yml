name: One-time final durable-history transition repair

on:
  push:
    branches: [history-wait-repair-20260829]
    paths:
      - .github/workflows/history-durable-repair-final-once-20260829.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: history-wait-repair-20260829
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply evidence-preserving transition repairs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const CUTOFF = Date.parse('2026-08-25T15:24:44-07:00');
          const MARKET_ONLY = /\b(bet\s*365|draftkings|odds[-\s]?api(?:\.io)?|live[-\s]?odds|sportsbook(?:\s+pair)?|two[-\s]?book|no[-\s]?vig|market consensus|market-derived)\b/i;
          const index = JSON.parse(fs.readFileSync('run-history.json','utf8'));
          const changedFiles=new Set();
          const repairs=[];
          function nonEmpty(v){return typeof v==='string'&&v.trim().length>0;}
          function validQualification(q){
            if(!q||typeof q!=='object'||Array.isArray(q)||q.actionableIfResolved!==true) return false;
            if(!Array.isArray(q.blockers)||!q.blockers.length||q.blockers.some(x=>!nonEmpty(x))) return false;
            if(!Array.isArray(q.independentSignals)||!q.independentSignals.length) return false;
            for(const s of q.independentSignals){if(!s||typeof s!=='object'||Array.isArray(s)||!nonEmpty(s.origin)||!nonEmpty(s.finding)||MARKET_ONLY.test(s.origin)) return false;}
            return nonEmpty(q.rationale);
          }
          function serialize(original,data){return JSON.stringify(data,null,2)+(original.endsWith('\n')?'\n':'');}
          function deriveQualification(rec){
            const e=rec?.personnelEvidence;
            const support=String(rec?.coreAssessment?.context?.independentCurrentSupport||'').toUpperCase();
            if(!e||typeof e!=='object'||Array.isArray(e)||!['MODERATE','STRONG'].includes(support)) return null;
            const blockers=[...new Set((Array.isArray(e.unresolved)?e.unresolved:[]).filter(nonEmpty).map(x=>String(x).trim()))];
            if(!blockers.length) return null;
            const pool=[...(Array.isArray(e.officialSources)?e.officialSources:[]),...(Array.isArray(e.fallbackSources)?e.fallbackSources:[])];
            const seen=new Set(); const independentSignals=[];
            for(const s of pool){const origin=String(s?.origin||'').trim(); const finding=String(s?.fact||s?.finding||'').trim(); if(!origin||!finding||MARKET_ONLY.test(origin)) continue; const k=origin.toLowerCase().replace(/\s+/g,' '); if(seen.has(k)) continue; seen.add(k); independentSignals.push({origin,finding}); if(independentSignals.length>=2) break;}
            if(!independentSignals.length) return null;
            return {actionableIfResolved:true,blockers,independentSignals,rationale:`Historical WAIT retained because preserved ${support.toLowerCase()} independent current support and the named unresolved gate(s) left a plausible path to materially closer actionability if resolved; fresh re-handicapping, current identity/freshness checks and an executable price were still required.`};
          }
          const entries=(index.runs||[]).filter(e=>e?.researchFitPath&&Number.isFinite(Date.parse(e.ts))&&Date.parse(e.ts)>=CUTOFF).sort((a,b)=>Date.parse(a.ts)-Date.parse(b.ts));
          for(const entry of entries){
            const file=entry.researchFitPath; const original=fs.readFileSync(file,'utf8'); const sidecar=JSON.parse(original); let changed=false;
            for(const rec of sidecar.recommendations||[]){
              if(String(rec?.status||'').toUpperCase()==='WAIT'&&!validQualification(rec.waitQualification)){
                const q=deriveQualification(rec);
                if(!q||!validQualification(q)) throw new Error(`${file} #${rec?.ordinal} ${rec?.title}: WAIT qualification cannot be safely derived`);
                rec.waitQualification=q; changed=true; repairs.push(`WAIT ${entry.ts} #${rec.ordinal} ${rec.title}`);
              }
            }
            if(entry.ts==='2026-08-27T15:21:41.695-07:00'){
              const rec=(sidecar.recommendations||[]).find(r=>r.ordinal===9);
              if(!rec||rec.title!=='Academia del Balompié Boliviano moneyline') throw new Error('Expected August 27 recommendation #9 was not found');
              const e=rec.personnelEvidence;
              if(!e||typeof e!=='object') throw new Error('Academia recommendation is missing personnelEvidence');
              if(!Array.isArray(e.officialSources)) e.officialSources=[];
              if(e.officialSources.length===0){
                e.officialSources.push({
                  origin:'Federación Boliviana de Fútbol — División Profesional',
                  url:'https://fbf.com.bo/torneos/division-profesional/',
                  asOf:new Date().toISOString(),
                  fact:'Post-issuance durable-history repair check: the official FBF División Profesional page lists both Bolívar and A.B.B.; this authority check does not resolve or overwrite the archived official-lineup source shortfall.'
                });
                changed=true; repairs.push(`AUTHORITY ${entry.ts} #9 Academia del Balompié Boliviano moneyline`);
              }
            }
            if(changed){fs.writeFileSync(file,serialize(original,sidecar),'utf8'); changedFiles.add(file);}
          }
          console.log(`REPAIR COUNT ${repairs.length}`); for(const r of repairs) console.log(`REPAIRED ${r}`);
          console.log(`REPAIR FILE COUNT ${changedFiles.size}`); for(const f of changedFiles) console.log(`CHANGED ${f}`);
          if(!changedFiles.size) throw new Error('No durable-history repairs were produced');
          NODE
      - name: Verify complete durable history
        run: |
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history
      - name: Commit repaired history and remove one-time workflows
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/history/research-fit
          git rm -f .github/workflows/history-wait-qualification-repair-once-20260829.yml
          git rm -f .github/workflows/history-durable-audit-once-20260829.yml
          git rm -f .github/workflows/history-durable-repair-final-once-20260829.yml
          git commit -m 'history: repair post-cutover durable-history metadata'
          git push origin HEAD:history-wait-repair-20260829
      - name: Remote read-back verification
        run: |
          git fetch origin history-wait-repair-20260829
          git reset --hard origin/history-wait-repair-20260829
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history
