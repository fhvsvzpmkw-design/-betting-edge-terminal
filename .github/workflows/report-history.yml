name: Report history publication
# Production report bundle validation and durable publication.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify current history or publish one complete report bundle
        required: true
        type: choice
        options:
          - verify
          - publish
        default: verify
      report_json_b64:
        description: Base64 or Base64URL encoded validated issued report JSON (publish mode)
        required: false
        type: string
      sidecar_json_b64:
        description: Base64 or Base64URL encoded matching schema-3 Research Fit/Core provenance sidecar JSON (publish mode)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - BETTING_EDGE_CONTRACT.md
      - core/core-v1.4-production.json
      - core/core-handicap-framework-v1.4.json
      - core/walters-intelligence-interface-v1.4.json
      - core/walters-authority-v1.4.json
      - data/history/report-provenance-schema.json
      - data/history/runs/**
      - data/history/research-fit/**
      - data/history/staging/report-bundle.json
      - run-history.json
      - tools/core-handicap-framework.mjs
      - tools/core-v14-publication-gate.mjs
      - tools/report-publication.mjs
      - tests/report-bundle-preflight.test.mjs
      - tools/moneyline-lineage.mjs
      - tests/moneyline-lineage.test.mjs
      - tools/primary-lineage.mjs
      - tests/spread-price-movement.test.mjs
      - tools/total-lineage.mjs
      - tools/selection-continuity.mjs
      - tools/major-sport-market-coverage-gate.mjs
      - tests/total-lineage.test.mjs
      - tools/spread-lineage.mjs
      - tools/selection-availability.mjs
      - tests/selection-availability.test.mjs
      - tests/spread-lineage-reconciliation.test.js
      - tests/spread-lineage-primary-line-fixtures.test.js
      - tests/fixtures/spread-lineage-primary-lines.json
      - .github/workflows/report-history.yml
  pull_request:
    paths:
      - BETTING_EDGE_CONTRACT.md
      - core/core-v1.4-production.json
      - core/core-handicap-framework-v1.4.json
      - core/walters-intelligence-interface-v1.4.json
      - core/walters-authority-v1.4.json
      - data/history/report-provenance-schema.json
      - data/history/runs/**
      - data/history/research-fit/**
      - run-history.json
      - tools/core-handicap-framework.mjs
      - tools/core-v14-publication-gate.mjs
      - tools/report-publication.mjs
      - tests/report-bundle-preflight.test.mjs
      - tools/moneyline-lineage.mjs
      - tests/moneyline-lineage.test.mjs
      - tools/primary-lineage.mjs
      - tests/spread-price-movement.test.mjs
      - tools/total-lineage.mjs
      - tools/selection-continuity.mjs
      - tools/major-sport-market-coverage-gate.mjs
      - tests/total-lineage.test.mjs
      - tools/spread-lineage.mjs
      - tools/selection-availability.mjs
      - tests/selection-availability.test.mjs
      - tests/spread-lineage-reconciliation.test.js
      - tests/spread-lineage-primary-line-fixtures.test.js
      - tests/fixtures/spread-lineage-primary-lines.json
      - .github/workflows/report-history.yml

concurrency:
  group: betting-edge-report-history
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Core 1.4 model-error framework
        run: node tools/core-handicap-framework.mjs self-test
      - name: Exercise Core 1.4 production gate
        run: node tools/core-v14-publication-gate.mjs self-test
      - name: Exercise publisher path
        run: node tools/report-publication.mjs self-test
      - name: Exercise read-only pre-freeze bundle validation
        run: node tests/report-bundle-preflight.test.mjs
      - name: Exercise tracked selection availability
        run: node tests/selection-availability.test.mjs
      - name: Exercise seven-sport moneyline prices and history
        run: node tests/moneyline-lineage.test.mjs
      - name: Exercise seven-sport total movement and continuity
        run: node tests/total-lineage.test.mjs
      - name: Exercise seven-sport spread, run-line and puck-line movement
        run: node tests/spread-price-movement.test.mjs
      - name: Exercise spread-lineage path
        run: node tests/spread-lineage-reconciliation.test.js
      - name: Exercise spread primary-line fixtures
        run: node tests/spread-lineage-primary-line-fixtures.test.js
      - name: Verify durable report history
        run: node tools/report-publication.mjs verify
      - name: Verify Core 1.4 post-cutover history
        run: node tools/core-v14-publication-gate.mjs verify-history

  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || (github.event_name == 'push' && github.event.head_commit != null && (contains(github.event.head_commit.modified, 'data/history/staging/report-bundle.json') || contains(github.event.head_commit.added, 'data/history/staging/report-bundle.json'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require clean durable history before candidate publication
        run: |
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history
      - name: Decode manual bundle inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REPORT_JSON_B64: ${{ inputs.report_json_b64 }}
          SIDECAR_JSON_B64: ${{ inputs.sidecar_json_b64 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function decode(name, target) {
            let value = String(process.env[name] || '').trim();
            if (!value) throw new Error(`${name} is required in publish mode`);
            value = value.replace(/-/g, '+').replace(/_/g, '/');
            while (value.length % 4) value += '=';
            const bytes = Buffer.from(value, 'base64');
            if (!bytes.length) throw new Error(`${name} decoded to an empty value`);
            fs.writeFileSync(target, bytes);
          }
          decode('REPORT_JSON_B64', '/tmp/report.json');
          decode('SIDECAR_JSON_B64', '/tmp/sidecar.json');
          NODE
      - name: Extract staged candidate bundle
        if: ${{ github.event_name == 'push' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const bundle = JSON.parse(fs.readFileSync('data/history/staging/report-bundle.json', 'utf8'));
          if (bundle.schema !== 1) throw new Error('Staging bundle schema must be 1');
          if (bundle.state !== 'READY') throw new Error('Staging bundle state must be READY');
          if (typeof bundle.candidateId !== 'string' || !bundle.candidateId.trim()) throw new Error('Staging candidateId is required');
          if (typeof bundle.phase !== 'string' || !bundle.phase.trim()) throw new Error('Staging phase is required');
          if (!bundle.report || typeof bundle.report !== 'object' || Array.isArray(bundle.report)) throw new Error('Staging report object is required');
          if (!bundle.sidecar || typeof bundle.sidecar !== 'object' || Array.isArray(bundle.sidecar)) throw new Error('Staging sidecar object is required');
          if (bundle.sidecar.schema !== 3) throw new Error('Staging sidecar schema must be 3');
          if (!bundle.report.ts || !Number.isFinite(Date.parse(bundle.report.ts))) throw new Error('Staging report.ts must be a valid timestamp');
          fs.writeFileSync('/tmp/report.json', JSON.stringify(bundle.report, null, 2) + '\n');
          fs.writeFileSync('/tmp/sidecar.json', JSON.stringify(bundle.sidecar, null, 2) + '\n');
          NODE
      - name: Enforce Core 1.4 production handicap and Walters authority
        run: node tools/core-v14-publication-gate.mjs validate --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Guard tracked selection continuity
        run: node tools/selection-continuity.mjs audit --report /tmp/report.json
      - name: Verify every displayed moneyline and price movement
        run: node tools/moneyline-lineage.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Verify tracked non-spread book availability
        run: node tools/selection-availability.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Reconcile tracked spread lineage
        run: node tools/spread-lineage.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Reconcile tracked full-game total lineage
        run: node tools/total-lineage.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Validate bundle and derive paths
        id: bundle
        run: node tools/report-publication.mjs publish --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Commit payload, sidecar and index together
        env:
          REPORT_TS: ${{ steps.bundle.outputs.report_ts }}
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          published=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node tools/report-publication.mjs verify
            node tools/core-v14-publication-gate.mjs verify-history
            node tools/core-v14-publication-gate.mjs validate --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/moneyline-lineage.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/spread-lineage.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/total-lineage.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/report-publication.mjs publish --report /tmp/report.json --sidecar /tmp/sidecar.json
            git add -- "$REPORT_PATH" "$SIDECAR_PATH" run-history.json
            if git diff --cached --quiet; then
              echo "Bundle already exists unchanged."
              published=1
              break
            fi
            git commit -m "history: publish ${REPORT_TS} report bundle"
            if git push origin HEAD:main; then
              published=1
              break
            fi
            echo "Push raced another repository update; retrying from current main."
          done
          test "$published" -eq 1
      - name: Remote read-back gate
        env:
          REPORT_TS: ${{ steps.bundle.outputs.report_ts }}
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          node tools/report-publication.mjs verify --ts "$REPORT_TS"
          node tools/moneyline-lineage.mjs audit --report "$REPORT_PATH" --sidecar "$SIDECAR_PATH"
          node tools/spread-lineage.mjs audit --report "$REPORT_PATH" --sidecar "$SIDECAR_PATH"
          node tools/total-lineage.mjs audit --report "$REPORT_PATH" --sidecar "$SIDECAR_PATH"
          node tools/core-v14-publication-gate.mjs verify-history
      - name: Publication summary
        env:
          SHORT_ID: ${{ steps.bundle.outputs.short_id }}
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: |
          {
            echo "## Betting Edge report history published"
            echo
            echo "- Short ID: \`$SHORT_ID\`"
            echo "- Report: \`$REPORT_PATH\`"
            echo "- Sidecar: \`$SIDECAR_PATH\`"
            echo "- Index: \`run-history.json\`"
            echo "- Preflight history: passed"
            echo "- Core gate: passed"
            echo "- Read-back: passed"
            echo "- Link: https://fhvsvzpmkw-design.github.io/-betting-edge-terminal/r.html?id=$SHORT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
