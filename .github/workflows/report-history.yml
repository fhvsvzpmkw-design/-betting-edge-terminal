name: Report history publication
# Recovery verification trigger for the complete 2026-08-17 15:15 report bundle.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify current history or publish one complete report bundle
        required: true
        type: choice
        options:
          - verify
          - publish
        default: verify
      report_json_b64:
        description: Base64 or Base64URL encoded validated issued report JSON (publish mode)
        required: false
        type: string
      sidecar_json_b64:
        description: Base64 or Base64URL encoded matching schema-3 Research Fit sidecar JSON (publish mode)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - BETTING_EDGE_CONTRACT.md
      - data/history/runs/**
      - data/history/research-fit/**
      - run-history.json
      - tools/report-publication.mjs
      - tools/spread-lineage.mjs
      - tests/spread-lineage-reconciliation.test.js
      - tests/spread-lineage-primary-line-fixtures.test.js
      - tests/fixtures/spread-lineage-primary-lines.json
      - .github/workflows/report-history.yml
  pull_request:
    paths:
      - BETTING_EDGE_CONTRACT.md
      - data/history/runs/**
      - data/history/research-fit/**
      - run-history.json
      - tools/report-publication.mjs
      - tools/spread-lineage.mjs
      - tests/spread-lineage-reconciliation.test.js
      - tests/spread-lineage-primary-line-fixtures.test.js
      - tests/fixtures/spread-lineage-primary-lines.json
      - .github/workflows/report-history.yml

concurrency:
  group: betting-edge-report-history
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise publisher path
        run: node tools/report-publication.mjs self-test
      - name: Exercise spread-lineage path
        run: node tests/spread-lineage-reconciliation.test.js
      - name: Exercise spread primary-line fixtures
        run: node tests/spread-lineage-primary-line-fixtures.test.js
      - name: Verify durable report history
        run: node tools/report-publication.mjs verify

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode bundle inputs
        env:
          REPORT_JSON_B64: ${{ inputs.report_json_b64 }}
          SIDECAR_JSON_B64: ${{ inputs.sidecar_json_b64 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function decode(name, target) {
            let value = String(process.env[name] || '').trim();
            if (!value) throw new Error(`${name} is required in publish mode`);
            value = value.replace(/-/g, '+').replace(/_/g, '/');
            while (value.length % 4) value += '=';
            const bytes = Buffer.from(value, 'base64');
            if (!bytes.length) throw new Error(`${name} decoded to an empty value`);
            fs.writeFileSync(target, bytes);
          }
          decode('REPORT_JSON_B64', '/tmp/report.json');
          decode('SIDECAR_JSON_B64', '/tmp/sidecar.json');
          NODE
      - name: Guard tracked selection continuity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/report.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync('run-history.json', 'utf8'));
          const reportMs = Date.parse(report.ts);
          const day = String(report.ts || '').slice(0, 10);
          const prior = (index.runs || [])
            .filter(entry => String(entry.ts || '').slice(0, 10) === day && Date.parse(entry.ts) < reportMs && entry.path)
            .sort((a, b) => Date.parse(b.ts) - Date.parse(a.ts))[0];
          if (!prior) {
            console.log('SELECTION CONTINUITY OK: no prior same-day report');
            process.exit(0);
          }
          const previous = JSON.parse(fs.readFileSync(prior.path, 'utf8'));
          const currentByKey = new Map((report.recs || []).map(rec => [String(rec?.feed?.selectionKey || '').trim(), rec]).filter(([key]) => key));
          const currentSpreadByEventSide = new Map((report.recs || [])
            .filter(rec => String(rec?.feed?.marketKey || rec?.feed?.market || '').toLowerCase() === 'spread' && rec?.feed?.eventId && rec?.feed?.side)
            .map(rec => [`${rec.feed.eventId}|${String(rec.feed.side).toLowerCase()}`, rec]));
          const active = new Set(['BET', 'LEAN', 'WAIT']);
          const resolved = new Set(['BET', 'LEAN', 'WAIT', 'PASS']);
          const missing = [];
          for (const rec of previous.recs || []) {
            const priorStatus = String(rec?.status || '').toUpperCase();
            if (!active.has(priorStatus)) continue;
            const key = String(rec?.feed?.selectionKey || '').trim();
            if (!key) continue;
            const current = currentByKey.get(key);
            if (current) {
              const nextStatus = String(current?.status || '').toUpperCase();
              if (!resolved.has(nextStatus)) {
                throw new Error(`SELECTION CONTINUITY VIOLATION: tracked selection ${key} must receive a fresh BET/LEAN/WAIT/PASS decision; got ${current?.status}`);
              }
              const stake = Number(String(current?.stake ?? '0').replace(/[$,\s]/g, ''));
              if (nextStatus === 'BET') {
                if (!(Number.isFinite(stake) && stake > 0)) throw new Error(`SELECTION CONTINUITY VIOLATION: ${key} resolved to BET without positive stake`);
                if (!String(current?.price || '').trim() || !String(current?.fair || '').trim() || !String(current?.playTo || '').trim()) {
                  throw new Error(`SELECTION CONTINUITY VIOLATION: ${key} resolved to BET without current price, fair value and playTo`);
                }
              } else if (Number.isFinite(stake) && stake !== 0) {
                throw new Error(`SELECTION CONTINUITY VIOLATION: ${key} resolved to ${nextStatus} with non-zero stake`);
              }
              console.log(`SELECTION CONTINUITY RE-EVALUATED: ${key} ${priorStatus} -> ${nextStatus}`);
              continue;
            }
            const eventDate = String(rec?.feed?.eventDate || '').trim();
            const eventMs = Date.parse(eventDate);
            if (Number.isFinite(eventMs) && reportMs >= eventMs) continue;
            const marketKey = String(rec?.feed?.marketKey || rec?.feed?.market || '').toLowerCase();
            if (marketKey === 'spread' && rec?.feed?.eventId && rec?.feed?.side) {
              const lineageKey = `${rec.feed.eventId}|${String(rec.feed.side).toLowerCase()}`;
              const movedSpread = currentSpreadByEventSide.get(lineageKey);
              if (movedSpread) {
                console.log(`SELECTION CONTINUITY DEFERRED TO SPREAD LINEAGE: ${key} -> ${String(movedSpread?.feed?.selectionKey || 'NEW LINE')}`);
                continue;
              }
            }
            missing.push(`${rec.status} ${rec.title} [${key}] event=${eventDate || 'UNKNOWN'}`);
          }
          if (missing.length) {
            throw new Error(`SELECTION CONTINUITY VIOLATION: a tracked BET/LEAN/WAIT vanished before event start. Carry it forward and freshly re-evaluate it as BET/LEAN/WAIT/PASS on the current snapshot; prior status is not sticky and BET is allowed when all current gates pass. A sportsbook dropping the market does not authorize silent omission. Prior=${prior.path}. Missing: ${missing.join('; ')}`);
          }
          console.log(`SELECTION CONTINUITY OK: ${prior.path}`);
          NODE
      - name: Reconcile tracked spread lineage
        run: node tools/spread-lineage.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Validate bundle and derive paths
        id: bundle
        run: node tools/report-publication.mjs publish --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Commit payload, sidecar and index together
        env:
          REPORT_TS: ${{ steps.bundle.outputs.report_ts }}
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          published=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node tools/report-publication.mjs publish --report /tmp/report.json --sidecar /tmp/sidecar.json
            git add -- "$REPORT_PATH" "$SIDECAR_PATH" run-history.json
            if git diff --cached --quiet; then
              echo "Bundle already exists unchanged."
              published=1
              break
            fi
            git commit -m "history: publish ${REPORT_TS} report bundle"
            if git push origin HEAD:main; then
              published=1
              break
            fi
            echo "Push raced another repository update; retrying from current main."
          done
          test "$published" -eq 1
      - name: Remote read-back gate
        env:
          REPORT_TS: ${{ steps.bundle.outputs.report_ts }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          node tools/report-publication.mjs verify --ts "$REPORT_TS"
      - name: Publication summary
        env:
          SHORT_ID: ${{ steps.bundle.outputs.short_id }}
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: |
          {
            echo "## Betting Edge report history published"
            echo
            echo "- Short ID: \`$SHORT_ID\`"
            echo "- Report: \`$REPORT_PATH\`"
            echo "- Sidecar: \`$SIDECAR_PATH\`"
            echo "- Index: \`run-history.json\`"
            echo "- Read-back: passed"
            echo "- Link: https://fhvsvzpmkw-design.github.io/-betting-edge-terminal/r.html?id=$SHORT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
