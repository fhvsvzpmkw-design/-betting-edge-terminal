name: Verify report history
# Verification only. report-history-staged.yml is the sole History writer.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/history/runs/**
      - data/history/research-fit/**
      - run-history.json
      - tools/report-pipeline.mjs
      - tools/report-publication.mjs
permissions:
  contents: read
concurrency:
  group: betting-edge-history-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify durable history
        run: node tools/report-pipeline.mjs history
