name: Set basic analysis defaults

on:
  push:
    branches: [ui/basic-analysis-defaults]
    paths:
      - '.github/workflows/set-basic-analysis-defaults.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/basic-analysis-defaults
      - name: Make basic read-through the default review depth
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          prefs_path=Path('data/preferences.json')
          prefs=json.loads(prefs_path.read_text())
          found=set()
          for module in prefs.get('modules',[]):
              if module.get('id') in {'meat_desk_analysis','crypto_specials_analysis'}:
                  module['default']='basic_readthrough'
                  found.add(module.get('id'))
          if found != {'meat_desk_analysis','crypto_specials_analysis'}:
              raise SystemExit(f'missing analysis preference modules: {found}')
          prefs_path.write_text(json.dumps(prefs,indent=2,ensure_ascii=False)+'\n')

          meat=Path('assets/season-previews-ui.js')
          s=meat.read_text()
          old="""function analysisModeLabel(){
  let value='god_mode';
  try{value=localStorage.getItem(ANALYSIS_MODE_KEY)||'god_mode'}catch{}
  return ({basic_readthrough:'BASIC READ-THROUGH',in_depth_report:'IN-DEPTH REPORT',god_mode:'GOD MODE'})[value]||'GOD MODE';
}"""
          new="""function analysisModeLabel(){
  let value='basic_readthrough';
  try{value=localStorage.getItem(ANALYSIS_MODE_KEY)||'basic_readthrough'}catch{}
  return ({basic_readthrough:'BASIC READ-THROUGH',in_depth_report:'IN-DEPTH REPORT',god_mode:'GOD MODE'})[value]||'BASIC READ-THROUGH';
}"""
          if old not in s:
              raise SystemExit('Meat Desk analysisModeLabel block not found')
          meat.write_text(s.replace(old,new))

          crypto=Path('assets/special-desks-ui.js')
          s=crypto.read_text()
          old="""function cryptoAnalysisModeLabel(){
  let value='god_mode';
  try{value=localStorage.getItem(CRYPTO_ANALYSIS_MODE_KEY)||'god_mode'}catch{}
  return ({basic_readthrough:'BASIC READ-THROUGH',in_depth_report:'IN-DEPTH REPORT',god_mode:'GOD MODE'})[value]||'GOD MODE';
}"""
          new="""function cryptoAnalysisModeLabel(){
  let value='basic_readthrough';
  try{value=localStorage.getItem(CRYPTO_ANALYSIS_MODE_KEY)||'basic_readthrough'}catch{}
  return ({basic_readthrough:'BASIC READ-THROUGH',in_depth_report:'IN-DEPTH REPORT',god_mode:'GOD MODE'})[value]||'BASIC READ-THROUGH';
}"""
          if old not in s:
              raise SystemExit('Crypto analysisModeLabel block not found')
          crypto.write_text(s.replace(old,new))

          dash=Path('assets/report-dashboard-vigscope.js')
          d=dash.read_text()
          d=d.replace("specialDesks.src='./assets/special-desks-ui.js?v=3';","specialDesks.src='./assets/special-desks-ui.js?v=4';")
          d=d.replace("seasonPreviews.src='./assets/season-previews-ui.js?v=5';","seasonPreviews.src='./assets/season-previews-ui.js?v=6';")
          dash.write_text(d)

          runner=Path('runner.html')
          r=runner.read_text().replace('report-dashboard-vigscope.js?v=20260821-1810','report-dashboard-vigscope.js?v=20260821-1815')
          runner.write_text(r)
          PY
      - name: Commit default changes
        shell: bash
        run: |
          if git diff --quiet -- data/preferences.json assets/season-previews-ui.js assets/special-desks-ui.js assets/report-dashboard-vigscope.js runner.html; then
            echo 'Already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add -- data/preferences.json assets/season-previews-ui.js assets/special-desks-ui.js assets/report-dashboard-vigscope.js runner.html
          git commit -m 'Default source reviews to basic read-through'
          git push origin ui/basic-analysis-defaults

# trigger
