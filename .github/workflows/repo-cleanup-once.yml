name: Betting Edge one-time repo cleanup

on:
  push:
    paths:
      - '.github/workflows/repo-cleanup-once.yml'

permissions:
  contents: write

concurrency:
  group: betting-edge-repo-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply narrow cleanup patches
        run: |
          python <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json

          runner_path = Path('runner.html')
          index_path = Path('index.html')
          ledger_path = Path('data/betting-ledger.json')
          manifest_path = Path('research/manifest.json')
          checksums_path = Path('research/CHECKSUMS.json')
          contract_path = Path('BETTING_EDGE_CONTRACT_DRAFT_v0.8.md')

          if not contract_path.exists():
              raise SystemExit('v0.8 contract draft is missing; refusing manifest compatibility update.')

          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          unique_wagers = int(ledger.get('validation', {}).get('uniqueWagers', 0))
          pages = int(ledger.get('validation', {}).get('pagesAt10Rows', 0))
          if unique_wagers != 1624 or pages != 163:
              raise SystemExit(f'Ledger authority mismatch: uniqueWagers={unique_wagers}, pages={pages}')

          runner = runner_path.read_text(encoding='utf-8')
          old_history = 'MASTER LEDGER // 1,622 WAGERS // 163 PAGES'
          new_history = f'MASTER LEDGER // {unique_wagers:,} WAGERS // {pages} PAGES'
          if runner.count(old_history) != 1:
              raise SystemExit(f'Expected exactly one stale runner history label; found {runner.count(old_history)}')
          runner_path.write_text(runner.replace(old_history, new_history), encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          old_version_count = index.count('v1.2')
          if old_version_count < 1:
              raise SystemExit('No v1.2 static-shell labels found in index.html; refusing blind version edit.')
          index_path.write_text(index.replace('v1.2', 'v1.3'), encoding='utf-8')

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['generatedAtUtc'] = now
          manifest.setdefault('contractCompatibility', {})['draftVersion'] = '0.8'
          manifest['contractCompatibility']['status'] = 'compatible_for_R2_manual_read_test'
          manifest_text = json.dumps(manifest, indent=2, ensure_ascii=False) + '\n'
          manifest_path.write_text(manifest_text, encoding='utf-8')

          manifest_bytes = manifest_text.encode('utf-8')
          manifest_sha256 = hashlib.sha256(manifest_bytes).hexdigest()
          manifest_size = len(manifest_bytes)

          checksums = json.loads(checksums_path.read_text(encoding='utf-8'))
          checksums['generatedAtUtc'] = now
          matches = [x for x in checksums.get('files', []) if x.get('path') == 'research/manifest.json']
          if len(matches) != 1:
              raise SystemExit(f'Expected one manifest checksum entry; found {len(matches)}')
          matches[0]['sizeBytes'] = manifest_size
          matches[0]['sha256'] = manifest_sha256
          checksums_path.write_text(json.dumps(checksums, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          print(f'Runner history label: {new_history}')
          print(f'index.html v1.2 labels upgraded: {old_version_count}')
          print(f'Research manifest compatibility: draft 0.8')
          print(f'Manifest checksum: {manifest_sha256}')
          PY

      - name: Validate cleanup invariants
        run: |
          python <<'PY'
          from pathlib import Path
          import hashlib
          import json

          runner = Path('runner.html').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          ledger = json.loads(Path('data/betting-ledger.json').read_text(encoding='utf-8'))
          manifest_bytes = Path('research/manifest.json').read_bytes()
          manifest = json.loads(manifest_bytes)
          checksums = json.loads(Path('research/CHECKSUMS.json').read_text(encoding='utf-8'))

          assert ledger['validation']['uniqueWagers'] == 1624
          assert ledger['validation']['pagesAt10Rows'] == 163
          assert 'MASTER LEDGER // 1,624 WAGERS // 163 PAGES' in runner
          assert 'MASTER LEDGER // 1,622 WAGERS // 163 PAGES' not in runner
          assert 'v1.2' not in index
          assert 'v1.3' in index
          assert manifest['contractCompatibility']['draftVersion'] == '0.8'
          assert manifest['runtime']['scheduledReportsLinked'] is False
          assert manifest['runtime']['writeRequired'] is False

          expected = hashlib.sha256(manifest_bytes).hexdigest()
          entry = next(x for x in checksums['files'] if x['path'] == 'research/manifest.json')
          assert entry['sha256'] == expected
          assert entry['sizeBytes'] == len(manifest_bytes)
          print('All cleanup invariants PASS.')
          PY

      - name: Commit cleanup
        run: |
          git config user.name 'betting-edge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add runner.html index.html research/manifest.json research/CHECKSUMS.json
          if git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git commit -m 'Clean Betting Edge repo metadata'
          git push
