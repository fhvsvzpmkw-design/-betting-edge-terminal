name: Eddie V3 remove main hero once

on:
  push:
    paths:
      - '.github/workflows/eddie-v3-remove-main-hero-once.yml'

permissions:
  contents: write

jobs:
  remove-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove oversized Eddie hero block
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          page = Path('syndicates/generated/eddie-numbers/hotline.html')
          s = page.read_text()
          hero = '<section class="panel heroart" data-zone="hero"><img src="../../../assets/syndicates/01_eddie_numbers_main_hero.png" alt="Illustrated Eddie Numbers at a Las Vegas sportsbook analysis desk"><div class="artnote">MUDDY NUMBERS VISUAL DESK // ILLUSTRATION ONLY. BANKROLL, P/L, ROI, CHARTS AND TICKET RESULTS BELOW ARE GENERATED FROM THE PUBLIC LEDGER.</div></section>\n'
          if hero not in s:
              raise SystemExit('Expected Eddie hero section not found')
          s = s.replace(hero, '', 1)
          s = s.replace('.heroart{margin-top:10px;overflow:hidden;position:relative;border-color:#806426}.heroart img{display:block;width:100%;max-height:590px;object-fit:cover}.artnote{position:absolute;left:10px;right:10px;bottom:10px;padding:8px 10px;border:1px solid #735f27;border-radius:8px;background:#02070ce9;color:#d7bf7a;font-size:8px;font-weight:900;letter-spacing:.08em}', '', 1)
          s = s.replace('.artnote{position:static;border-width:1px 0 0;border-radius:0}', '', 1)
          page.write_text(s)

          reg_path = Path('data/hotline-shells.json')
          reg = json.loads(reg_path.read_text())
          for sh in reg['shells']:
              if sh.get('id') == 'muddy-ledger-desk':
                  sh['description'] = 'Image-rich high-gloss Las Vegas sportsbook main-sheet presentation for Eddie “Muddy” Numbers: wide banner, Ledger Desk logo and Eddie portrait layered over authoritative public-ledger accounting, charts, Muddy Meters and recent-ticket analysis.'
                  sh['compatibility']['requiredZones'] = [z for z in sh['compatibility']['requiredZones'] if z != 'hero']
                  break
          reg_path.write_text(json.dumps(reg, indent=2, ensure_ascii=False) + '\n')

          prof_path = Path('data/characters/eddie-numbers.json')
          prof = json.loads(prof_path.read_text())
          prof['updatedAt'] = '2026-08-23T19:38:00-07:00'
          hs = prof['hotlineStyle']
          hs['layoutStyle'] = 'Image-rich V3 control room with a wide Muddy Numbers banner, standalone Ledger Desk logo, live public-ledger scoreboard, cumulative P/L curve, weekly and monthly reconciliation, sport and book bars, transparent Muddy Meters, recent-ticket tape and an Eddie portrait beside the analyst close.'
          hs['signatureSections'] = [x for x in hs['signatureSections'] if x != 'image-rich Las Vegas main-sheet hero']
          prof_path.write_text(json.dumps(prof, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Verify hero is gone
        run: |
          ! grep -F '01_eddie_numbers_main_hero.png' syndicates/generated/eddie-numbers/hotline.html
          ! grep -F 'data-zone="hero"' syndicates/generated/eddie-numbers/hotline.html
          grep -F '04_eddie_numbers_header_banner.png' syndicates/generated/eddie-numbers/hotline.html
          grep -F '02_eddie_numbers_portrait_cutout.png' syndicates/generated/eddie-numbers/hotline.html
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syndicates/generated/eddie-numbers/hotline.html data/hotline-shells.json data/characters/eddie-numbers.json
          git diff --cached --quiet && exit 0
          git commit -m "Remove oversized Eddie V3 hero image"
          git push
