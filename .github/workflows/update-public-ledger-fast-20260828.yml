name: Fast public ledger update 2026-08-28

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-public-ledger-fast-20260828.yml'

permissions:
  contents: write

jobs:
  update-public-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Update canonical public ledger through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime, timezone

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          path = 'data/ledger/public-ledger.json'
          url = f'https://api.github.com/repos/{repo}/contents/{path}?ref=main'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'betting-edge-public-ledger-updater'
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              payload = json.load(resp)
          sha = payload['sha']
          data = json.loads(base64.b64decode(payload['content']).decode('utf-8'))

          if data.get('schema') != 2 or data.get('publicProjection') is not True:
              raise SystemExit('Unexpected public ledger contract')
          wagers = data.get('wagers')
          if not isinstance(wagers, list):
              raise SystemExit('Public wagers missing')
          if any((not isinstance(r, list)) or len(r) < 18 or r[2] is not None for r in wagers):
              raise SystemExit('Public ledger privacy validation failed before update')
          if len(wagers) not in (1624, 1627):
              raise SystemExit(f'Unexpected starting public wager count: {len(wagers)}')

          additions = [
              [1625, 'Bet365', None, '2026-08-27 02:29:47+00', '2026-08-27 02:29:47+00', 'Basketball', 'WNBA', 'TOR Tempo @ SEA Storm - TOR Tempo +6.5 - Point Spread', -110, 5.5, 'Lost', -5.5, 'AFTER START', 0, False, ['Seattle Storm vs Toronto Tempo'], ['TOR Tempo @ SEA Storm - TOR Tempo +6.5 - Point Spread'], '[]'],
              [1626, 'Bet365', None, '2026-08-28 01:02:08+00', '2026-08-28 01:02:08+00', 'Basketball', 'WNBA', 'GS Valkyries @ NY Liberty - GS Valkyries - Money Line', 122, 5.5, 'Won', 6.71, 'AFTER START', -0.0114, False, ['New York Liberty vs Golden State Valkyries'], ['GS Valkyries @ NY Liberty - GS Valkyries - Money Line'], '[]'],
              [1627, 'Bet365', None, '2026-08-28 01:04:56+00', '2026-08-28 01:04:56+00', 'Baseball', 'MLB', 'LA Dodgers @ ATL Braves - LA Dodgers - Money Line', 185, 5.5, 'Lost', -5.5, 'AFTER START', None, False, ['Atlanta Braves vs Los Angeles Dodgers'], ['LA Dodgers @ ATL Braves - LA Dodgers - Money Line'], '[]']
          ]

          if len(wagers) == 1624:
              if [int(r[0]) for r in wagers] != list(range(1, 1625)):
                  raise SystemExit('Existing public surrogate IDs are not contiguous 1..1624')
              wagers.extend(additions)
          else:
              if [int(r[0]) for r in wagers[-3:]] != [1625, 1626, 1627]:
                  raise SystemExit('Existing 1627-wager public ledger has unexpected tail IDs')

          data['generatedAt'] = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          data['bankrollCad'] = 495.41
          data['validation'] = {'uniqueWagers': 1627, 'pagesAt10Rows': 163, 'status': 'PASS'}
          data['summary'] = {
              'cashBets': 1514,
              'cashRisked': 8921.37,
              'cashProfit': 163.57,
              'cashRoiPercent': 1.83,
              'resultMix': {'Won': 638, 'Lost': 851, 'CashedOut': 133, 'Push': 2, 'Cancelled': 3}
          }

          if len(wagers) != 1627 or any(r[2] is not None for r in wagers):
              raise SystemExit('Final public projection validation failed')

          content = (json.dumps(data, indent=2, ensure_ascii=False) + '\n').encode('utf-8')
          body = json.dumps({
              'message': 'ledger: publish sanitized Aug 28 public projection',
              'content': base64.b64encode(content).decode('ascii'),
              'sha': sha,
              'branch': 'main'
          }).encode('utf-8')
          put = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}',
              data=body,
              headers={**headers, 'Content-Type': 'application/json'},
              method='PUT'
          )
          with urllib.request.urlopen(put) as resp:
              result = json.load(resp)
          print('PUBLIC LEDGER COMMIT:', result['commit']['sha'])
          PY
