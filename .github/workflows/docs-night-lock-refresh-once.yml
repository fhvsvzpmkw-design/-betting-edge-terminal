name: Refresh night-lock docs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-night-lock-refresh-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh current documentation boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          # PROJECT STATE
          p=Path('docs/PROJECT_STATE.md')
          s=p.read_text()
          old='**Last updated:** 2026-08-22 — Contract v1.0 / VigScope UI v1.5 production consolidation  '
          new='**Last updated:** 2026-08-24 — VigScope UI v1.5 night-lock checkpoint  '
          assert old in s, 'PROJECT_STATE last-updated marker not found'
          s=s.replace(old,new,1)
          marker='- **Authoritative rollback system:** Git history.\n'
          insert='- **Night-lock checkpoint:** branch `night-lock-2026-08-24` at main commit `1e1551baa6bf5dfc4104ad21e33424969466402b` — Contract v1.0 / Terminal UI v1.5 / core v1.3 / Research Library v1.7.\n'
          assert marker in s, 'PROJECT_STATE rollback marker not found'
          assert insert not in s
          s=s.replace(marker,marker+insert,1)
          p.write_text(s)

          # DECISIONS
          p=Path('docs/DECISIONS.md')
          s=p.read_text()
          old='**Last updated:** 2026-08-18 — odds-refresh scheduler simplification'
          new='**Last updated:** 2026-08-24 — current production/version boundary clarified'
          assert old in s, 'DECISIONS last-updated marker not found'
          s=s.replace(old,new,1)
          marker='This file records durable project decisions and the reasoning behind them. It exists so future changes do not accidentally undo choices that were already made intentionally.\n'
          boundary='''\n## Current production boundary\n\nAs of the 2026-08-24 night lock, current production authority is **Betting Edge Contract v1.0 OPERATIONAL**, **VigScope Terminal UI v1.5**, **report engine/core v1.3**, and **Research Library v1.7 read-only**. Earlier decision entries that describe v0.9, v1.3.x UI patches, or other prior versions as current record the state that existed when those decisions were made; they remain historical evidence and do not override this current boundary.\n'''
          assert marker in s, 'DECISIONS intro marker not found'
          assert '## Current production boundary' not in s
          s=s.replace(marker,marker+boundary,1)
          old='''## D-025 — v0.9 is the operational production contract\n\n**Status:** Active as of 2026-08-15\n\n`BETTING_EDGE_CONTRACT.md` is the authoritative production governance file and declares version 0.9 operational.'''
          new='''## D-025 — v0.9 operational contract promotion\n\n**Status:** Superseded by Contract v1.0 on 2026-08-22\n\n`BETTING_EDGE_CONTRACT.md` was deliberately promoted as version 0.9 operational on 2026-08-15. This entry records that historical promotion; current production authority is Contract v1.0.'''
          assert old in s, 'DECISIONS D-025 current-authority text not found'
          s=s.replace(old,new,1)
          p.write_text(s)

          # ROADMAP
          p=Path('docs/ROADMAP.md')
          s=p.read_text()
          replacements=[
            ('**Last updated:** 2026-08-16 — first real v1.8 shadow comparison complete; promotion still on hold',
             '**Last updated:** 2026-08-24 — Contract v1.0 / VigScope UI v1.5 night-lock alignment; v1.8 Research Library promotion still on hold'),
            ('- Runner is at **v1.3**.\n- Static shell is aligned to v1.3.',
             '- Terminal / product presentation is **VigScope Terminal UI v1.5**.\n- Report engine/core remains **v1.3** in `runner-core.html` + `index.html`; the UI and core versions are intentionally independent.'),
            ('- `BETTING_EDGE_CONTRACT.md` **v0.9 is OPERATIONAL**.',
             '- `BETTING_EDGE_CONTRACT.md` **v1.0 is OPERATIONAL**; v0.9 remains immutable historical acceptance evidence.'),
            ('- All five scheduled report lanes now perform production-contract/runner preflight before handicapping.',
             '- All five scheduled report lanes perform production-contract/runner preflight against **Contract v1.0 / UI v1.5 / core v1.3** before handicapping.'),
            ('- Player-prop executable identity tightening is operational as v0.9 Invariant 23.',
             '- Player-prop executable identity tightening originated under v0.9 Invariant 23 and remains inherited by Contract v1.0.'),
            ('v0.9 is active. The near-term goal remains operational observation and evidence collection, not another contract change or speculative production rewrite.',
             'Contract v1.0 / VigScope UI v1.5 / core v1.3 are active. The near-term goal remains operational observation and evidence collection, not another contract change or speculative production rewrite.'),
            ('1. `BETTING_EDGE_CONTRACT.md` resolves as operational v0.9 before analysis;\n2. current runner v1.3 resolves;',
             '1. `BETTING_EDGE_CONTRACT.md` resolves as **v1.0 OPERATIONAL** before analysis;\n2. VigScope Terminal UI **v1.5** resolves with report core **v1.3**;'),
            ('### P2.1 — Observe v0.9 player-prop identity in live reports',
             '### P2.1 — Observe Contract v1.0 player-prop identity in live reports'),
            ('v0.9 activation is complete. Future governance work is now **post-v0.9 evolution**, not activation.',
             'Contract v1.0 promotion is complete. Future governance work is now **post-v1.0 evolution**, not activation.'),
            ('Do not edit v0.9 merely to make a failing implementation appear compliant.',
             'Do not edit Contract v1.0 merely to make a failing implementation appear compliant.'),
          ]
          for old,new in replacements:
            assert old in s, f'ROADMAP marker not found: {old[:70]}'
            s=s.replace(old,new,1)
          assert '- Runner is at **v1.3**.' not in s
          assert '`BETTING_EDGE_CONTRACT.md` **v0.9 is OPERATIONAL**' not in s
          assert 'v0.9 is active. The near-term goal' not in s
          assert 'post-v0.9 evolution' not in s
          p.write_text(s)
          PY
      - name: Validate documentation-only diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' docs/DECISIONS.md docs/PROJECT_STATE.md docs/ROADMAP.md | sort)"
          test "$changed" = "$expected"
          grep -q 'night-lock-2026-08-24' docs/PROJECT_STATE.md
          grep -q 'Contract v1.0 OPERATIONAL' docs/DECISIONS.md
          grep -q 'VigScope Terminal UI v1.5' docs/ROADMAP.md
      - name: Commit documentation refresh
        run: |
          git config user.name "fhvsvzpmkw-design"
          git config user.email "fhvsvzpmkw@privaterelay.appleid.com"
          git add docs/PROJECT_STATE.md docs/DECISIONS.md docs/ROADMAP.md
          git diff --cached --check
          git commit -m "Align docs with v1.5 night lock"
          git push
