name: Core 1.4 model-error framework

on:
  workflow_dispatch:
  push:
    paths:
      - 'core/core-handicap-framework-v1.4.json'
      - 'core/core-v1.4-production.json'
      - 'core/tests/core-handicap-framework-v1.4-cases.json'
      - 'research/research-library.json'
      - 'research/manifest.json'
      - 'tools/core-handicap-framework.mjs'
      - '.github/workflows/core-handicap-framework-r1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse production JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('core/core-handicap-framework-v1.4.json','utf8')); JSON.parse(require('fs').readFileSync('core/core-v1.4-production.json','utf8')); JSON.parse(require('fs').readFileSync('core/tests/core-handicap-framework-v1.4-cases.json','utf8'));"
      - name: Run Core 1.4 framework regression
        run: node tools/core-handicap-framework.mjs self-test
      - name: Assert production state
        run: |
          test "$(node -p "require('./core/core-handicap-framework-v1.4.json').state")" = "OPERATIONAL"
          test "$(node -p "require('./core/core-v1.4-production.json').state")" = "OPERATIONAL"
          test "$(node -p "require('./research/manifest.json').activeLibraryVersion")" = "1.8"
