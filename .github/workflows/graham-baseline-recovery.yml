name: Graham baseline recovery
on:
  push:
    branches: [main]
    paths:
      - tools/graham-baseline-recovery.mjs
      - tools/graham-research-review.mjs
      - tests/graham-baseline-recovery.test.mjs
      - .github/workflows/graham-baseline-recovery.yml
      - data/walters/nfl/20*/week-*-research-runtime/*.json
  workflow_run:
    workflows: [Graham research runtime]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: graham-baseline-recovery
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recovery regressions
        run: |
          node tests/graham-baseline-recovery.test.mjs
          node tests/graham-production-queue.test.mjs
      - name: Reconcile pending baseline against exact verified review
        run: |
          set -euo pipefail
          git config user.name betting-edge-bot
          git config user.email actions@users.noreply.github.com
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            ACTIVE_NUMBERS="$(node tools/graham-active-week.mjs --path currentNumbers)"
            BASELINE="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1])).baselineStatus" "$ACTIVE_NUMBERS")"
            if [ "$BASELINE" = "PENDING_TUESDAY_GRAHAM_BASELINE" ]; then
              # Retain the pending board, but surface the exact failed gate.
              if ! node tools/graham-baseline-recovery.mjs --write > /tmp/graham-baseline-recovery.json 2> /tmp/graham-baseline-recovery-error.txt; then
                cat /tmp/graham-baseline-recovery.json
                cat /tmp/graham-baseline-recovery-error.txt >&2
                echo '### Graham baseline recovery blocked' >> "$GITHUB_STEP_SUMMARY"
                cat /tmp/graham-baseline-recovery-error.txt >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              cat /tmp/graham-baseline-recovery.json
            else
              exit 0
            fi
            node tools/validate-walters-qb-performance-production.mjs
            git add -- "$ACTIVE_NUMBERS"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Recover initial Graham baseline from verified full catch-up'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Concurrent writes prevented baseline recovery publication.' >&2
          exit 1
