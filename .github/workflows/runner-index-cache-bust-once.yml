name: Runner index cache bust one-time

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-index-cache-bust-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch runner core index loader
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='runner-core.html';
          let html=fs.readFileSync(path,'utf8');
          const old='<iframe id="app" src="./index.html" title="VigScope Terminal UI v1.3"></iframe>\n<script>\nconst $=s=>document.querySelector(s);';
          const next='<iframe id="app" title="VigScope Terminal UI v1.3"></iframe>\n<script>\nconst $=s=>document.querySelector(s);\n$(\'#app\').src=\'./index.html?build=\'+Date.now();';
          if(!html.includes(old)) throw new Error('Expected runner-core index loader not found');
          html=html.replace(old,next);
          if(html.includes('src="./index.html"')) throw new Error('Static index iframe source survived');
          if(!html.includes("$('#app').src='./index.html?build='+Date.now();")) throw new Error('Dynamic index cache buster missing');
          fs.writeFileSync(path,html);
          NODE
          git diff --check
      - name: Validate runner core script
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('runner-core.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          if(!scripts.length)throw new Error('No runner-core scripts found');
          scripts.forEach((s,i)=>{try{new Function(s)}catch(e){throw new Error(`runner-core script ${i+1}: ${e.message}`)}});
          console.log('runner-core cache-bust validation: PASS');
          NODE
      - name: Commit cache-bust rebuild
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runner-core.html
          git commit -m 'Force fresh terminal index on runner load'
          git push origin HEAD:main
