name: V1.7 Soak Documentation Update

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v17-soak-docs-update.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update roadmap and project state
        run: python research/staging/apply_v17_soak_docs_2026-08-15.py
      - name: Commit documentation checkpoint
        run: |
          git config user.name "betting-edge-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ROADMAP.md docs/PROJECT_STATE.md
          if git diff --cached --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git commit -m "Document v1.7 soak and v1.8 promotion hold"
          git push
