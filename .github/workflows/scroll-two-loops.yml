name: Scroll two-loop cleanup
on:
  push:
    branches:
      - fix/scroll-two-loops
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scroll-two-loops
          fetch-depth: 0
      - name: Patch two loops
        run: python3 .github/scripts/patch-scroll-two-loops.py
      - name: Verify
        run: |
          node --check assets/card-view-preference.js
          node --check assets/special-desks-ui.js
          ! grep -q '},150);' assets/card-view-preference.js
          ! grep -q '},600);' assets/special-desks-ui.js
          git diff --check
      - name: Commit narrow cleanup
        run: |
          rm .github/workflows/scroll-two-loops.yml .github/scripts/patch-scroll-two-loops.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/card-view-preference.js assets/special-desks-ui.js .github/workflows/scroll-two-loops.yml .github/scripts/patch-scroll-two-loops.py
          git commit -m 'Remove two persistent UI polling loops'
          git push origin HEAD:fix/scroll-two-loops
