name: Persist main report readback
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-persist-main-readback-20261003.yml
permissions:
  contents: write
concurrency:
  group: persist-main-readback-20261003
  cancel-in-progress: false
jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify publication and persist checkpoint receipt
        run: |
          node tools/report-run.mjs readback --checkpoint data/report-production/checkpoints/20261003-main-0805.json --expected-revision 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/report-production/checkpoints/20261003-main-0805.json
          git rm .github/workflows/tmp-persist-main-readback-20261003.yml
          git commit -m "Record main report publication readback"
          git pull --rebase origin main
          git push origin HEAD:main
