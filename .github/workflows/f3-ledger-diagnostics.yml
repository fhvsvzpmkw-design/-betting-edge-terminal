name: F3 public stats upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f3-ledger-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate upgrade script
        run: node --check tools/upgrade-f3-live-stats.mjs
      - name: Convert F3 to live public statistics
        run: node tools/upgrade-f3-live-stats.mjs
      - name: Validate generated F3
        shell: bash
        run: |
          git diff --check
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
          if(!scripts.length)throw new Error('No scripts found');
          scripts.forEach((s,i)=>{try{new Function(s)}catch(e){throw new Error(`Script ${i+1} syntax: ${e.message}`)}});
          for(const marker of ['id="sportsBody"','id="typesBody"','id="timingBody"','id="pricesBody"','id="booksBody"','id="timeBody"','id="clvCount"','function renderHistoryStats()','./api/bet-history','PRIVATE MASTER // CLOUDFLARE'])if(!html.includes(marker))throw new Error('Missing marker: '+marker);
          for(const stale of ['+9.32% ROI','752 bets // +$388.66','<b>180</b>'])if(html.includes(stale))throw new Error('Static F3 value survived: '+stale);
          if(html.includes('x.bookid'))throw new Error('Public F3 still searches sportsbook reference IDs');
          console.log('F3 live public stats validation: PASS');
          NODE
      - name: Commit F3 upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make F3 bet history live public stats'
          git push origin HEAD:main
