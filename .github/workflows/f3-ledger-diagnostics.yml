name: F3 ledger diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f3-ledger-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect public projection semantics
        shell: bash
        run: |
          mkdir -p tmp
          node <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('data/bet-history-public.json','utf8'));
          const rows=j.wagers;
          const sum=(a,f)=>a.reduce((t,x)=>t+Number(f(x)||0),0);
          const stat=a=>({count:a.length,risk:+sum(a,x=>x[9]).toFixed(4),profit:+sum(a,x=>x[11]).toFixed(4)});
          const single=x=>Array.isArray(x[16])&&x[16].length===1;
          const pre=x=>x[12]==='PREGAME';
          const boosted=x=>!!x[14];
          const zeroLost=x=>x[10]==='Lost'&&Number(x[11])===0;
          const out={summary:j.summary,all:stat(rows),boostedTrue:stat(rows.filter(boosted)),boostedFalse:stat(rows.filter(x=>!boosted(x))),zeroPlLost:stat(rows.filter(zeroLost)),notZeroLost:stat(rows.filter(x=>!zeroLost(x))),pregameSingleAll:stat(rows.filter(x=>pre(x)&&single(x))),pregameSingleNotBoosted:stat(rows.filter(x=>pre(x)&&single(x)&&!boosted(x))),pregameSingleNotZeroLost:stat(rows.filter(x=>pre(x)&&single(x)&&!zeroLost(x))),pregameSingleNotBoostedNotZeroLost:stat(rows.filter(x=>pre(x)&&single(x)&&!boosted(x)&&!zeroLost(x)))};
          out.results={};for(const r of rows)out.results[r[10]]=(out.results[r[10]]||0)+1;
          out.combos={};for(const r of rows){const k=`${r[10]}|boost=${!!r[14]}|pl0=${Number(r[11])===0}`;out.combos[k]=(out.combos[k]||0)+1}
          out.tagCounts={};for(const r of rows){const k=String(r[17]??'');out.tagCounts[k]=(out.tagCounts[k]||0)+1}
          const clv=rows.map(r=>r[13]).filter(v=>v!==null&&v!==''&&Number.isFinite(Number(v))).map(Number).sort((a,b)=>a-b);const med=clv.length?(clv.length%2?clv[(clv.length-1)/2]:(clv[clv.length/2-1]+clv[clv.length/2])/2):null;out.clv={count:clv.length,mean:clv.length?sum(clv,x=>x)/clv.length:null,median:med,min:clv[0]??null,max:clv.at(-1)??null,sample:clv.slice(0,10).concat(clv.slice(-10))};
          const classify=r=>{const t=[r[7],...(Array.isArray(r[16])?r[16]:[])].join(' ').toLowerCase();if(/goalscorer|touchdown|rush yds|receiv|passing|shots|rebounds|assists|strikeouts|total bases|hits, runs|player|offsides|saves|aces|double faults/.test(t))return 'Props';if(/spread|point spread|run line|puck line|handicap/.test(t))return 'Spread';if(/money line|moneyline|to advance|match winner|draw no bet| to win\b/.test(t))return 'Moneyline';if(/total|over |under |o\/u|team points|team total/.test(t))return 'Totals';return 'Props'};
          out.typeCounts={};for(const r of rows.filter(x=>pre(x)&&single(x))){const k=classify(r);out.typeCounts[k]=(out.typeCounts[k]||0)+1}
          fs.writeFileSync('tmp/f3-ledger-diagnostics.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Publish diagnostic snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/f3-ledger-diagnostics.json
          git commit -m 'Update F3 ledger diagnostic snapshot' || exit 0
          git push origin HEAD:main
