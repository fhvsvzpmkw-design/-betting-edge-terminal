name: F3 public stats upgrade
# literal-dollar replacement fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f3-ledger-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run and capture F3 upgrade
        shell: bash
        run: |
          mkdir -p tmp
          : > tmp/f3-upgrade-result.txt
          set +e
          sed -i "s/html=html.replace(summaryMarker,summaryReplacement);/html=html.replace(summaryMarker,()=>summaryReplacement);/" tools/upgrade-f3-live-stats.mjs
          grep -Fq "html=html.replace(summaryMarker,()=>summaryReplacement);" tools/upgrade-f3-live-stats.mjs
          PREP=$?
          node --check tools/upgrade-f3-live-stats.mjs >> tmp/f3-upgrade-result.txt 2>&1
          CHECK=$?
          PATCH=99
          FIX=99
          SCRIPT=97
          VALID=98
          if [ "$PREP" -eq 0 ] && [ "$CHECK" -eq 0 ]; then
            node tools/upgrade-f3-live-stats.mjs >> tmp/f3-upgrade-result.txt 2>&1
            PATCH=$?
          fi
          if [ "$PATCH" -eq 0 ]; then
            node tools/fix-f3-generated-regex.mjs >> tmp/f3-upgrade-result.txt 2>&1
            FIX=$?
          fi
          if [ "$PATCH" -eq 0 ] && [ "$FIX" -eq 0 ]; then
            node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const m=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!m)throw new Error('No first script found');
          fs.writeFileSync('tmp/f3-script1.js',m[1]);
          NODE
            node --check tmp/f3-script1.js >> tmp/f3-upgrade-result.txt 2>&1
            SCRIPT=$?
          fi
          echo "prep=$PREP script_check=$CHECK patch=$PATCH regex_fix=$FIX generated_script=$SCRIPT" >> tmp/f3-upgrade-result.txt
          if [ "$SCRIPT" -eq 0 ]; then
            git diff --check >> tmp/f3-upgrade-result.txt 2>&1
            DIFF=$?
            if [ "$DIFF" -eq 0 ]; then
              node <<'NODE' >> tmp/f3-upgrade-result.txt 2>&1
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          for(const marker of ['id="sportsBody"','id="typesBody"','id="timingBody"','id="pricesBody"','id="booksBody"','id="timeBody"','id="clvCount"','function renderHistoryStats()','./api/bet-history','PRIVATE MASTER // CLOUDFLARE'])if(!html.includes(marker))throw new Error('Missing marker: '+marker);
          for(const stale of ['+9.32% ROI','752 bets // +$388.66','<b>180</b>'])if(html.includes(stale))throw new Error('Static F3 value survived: '+stale);
          if(html.includes('x.bookid'))throw new Error('Public F3 still searches sportsbook reference IDs');
          console.log('F3 live public stats validation: PASS');
          NODE
              VALID=$?
            fi
          fi
          echo "validation=$VALID" >> tmp/f3-upgrade-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/f3-upgrade-result.txt
          if [ "$PREP" -eq 0 ] && [ "$CHECK" -eq 0 ] && [ "$PATCH" -eq 0 ] && [ "$FIX" -eq 0 ] && [ "$SCRIPT" -eq 0 ] && [ "$VALID" -eq 0 ]; then git add index.html; fi
          git commit -m 'Capture F3 public stats upgrade result' || exit 0
          git push origin HEAD:main
