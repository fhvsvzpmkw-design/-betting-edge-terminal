name: Walters QB Stage 4 Integrity Fix

on:
  push:
    paths:
      - ".github/workflows/walters-qb-stage4-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: walters-qb-stage4-integrity-fix
  cancel-in-progress: false

jobs:
  patch-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch cross-language canonicalization and evidence-token boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/build-walters-qb-performance-stage4.py")
          text = path.read_text(encoding="utf-8")

          old = "\n".join([
              "    if isinstance(value, list):",
              "        return [canonical_payload(item) for item in value]",
              "    return value",
              "",
          ])
          new = "\n".join([
              "    if isinstance(value, list):",
              "        return [canonical_payload(item) for item in value]",
              "    # JavaScript JSON has a single numeric type and serializes integral values",
              "    # without a trailing decimal. Normalize Python floats the same way so the",
              "    # independent Node validator reproduces every canonical hash exactly.",
              "    if isinstance(value, float) and math.isfinite(value) and value.is_integer():",
              "        return int(value)",
              "    return value",
              "",
          ])
          if old not in text:
              raise SystemExit("Canonicalization patch anchor not found")
          text = text.replace(old, new, 1)

          anchor = "def recursive_market_true(value: Any) -> bool:\n"
          helper = "\n".join([
              "def sanitize_shadow_text(value: Any) -> str:",
              "    \"\"\"Keep source meaning while preventing future authority tokens from entering evidence outputs.\"\"\"",
              "    return str(value or \"\").replace(",
              "        \"APPROVED_WALTERS_QB_PERFORMANCE\",",
              "        \"GOVERNED_QB_PERFORMANCE_AUTHORITY\",",
              "    )",
              "",
              "",
          ])
          if anchor not in text:
              raise SystemExit("Evidence sanitizer anchor not found")
          text = text.replace(anchor, helper + anchor, 1)

          old_summary = '        summary = str(finding.get("summary") or "")\n'
          new_summary = '        summary = sanitize_shadow_text(finding.get("summary"))\n'
          if old_summary not in text:
              raise SystemExit("Research evidence patch anchor not found")
          text = text.replace(old_summary, new_summary, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          python -m py_compile tools/build-walters-qb-performance-stage4.py
          python tools/build-walters-qb-performance-stage4.py --self-test

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- tools/build-walters-qb-performance-stage4.py
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git commit -m "Fix Walters QB Stage 4 integrity read-back"
          git push origin HEAD:main
