name: Add Syndicate glow

on:
  push:
    branches: [ui/syndicate-glow]
    paths:
      - '.github/workflows/add-syndicate-glow.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/syndicate-glow
      - name: Match Load Syndicate glow to special desks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          desks=Path('assets/special-desks-ui.js')
          s=desks.read_text()
          anchor="    #${PIZZA_ID},#${CRYPTO_ID},#${MEAT_ID}{grid-column:1/-1!important;display:grid!important;place-items:center!important;gap:7px!important;padding:10px 8px!important}\n"
          glow="""    #runnerSyndicateF5{box-shadow:inset 0 0 0 1px rgba(255,232,145,.10),0 0 12px rgba(216,173,56,.18),0 0 26px rgba(216,173,56,.08)!important;text-shadow:0 0 7px rgba(255,216,106,.34),0 0 14px rgba(255,216,106,.14)!important}\n    #runnerSyndicateF5:hover,#runnerSyndicateF5.loaded{box-shadow:inset 0 0 0 1px rgba(255,240,170,.16),0 0 16px rgba(255,210,80,.26),0 0 30px rgba(255,210,80,.12)!important;text-shadow:0 0 8px rgba(255,225,125,.42),0 0 16px rgba(255,216,106,.18)!important}\n"""
          if glow not in s:
              if anchor not in s:
                  raise SystemExit('special desk style anchor not found')
              desks.write_text(s.replace(anchor,anchor+glow))

          dash=Path('assets/report-dashboard-vigscope.js')
          d=dash.read_text()
          d=d.replace("specialDesks.src='./assets/special-desks-ui.js?v=1';","specialDesks.src='./assets/special-desks-ui.js?v=2';")
          dash.write_text(d)

          runner=Path('runner.html')
          r=runner.read_text()
          old='report-dashboard-vigscope.js?v=20260821-1651'
          new='report-dashboard-vigscope.js?v=20260821-1704'
          if old in r:
              runner.write_text(r.replace(old,new))
          elif new not in r:
              raise SystemExit('runner dashboard asset tag not found')
          PY
      - name: Commit glow update
        shell: bash
        run: |
          if git diff --quiet -- assets/special-desks-ui.js assets/report-dashboard-vigscope.js runner.html; then
            echo 'Already updated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add -- assets/special-desks-ui.js assets/report-dashboard-vigscope.js runner.html
          git commit -m 'Add persistent gold glow to Load Syndicate'
          git push origin ui/syndicate-glow
