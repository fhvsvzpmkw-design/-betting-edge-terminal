name: Index Betting Edge odds history

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh Betting Edge odds"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: betting-edge-odds-history-index
  cancel-in-progress: false

jobs:
  index:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and publish odds history index
        run: bash tools/publish-odds-history-index.sh

