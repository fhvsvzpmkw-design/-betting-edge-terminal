name: Apply bankroll adjustment 2026-09-01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bankroll-adjustment-20260901.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bankroll-only adjustment to canonical public ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          canonical = Path('data/ledger/public-ledger.json')
          data = json.loads(canonical.read_text(encoding='utf-8'))
          if data.get('schema') != 2 or data.get('publicProjection') is not True:
              raise SystemExit('Unexpected public ledger contract')
          if len(data.get('wagers', [])) != 1632:
              raise SystemExit('Expected 1632 public wagers')
          if any((not isinstance(r, list)) or len(r) < 18 or r[2] is not None for r in data['wagers']):
              raise SystemExit('Public privacy validation failed')
          if data.get('validation', {}).get('uniqueWagers') != 1632:
              raise SystemExit('Public validation count mismatch')
          summary = data.get('summary', {})
          expected = {
              'cashBets': 1519,
              'cashRisked': 8970.87,
              'cashProfit': 192.54,
              'cashRoiPercent': 2.15
          }
          for k,v in expected.items():
              if float(summary.get(k)) != float(v):
                  raise SystemExit(f'Unexpected {k}: {summary.get(k)}')
          if summary.get('resultMix') != {'Won':641,'Lost':853,'CashedOut':133,'Push':2,'Cancelled':3}:
              raise SystemExit('Unexpected result mix')

          data['generatedAt'] = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          data['bankrollCad'] = 523.38
          canonical.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          for p in [Path('data/bet-history-public.json'), Path('api/bet-history')]:
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(canonical.read_text(encoding='utf-8'), encoding='utf-8')
          PY

      - name: Validate synchronized public state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[Path('data/ledger/public-ledger.json'),Path('data/bet-history-public.json'),Path('api/bet-history')]
          docs=[json.loads(p.read_text()) for p in paths]
          for d in docs:
              assert d['schema']==2 and d['publicProjection'] is True
              assert d['bankrollCad']==523.38
              assert d['validation']['uniqueWagers']==1632
              assert len(d['wagers'])==1632
              assert d['summary']['cashProfit']==192.54
              assert d['summary']['cashRoiPercent']==2.15
              assert all(r[2] is None for r in d['wagers'])
          assert docs[0] == docs[1] == docs[2]
          print('PUBLIC BANKROLL SYNC VALIDATION: PASS')
          PY

      - name: Commit public bankroll adjustment and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-bankroll-adjustment-20260901.yml
          git config user.name 'betting-edge-public-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- data/ledger/public-ledger.json data/bet-history-public.json api/bet-history .github/workflows/apply-bankroll-adjustment-20260901.yml
          git commit -m 'ledger: apply Sep 1 bankroll adjustment'
          git push origin HEAD:main
