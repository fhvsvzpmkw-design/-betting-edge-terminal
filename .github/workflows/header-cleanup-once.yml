name: VigScope header cleanup once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/header-cleanup-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant terminal header labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # The public shell already carries the VigScope name/version. Remove the
          # old implementation label and the duplicate engine/book status block.
          runner = Path('runner.html')
          text = runner.read_text()
          text = text.replace("const UI_BUILD=`CHATGPT LIVE-RUNNER // v${UI_VERSION} UI`;\n", "")

          old = "const top=d.querySelector('.top'),terminalTitle=top&&top.querySelector('.title');if(terminalTitle&&terminalTitle.textContent!==UI_TITLE)terminalTitle.textContent=UI_TITLE;const build=top&&top.querySelector('.small.muted');if(build&&build.textContent!==UI_BUILD)build.textContent=UI_BUILD;const footer=d.querySelector('.foot');"
          new = "const top=d.querySelector('.top'),terminalTitle=top&&top.querySelector('.title');if(terminalTitle&&terminalTitle.textContent!==UI_TITLE)terminalTitle.textContent=UI_TITLE;const build=top&&top.querySelector('.small.muted');if(build)build.remove();const topRight=top&&top.querySelector('.right');if(topRight)topRight.remove();const footer=d.querySelector('.foot');"
          if old not in text and new not in text:
              raise SystemExit('runner header patch target not found')
          if old in text:
              text = text.replace(old, new, 1)
          runner.write_text(text)

          # Keep the inner page clean as well so a direct/fallback index load does
          # not show the removed labels before the runner hierarchy patch applies.
          index = Path('index.html')
          text = index.read_text()
          old = '<header class="top"><div><div class="title">VIGSCOPE TERMINAL UI v1.3</div><div class="small muted">LIVE REPORT + ARCHIVE</div></div><div class="right small" style="text-align:right"><div class="g">REPORT ENGINE // v1.3</div><div class="y">LIVE ODDS // BET365 + DRAFTKINGS</div></div></header>'
          new = '<header class="top"><div><div class="title">VIGSCOPE TERMINAL UI v1.3</div></div></header>'
          if old not in text and new not in text:
              raise SystemExit('index header patch target not found')
          if old in text:
              text = text.replace(old, new, 1)
          index.write_text(text)
          PY
      - name: Commit header cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.html index.html
          if git diff --cached --quiet; then
            echo "No header changes needed."
          else
            git commit -m "Simplify VigScope terminal header"
            git push
          fi
