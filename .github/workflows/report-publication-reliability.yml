name: Report publication reliability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/report-publication.mjs
      - tools/report-pipeline.mjs
      - tools/report-run.mjs
      - tools/report-snapshot.mjs
      - tools/report-producer-progress.mjs
      - tools/moneyline-lineage.mjs
      - tools/spread-lineage.mjs
      - tools/primary-lineage.mjs
      - tools/market-price-assessment.mjs
      - tools/pinnacle-benchmark-publication-gate.mjs
      - tools/major-sport-market-coverage-gate.mjs
      - tools/report-coverage-summary.mjs
      - tools/coverage-validation-lookups.mjs
      - tools/resolve-report-publication.mjs
      - tools/extract-staged-report.mjs
      - data/report-production/publication-request.schema.json
      - docs/REPORT_PUBLICATION_REQUEST.md
      - BETTING_EDGE_SCHEDULED_REPORT_AUTHORITY.md
      - tools/odds-history-index.py
      - tools/publish-odds-history-index.sh
      - tests/report-history-verification.test.mjs
      - tests/coverage-validation-lookups.test.mjs
      - tests/report-publication-request.test.mjs
      - tests/report-pipeline.test.mjs
      - tests/report-snapshot.test.mjs
      - tests/report-producer-progress.test.mjs
      - tests/odds-history-index-collision.py
      - .github/workflows/report-publication-reliability.yml
      - .github/workflows/report-history-staged.yml

permissions:
  contents: read

concurrency:
  group: report-publication-reliability
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: History integrity, exact receipt matching and eligibility wiring
        run: |
          node --test tests/report-history-verification.test.mjs tests/coverage-validation-lookups.test.mjs tests/report-eligibility-wiring.test.mjs
          node tools/report-publication.mjs self-test
          node tests/report-pipeline.test.mjs
          node --test tests/report-snapshot.test.mjs tests/report-producer-progress.test.mjs tests/scheduled-report-authority.test.mjs tests/moneyline-lineage.test.mjs tests/pinnacle-observation-freshness.test.mjs
          node tools/spread-lineage.mjs self-test
          node --default-to-experimental-regexp-engine --test tests/report-publication-request.test.mjs
      - name: Concurrent snapshot-index publication regression
        run: |
          bash -n tools/publish-odds-history-index.sh
          python tests/odds-history-index-collision.py
      - name: Verify complete production history with measured gate durations
        run: node tools/report-pipeline.mjs history
