name: Scheduler Canary v3 — Odds Pair

on:
  workflow_dispatch:
  schedule:
    # Diagnostic twin of the real odds-refresh scheduler.
    # These cron expressions intentionally match odds-refresh.yml exactly so
    # dispatch timing can be compared without making API calls or repo writes.
    - cron: '43,53 12 * * *' # 05:43 / 05:53 Vancouver
    - cron: '43,53 14 * * *' # 07:43 / 07:53 Vancouver
    - cron: '13,23 16 * * *' # 09:13 / 09:23 Vancouver
    - cron: '53 21 * * *'    # 14:53 Vancouver
    - cron: '3 22 * * *'     # 15:03 Vancouver backup
    - cron: '53 0 * * *'     # 17:53 Vancouver
    - cron: '3 1 * * *'      # 18:03 Vancouver backup

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm paired scheduler dispatch
        run: |
          echo "event=${{ github.event_name }}"
          echo "scheduled=${{ github.event.schedule || 'manual' }}"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Scheduler Canary v3 completed. This workflow mirrors odds-refresh cron timing and makes no API requests or repository writes."
