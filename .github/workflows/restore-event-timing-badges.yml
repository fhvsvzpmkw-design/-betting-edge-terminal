name: Restore event timing badges

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-event-timing-badges.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-event-timing-badges
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Attach lightweight timing runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('runner.html')
          text = path.read_text(encoding='utf-8')
          anchor = '<script src="./assets/runner-core-runtime.js"></script>'
          timing = '<script src="./assets/event-timing-badges.js"></script>'
          if timing not in text:
              if anchor not in text:
                  raise SystemExit('runner-core-runtime anchor not found')
              text = text.replace(anchor, anchor + '\n' + timing, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate attachment and Safari-safe constraints
        run: |
          grep -F '<script src="./assets/event-timing-badges.js"></script>' runner.html
          grep -F 'const REFRESH_MS=60000;' assets/event-timing-badges.js
          if grep -Eq 'scroll|wheel|touchmove|requestAnimationFrame|position:[[:space:]]*(fixed|sticky)|will-change|filter:|backdrop-filter' assets/event-timing-badges.js; then
            echo 'Timing runtime contains a prohibited scroll/repaint-sensitive primitive.'
            exit 1
          fi
          node --check assets/event-timing-badges.js

      - name: Publish and remove one-off workflow
        run: |
          rm .github/workflows/restore-event-timing-badges.yml
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runner.html assets/event-timing-badges.js .github/workflows/restore-event-timing-badges.yml
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m "ui: restore lightweight event timing badges"
          git pull --rebase origin main
          git push
