name: Lou asset pack check once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lou-asset-pack-check-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Lou Vega asset pack
        run: node tests/lou-vega-v2.test.mjs
      - name: Record successful validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Validate Lou Vega asset pack"
          git push
