name: Report history staged publication

on:
  push:
    branches: [main]
    paths:
      - data/report-production/readback-triggers/20261003-main-081824.txt

concurrency:
  group: betting-edge-report-history
  cancel-in-progress: false

jobs:
  controller-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run controller readback and persist exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          checkpoint=data/report-production/checkpoints/20261003-main-0805.json
          node tools/report-run.mjs readback --checkpoint "$checkpoint" --expected-revision 10
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(p.revision!==11||p.phase!=="PUBLISHED"||!p.publication?.readbackAt)process.exit(1)' "$checkpoint"
          git show "$GITHUB_SHA^:.github/workflows/report-history-staged.yml" > .github/workflows/report-history-staged.yml
          git rm -f -- data/report-production/readback-triggers/20261003-main-081824.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/workflows/report-history-staged.yml "$checkpoint"
          git commit -m "Record 2026-10-03 main report readback"
          git push origin HEAD:main
