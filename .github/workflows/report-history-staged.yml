name: Report history staged publication
# Fail-closed production publication for ChatGPT scheduled runs.
# Scheduled tasks may write only the staging bundle; this workflow alone mutates durable History.
# Manual dispatch may replay the exact preserved staging bundle when deliberate recovery is required.
# Publisher workflow edits do not auto-replay an older staged candidate.
# Manual recovery publisher trigger: 2026-08-31 16:10 PT.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/history/staging/report-bundle.json

concurrency:
  group: betting-edge-report-history
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require clean durable history before candidate publication
        run: |
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history
          node tools/pinnacle-benchmark-publication-gate.mjs validate-runtime
          node tools/vigscope-meter-telemetry-gate.mjs self-test
      - name: Extract staged candidate bundle
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'data/history/staging/report-bundle.json';
          const bundle = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (bundle.schema !== 1) throw new Error('Staging bundle schema must be 1');
          if (bundle.state !== 'READY') throw new Error('Staging bundle state must be READY');
          if (typeof bundle.candidateId !== 'string' || !bundle.candidateId.trim()) throw new Error('Staging candidateId is required');
          if (typeof bundle.phase !== 'string' || !bundle.phase.trim()) throw new Error('Staging phase is required');
          if (!bundle.report || typeof bundle.report !== 'object' || Array.isArray(bundle.report)) throw new Error('Staging report object is required');
          if (!bundle.sidecar || typeof bundle.sidecar !== 'object' || Array.isArray(bundle.sidecar)) throw new Error('Staging sidecar object is required');
          if (bundle.sidecar.schema !== 3) throw new Error('Staging sidecar schema must be 3');
          if (!bundle.report.ts || !Number.isFinite(Date.parse(bundle.report.ts))) throw new Error('Staging report.ts must be a valid timestamp');
          fs.writeFileSync('/tmp/report.json', JSON.stringify(bundle.report, null, 2) + '\n');
          fs.writeFileSync('/tmp/sidecar.json', JSON.stringify(bundle.sidecar, null, 2) + '\n');
          NODE
      - name: Enforce major-sport coverage receipt
        run: |
          node tools/major-sport-market-coverage-gate.mjs self-test
          node tools/major-sport-market-coverage-gate.mjs validate --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Enforce same-day event eligibility
        run: |
          node tools/report-event-eligibility.mjs self-test
          node tools/report-event-eligibility.mjs validate --report /tmp/report.json
      - name: Canonicalize report-derived sidecar fields
        run: |
          node tools/report-sidecar-contract.mjs normalize --report /tmp/report.json --sidecar /tmp/sidecar.json
          node tools/report-sidecar-contract.mjs check --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Canonicalize official Pinnacle benchmark provenance
        run: |
          node tools/pinnacle-sharp-benchmark.mjs self-test
          node tools/pinnacle-benchmark-publication-gate.mjs self-test
          node tools/pinnacle-benchmark-publication-gate.mjs normalize --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Validate complete Core assessment trace
        run: |
          node tools/core-assessment-trace-gate.mjs self-test
          node tools/core-assessment-trace-gate.mjs validate --report /tmp/report.json
      - name: Enforce Core 1.4 production handicap and Walters authority
        run: node tools/core-v14-publication-gate.mjs validate --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Enforce official non-executable Pinnacle benchmark
        run: node tools/pinnacle-benchmark-publication-gate.mjs validate --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Guard tracked selection continuity
        run: node tools/selection-continuity.mjs audit --report /tmp/report.json
      - name: Verify tracked non-spread book availability
        run: node tools/selection-availability.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Reconcile tracked spread lineage
        run: node tools/spread-lineage.mjs audit --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Validate bundle and derive paths
        id: bundle
        run: node tools/report-publication.mjs publish --report /tmp/report.json --sidecar /tmp/sidecar.json
      - name: Validate derived meter telemetry before commit
        env:
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: node tools/vigscope-meter-telemetry-gate.mjs validate --report "$REPORT_PATH" --sidecar "$SIDECAR_PATH"
      - name: Commit payload, sidecar and index together
        env:
          REPORT_TS: ${{ steps.bundle.outputs.report_ts }}
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          published=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -f -- "$REPORT_PATH" "$SIDECAR_PATH"
            node tools/report-publication.mjs verify
            node tools/core-v14-publication-gate.mjs verify-history
            node tools/pinnacle-benchmark-publication-gate.mjs validate-runtime
            node tools/major-sport-market-coverage-gate.mjs validate --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/report-event-eligibility.mjs validate --report /tmp/report.json
            node tools/report-sidecar-contract.mjs check --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/pinnacle-benchmark-publication-gate.mjs validate --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/core-assessment-trace-gate.mjs validate --report /tmp/report.json
            node tools/core-v14-publication-gate.mjs validate --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/report-publication.mjs publish --report /tmp/report.json --sidecar /tmp/sidecar.json
            node tools/vigscope-meter-telemetry-gate.mjs validate --report "$REPORT_PATH" --sidecar "$SIDECAR_PATH"
            git add -- "$REPORT_PATH" "$SIDECAR_PATH" run-history.json
            if git diff --cached --quiet; then
              echo "Bundle already exists unchanged."
              published=1
              break
            fi
            git commit -m "history: publish ${REPORT_TS} staged report bundle"
            if git push origin HEAD:main; then
              published=1
              break
            fi
            echo "Push raced another repository update; retrying from current main."
          done
          test "$published" -eq 1
      - name: Remote read-back gate
        env:
          REPORT_TS: ${{ steps.bundle.outputs.report_ts }}
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          node tools/report-publication.mjs verify --ts "$REPORT_TS"
          node tools/core-v14-publication-gate.mjs verify-history
          node tools/report-event-eligibility.mjs validate --report "$REPORT_PATH"
          node tools/major-sport-market-coverage-gate.mjs validate --report "$REPORT_PATH" --sidecar "$SIDECAR_PATH"
          node tools/pinnacle-benchmark-publication-gate.mjs validate --report "$REPORT_PATH" --sidecar "$SIDECAR_PATH"
          node tools/vigscope-meter-telemetry-gate.mjs validate --report "$REPORT_PATH" --sidecar "$SIDECAR_PATH"
      - name: Publication summary
        env:
          SHORT_ID: ${{ steps.bundle.outputs.short_id }}
          REPORT_PATH: ${{ steps.bundle.outputs.report_path }}
          SIDECAR_PATH: ${{ steps.bundle.outputs.sidecar_path }}
        run: |
          {
            echo "## Betting Edge staged report published"
            echo
            echo "- Short ID: \`$SHORT_ID\`"
            echo "- Report: \`$REPORT_PATH\`"
            echo "- Sidecar: \`$SIDECAR_PATH\`"
            echo "- Index: \`run-history.json\`"
            echo "- Preflight history: passed"
            echo "- Major-sport coverage receipt: passed"
            echo "- Same-day event eligibility: passed"
            echo "- Core gate: passed"
            echo "- Pinnacle benchmark gate: passed (official, non-executable)"
            echo "- VigScope meter telemetry gate: passed"
            echo "- Read-back: passed"
            echo "- Link: https://fhvsvzpmkw-design.github.io/-betting-edge-terminal/r.html?id=$SHORT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
