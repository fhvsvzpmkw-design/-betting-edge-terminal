name: Report history staged publication

on:
  push:
    branches: [main]
    paths:
      - data/report-production/upload/20261003-main-0805/**

concurrency:
  group: betting-edge-report-history
  cancel-in-progress: false

jobs:
  restore-sealed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out triggering main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore exact staged bundle and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          upload=data/report-production/upload/20261003-main-0805
          cat "$upload"/staging.part*.b64 | base64 --decode > data/history/staging/report-bundle.json
          cat "$upload"/checkpoint.part*.b64 | base64 --decode > data/report-production/checkpoints/20261003-main-0805.json
          test "$(git hash-object data/history/staging/report-bundle.json)" = "50de65625cb7497e6459eef197e1ae3884429d49"
          test "$(git hash-object data/report-production/checkpoints/20261003-main-0805.json)" = "05d2fe38603f888981b41c88d5d58289bf5c1ac7"
          test "$(sha256sum data/history/staging/report-bundle.json | cut -d' ' -f1)" = "5976f2dccf7ca67149bdc293b6e96ff04782105a2486bf8c6043009dcdb02e2e"
          test "$(sha256sum data/report-production/checkpoints/20261003-main-0805.json | cut -d' ' -f1)" = "196f33a8747b2cbde0703773555246baa8cc735b8cd7ba139d1b53d813d4a0c6"
          git show "$GITHUB_SHA^:.github/workflows/report-history-staged.yml" > .github/workflows/report-history-staged.yml
          git rm -r -- "$upload"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/workflows/report-history-staged.yml data/history/staging/report-bundle.json data/report-production/checkpoints/20261003-main-0805.json
          git commit -m "Stage 2026-10-03 main betting report"
          git push origin HEAD:main
