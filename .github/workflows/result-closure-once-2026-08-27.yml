name: One-off Betting Edge result closure 2026-08-27

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/result-closure-once-2026-08-27.yml"

permissions:
  contents: write

concurrency:
  group: betting-edge-result-closure-once-2026-08-27
  cancel-in-progress: false

