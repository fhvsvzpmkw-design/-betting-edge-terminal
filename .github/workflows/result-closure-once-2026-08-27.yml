            data/history/runs/2026-08-26/late-182538.json
          )
          for run in "${runs[@]}"; do
            node tools/observe-issued-prices.mjs "$run"
            node tools/verify-issued-results.mjs "$run" /tmp/result-verification.json
          done

      - name: Validate observation-only write scope
        run: |
          set -euo pipefail
          git add data/history/observations
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^data/history/observations/'; then
            echo "Unexpected path in result-closure write set."
            exit 1
          fi

      - name: Publish observation sidecars
        run: |
          set -euo pipefail
          git config user.name "betting-edge-result-closure"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Close issued Betting Edge results 2026-08-27"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
