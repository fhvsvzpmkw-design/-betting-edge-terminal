name: Runner history regression

on:
  push:
    branches: [main]
    paths:
      - BETTING_EDGE_CONTRACT.md
      - BETTING_EDGE_PERSONNEL_SWEEP.md
      - data/history/report-provenance-schema.json
      - r.html
      - runner.html
      - assets/runner-core-runtime.js
      - assets/runner-picks-ui.css
      - tests/runner-picks-ui.test.mjs
      - assets/report-dashboard-vigscope.js
      - assets/menu-order-controller.js
      - assets/primary-nav-shell.js
      - assets/results-desk-ui.js
      - assets/game-window-intelligence.js
      - assets/preferences-framework.js
      - assets/guy-blue-line.js
      - tools/build-guy-hotline.mjs
      - tests/guy-blue-line.test.mjs
      - assets/guy-value.js
      - tools/track-guy-value.mjs
      - tests/guy-value.test.mjs
      - data/preferences.json
      - data/main-schedule.json
      - data/syndicates.json
      - data/characters/*.json
      - syndicates/**/*.html
      - syndicates/**/archive/index.json
      - tools/main-schedule.mjs
      - tests/f8-nav-theme-authority.test.mjs
      - tests/personnel-information-ordering.test.mjs
      - tests/preferences-framework.test.mjs
      - tests/main-schedule.test.mjs
      - tests/syndicate-hotline-completeness.test.mjs
      - tests/runner-history-session-applicability.test.js
      - tests/runner-session-strip-applicability.test.js
      - .github/workflows/runner-history-regression.yml
  pull_request:
    paths:
      - BETTING_EDGE_CONTRACT.md
      - BETTING_EDGE_PERSONNEL_SWEEP.md
      - data/history/report-provenance-schema.json
      - r.html
      - runner.html
      - assets/runner-core-runtime.js
      - assets/runner-picks-ui.css
      - tests/runner-picks-ui.test.mjs
      - assets/report-dashboard-vigscope.js
      - assets/menu-order-controller.js
      - assets/primary-nav-shell.js
      - assets/results-desk-ui.js
      - assets/game-window-intelligence.js
      - assets/preferences-framework.js
      - assets/guy-blue-line.js
      - tools/build-guy-hotline.mjs
      - tests/guy-blue-line.test.mjs
      - assets/guy-value.js
      - tools/track-guy-value.mjs
      - tests/guy-value.test.mjs
      - data/preferences.json
      - data/main-schedule.json
      - data/syndicates.json
      - data/characters/*.json
      - syndicates/**/*.html
      - syndicates/**/archive/index.json
      - tools/main-schedule.mjs
      - tests/f8-nav-theme-authority.test.mjs
      - tests/personnel-information-ordering.test.mjs
      - tests/preferences-framework.test.mjs
      - tests/main-schedule.test.mjs
      - tests/syndicate-hotline-completeness.test.mjs
      - tests/runner-history-session-applicability.test.js
      - tests/runner-session-strip-applicability.test.js
      - .github/workflows/runner-history-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check runner UI modules
        run: |
          node --check assets/runner-core-runtime.js
          node --check assets/preferences-framework.js
          node --check assets/report-dashboard-vigscope.js
          node --check assets/game-window-intelligence.js
          node --check assets/menu-order-controller.js
          node --check assets/primary-nav-shell.js
          node --check assets/results-desk-ui.js
      - name: Run F8 navigation theme authority regression
        run: node tests/f8-nav-theme-authority.test.mjs
      - name: Run personnel information ordering regression
        run: node tests/personnel-information-ordering.test.mjs
      - name: Run short-link history regression
        run: node tests/runner-history-session-applicability.test.js
      - name: Run large-report handoff regression
        run: node tests/runner-report-handoff.test.mjs
      - name: Run runner session strip regression
        run: node tests/runner-session-strip-applicability.test.js
      - name: Run published-pick filters and report comparison regression
        run: node tests/runner-picks-ui.test.mjs
      - name: Run permanent Main Betting Edge schedule regression
        run: node tests/main-schedule.test.mjs
      - name: Run F6 preferences framework regression
        run: node tests/preferences-framework.test.mjs
      - name: Run Blue Line ranking and edition regression
        run: node --test tests/guy-blue-line.test.mjs tests/guy-value.test.mjs
      - name: Run Syndicate Hotline completeness regression
        run: node tests/syndicate-hotline-completeness.test.mjs
