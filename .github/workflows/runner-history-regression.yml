name: Runner history regression

on:
  push:
    branches: [main]
    paths:
      - r.html
      - runner.html
      - assets/schedule-profile-ui.js
      - data/schedule-profiles.json
      - data/schedule-state.json
      - tools/schedule-profile.mjs
      - tests/schedule-profile.test.mjs
      - tests/runner-history-session-applicability.test.js
      - tests/runner-session-strip-applicability.test.js
      - .github/workflows/runner-history-regression.yml
  pull_request:
    paths:
      - r.html
      - runner.html
      - assets/schedule-profile-ui.js
      - data/schedule-profiles.json
      - data/schedule-state.json
      - tools/schedule-profile.mjs
      - tests/schedule-profile.test.mjs
      - tests/runner-history-session-applicability.test.js
      - tests/runner-session-strip-applicability.test.js
      - .github/workflows/runner-history-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run short-link history regression
        run: node tests/runner-history-session-applicability.test.js
      - name: Run runner session strip regression
        run: node tests/runner-session-strip-applicability.test.js
      - name: Run seasonal schedule profile regression
        run: node tests/schedule-profile.test.mjs
