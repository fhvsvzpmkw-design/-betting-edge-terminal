name: Runner history regression

on:
  push:
    branches: [main]
    paths:
      - r.html
      - tests/runner-history-session-applicability.test.js
      - .github/workflows/runner-history-regression.yml
  pull_request:
    paths:
      - r.html
      - tests/runner-history-session-applicability.test.js
      - .github/workflows/runner-history-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run runner history regression
        run: node tests/runner-history-session-applicability.test.js
