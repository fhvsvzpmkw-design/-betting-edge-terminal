name: Eddie V3 2 percent $5000 scale once

on:
  push:
    paths:
      - '.github/workflows/eddie-v3-2pct-5000-scale-once.yml'

permissions:
  contents: write

jobs:
  update-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change public unit normalization to 2 percent
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('syndicates/generated/eddie-numbers/hotline.html')
          s = p.read_text()
          replacements = [
            ('current 3% bankroll unit', 'current 2% bankroll unit'),
            ('100 ÷ (current bankroll × 3%)', '100 ÷ (current bankroll × 2%)'),
            ('current 3% unit', 'current 2% unit'),
            ('UNIT_RATE=.03,TARGET_UNIT=100', 'UNIT_RATE=.02,TARGET_UNIT=100'),
            ('3% source unit', '2% source unit'),
            ('produces a ${money(rawUnit)} 3% unit', 'produces a ${money(rawUnit)} 2% unit'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s)

          prof_path = Path('data/characters/eddie-numbers.json')
          prof = json.loads(prof_path.read_text())
          prof['updatedAt'] = '2026-08-23T20:18:00-07:00'
          ps = prof['authority'].setdefault('presentationScale', {})
          ps['unitPercent'] = 0.02
          ps['targetUnitCad'] = 100
          ps['multiplierFormula'] = '100 / (bankrollCad * 0.02)'
          ps['normalizedBankrollCad'] = 5000
          ps['appliesTo'] = 'displayed bankroll plus all displayed wager/performance dollar amounts; source ledger values remain untouched; counts, ROI and percentage ratios are unchanged'
          prof['authority']['updateModel'] = 'The live V3 Hotline fetches /data/bet-history-public.json directly with cache bypass. It calculates the current 2% source-bankroll unit and automatically applies 100 / (bankroll × 2%) to displayed bankroll and all wager/performance dollar amounts, producing a $5,000 normalized bankroll with a $100 active unit.'
          prof['hotlineStyle']['ledgerRules']['moneyRule'] = 'Do not modify source ledger values. For displayed bankroll and every displayed wager/performance dollar amount, multiply the public-ledger source value by 100 / (bankrollCad × 0.02). Recalculate automatically whenever the public bankroll changes. This fixes the normalized bankroll at $5,000 and the active 2% unit at $100. ROI, counts and percentage ratios remain unchanged.'
          prof['guardrails']['publicUnitNormalization'] = 'Current 2% source-bankroll unit is normalized to $100 for all Hotline bankroll/wager/performance dollar presentation; normalized bankroll is $5,000 and the multiplier updates automatically from the public bankroll.'
          prof['guardrails']['scaledBankrollPresentation'] = 'Displayed bankroll is scaled by the same current-bankroll multiplier as performance dollars so the public 2% unit equals $100 and the normalized bankroll equals $5,000; source bankroll in the underlying public ledger remains unchanged.'
          prof_path.write_text(json.dumps(prof, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Verify 2 percent scale
        run: |
          grep -F 'UNIT_RATE=.02,TARGET_UNIT=100' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'current 2% bankroll unit' syndicates/generated/eddie-numbers/hotline.html
          grep -F 'multiplierFormula' data/characters/eddie-numbers.json
          grep -F '0.02' data/characters/eddie-numbers.json
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syndicates/generated/eddie-numbers/hotline.html data/characters/eddie-numbers.json
          git diff --cached --quiet && exit 0
          git commit -m "Set Eddie normalized bankroll to $5000 at 2 percent"
          git push
