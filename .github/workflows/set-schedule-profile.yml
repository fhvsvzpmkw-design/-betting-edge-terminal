name: Set Betting Edge schedule profile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Schedule profile to queue for the next eligible 06:00 Vancouver operating day
        required: true
        type: choice
        options:
          - mlb
          - nfl
          - nba_nhl
        default: mlb

permissions:
  contents: write

concurrency:
  group: betting-edge-schedule-profile-control
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate profile definitions
        run: node tools/schedule-profile.mjs validate

      - name: Queue profile
        id: queue
        env:
          PROFILE: ${{ inputs.profile }}
        run: node tools/schedule-profile.mjs queue --profile "$PROFILE" | tee -a "$GITHUB_OUTPUT"

      - name: Publish profile state
        if: steps.queue.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/schedule-state.json
          git commit -m "Queue Betting Edge schedule profile: ${{ inputs.profile }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Could not publish schedule profile state after retries." >&2
          exit 1

      - name: Summary
        env:
          PROFILE: ${{ steps.queue.outputs.profile_id }}
          EFFECTIVE: ${{ steps.queue.outputs.effective_operating_date }}
          MESSAGE: ${{ steps.queue.outputs.message }}
        run: |
          {
            echo "## Betting Edge schedule profile"
            echo
            echo "- Profile: \`$PROFILE\`"
            echo "- Effective operating day: \`$EFFECTIVE\`"
            echo "- Activation boundary: \`06:00 America/Vancouver\`"
            echo "- Five-pull daily cap: unchanged"
            echo "- Result: $MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"
