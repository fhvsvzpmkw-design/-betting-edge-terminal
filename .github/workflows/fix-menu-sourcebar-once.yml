name: Fix menu sourcebar once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-menu-sourcebar-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make menu hide legacy footer bars explicitly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/primary-nav-shell.js')
          s=p.read_text()
          old='    body.${MENU_CLASS} .runnerNavPad~*{display:none!important}\n'
          new=old+'    body.${MENU_CLASS} .f3sourcebar,body.${MENU_CLASS} footer.foot{display:none!important}\n'
          assert old in s, 'menu sibling hide rule not found'
          assert 'body.${MENU_CLASS} .f3sourcebar' not in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit menu visibility fix
        run: |
          git config user.name "fhvsvzpmkw-design"
          git config user.email "fhvsvzpmkw@privaterelay.appleid.com"
          git add assets/primary-nav-shell.js
          git diff --cached --check
          git commit -m "Hide legacy source footer on menu"
          git push
