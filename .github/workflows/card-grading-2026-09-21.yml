name: Isolated Betting Edge card grading 2026-09-21

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/card-grading-2026-09-21.yml"

permissions:
  contents: write

concurrency:
  group: betting-edge-card-grading-2026-09-21
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Grade previous Vancouver day and older unresolved backlog
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');

          const TARGET = '2026-09-20';
          const VERIFIED_AT = new Date().toISOString();
          const runDir = `data/history/runs/${TARGET}`;
          const runFiles = fs.existsSync(runDir) ? fs.readdirSync(runDir)
            .filter(name => name.endsWith('.json'))
            .sort()
            .map(name => path.join(runDir, name)) : [];

          function readJson(p) { return JSON.parse(fs.readFileSync(p, 'utf8')); }
          function norm(s) { return String(s || '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]/g, ''); }
          function sameName(a, b) {
            const x = norm(a), y = norm(b);
            if (!x || !y) return false;
            return x === y || (x.length >= 5 && y.includes(x)) || (y.length >= 5 && x.includes(y));
          }
          function eventInfoFromRuns(runs, eventId) {
            const recs = [];
            for (const { run } of runs) for (const r of run.recs || []) {
              if (String(r?.feed?.eventId || '') === String(eventId)) recs.push(r);
            }
            let away = null, home = null;
            for (const r of recs) {
              const mk = String(r?.feed?.marketKey || r?.feed?.market || '').toLowerCase();
              const side = String(r?.feed?.side || '').toLowerCase();
              if ((mk === 'ml' || mk === 'moneyline') && side === 'away') away ||= r.title;
              if ((mk === 'ml' || mk === 'moneyline') && side === 'home') home ||= r.title;
            }
            if (!away || !home) {
              for (const r of recs) {
                const meta = String(r.meta || '');
                const matchup = meta.split('|').map(x => x.trim()).find(x => / at /i.test(x));
                const m = matchup?.match(/^(.+?)\s+at\s+(.+)$/i);
                if (m) { away ||= m[1].trim(); home ||= m[2].trim(); break; }
              }
            }
            const sample = recs[0] || {};
            const sport = String(sample?.coreAssessment?.context?.sport || sample?.feed?.sport || sample?.feed?.league || (sample.meta || '').split('|')[0] || '').trim().toUpperCase();
            return { away, home, sport, recs };
          }
          async function fetchJson(url) {
            const res = await fetch(url, { headers: { 'user-agent': 'Betting-Edge-Historical-Grader/1.2' } });
            if (!res.ok) throw new Error(`fetch ${url} failed ${res.status}`);
            return res.json();
          }
          function yyyymmdd(date) { return String(date).replaceAll('-', ''); }
          function competitors(comp) {
            const cs = comp?.competitors || [];
            return { away: cs.find(x => x.homeAway === 'away'), home: cs.find(x => x.homeAway === 'home') };
          }
          function aliases(c) {
            const t = c?.team || {};
            return [t.displayName, t.shortDisplayName, t.location, t.name, t.abbreviation].filter(Boolean);
          }
          function aliasMatch(issued, c) { return aliases(c).some(x => sameName(issued, x)); }

          const providerCache = new Map();
          const espnMap = {
            NFL: ['football','nfl'],
            NCAAF: ['football','college-football'],
            CFB: ['football','college-football'],
            CFL: ['football','cfl'],
            NBA: ['basketball','nba'],
            WNBA: ['basketball','wnba'],
            NHL: ['hockey','nhl']
          };
          async function verifyEvent(date, eventId, info) {
            const sport = String(info?.sport || '').toUpperCase();
            if (!info?.away || !info?.home) return { eventId, status: 'unresolved', unresolvedReason: 'issued_event_identity_incomplete' };
            if (sport === 'MLB') {
              const key = `MLB|${date}`;
              if (!providerCache.has(key)) {
                const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}&hydrate=linescore,team`;
                providerCache.set(key, { url, data: await fetchJson(url) });
              }
              const { url, data } = providerCache.get(key);
              const games = (data.dates || []).flatMap(d => d.games || []);
              const g = games.find(g => sameName(info.away, g?.teams?.away?.team?.name) && sameName(info.home, g?.teams?.home?.team?.name));
              if (!g) return { eventId, status: 'unresolved', unresolvedReason: 'result_not_verified' };
              const finalState = String(g?.status?.abstractGameState || g?.status?.detailedState || '').toLowerCase();
              if (!finalState.includes('final')) return { eventId, status: 'unresolved', unresolvedReason: 'event_not_final' };
              return { eventId, status: 'final', away: g.teams.away.team.name, home: g.teams.home.team.name,
                awayScore: Number(g.teams.away.score), homeScore: Number(g.teams.home.score),
                source: { name: `MLB official schedule — ${date}`, url } };
            }
            const route = espnMap[sport];
            if (route) {
              const key = `${sport}|${date}`;
              if (!providerCache.has(key)) {
                const apiUrl = `https://site.api.espn.com/apis/site/v2/sports/${route[0]}/${route[1]}/scoreboard?dates=${yyyymmdd(date)}&limit=300`;
                providerCache.set(key, { apiUrl, data: await fetchJson(apiUrl) });
              }
              const { data } = providerCache.get(key);
              const e = (data.events || []).find(e => {
                const { away, home } = competitors(e?.competitions?.[0]);
                return away && home && aliasMatch(info.away, away) && aliasMatch(info.home, home);
              });
              if (!e) return { eventId, status: 'unresolved', unresolvedReason: 'result_not_verified' };
              const { away, home } = competitors(e?.competitions?.[0]);
              const isFinal = Boolean(e?.status?.type?.completed) || /final/i.test(String(e?.status?.type?.description || ''));
              if (!away || !home || !isFinal) return { eventId, status: 'unresolved', unresolvedReason: 'event_not_final' };
              return { eventId, status: 'final', away: away.team.displayName, home: home.team.displayName,
                awayScore: Number(away.score), homeScore: Number(home.score),
                source: { name: `ESPN ${sport} scoreboard — ${date}`, url: `https://www.espn.com/${route[1]}/scoreboard/_/date/${yyyymmdd(date)}` } };
            }
            return { eventId, status: 'unresolved', unresolvedReason: 'result_not_verified' };
          }

          (async () => {
            if (!runFiles.length) throw new Error(`no issued runs found for ${TARGET}`);
            const runs = runFiles.map(p => ({ path: p, run: readJson(p) }));
            const firstSeen = [], seen = new Set();
            const statusCounts = {};
            let issuedCards = 0;
            for (const { run } of runs) {
              for (const rec of run.recs || []) {
                issuedCards += 1;
                const st = String(rec?.status || 'UNKNOWN').trim().toUpperCase() || 'UNKNOWN';
                statusCounts[st] = (statusCounts[st] || 0) + 1;
                const id = String(rec?.feed?.eventId || '');
                if (id && !seen.has(id)) { seen.add(id); firstSeen.push(id); }
              }
            }
            const infoByEvent = new Map(firstSeen.map(id => [id, eventInfoFromRuns(runs, id)]));
            const eventsA = [];
            for (const id of firstSeen) eventsA.push(await verifyEvent(TARGET, id, infoByEvent.get(id) || {}));
            const vf = '/tmp/sep20-verification.json';
            fs.writeFileSync(vf, JSON.stringify({ verifiedAt: VERIFIED_AT, attemptedEventIds: firstSeen, deferredEventIds: [], events: eventsA }, null, 2));
            for (const { path: rp } of runs) {
              cp.execFileSync('node', ['tools/verify-issued-results.mjs', rp, vf], { stdio: 'inherit' });
              cp.execFileSync('node', ['tools/observe-issued-prices.mjs', rp], { stdio: 'inherit' });
            }

            const idxBefore = readJson('data/history/results-index.json');
            const olderCards = (idxBefore.unresolved || []).filter(x => String(x.date || '') < TARGET);
            const groups = new Map();
            for (const card of olderCards) {
              const eventId = String(card.eventId || '');
              const date = String(card.date || '');
              if (!eventId || !date) continue;
              const key = `${date}|${eventId}`;
              if (!groups.has(key)) groups.set(key, { eventId, date, sport: String(card.sport || '').toUpperCase(), reasons: new Set(), runPaths: new Set() });
              const g = groups.get(key);
              g.reasons.add(String(card.reason || ''));
              const runPath = String(card.cardId || '').split('#')[0];
              if (runPath) g.runPaths.add(runPath);
            }
            const olderGroups = [...groups.values()].sort((a,b) => a.date.localeCompare(b.date) || a.eventId.localeCompare(b.eventId));
            const backlogOutcomes = [], perRun = new Map();
            for (const g of olderGroups) {
              const existingRunPaths = [...g.runPaths].filter(rp => fs.existsSync(rp));
              if (!existingRunPaths.length) {
                backlogOutcomes.push({ eventId:g.eventId, date:g.date, status:'unresolved', unresolvedReason:'source_run_missing' });
                continue;
              }
              const sourceRuns = existingRunPaths.map(rp => ({ path: rp, run: readJson(rp) }));
              const info = eventInfoFromRuns(sourceRuns, g.eventId); if (!info.sport) info.sport = g.sport;
              const outcome = await verifyEvent(g.date, g.eventId, info);
              backlogOutcomes.push({ ...outcome, date: g.date });
              for (const runPath of existingRunPaths) {
                if (!perRun.has(runPath)) perRun.set(runPath, { ids: [], events: [] });
                perRun.get(runPath).ids.push(g.eventId); perRun.get(runPath).events.push(outcome);
              }
            }
            let n=0;
            for (const [rp,payload] of perRun) {
              const bvf=`/tmp/backlog-${n++}.json`;
              fs.writeFileSync(bvf, JSON.stringify({ verifiedAt: VERIFIED_AT, attemptedEventIds: payload.ids, deferredEventIds: [], events: payload.events }, null, 2));
              cp.execFileSync('node', ['tools/verify-issued-results.mjs', rp, bvf], { stdio:'inherit' });
              cp.execFileSync('node', ['tools/observe-issued-prices.mjs', rp], { stdio:'inherit' });
            }
            fs.writeFileSync('/tmp/grading-runtime.json', JSON.stringify({
              target: TARGET,
              issuedCards,
              statusCounts,
              currentUniqueEvents: firstSeen.length,
              currentVerifiedFinal: eventsA.filter(x=>x.status==='final').length,
              currentUnresolvedEvents: eventsA.filter(x=>x.status!=='final').map(x=>({eventId:x.eventId,reason:x.unresolvedReason})),
              olderEnteringCards: olderCards.length,
              olderEnteringEvents: olderGroups.length,
              olderVerifiedFinal: backlogOutcomes.filter(x=>x.status==='final').length,
              olderUnresolvedEvents: backlogOutcomes.filter(x=>x.status!=='final').map(x=>({date:x.date,eventId:x.eventId,reason:x.unresolvedReason}))
            }, null, 2));
            console.log(`CURRENT issuedCards=${issuedCards} uniqueEvents=${firstSeen.length} verifiedFinal=${eventsA.filter(x=>x.status==='final').length} unresolvedEvents=${eventsA.filter(x=>x.status!=='final').length}`);
            console.log(`CURRENT statusCounts=${JSON.stringify(statusCounts)}`);
            console.log(`CURRENT unresolved=${JSON.stringify(eventsA.filter(x=>x.status!=='final'))}`);
            console.log(`OLDER enteringCards=${olderCards.length} enteringEvents=${olderGroups.length} verifiedFinal=${backlogOutcomes.filter(x=>x.status==='final').length} unresolvedEvents=${backlogOutcomes.filter(x=>x.status!=='final').length}`);
            console.log(`OLDER unresolved=${JSON.stringify(backlogOutcomes.filter(x=>x.status!=='final'))}`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Rebuild downstream results index
        run: |
          node tools/build-results-index.mjs
          node tools/add-results-player-value.mjs
          node tools/add-results-shadow-v2.mjs

      - name: Verify coverage and strict isolation
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const idx = JSON.parse(fs.readFileSync('data/history/results-index.json','utf8'));
          const runtime = JSON.parse(fs.readFileSync('/tmp/grading-runtime.json','utf8'));
          const d = (idx.byDate || []).find(x => x.name === runtime.target) || {};
          const older = (idx.unresolved || []).filter(x => String(x.date || '') < runtime.target);
          const allUnresolved = idx.unresolved || [];
          const c = idx.coverage || {};
          const grades = d.grades || {};
          const summary = {
            ...runtime,
            dateSummary: d,
            remainingOlderCards: older.length,
            remainingOlderEvents: new Set(older.map(x => `${x.date}|${x.eventId}`)).size,
            remainingAllUnresolvedCards: allUnresolved.length,
            remainingAllUnresolvedEvents: new Set(allUnresolved.map(x => `${x.date}|${x.eventId}`)).size,
            coverage: c
          };
          fs.writeFileSync('/tmp/grading-summary.json', JSON.stringify(summary, null, 2));
          const status = runtime.statusCounts || {};
          const msg = [
            `Grade September 20 issued cards and retry older unresolved`,
            ``,
            `TARGET issued=${d.issued ?? runtime.issuedCards} complete=${d.complete ?? 'n/a'} unresolved=${d.unresolved ?? 'n/a'} WIN=${grades.WIN ?? 0} LOSS=${grades.LOSS ?? 0} PUSH=${grades.PUSH ?? 0} VOID=${grades.VOID ?? 0} HALF_WIN=${grades.HALF_WIN ?? 0} HALF_LOSS=${grades.HALF_LOSS ?? 0} priced=${d.priced ?? 'n/a'} netUnits=${d.netUnits ?? 'n/a'} roiPct=${d.roiPct ?? 'n/a'}`,
            `STATUS PASS=${status.PASS ?? 0} WAIT=${status.WAIT ?? 0} LEAN=${status.LEAN ?? 0} BET=${status.BET ?? 0} OTHER=${Object.entries(status).filter(([k])=>!['PASS','WAIT','LEAN','BET'].includes(k)).reduce((s,[,v])=>s+v,0)}`,
            `EVENTS unique=${runtime.currentUniqueEvents} verifiedFinal=${runtime.currentVerifiedFinal} unresolved=${runtime.currentUnresolvedEvents.length}`,
            `BACKLOG enteringCards=${runtime.olderEnteringCards} enteringEvents=${runtime.olderEnteringEvents} verifiedFinal=${runtime.olderVerifiedFinal} unresolvedAttempted=${runtime.olderUnresolvedEvents.length} remainingCards=${older.length} remainingEvents=${new Set(older.map(x => `${x.date}|${x.eventId}`)).size}`,
            `INDEX cards=${c.cards ?? 'n/a'} complete=${c.completeCards ?? 'n/a'} unresolved=${c.unresolvedCards ?? 'n/a'} pendingObservationCards=${c.pendingObservationCards ?? 'n/a'} unresolvedSelections=${c.unresolvedSelections ?? 'n/a'} unresolvedEvents=${c.unresolvedEvents ?? 'n/a'} observedThrough=${c.observedThroughDate ?? 'n/a'}`,
            `ISOLATION historical-only`
          ].join('\n');
          fs.writeFileSync('/tmp/commit-msg.txt', msg);
          console.log(msg);
          console.log(`CURRENT_UNRESOLVED=${JSON.stringify(runtime.currentUnresolvedEvents)}`);
          console.log(`OLDER_UNRESOLVED=${JSON.stringify(runtime.olderUnresolvedEvents)}`);
          NODE
          bad=$(git diff --name-only | grep -Ev '^(data/history/observations/|data/history/results-index\.json$)' || true)
          if [ -n "$bad" ]; then echo "Unexpected changes outside historical grading outputs:"; echo "$bad"; exit 1; fi
          if git diff --name-only | grep -q '^data/history/runs/'; then echo 'Issued run mutation forbidden'; exit 1; fi

      - name: Commit historical grading outputs only
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "betting-edge-bot@users.noreply.github.com"
          git add data/history/observations data/history/results-index.json
          if git diff --cached --quiet; then echo "No historical grading changes to commit"; exit 0; fi
          git commit -F /tmp/commit-msg.txt
          git pull --rebase origin main
          git push origin main
