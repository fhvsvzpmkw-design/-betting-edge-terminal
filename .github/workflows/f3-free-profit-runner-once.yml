name: F3 free bet profit one-time

on:
  push:
    branches: [main]
    paths:
      - 'tools/f3-free-profit-once.mjs'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add free bet profit
        run: node tools/f3-free-profit-once.mjs
      - name: Commit F3 free bet profit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Show free bet profit in F3 summary'
          git push origin HEAD:main
