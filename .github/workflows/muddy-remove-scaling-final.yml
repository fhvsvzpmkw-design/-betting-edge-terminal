name: Muddy Remove Scaling Final
on:
  push:
    paths:
      - '.github/workflows/muddy-remove-scaling-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rewrite Muddy V3 to actual CAD
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['syndicates/generated/eddie-numbers/hotline.html','syndicates/sharp-room/incoming.html'];
          for(const p of files){
            let s=fs.readFileSync(p,'utf8');
            s=s.replace(/const URL='[^']+',TZ='America\/Vancouver',UNIT_RATE=\.03,TARGET_UNIT=100,/g,"const URL='/api/bet-history',TZ='America/Vancouver',");
            s=s.replace(/function W\(r,scale\)/g,'function W(r)');
            s=s.replace(/risk:\(\+r\[9\]\|\|0\)\*scale/g,'risk:(+r[9]||0)');
            s=s.replace(/p:\(\+r\[11\]\|\|0\)\*scale/g,'p:(+r[11]||0)');
            s=s.replace(/rawUnit=bankroll\*UNIT_RATE,scale=rawUnit>0\?TARGET_UNIT\/rawUnit:1,/g,'');
            s=s.replace(/\.map\(r=>W\(r,scale\)\)/g,'.map(r=>W(r))');
            s=s.replace(/\(\+j\.summary\?\.cashProfit\|\|0\)\*scale/g,'(+j.summary?.cashProfit||0)');
            s=s.replace(/\(\+j\.summary\.cashRisked\)\*scale/g,'(+j.summary.cashRisked)');
            s=s.replace(/let scaledBankroll=bankroll\*scale;/g,'let scaledBankroll=bankroll;');
            s=s.replace(/set\('scale',rawUnit>0\?[^;]+;/g,"set('scale','VALIDATED');");
            s=s.replace(/Ten most recent settled public wagers, \$100-unit normalized stake and P\/L\./g,'Ten most recent settled public wagers, actual stake and P/L.');
            s=s.replace(/\$100-unit normalized/g,'actual CAD');
            s=s.replace(/Authority: public Bet History via \/data\/bet-history-public\.json\. The source ledger remains untouched\. Displayed bankroll, wager and performance dollars are normalized by 100 ÷ \(current bankroll × 3%\), making the current 3% unit equal \$100\. Counts, ROI, win rates and percentage ratios remain unchanged\./g,'Authority: public Bet History via /api/bet-history plus the sanitized public funding layer. All bankroll, wager and performance dollars are actual CAD.');
            s=s.replace(/set\('walk',`Source bankroll[^`]*`\)/g,"set('walk',`Actual bankroll ${money(bankroll)}. Cash P/L ${sm(scaledProfit)} at ${pct(j.summary?.cashRoiPercent)} cash ROI. Public-row week ${sm(Wk.p)}; public-row month ${sm(Mo.p)}.`)");
            s=s.replace(/active unit is \$100/gi,'actual-dollar presentation');
            s=s.replace(/Displayed bankroll, wager and performance dollars are normalized[^<]*/g,'All bankroll, wager and performance dollars are actual CAD. ');
            const bad=['UNIT_RATE','TARGET_UNIT','W(r,scale)','*scale','bankroll*scale','active unit is $100','$100-unit normalized'];
            const found=bad.filter(x=>s.includes(x));
            if(found.length) throw new Error(`${p}: residual scaling tokens: ${found.join(', ')}`);
            if(!s.includes("const URL='/api/bet-history'")) throw new Error(`${p}: canonical public endpoint missing`);
            fs.writeFileSync(p,s);
          }
          const profilePath='data/characters/eddie-numbers.json';
          const profile=JSON.parse(fs.readFileSync(profilePath,'utf8'));
          profile.hotlineStyle.ledgerRules.freeBetRule='Never infer free-bet status from wager rows. Public row index 14 is the boosted flag. Use only the sanitized funding layer classes CASH, FREE_BET and MIXED_PROMO.';
          profile.editorial.primaryFocus=['actual bankroll and full-ledger P/L','full/all-in actual-capital ROI','cash ROI as a secondary diagnostic','weekly and monthly performance','risk and ticket volume','sport-by-sport results','sportsbook-by-sportsbook results','pregame versus after-start risk','parlay concentration','recent-ticket sequence'];
          profile.continuity.track=['ledger generatedAt','latest recorded wager date','bankroll','full-ledger P/L and ROI','cash P/L and ROI','promotional contribution','current ledger week','current ledger month','sport and sportsbook breakdowns','behaviour ratios','last ten settled public wagers'];
          fs.writeFileSync(profilePath,JSON.stringify(profile,null,2)+'\n');
          NODE
      - name: Validate Muddy contracts
        run: |
          node tests/ledger-funding-layer.test.mjs
          node tests/muddy-ledger-desk.test.mjs
          grep -q "const URL='/api/bet-history'" syndicates/generated/eddie-numbers/hotline.html
          ! grep -q 'UNIT_RATE\|TARGET_UNIT\|W(r,scale)\|bankroll\*scale\|active unit is \$100\|\$100-unit normalized' syndicates/generated/eddie-numbers/hotline.html
      - name: Commit corrected page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add syndicates/generated/eddie-numbers/hotline.html syndicates/sharp-room/incoming.html data/characters/eddie-numbers.json
          git commit -m 'muddy: actual CAD with no residual scaling'
          git push origin main
