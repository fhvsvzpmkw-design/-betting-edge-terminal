name: Isolated Betting Edge card grading 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/card-grading-2026-09-13.yml"

permissions:
  contents: write

concurrency:
  group: betting-edge-card-grading-2026-09-13
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Close verified older pending observation backlog
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const NOW=new Date().toISOString();
          const targets=[
            'data/history/runs/2026-08-15/evening-152124.json',
            'data/history/runs/2026-08-15/late-182100.json',
            'data/history/runs/2026-08-16/open-060831.json',
            'data/history/runs/2026-08-16/main-080114.json',
            'data/history/runs/2026-08-16/final_morning-093240.json',
            'data/history/runs/2026-08-16/evening-154530.json',
            'data/history/runs/2026-08-16/late-190810.json',
            'data/history/runs/2026-08-17/open-063217.json',
            'data/history/runs/2026-08-17/main-080437.json',
            'data/history/runs/2026-08-17/final_morning-093941.json',
            'data/history/runs/2026-08-17/evening-152114.json',
            'data/history/runs/2026-08-17/late-184110.json',
            'data/history/runs/2026-08-23/late-182521.json'
          ];
          const S={
            PHI:{name:'StatMuse — Philadelphia 9, Minnesota 1 — 2026-08-15',url:'https://www.statmuse.com/mlb/ask/phillies-vs-twins-last-15-game-log'},
            MIL:{name:'Baseball-Reference — Milwaukee 4, Los Angeles Dodgers 1 — 2026-08-15',url:'https://www.baseball-reference.com/boxes/LAN/LAN202608150.shtml'},
            TEX:{name:'StatMuse/AP — Texas 5, Athletics 3 — 2026-08-15',url:'https://www.statmuse.com/mlb/game/8-15-2026-tex-at-ath-235479'},
            SEA:{name:'Sports Illustrated — Dallas Cowboys 17, Seattle Seahawks 7 — 2026-08-15 preseason',url:'https://www.si.com/nfl/scoreboard/cowboys-vs-seahawks-8-15-2026-351'},
            KCR:{name:'Baseball-Reference — Los Angeles Angels 1, Kansas City 0 — 2026-08-15',url:'https://www.baseball-reference.com/boxes/ANA/ANA202608150.shtml'},
            LAFC:{name:'Los Angeles Football Club — San Diego FC 1, LAFC 0 — 2026-08-15',url:'https://www.lafc.com/news/recap-lafc-4-0-san-diego-fc-2026-mls-season-august-15'},
            CWS:{name:'Baseball-Reference — Chicago White Sox 7, Detroit 5 — 2026-08-16',url:'https://www.baseball-reference.com/boxes/DET/DET202608160.shtml'},
            IND:{name:'Basketball-Reference — Indiana Fever 95, Atlanta Dream 91 (OT) — 2026-08-16',url:'https://www.basketball-reference.com/wnba/boxscores/202608160ATL.html'},
            TBR:{name:'StatMuse/AP — Baltimore 10, Tampa Bay 2 — 2026-08-16',url:'https://www.statmuse.com/mlb/game/8-16-2026-bal-at-tbr-235109'},
            BOS:{name:'CBS News/AP — Pittsburgh 8, Boston 3 — 2026-08-16',url:'https://www.cbsnews.com/pittsburgh/news/red-sox-pirates-score-bryan-reynolds-brandon-lowe/'},
            POR:{name:'Basketball-Reference — Portland Fire 88, Phoenix Mercury 85 — 2026-08-16',url:'https://www.basketball-reference.com/wnba/boxscores/202608160PHO.html'},
            VAN:{name:'Seattle Sounders FC — Vancouver Whitecaps 2, Seattle Sounders 0 — 2026-08-16',url:'https://www.soundersfc.com/news/match-recap-sounders-fc-drops-2-0-home-result-to-vancouver-whitecaps-fc'},
            SDP:{name:'Baseball-Reference — New York Mets 2, San Diego 1 — 2026-08-17',url:'https://www.baseball-reference.com/boxes/NYN/NYN202608170.shtml'},
            CHC:{name:'Fever Baseball/official MLB feed — Chicago Cubs 7, Chicago White Sox 5 — 2026-08-17',url:'https://www.feverbaseball.com/scorecard/2026-08-17-cws-chc'},
            LAD:{name:'Baseball-Reference — Los Angeles Dodgers 11, Colorado 5 — 2026-08-17',url:'https://www.baseball-reference.com/boxes/COL/COL202608170.shtml'},
            DET:{name:'Baseball-Reference — Detroit 8, Pittsburgh 5 — 2026-08-17',url:'https://www.baseball-reference.com/boxes/PIT/PIT202608170.shtml'},
            GSV:{name:'CBS Sports/AP — Golden State Valkyries 78, Dallas Wings 70 — 2026-08-17',url:'https://www.cbssports.com/wnba/gametracker/live/WNBA_20260817_DAL%40GS/'},
            ATL:{name:'Baseball-Reference — Minnesota 4, Atlanta 2 — 2026-08-17',url:'https://www.baseball-reference.com/boxes/MIN/MIN202608170.shtml'},
            BOL:{name:'StatMuse — Lazio 1, Bologna 0 — 2026-08-24',url:'https://www.statmuse.com/fc/match/8-24-2026-bol-vs-laz-112083'},
            OSA:{name:'StatMuse — Osasuna 0, Levante 0 — 2026-08-24',url:'https://www.statmuse.com/fc/match/8-23-2026-osa-vs-lev-113462'},
            ROM:{name:'StatMuse — Roma 4, Fiorentina 0 — 2026-08-24',url:'https://www.statmuse.com/fc/match/8-24-2026-rom-vs-fio-112078'},
            TAL:{name:'ElDoce — Talleres 2, Rosario Central 2 — 2026-08-24',url:'https://artear-eldoce-prod.web.arc-cdn.net/deportes/2026/08/24/un-necesitado-talleres-busca-salir-del-fondo-y-recibe-a-rosario-central-en-el-kempes-tv-y-formaciones/'}
          };
          const R={
            '2026-08-15':{
              'Philadelphia Phillies moneyline':{away:'Philadelphia Phillies',home:'Minnesota Twins',as:9,hs:1,src:S.PHI},
              'Milwaukee Brewers moneyline':{away:'Milwaukee Brewers',home:'Los Angeles Dodgers',as:4,hs:1,src:S.MIL},
              'Texas Rangers moneyline':{away:'Texas Rangers',home:'Athletics',as:5,hs:3,src:S.TEX},
              'Seattle Seahawks moneyline':{away:'Dallas Cowboys',home:'Seattle Seahawks',as:17,hs:7,src:S.SEA},
              'Kansas City Royals moneyline':{away:'Kansas City Royals',home:'Los Angeles Angels',as:0,hs:1,src:S.KCR},
              'Los Angeles FC moneyline':{away:'San Diego FC',home:'Los Angeles FC',as:1,hs:0,src:S.LAFC}
            },
            '2026-08-16':{
              'White Sox ML':{away:'Chicago White Sox',home:'Detroit Tigers',as:7,hs:5,src:S.CWS},
              'Fever ML':{away:'Indiana Fever',home:'Atlanta Dream',as:95,hs:91,src:S.IND},
              'Rays ML':{away:'Baltimore Orioles',home:'Tampa Bay Rays',as:10,hs:2,src:S.TBR},
              'Red Sox ML':{away:'Boston Red Sox',home:'Pittsburgh Pirates',as:3,hs:8,src:S.BOS},
              'Portland Fire ML':{away:'Portland Fire',home:'Phoenix Mercury',as:88,hs:85,src:S.POR},
              'Vancouver Whitecaps FC ML':{away:'Vancouver Whitecaps FC',home:'Seattle Sounders FC',as:2,hs:0,src:S.VAN}
            },
            '2026-08-17':{
              'Padres ML':{away:'San Diego Padres',home:'New York Mets',as:1,hs:2,src:S.SDP},
              'Cubs ML':{away:'Chicago White Sox',home:'Chicago Cubs',as:5,hs:7,src:S.CHC},
              'Dodgers ML':{away:'Los Angeles Dodgers',home:'Colorado Rockies',as:11,hs:5,src:S.LAD},
              'Tigers ML':{away:'Detroit Tigers',home:'Pittsburgh Pirates',as:8,hs:5,src:S.DET},
              'Valkyries -6.5':{away:'Dallas Wings',home:'Golden State Valkyries',as:70,hs:78,src:S.GSV},
              'Valkyries -5.5':{away:'Dallas Wings',home:'Golden State Valkyries',as:70,hs:78,src:S.GSV},
              'Braves ML':{away:'Atlanta Braves',home:'Minnesota Twins',as:2,hs:4,src:S.ATL}
            },
            '2026-08-23':{
              'Bologna–Lazio under 2.5':{away:'Lazio',home:'Bologna',as:1,hs:0,src:S.BOL},
              'Osasuna–Levante under 2.5':{away:'Levante',home:'Osasuna',as:0,hs:0,src:S.OSA},
              'Roma–Fiorentina over 2.5':{away:'Fiorentina',home:'Roma',as:0,hs:4,src:S.ROM},
              'Talleres–Rosario Central draw':{away:'Rosario Central',home:'Talleres',as:2,hs:2,src:S.TAL}
            }
          };
          function dateOf(runPath){return runPath.split('/')[3]}
          function lineValue(rec){const f=rec.feed||{};for(const v of [f.hdp,f.line])if(Number.isFinite(Number(v)))return Number(v);const p=String(f.selectionKey||'').split('|'),tail=p.length>=5?p[4]:null;return tail!==null&&tail!==''&&Number.isFinite(Number(tail))?Number(tail):null}
          function inferLegacySide(title,result){
            if(title==='Seattle Seahawks moneyline')return 'home';
            if(title==='Los Angeles FC moneyline')return 'home';
            if(title==='Rays ML')return 'home';
            if(title==='Cubs ML')return 'home';
            if(title.startsWith('Valkyries '))return 'home';
            if(title==='Bologna–Lazio under 2.5'||title==='Osasuna–Levante under 2.5')return 'under';
            if(title==='Roma–Fiorentina over 2.5')return 'over';
            if(title==='Talleres–Rosario Central draw')return 'draw';
            return 'away';
          }
          function marketKey(rec){const f=rec.feed||{}; if(f.marketKey)return String(f.marketKey).toLowerCase(); if(/under 2\.5|over 2\.5/i.test(rec.title))return 'totals'; if(/draw$/i.test(rec.title))return 'ml'; if(/-[0-9]+(?:\.[0-9]+)?$/.test(rec.title))return 'spread'; return 'ml'}
          function sideOf(rec,result){return String(rec.feed?.side||inferLegacySide(rec.title,result)).toLowerCase()}
          function grade(rec,v){const key=marketKey(rec),side=sideOf(rec,v),line=lineValue(rec) ?? (/under 2\.5|over 2\.5/i.test(rec.title)?2.5:(/-(\d+(?:\.\d+)?)$/.test(rec.title)?-Number(rec.title.match(/-(\d+(?:\.\d+)?)$/)[1]):null));
            if(key==='ml'){
              if(side==='draw')return v.as===v.hs?'WIN':'LOSS';
              const s=side==='home'?v.hs:v.as,o=side==='home'?v.as:v.hs; return s>o?'WIN':s<o?'LOSS':'PUSH';
            }
            if(key==='spread'){
              const h=side==='home'?line:-line,s=side==='home'?v.hs:v.as,o=side==='home'?v.as:v.hs,z=s+h-o; return z>0?'WIN':z<0?'LOSS':'PUSH';
            }
            if(key==='totals'){
              const total=v.hs+v.as;if(total===line)return 'PUSH';return side==='over'?(total>line?'WIN':'LOSS'):(total<line?'WIN':'LOSS');
            }
            return null;
          }
          function baseItem(run,rec,old){return {
            ...(old||{}),title:rec.title,status:rec.status,book:rec.book||null,selectionKey:rec.feed?.selectionKey||old?.selectionKey||null,commenceTime:rec.feed?.eventDate||old?.commenceTime||null,
            issued:old?.issued||{priceAmerican:rec.price||null,feedGeneratedAt:run.feedGeneratedAt||null},
            observation:old?.observation||{state:'unavailable',reason:rec.feed?.selectionKey?'price_not_backfilled':'issued_identity_missing'}
          }}
          function completed(run,rec,old,v){const g=grade(rec,v);if(!g)throw Error(`cannot grade ${rec.title}`);const prior=old?.completion||{};return {...baseItem(run,rec,old),completion:{state:'complete',verificationState:'verified',grade:g,official:rec.status==='BET',hypothetical:rec.status!=='BET',verifiedAt:NOW,eventId:rec.feed?.eventId||prior.eventId||null,finalScore:{home:v.home,away:v.away,homeScore:v.hs,awayScore:v.as},settlementMethod:'final_score',line:lineValue(rec)??(/under 2\.5|over 2\.5/i.test(rec.title)?2.5:(/-(\d+(?:\.\d+)?)$/.test(rec.title)?-Number(rec.title.match(/-(\d+(?:\.\d+)?)$/)[1]):null)),basis:null,observedValue:null,settlementComponents:null,source:v.src,firstUnresolvedAt:prior.firstUnresolvedAt||null,lastVerificationAttemptAt:NOW,verificationAttempts:Number(prior.verificationAttempts||0)+1,nextRetryTier:null}}}
          let closed=0,created=0,updated=0;
          for(const rp of targets){
            const run=JSON.parse(fs.readFileSync(rp,'utf8')),date=dateOf(rp),op=rp.replace('/runs/','/observations/');
            fs.mkdirSync(path.dirname(op),{recursive:true});
            const old=fs.existsSync(op)?JSON.parse(fs.readFileSync(op,'utf8')):null;
            const oldByKey=new Map((old?.recommendations||[]).map(x=>[x.selectionKey||`title:${x.title}`,x]));
            const recs=[];
            for(const rec of run.recs||[]){
              const key=rec.feed?.selectionKey||`title:${rec.title}`,prior=oldByKey.get(key);
              if(prior?.completion?.state==='complete'){recs.push(prior);continue;}
              const v=R[date]?.[rec.title];
              if(!v){
                if(prior){recs.push(prior);continue;}
                recs.push({...baseItem(run,rec,null),completion:{state:'unresolved',verificationState:'unresolved',grade:null,official:false,hypothetical:rec.status!=='BET',verifiedAt:null,eventId:rec.feed?.eventId||null,reason:'result_not_verified',firstUnresolvedAt:NOW,lastVerificationAttemptAt:NOW,verificationAttempts:1,nextRetryTier:'exception'}});continue;
              }
              recs.push(completed(run,rec,prior,v));closed++;
            }
            const doc={schemaVersion:1,kind:'issued-card-observations',sourceRun:rp,runId:run.ts,slot:run.slot,resultMethod:old?.resultMethod||{lifecycle:'ISSUED -> UNRESOLVED -> VERIFIED -> COMPLETE',scoreMarkets:['ml','spread','totals'],spreadHdpSemantics:'raw hdp is the home-side handicap; away selected handicap is the opposite sign',unsupportedMarkets:'remain unresolved unless exact selection verification is supplied',officialOnlyWhenStatus:'BET',issuedReportMutable:false},recommendations:recs};
            fs.writeFileSync(op,JSON.stringify(doc,null,2)+'\n');if(old)updated++;else created++;
          }
          console.log(`OLDER BACKLOG CLOSEOUT: closed=${closed} createdSidecars=${created} updatedSidecars=${updated}`);
          NODE

      - name: Rebuild downstream results index
        run: |
          node tools/build-results-index.mjs
          node tools/add-results-player-value.mjs
          node tools/add-results-shadow-v2.mjs

      - name: Verify coverage and strict isolation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const idx=JSON.parse(fs.readFileSync('data/history/results-index.json','utf8'));
          console.log(`FINAL INDEX: cards=${idx.coverage.cards} complete=${idx.coverage.completeCards} unresolved=${idx.coverage.unresolvedCards} pendingObservationCards=${idx.coverage.pendingObservationCards} unresolvedSelections=${idx.coverage.unresolvedSelections} unresolvedEvents=${idx.coverage.unresolvedEvents} lastDate=${idx.coverage.lastDate}`);
          console.log(`UNRESOLVED: ${JSON.stringify(idx.unresolved.map(x=>({date:x.date,title:x.title,reason:x.reason})))}`);
          const d=idx.byDate.find(x=>x.name==='2026-09-12');
          console.log(`SEP12 INDEX: ${JSON.stringify(d)}`);
          NODE
          bad=$(git diff --name-only | grep -Ev '^(data/history/observations/|data/history/results-index\.json$)' || true)
          if [ -n "$bad" ]; then echo "Unexpected changes outside historical grading outputs:"; echo "$bad"; exit 1; fi
          if git diff --name-only | grep -q '^data/history/runs/'; then echo 'Issued run mutation forbidden'; exit 1; fi

      - name: Commit historical grading outputs only
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "betting-edge-bot@users.noreply.github.com"
          git add data/history/observations data/history/results-index.json
          if git diff --cached --quiet; then echo "No historical grading changes to commit"; exit 0; fi
          git commit -m "Close verified older historical grading backlog"
          git push origin main
