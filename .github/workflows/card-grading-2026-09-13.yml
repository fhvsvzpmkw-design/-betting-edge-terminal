name: Isolated Betting Edge card grading 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/card-grading-2026-09-13.yml"

permissions:
  contents: write

concurrency:
  group: betting-edge-card-grading-2026-09-13
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Close independently verified Sep 12 exceptions
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const DATE='2026-09-12';
          const NOW=new Date().toISOString();
          const obsRoot=path.join('data/history/observations',DATE);
          const runRoot=path.join('data/history/runs',DATE);
          const norm=s=>String(s||'').normalize('NFKD').replace(/[’'`´]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const sources={
            BC:{name:'The Canadian Press — B.C. Lions 48, Montreal Alouettes 29 — 2026-09-12',url:'https://infonews.ca/news/7869535/horvaths-three-tds-power-bc-lions-to-48-29-victory-over-montreal-alouettes/'},
            OTT:{name:'The Canadian Press — Toronto Argonauts 26, Ottawa Redblacks 23 — 2026-09-12',url:'https://rdnewsnow.com/2026/09/12/lirim-hajrullahus-29-yard-field-goal-earns-argos-26-23-victory-over-redblacks/'},
            SSK:{name:'The Canadian Press — Winnipeg Blue Bombers 19, Saskatchewan Roughriders 6 — 2026-09-12',url:'https://rdnewsnow.com/2026/09/12/blue-bombers-pick-roughriders-apart-to-win-banjo-bowl-19-6/'},
            MTSU:{name:'Associated Press — Marshall 28, Middle Tennessee 26 — 2026-09-12',url:'https://infonews.ca/news/7869372/turner-bradshaws-2-tds-rally-marshall-over-middle-tennessee-28-26/'},
            TAR:{name:'Associated Press/CBS Sports — Tarleton State 27, McNeese 24 — 2026-09-12',url:'https://10704107906.golf.cbssports.com/college-football/gametracker/recap/NCAAF_20260912_TRLST%40MCN/'},
            GRAM:{name:'Associated Press/CBS Sports — TCU 63, Grambling State 7 — 2026-09-12',url:'https://prueba.games.cbssports.com/college-football/gametracker/recap/NCAAF_20260912_GRAM%40TCU/'},
            TUL:{name:'University of Tulsa Athletics — Tulsa 23, Sam Houston 17 — 2026-09-12',url:'https://tulsahurricane.com/news/2026/9/12/Tulsa-defeats-sam-houston-23-17'},
            HOLY:{name:'Associated Press/CBS Sports — Miami (Ohio) 45, Holy Cross 7 — 2026-09-12',url:'https://5554.racing.cbssports.com/college-football/gametracker/recap/NCAAF_20260912_HOLY%40MIAOH/'},
            APP:{name:'Associated Press/CBS Sports — Appalachian State 27, East Carolina 24 — 2026-09-12',url:'https://si.games.cbssports.com/college-football/gametracker/recap/NCAAF_20260912_APLST%40ECU/'}
          };
          const verified=[
            {id:'BC',away:'Montreal Alouettes',home:'British Columbia Lions',as:29,hs:48,source:sources.BC},
            {id:'OTT',away:'Ottawa Redblacks',home:'Toronto Argonauts',as:23,hs:26,source:sources.OTT},
            {id:'SSK',away:'Saskatchewan Roughriders',home:'Winnipeg Blue Bombers',as:6,hs:19,source:sources.SSK},
            {id:'MTSU',away:'Middle Tennessee State Blue Raiders',home:'Marshall Herd',as:26,hs:28,source:sources.MTSU},
            {id:'TAR',away:'Tarleton State Texans',home:'McNeese State Cowboys',as:27,hs:24,source:sources.TAR},
            {id:'GRAM',away:'Grambling State Tigers',home:'TCU Horned Frogs',as:7,hs:63,source:sources.GRAM},
            {id:'TUL',away:'Tulsa Golden Hurricane',home:'Sam Houston State Bearkats',as:23,hs:17,source:sources.TUL},
            {id:'HOLY',away:'Holy Cross Crusaders',home:'Miami Ohio RedHawks',as:7,hs:45,source:sources.HOLY},
            {id:'APP',away:'Appalachian State Mountaineers',home:'East Carolina Pirates',as:27,hs:24,source:sources.APP}
          ];
          const aliases=new Map([
            ['bc lions','british columbia lions'],['miami oh redhawks','miami ohio redhawks'],['miami ohio redhawks','miami ohio redhawks'],
            ['app state mountaineers','appalachian state mountaineers'],['middle tennessee blue raiders','middle tennessee state blue raiders'],
            ['sam houston bearkats','sam houston state bearkats'],['mcneese cowboys','mcneese state cowboys'],['tcu horned frogs','tcu horned frogs']
          ]);
          function canon(s){const n=norm(s); return aliases.get(n)||n;}
          function tokens(s){return new Set(canon(s).split(' ').filter(Boolean));}
          function teamEq(a,b){
            const x=canon(a),y=canon(b); if(!x||!y)return false; if(x===y||x.includes(y)||y.includes(x))return true;
            const A=tokens(x),B=tokens(y),common=[...A].filter(t=>B.has(t)).length,small=Math.min(A.size,B.size);
            return common>=2 && common/small>=0.6;
          }
          function parseMeta(meta){
            const m=String(meta||'').match(/^(?:MLB|NCAAF|NFL|CFL)\s*\|\s*(.+?)\s+at\s+(.+?)\s*\|/i);
            return m?{away:m[1].trim(),home:m[2].trim()}:null;
          }
          function findVerified(rec){const m=parseMeta(rec.meta); if(!m)return null; return verified.find(v=>teamEq(m.away,v.away)&&teamEq(m.home,v.home))||null;}
          function lineValue(rec){
            const f=rec.feed||{};
            for(const v of [f.hdp,f.line]) if(Number.isFinite(Number(v))) return Number(v);
            const p=String(f.selectionKey||'').split('|'),tail=p.length>=5?p[4]:null;
            return tail!==null&&tail!==''&&Number.isFinite(Number(tail))?Number(tail):null;
          }
          function grade(rec,v){
            const f=rec.feed||{},key=String(f.marketKey||f.market||'').toLowerCase(),side=String(f.side||'').toLowerCase();
            if(key==='ml'){
              const s=side==='home'?v.hs:side==='away'?v.as:null,o=side==='home'?v.as:side==='away'?v.hs:null;
              if(s===null)return null; return s>o?'WIN':s<o?'LOSS':'PUSH';
            }
            if(key==='spread'||key==='spreads'){
              const raw=lineValue(rec); if(!Number.isFinite(raw)||!['home','away'].includes(side))return null;
              const h=side==='home'?raw:-raw,s=side==='home'?v.hs:v.as,o=side==='home'?v.as:v.hs,z=s+h-o;
              return z>0?'WIN':z<0?'LOSS':'PUSH';
            }
            if(key==='total'||key==='totals'){
              const line=lineValue(rec); if(!Number.isFinite(line)||!['over','under'].includes(side))return null;
              const total=v.hs+v.as; if(total===line)return 'PUSH'; return side==='over'?(total>line?'WIN':'LOSS'):(total<line?'WIN':'LOSS');
            }
            return null;
          }
          let closed=0,left=0; const leftTitles=[];
          for(const f of fs.readdirSync(obsRoot).filter(x=>x.endsWith('.json')).sort()){
            const op=path.join(obsRoot,f),rp=path.join(runRoot,f),obs=JSON.parse(fs.readFileSync(op,'utf8')),run=JSON.parse(fs.readFileSync(rp,'utf8'));
            const recMap=new Map((run.recs||[]).map(r=>[r.feed?.selectionKey,r])); let changed=false;
            for(let i=0;i<(obs.recommendations||[]).length;i++){
              const item=obs.recommendations[i]; if(item.completion?.state!=='unresolved')continue;
              const rec=recMap.get(item.selectionKey); if(!rec){left++;leftTitles.push(item.title);continue;}
              const v=findVerified(rec); if(!v){left++;leftTitles.push(item.title);continue;}
              const g=grade(rec,v); if(!g){left++;leftTitles.push(item.title);continue;}
              const old=item.completion||{};
              obs.recommendations[i]={...item,completion:{state:'complete',verificationState:'verified',grade:g,official:rec.status==='BET',hypothetical:rec.status!=='BET',verifiedAt:NOW,eventId:rec.feed?.eventId||null,finalScore:{home:v.home,away:v.away,homeScore:v.hs,awayScore:v.as},settlementMethod:'final_score',line:lineValue(rec),basis:null,observedValue:null,settlementComponents:null,source:v.source,firstUnresolvedAt:old.firstUnresolvedAt||null,lastVerificationAttemptAt:NOW,verificationAttempts:Number(old.verificationAttempts||0)+1,nextRetryTier:null}};
              closed++; changed=true;
            }
            if(changed) fs.writeFileSync(op,JSON.stringify(obs,null,2)+'\n');
          }
          console.log(`SUPPORTED EXCEPTION CLOSEOUT: closed=${closed} remaining=${left}`);
          console.log(`REMAINING TITLES: ${JSON.stringify([...new Set(leftTitles)])}`);
          NODE

      - name: Rebuild downstream results index
        run: |
          node tools/build-results-index.mjs
          node tools/add-results-player-value.mjs
          node tools/add-results-shadow-v2.mjs

      - name: Verify final Sep 12 grading and strict isolation
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),date='2026-09-12';
          const runRoot=path.join('data/history/runs',date),obsRoot=path.join('data/history/observations',date);
          const rf=fs.readdirSync(runRoot).filter(f=>f.endsWith('.json')).sort(),of=fs.readdirSync(obsRoot).filter(f=>f.endsWith('.json')).sort();
          if(JSON.stringify(rf)!==JSON.stringify(of))throw Error('observation/run file mismatch');
          let cards=0,complete=0,unresolved=0,w=0,l=0,p=0; const statuses={};
          for(const f of of){const j=JSON.parse(fs.readFileSync(path.join(obsRoot,f),'utf8')); for(const r of j.recommendations||[]){cards++;statuses[r.status]=(statuses[r.status]||0)+1;if(r.completion?.state==='complete'){complete++;if(r.completion.grade==='WIN')w++;else if(r.completion.grade==='LOSS')l++;else if(r.completion.grade==='PUSH')p++;}else if(r.completion?.state==='unresolved')unresolved++;}}
          const idx=JSON.parse(fs.readFileSync('data/history/results-index.json','utf8'));
          console.log(`FINAL SEP12: cards=${cards} complete=${complete} unresolved=${unresolved} WIN=${w} LOSS=${l} PUSH=${p} statuses=${JSON.stringify(statuses)}`);
          console.log(`RESULTS INDEX: cards=${idx.coverage?.cards} complete=${idx.coverage?.completeCards} unresolved=${idx.coverage?.unresolvedCards} unresolvedSelections=${idx.coverage?.unresolvedSelections} unresolvedEvents=${idx.coverage?.unresolvedEvents} lastDate=${idx.coverage?.lastDate}`);
          NODE
          bad=$(git diff --name-only | grep -Ev '^(data/history/observations/|data/history/results-index\.json$)' || true)
          if [ -n "$bad" ]; then echo "Unexpected changes outside historical grading outputs:"; echo "$bad"; exit 1; fi
          if git diff --name-only | grep -q '^data/history/runs/'; then echo 'Issued run mutation forbidden'; exit 1; fi

      - name: Commit historical grading outputs only
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "betting-edge-bot@users.noreply.github.com"
          git add data/history/observations data/history/results-index.json
          if git diff --cached --quiet; then echo "No historical grading changes to commit"; exit 0; fi
          git commit -m "Close verified Sep 12 grading exceptions"
          git push origin main
