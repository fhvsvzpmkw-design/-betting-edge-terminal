name: Runtime churn audit
on:
  push:
    branches: [fix/global-scroll-runtime-churn]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-scroll-runtime-churn
      - name: Find recurring runtime work
        run: |
          echo '=== setInterval ==='
          grep -RIn --include='*.js' --include='*.html' 'setInterval' assets runner.html | sed -n '1,240p' || true
          echo '=== MutationObserver ==='
          grep -RIn --include='*.js' --include='*.html' 'MutationObserver' assets runner.html | sed -n '1,320p' || true
          echo '=== sticky/fixed paint ==='
          grep -RIn --include='*.js' --include='*.css' --include='*.html' -E 'position:(sticky|fixed)|filter:|backdrop-filter|box-shadow' assets runner.html | sed -n '1,320p' || true
