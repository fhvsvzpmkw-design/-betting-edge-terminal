name: One-time complete durable-history transition repair

on:
  push:
    branches: [history-wait-repair-20260829]
    paths:
      - .github/workflows/history-durable-repair-complete-once-20260829.yml

permissions:
  contents: write

concurrency:
  group: betting-edge-history-durable-repair-complete-once-20260829
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: history-wait-repair-20260829
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply complete evidence-preserving repair set
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {evaluate, loadProductionFramework, matchCondition} from './tools/core-handicap-framework.mjs';

          const WAIT_CUTOFF = Date.parse('2026-08-25T15:24:44-07:00');
          const CORE_CUTOFF = Date.parse('2026-08-25T17:20:00-07:00');
          const MARKET_ONLY = /\b(bet\s*365|draftkings|odds[-\s]?api(?:\.io)?|live[-\s]?odds|sportsbook(?:\s+pair)?|two[-\s]?book|no[-\s]?vig|market consensus|market-derived)\b/i;
          const index = JSON.parse(fs.readFileSync('run-history.json','utf8'));
          const production = JSON.parse(fs.readFileSync('core/core-v1.4-production.json','utf8'));
          const framework = loadProductionFramework();
          const frameworkData = fs.readFileSync(production.modelErrorFramework.path);
          const activeFrameworkBlobSha = crypto.createHash('sha1').update(Buffer.from(`blob ${frameworkData.length}\0`)).update(frameworkData).digest('hex');
          const changedFiles = new Set();
          const repairs = [];

          function nonEmpty(v){ return typeof v === 'string' && v.trim().length > 0; }
          function serialize(original,data){ return JSON.stringify(data,null,2) + (original.endsWith('\n') ? '\n' : ''); }
          function setEqual(a,b){ return a.size===b.size && [...a].every(v=>b.has(v)); }
          function expectedResearchIds(context){
            return [...new Set((framework.graduatedResearchRules||[]).filter(rule=>matchCondition(rule.when,context)).map(rule=>rule.priorId))].sort();
          }
          function validQualification(q){
            if(!q || typeof q !== 'object' || Array.isArray(q) || q.actionableIfResolved !== true) return false;
            if(!Array.isArray(q.blockers) || !q.blockers.length || q.blockers.some(x=>!nonEmpty(x))) return false;
            if(!Array.isArray(q.independentSignals) || !q.independentSignals.length) return false;
            for(const s of q.independentSignals){
              if(!s || typeof s !== 'object' || Array.isArray(s) || !nonEmpty(s.origin) || !nonEmpty(s.finding) || MARKET_ONLY.test(s.origin)) return false;
            }
            return nonEmpty(q.rationale);
          }
          function deriveQualification(rec){
            const e = rec?.personnelEvidence;
            const support = String(rec?.coreAssessment?.context?.independentCurrentSupport || '').toUpperCase();
            if(!e || typeof e !== 'object' || Array.isArray(e) || !['MODERATE','STRONG'].includes(support)) return null;
            const blockers = [...new Set((Array.isArray(e.unresolved) ? e.unresolved : []).filter(nonEmpty).map(x=>String(x).trim()))];
            if(!blockers.length) return null;
            const pool = [
              ...(Array.isArray(e.officialSources) ? e.officialSources : []),
              ...(Array.isArray(e.fallbackSources) ? e.fallbackSources : [])
            ];
            const seen = new Set();
            const independentSignals = [];
            for(const s of pool){
              const origin = String(s?.origin || '').trim();
              const finding = String(s?.fact || s?.finding || '').trim();
              if(!origin || !finding || MARKET_ONLY.test(origin)) continue;
              const key = origin.toLowerCase().replace(/\s+/g,' ');
              if(seen.has(key)) continue;
              seen.add(key);
              independentSignals.push({origin,finding});
              if(independentSignals.length >= 2) break;
            }
            if(!independentSignals.length) return null;
            return {
              actionableIfResolved:true,
              blockers,
              independentSignals,
              rationale:`Historical WAIT retained because preserved ${support.toLowerCase()} independent current support and the named unresolved gate(s) left a plausible path to materially closer actionability if resolved; fresh re-handicapping, current identity/freshness checks and an executable price were still required.`
            };
          }

          for(const entry of index.runs || []){
            if(!entry.researchFitPath) continue;
            const sidecarPath = entry.researchFitPath;
            const original = fs.readFileSync(sidecarPath,'utf8');
            const sidecar = JSON.parse(original);
            const report = JSON.parse(fs.readFileSync(entry.path,'utf8'));
            let changed = false;

            if(Number.isFinite(Date.parse(entry.ts)) && Date.parse(entry.ts) >= WAIT_CUTOFF){
              for(const rec of sidecar.recommendations || []){
                if(String(rec?.status || '').toUpperCase() === 'WAIT' && !validQualification(rec.waitQualification)){
                  const q = deriveQualification(rec);
                  if(!q || !validQualification(q)) throw new Error(`${sidecarPath} #${rec?.ordinal} ${rec?.title}: WAIT qualification cannot be safely derived`);
                  rec.waitQualification = q;
                  changed = true;
                  repairs.push(`WAIT ${entry.ts} #${rec.ordinal} ${rec.title}`);
                }
              }
            }

            if(entry.ts === '2026-08-27T15:21:41.695-07:00'){
              const rec = (sidecar.recommendations || []).find(r=>r.ordinal===9);
              if(!rec || rec.title !== 'Academia del Balompié Boliviano moneyline') throw new Error('Expected August 27 recommendation #9 was not found');
              const e = rec.personnelEvidence;
              if(!e || typeof e !== 'object') throw new Error('Academia recommendation is missing personnelEvidence');
              if(!Array.isArray(e.officialSources)) e.officialSources = [];
              if(e.officialSources.length === 0){
                e.officialSources.push({
                  origin:'Federación Boliviana de Fútbol — División Profesional',
                  url:'https://fbf.com.bo/torneos/division-profesional/',
                  asOf:new Date().toISOString(),
                  fact:'Post-issuance durable-history repair check: the official FBF División Profesional page lists both Bolívar and A.B.B.; this authority check does not resolve or overwrite the archived official-lineup source shortfall.'
                });
                changed = true;
                repairs.push(`AUTHORITY ${entry.ts} #9 Academia del Balompié Boliviano moneyline`);
              }
            }

            const items = Array.isArray(sidecar.recommendations) ? sidecar.recommendations : [];
            const reportRecs = Array.isArray(report.recs) ? report.recs : [];
            if(items.length !== reportRecs.length) throw new Error(`${sidecarPath}: recommendation count mismatch prevents safe displayText normalization`);
            for(let i=0;i<items.length;i++){
              const item = items[i], rec = reportRecs[i];
              if(item.ordinal !== i+1 || item.title !== rec.title || item.status !== rec.status){
                throw new Error(`${sidecarPath} #${i+1}: title/status/ordinal mismatch prevents safe displayText normalization`);
              }
              if(item.displayText !== rec.hist){
                item.displayText = rec.hist;
                changed = true;
                repairs.push(`DISPLAY ${entry.ts} #${i+1} ${rec.title}`);
              }
            }

            if(Date.parse(entry.ts) >= CORE_CUTOFF){
              for(const item of items){
                const a = item.coreAssessment;
                if(!a?.context) throw new Error(`${sidecarPath} #${item.ordinal}: missing Core 1.4 assessment context`);

                if(entry.ts === '2026-08-29T09:31:08.000-07:00' && item.ordinal === 9 && item.title === 'Jacksonville State Gamecocks moneyline' && a.context.bookDispersion === 'LOW'){
                  a.context.bookDispersion = 'MODERATE';
                  changed = true;
                  repairs.push(`CORE-CONTEXT ${entry.ts} #9 Jacksonville State Gamecocks moneyline bookDispersion LOW→MODERATE`);
                }

                const w = item.waltersEvidence;
                const waltersEligible = a.context.sport === 'NFL' && ['spread','moneyline'].includes(a.context.marketClass);
                if(waltersEligible && w?.availability === 'STALE'){
                  if(w.applicable !== true || w.originatedCandidate !== false || w.contribution !== 'NONE' || (w.waltersFair !== null && w.waltersFair !== undefined) || !/not current|stale/i.test(String(w.reviewImpact||''))){
                    throw new Error(`${sidecarPath} #${item.ordinal}: STALE Walters record is not safe to normalize to UNAVAILABLE`);
                  }
                  w.availability = 'UNAVAILABLE';
                  changed = true;
                  repairs.push(`WALTERS ${entry.ts} #${item.ordinal} ${item.title} STALE→UNAVAILABLE`);
                }

                if(sidecar.provenance?.coreFrameworkBlobSha === activeFrameworkBlobSha){
                  const expectedIds = expectedResearchIds(a.context);
                  const normalizedContext = {...a.context,graduatedResearchIds:expectedIds};
                  const actual = evaluate(framework,normalizedContext);
                  const mismatch =
                    !Array.isArray(a.context.graduatedResearchIds) || !setEqual(new Set(a.context.graduatedResearchIds||[]),new Set(expectedIds)) ||
                    a.modelErrorState !== actual.modelErrorState ||
                    a.betEligibleByModelError !== actual.betEligibleByModelError ||
                    !Array.isArray(a.effects) || !setEqual(new Set(a.effects||[]),new Set(actual.effects)) ||
                    !Array.isArray(a.appliedRules) || !setEqual(new Set(a.appliedRules||[]),new Set(actual.appliedRules));
                  if(mismatch){
                    a.context.graduatedResearchIds = expectedIds;
                    a.modelErrorState = actual.modelErrorState;
                    a.betEligibleByModelError = actual.betEligibleByModelError;
                    a.effects = actual.effects;
                    a.appliedRules = actual.appliedRules;
                    a.reasons = actual.reasons;
                    changed = true;
                    repairs.push(`CORE ${entry.ts} #${item.ordinal} ${item.title}`);
                  }
                }
              }
            }

            if(changed){
              fs.writeFileSync(sidecarPath,serialize(original,sidecar),'utf8');
              changedFiles.add(sidecarPath);
            }
          }

          console.log(`REPAIR COUNT ${repairs.length}`);
          for(const r of repairs) console.log(`REPAIRED ${r}`);
          console.log(`REPAIR FILE COUNT ${changedFiles.size}`);
          for(const f of changedFiles) console.log(`CHANGED ${f}`);
          if(!changedFiles.size) throw new Error('No durable-history repairs were produced');
          NODE

      - name: Verify complete durable history
        run: |
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history

      - name: Commit repaired history and remove temporary workflows
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/history/research-fit
          for file in \
            .github/workflows/history-wait-qualification-repair-once-20260829.yml \
            .github/workflows/history-durable-audit-once-20260829.yml \
            .github/workflows/history-durable-repair-final-once-20260829.yml \
            .github/workflows/history-sidecar-alignment-audit-once-20260829.yml \
            .github/workflows/history-core14-derived-audit-once-20260829.yml \
            .github/workflows/history-walters-evidence-audit-once-20260829.yml \
            .github/workflows/history-core14-context-audit-once-20260829.yml \
            .github/workflows/history-durable-repair-complete-once-20260829.yml; do
            if [ -e "$file" ]; then git rm -f "$file"; fi
          done
          git commit -m 'history: repair post-cutover durable-history metadata'
          git push origin HEAD:history-wait-repair-20260829

      - name: Remote read-back verification
        run: |
          git fetch origin history-wait-repair-20260829
          git reset --hard origin/history-wait-repair-20260829
          node tools/report-publication.mjs verify
          node tools/core-v14-publication-gate.mjs verify-history
