name: Build direct runner scroll path

on:
  push:
    branches:
      - fix/iphone-scroll-flatten
    paths:
      - .github/workflows/scroll-flatten-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iphone-scroll-flatten
      - name: Flatten runner browsing path
        shell: python
        run: |
          from pathlib import Path

          runner_path = Path('runner.html')
          runner = runner_path.read_text()
          old = "art.addEventListener('error',()=>splash.classList.add('asset-error'),{once:true});core.addEventListener('load',()=>{coreLoaded=true;watchHierarchy();reveal()},{once:true});const coreUrl=new URL('./runner-core.html',location.href);for(const [k,v] of new URLSearchParams(location.search))coreUrl.searchParams.set(k,v);coreUrl.searchParams.set('build',String(Date.now()));coreUrl.hash=location.hash;core.src=coreUrl.pathname+coreUrl.search+coreUrl.hash;startWhenVisible();"
          new = r"""function installDirectAppShim(){
            let d=null;try{d=core.contentDocument}catch(e){return null}if(!d||!d.body)return null;
            let app=d.getElementById('app');if(!app){app=d.createElement('div');app.id='app';app.style.display='none';app.setAttribute('aria-hidden','true');app.dataset.vigscopeDirectShim='1';d.body.appendChild(app)}
            try{Object.defineProperty(app,'contentDocument',{configurable:true,get:()=>d})}catch(e){try{app.contentDocument=d}catch(_){}}
            try{Object.defineProperty(app,'contentWindow',{configurable:true,get:()=>d.defaultView})}catch(e){try{app.contentWindow=d.defaultView}catch(_){}}
            let err=d.getElementById('err');if(!err){err=d.createElement('div');err.id='err';err.style.cssText='display:none;position:fixed;z-index:2147482000;left:10px;right:10px;top:10px;padding:10px;background:#25060d;color:#ff9cad;border:1px solid #ff6178;font:12px ui-monospace,SFMono-Regular,Menlo,monospace';d.body.appendChild(err)}
            return app
          }
          function bootDirectCore(){
            let d=null;try{d=core.contentDocument}catch(e){}const app=installDirectAppShim();if(!d||!d.head||!app){setTimeout(bootDirectCore,30);return}
            let settled=false;const finish=()=>{if(settled)return;settled=true;coreLoaded=true;watchHierarchy();reveal()};
            d.addEventListener('vigscope-core-ready',finish,{once:true});
            const loader=d.createElement('script');loader.id='runnerCoreDirectLoader';loader.src=`./assets/runner-core-direct-loader.js?build=${Date.now()}`;loader.async=false;loader.onerror=finish;d.head.appendChild(loader);
            setTimeout(finish,6000)
          }
          art.addEventListener('error',()=>splash.classList.add('asset-error'),{once:true});core.addEventListener('load',bootDirectCore,{once:true});const coreUrl=new URL('./index.html',location.href);for(const [k,v] of new URLSearchParams(location.search))coreUrl.searchParams.set(k,v);coreUrl.searchParams.set('build',String(Date.now()));coreUrl.hash=location.hash;core.src=coreUrl.pathname+coreUrl.search+coreUrl.hash;startWhenVisible();"""
          if runner.count(old) != 1:
              raise SystemExit(f'runner boot pattern count was {runner.count(old)}, expected 1')
          runner = runner.replace(old, new)
          runner_path.write_text(runner)

          loader = r"""(()=>{
            'use strict';
            const READY_EVENT='vigscope-core-ready';
            function showError(message){
              let err=document.getElementById('err');
              if(!err){err=document.createElement('div');err.id='err';document.body.appendChild(err)}
              err.textContent='VigScope core loader error: '+message;
              err.style.display='block';
            }
            async function boot(){
              const shim=document.getElementById('app');
              if(!shim)throw new Error('direct app compatibility shim missing');
              const response=await fetch(`./runner-core.html?runtime=${Date.now()}`,{cache:'no-store'});
              if(!response.ok)throw new Error(`runner-core ${response.status}`);
              const html=await response.text();
              const blocks=[...html.matchAll(/<script>([\s\S]*?)<\/script>/gi)];
              const match=blocks.find(item=>item[1].includes("const HISTORY_KEY='bettingEdge.runnerHistory.v1.3'"));
              if(!match)throw new Error('runner-core runtime script not found');
              const runtime=document.createElement('script');
              runtime.id='runnerCoreDirectRuntime';
              runtime.textContent=match[1]+'\n//# sourceURL=runner-core-direct-runtime.js';
              document.head.appendChild(runtime);
              shim.dispatchEvent(new Event('load'));
              document.dispatchEvent(new CustomEvent(READY_EVENT,{detail:{mode:'direct'}}));
            }
            boot().catch(error=>{
              console.error(error);
              showError(error&&error.message?error.message:String(error));
              document.dispatchEvent(new CustomEvent(READY_EVENT,{detail:{mode:'direct',error:String(error)}}));
            });
          })();
          """
          Path('assets/runner-core-direct-loader.js').write_text(loader)

          audit = Path('scroll-flatten-audit.txt')
          if audit.exists():
              audit.unlink()
      - name: Static checks
        shell: bash
        run: |
          node --check assets/runner-core-direct-loader.js
          grep -q "new URL('./index.html',location.href)" runner.html
          grep -q "runner-core-direct-loader.js" runner.html
          if grep -q "new URL('./runner-core.html',location.href)" runner.html; then
            echo 'runner.html still boots through runner-core.html' >&2
            exit 1
          fi
          node tests/runner-session-strip-applicability.test.js
          node tests/price-watch-guardrails.test.js
      - name: Save branch result and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/scroll-flatten-build.yml
          git add runner.html assets/runner-core-direct-loader.js
          git add -u scroll-flatten-audit.txt || true
          git commit -m 'Flatten VigScope runner scroll path'
          git push origin HEAD:fix/iphone-scroll-flatten
