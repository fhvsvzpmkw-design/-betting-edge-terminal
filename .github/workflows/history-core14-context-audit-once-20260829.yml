name: One-time Core 1.4 history-context audit

on:
  push:
    branches: [history-wait-repair-20260829]
    paths:
      - .github/workflows/history-core14-context-audit-once-20260829.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: history-wait-repair-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate all invalid Core 1.4 context values
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {loadProductionFramework, validateContext} from './tools/core-handicap-framework.mjs';
          const CORE_V14_FROM=Date.parse('2026-08-25T17:20:00-07:00');
          const index=JSON.parse(fs.readFileSync('run-history.json','utf8'));
          const framework=loadProductionFramework();
          const issues=[]; const frequencies={}; let bundles=0,recs=0;
          for(const entry of index.runs||[]){
            if(Date.parse(entry.ts)<CORE_V14_FROM||!entry.researchFitPath) continue;
            bundles++;
            const sidecar=JSON.parse(fs.readFileSync(entry.researchFitPath,'utf8'));
            for(const item of sidecar.recommendations||[]){
              recs++;
              const c=item?.coreAssessment?.context;
              if(c&&typeof c==='object'){
                for(const [k,v] of Object.entries(c)){
                  if(['graduatedResearchIds'].includes(k)) continue;
                  const key=`${k}=${JSON.stringify(v)}`;
                  frequencies[key]=(frequencies[key]||0)+1;
                }
              }
              try{validateContext(framework,c,`Recommendation ${item?.ordinal}`);}
              catch(error){issues.push(`${entry.ts} | ${entry.researchFitPath} | #${item?.ordinal??'?'} ${item?.title||'UNKNOWN'} | ${error.message} | context=${JSON.stringify(c)}`);}
            }
          }
          console.log(`CONTEXT AUDIT BUNDLES ${bundles}`);
          console.log(`CONTEXT AUDIT RECOMMENDATIONS ${recs}`);
          console.log(`CONTEXT AUDIT ISSUE COUNT ${issues.length}`);
          for(const x of issues) console.log(`ISSUE ${x}`);
          console.log('CONTEXT VALUE FREQUENCIES');
          for(const [k,v] of Object.entries(frequencies).sort()) console.log(`VALUE ${k} count=${v}`);
          if(issues.length) throw new Error(`Core 1.4 context audit found ${issues.length} invalid context(s)`);
          NODE
