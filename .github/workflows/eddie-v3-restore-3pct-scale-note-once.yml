name: Eddie V3 restore 3pct scale note once

on:
  push:
    paths:
      - '.github/workflows/eddie-v3-restore-3pct-scale-note-once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 3 percent unit scale and expose rule
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          page = Path('syndicates/generated/eddie-numbers/hotline.html')
          s = page.read_text()

          # Restore the intended 3% / $100 public scale everywhere.
          s = s.replace('current 2% bankroll unit displays as $100', 'current 3% bankroll unit displays as $100')
          s = s.replace('UNIT_RATE=.02', 'UNIT_RATE=.03')
          s = s.replace('current 2% source unit', 'current 3% source unit')
          s = s.replace('public 2% unit equals $100', 'public 3% unit equals $100')
          s = s.replace('2% source-bankroll unit', '3% source-bankroll unit')
          s = s.replace('2% unit', '3% unit')
          s = s.replace('(current bankroll × 2%)', '(current bankroll × 3%)')
          s = s.replace('(bankrollCad × 0.02)', '(bankrollCad × 0.03)')
          s = s.replace('(bankrollCad * 0.02)', '(bankrollCad * 0.03)')
          s = s.replace('normalized bankroll equals $5,000', 'normalized bankroll equals $3,333.33')
          s = s.replace('normalized bankroll with a $100 active unit', 'normalized bankroll with a $100 active unit')
          s = s.replace('$5,000 normalized bankroll', '$3,333.33 normalized bankroll')
          s = s.replace('normalized bankroll at $5,000', 'normalized bankroll at $3,333.33')

          # Add a compact explanatory line to the upper scale block.
          old_scale = '<div class="sourceMetric"><small>$100 Unit Scale</small><b id="scale">—</b></div>'
          new_scale = '<div class="sourceMetric"><small>$100 Unit Scale</small><b id="scale">—</b><div class="scaleRule">3% OF BANKROLL = 1 UNIT</div></div>'
          if old_scale in s:
              s = s.replace(old_scale, new_scale, 1)
          elif '3% OF BANKROLL = 1 UNIT' not in s:
              raise SystemExit('Expected unit-scale block not found')

          # Make the bankroll card self-explanatory too.
          s = s.replace('<div class="sub">$100-unit equivalent</div>', '<div class="sub">3% = $100 UNIT</div>', 1)

          css_anchor = '.source b{display:block;margin-top:2px}'
          css_add = '.source b{display:block;margin-top:2px}.scaleRule{margin-top:4px;color:var(--gold);font-size:7px;font-weight:900;letter-spacing:.08em}'
          if '.scaleRule{' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_add, 1)

          page.write_text(s)

          prof_path = Path('data/characters/eddie-numbers.json')
          prof = json.loads(prof_path.read_text())
          prof['updatedAt'] = '2026-08-23T20:22:00-07:00'
          auth = prof['authority']
          auth['updateModel'] = 'The live V3 Hotline fetches /data/bet-history-public.json directly with cache bypass. It calculates the current 3% source-bankroll unit and automatically applies 100 / (bankroll × 3%) to displayed bankroll and all wager/performance dollar amounts, producing a $3,333.33 normalized bankroll with a $100 active unit.'
          ps = auth.setdefault('presentationScale', {})
          ps['unitPercent'] = 0.03
          ps['targetUnitCad'] = 100
          ps['multiplierFormula'] = '100 / (bankrollCad * 0.03)'
          ps['bankrollUnscaled'] = False
          ps['appliesTo'] = 'displayed bankroll plus all displayed wager/performance dollar amounts; source ledger values remain untouched; counts, ROI and percentage ratios are unchanged'
          ps['normalizedBankrollCad'] = 3333.33
          prof['hotlineStyle']['ledgerRules']['moneyRule'] = 'Do not modify source ledger values. For displayed bankroll and every displayed wager/performance dollar amount, multiply the public-ledger source value by 100 / (bankrollCad × 0.03). Recalculate automatically whenever the public bankroll changes. This fixes the normalized bankroll at $3,333.33 and the active 3% unit at $100. ROI, counts and percentage ratios remain unchanged.'
          prof['guardrails']['publicUnitNormalization'] = 'Current 3% source-bankroll unit is normalized to $100 for all Hotline bankroll/wager/performance dollar presentation; normalized bankroll is $3,333.33 and the multiplier updates automatically from the public bankroll.'
          prof['guardrails']['scaledBankrollPresentation'] = 'Displayed bankroll is scaled by the same current-bankroll multiplier as performance dollars so the public 3% unit equals $100 and the normalized bankroll equals $3,333.33; source bankroll in the underlying public ledger remains unchanged.'
          prof_path.write_text(json.dumps(prof, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Verify 3 percent scale note
        run: |
          grep -F 'UNIT_RATE=.03' syndicates/generated/eddie-numbers/hotline.html
          grep -F '3% OF BANKROLL = 1 UNIT' syndicates/generated/eddie-numbers/hotline.html
          grep -F '3% = $100 UNIT' syndicates/generated/eddie-numbers/hotline.html
          ! grep -F 'current 2% bankroll unit' syndicates/generated/eddie-numbers/hotline.html
          grep -F '"unitPercent": 0.03' data/characters/eddie-numbers.json
      - name: Commit 3 percent scale note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syndicates/generated/eddie-numbers/hotline.html data/characters/eddie-numbers.json
          git diff --cached --quiet && exit 0
          git commit -m "Show Eddie 3 percent unit scale rule"
          git push
