name: Walters BW6 Stage 3R1 Diagnosis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/walters/nfl/key-numbers/bw6-stage1-contract-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage2-model-lock-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage2-calibration-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage3-holdout-audit-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage3r1-diagnosis-contract-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage3r1-recalibration-diagnosis-v1.json'
      - 'tools/build-walters-bw6-stage2.py'
      - 'tools/build-walters-bw6-stage3.py'
      - 'tools/build-walters-bw6-stage3r1.py'
      - 'tools/validate-walters-bw6-stage3r1.mjs'
      - 'tests/walters-bw6-stage3r1.test.mjs'
      - '.github/workflows/walters-bw6-stage3r1.yml'
  pull_request:
    paths:
      - 'data/walters/nfl/key-numbers/bw6-stage1-contract-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage2-model-lock-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage2-calibration-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage3-holdout-audit-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage3r1-diagnosis-contract-v1.json'
      - 'data/walters/nfl/key-numbers/bw6-stage3r1-recalibration-diagnosis-v1.json'
      - 'tools/build-walters-bw6-stage2.py'
      - 'tools/build-walters-bw6-stage3.py'
      - 'tools/build-walters-bw6-stage3r1.py'
      - 'tools/validate-walters-bw6-stage3r1.mjs'
      - 'tests/walters-bw6-stage3r1.test.mjs'
      - '.github/workflows/walters-bw6-stage3r1.yml'

permissions:
  contents: read

concurrency:
  group: walters-bw6-stage3r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-without-retroactive-refit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout governed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate preserved BW6 evidence
        run: |
          node tools/validate-walters-bw6-stage1.mjs
          node tools/validate-walters-bw6-stage2.mjs
          node tools/validate-walters-bw6-stage3.mjs

      - name: Snapshot prior BW6 and protected artifacts
        run: |
          set -euo pipefail
          mapfile -t IMMUTABLE < <(node - <<'NODE'
          const fs = require('node:fs');
          const contract = JSON.parse(fs.readFileSync('data/walters/nfl/key-numbers/bw6-stage3r1-diagnosis-contract-v1.json', 'utf8'));
          const paths = new Set([
            ...contract.frozenInputs.map(item => item.path),
            ...contract.priorBw6Artifacts,
            ...contract.protectedArtifacts,
            'data/walters/nfl/key-numbers/bw6-stage3r1-diagnosis-contract-v1.json',
            'tools/build-walters-bw6-stage3r1.py',
          ]);
          for (const file of paths) console.log(file);
          NODE
          )
          sha256sum "${IMMUTABLE[@]}" > /tmp/bw6-stage3r1-before.sha256

      - name: Run deterministic helper tests
        run: python tools/build-walters-bw6-stage3r1.py --self-test

      - name: Rebuild the non-operational diagnosis
        run: python tools/build-walters-bw6-stage3r1.py

      - name: Validate diagnosis and blocked handoff
        run: |
          node --check tools/validate-walters-bw6-stage3r1.mjs
          node tools/validate-walters-bw6-stage3r1.mjs

      - name: Run BW6 Stage 3R1 guardrail tests
        run: node --test tests/walters-bw6-stage3r1.test.mjs

      - name: Verify deterministic diagnosis artifact
        run: git diff --exit-code -- data/walters/nfl/key-numbers/bw6-stage3r1-recalibration-diagnosis-v1.json

      - name: Verify runtime immutability
        run: |
          set -euo pipefail
          mapfile -t IMMUTABLE < <(node - <<'NODE'
          const fs = require('node:fs');
          const contract = JSON.parse(fs.readFileSync('data/walters/nfl/key-numbers/bw6-stage3r1-diagnosis-contract-v1.json', 'utf8'));
          const paths = new Set([
            ...contract.frozenInputs.map(item => item.path),
            ...contract.priorBw6Artifacts,
            ...contract.protectedArtifacts,
            'data/walters/nfl/key-numbers/bw6-stage3r1-diagnosis-contract-v1.json',
            'tools/build-walters-bw6-stage3r1.py',
          ]);
          for (const file of paths) console.log(file);
          NODE
          )
          sha256sum "${IMMUTABLE[@]}" > /tmp/bw6-stage3r1-after.sha256
          diff -u /tmp/bw6-stage3r1-before.sha256 /tmp/bw6-stage3r1-after.sha256
          echo "WALTERS BW6 STAGE 3R1 RUNTIME IMMUTABILITY: PASS"

      - name: Prevent remediation changes from carrying prior or production edits
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          COMPARE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$COMPARE_BASE" ] || [ "$COMPARE_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparison base is available; runtime hash guard remains authoritative."
            exit 0
          fi
          mapfile -t GUARDED < <(node - <<'NODE'
          const fs = require('node:fs');
          const contract = JSON.parse(fs.readFileSync('data/walters/nfl/key-numbers/bw6-stage3r1-diagnosis-contract-v1.json', 'utf8'));
          const paths = new Set([
            ...contract.frozenInputs.map(item => item.path),
            ...contract.priorBw6Artifacts,
            ...contract.protectedArtifacts,
          ]);
          for (const file of paths) console.log(file);
          NODE
          )
          git diff --exit-code "$COMPARE_BASE"...HEAD -- "${GUARDED[@]}"
          echo "WALTERS BW6 STAGE 3R1 CHANGE-SCOPE GUARD: PASS"
