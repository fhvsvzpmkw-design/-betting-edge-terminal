name: Finalize rebuilt 09:30 Hotlines
on:
  push:
    paths:
      - '.github/workflows/hotline-repair-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance Bill and Lou continuity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ts = '2026-08-26T09:42:46.426-07:00';
          const billPath = 'data/characters/bill-weston.json';
          const bill = JSON.parse(fs.readFileSync(billPath,'utf8'));
          bill.updatedAt = ts;
          bill.continuity.currentMood = 'The Aug. 26 09:30 private sheet has nine current files: 0 BET, 1 LEAN, 0 WAIT, 8 PASS and $0 new risk. Boston Red Sox moneyline improves from -141 at 08:00 to Bet365 -132, inside the published -145-or-better range, but DraftKings exact ML is unavailable and starting lineups remain unposted, so Bill keeps it LEAN / NO ORDER. Washington loses its prior cushion with Colorado starter uncertainty; all other files remain PASS. Nothing is sent downstairs.';
          bill.continuity.ongoingThreads = bill.continuity.ongoingThreads.filter(x => !String(x).startsWith('The current 09:30 sheet'));
          bill.continuity.ongoingThreads.push('The current Aug. 26 09:30 sheet has one LEAN — Boston Red Sox moneyline at Bet365 -132 — plus eight PASS files; exact DraftKings ML and lineups remain incomplete, so no order is sent downstairs and new risk remains zero.');
          bill.continuity.lastReportSeen = {slot:'final_morning',label:'09:30 FINAL MORNING',timestamp:ts};
          fs.writeFileSync(billPath, JSON.stringify(bill,null,2)+'\n');

          const louPath = 'data/characters/lou-vega.json';
          const lou = JSON.parse(fs.readFileSync(louPath,'utf8'));
          lou.updatedAt = ts;
          lou.continuity.currentMood = 'The Aug. 26 09:30 route has one live Pizza overlay: Boston Red Sox moneyline at Bet365 -132. Pizza Plays selects it as Lou’s one compelled card while VigScope remains LEAN because DraftKings exact ML is unavailable and starting lineups are unposted. The other eight Betting Edge files are PASS. Betting Edge remains 0 BET, 1 LEAN, 0 WAIT, 8 PASS with $0 new risk. The frozen Pizza performance-accounting unit remains $13.503 from the $450.10 source-report bankroll.';
          lou.continuity.ongoingThreads = lou.continuity.ongoingThreads.filter(x => !String(x).startsWith('The current 09:30 report'));
          lou.continuity.ongoingThreads.push('The current Aug. 26 09:30 report has Boston Red Sox moneyline at Bet365 -132 as the one Pizza Play overlay; source VigScope status remains LEAN, eight other files are PASS, and new Betting Edge risk remains zero.');
          lou.continuity.lastReportSeen = {slot:'final_morning',label:'09:30 FINAL MORNING',timestamp:ts};
          fs.writeFileSync(louPath, JSON.stringify(lou,null,2)+'\n');
          NODE
      - name: Verify and index immutable Hotline archives
        run: |
          node tools/archive-syndicate-hotline.mjs --character bill-weston --session 0930
          node tools/archive-syndicate-hotline.mjs --character lou-vega --session 0930
      - name: Add shell and Pizza archive metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const b='syndicates/downtown-booth/archive/index.json';
          const bi=JSON.parse(fs.readFileSync(b,'utf8'));
          const be=bi.issues.find(x=>x.id==='2026-08-26T0930|bill-weston');
          if(be){be.shellId='private-sheet';be.shellVersion=1;}
          fs.writeFileSync(b,JSON.stringify(bi,null,2)+'\n');
          const l='syndicates/generated/lou-vega/archive/index.json';
          const li=JSON.parse(fs.readFileSync(l,'utf8'));
          const le=li.issues.find(x=>x.id==='2026-08-26T0930|lou-vega');
          if(le){
            le.shellId='vegas-by-the-slice';le.shellVersion=3;
            le.pizzaPlay={archivePath:'data/history/pizza-plays/2026-08-26/final_morning-094246.json',selectionKey:'63301827|ml|away||',vigScopeStatus:'LEAN'};
          }
          fs.writeFileSync(l,JSON.stringify(li,null,2)+'\n');
          NODE
      - name: Remove one-time workflow and commit bookkeeping
        run: |
          rm .github/workflows/hotline-repair-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/characters/bill-weston.json data/characters/lou-vega.json syndicates/downtown-booth/archive/index.json syndicates/generated/lou-vega/archive/index.json .github/workflows/hotline-repair-finalize.yml
          git commit -m 'Finalize rebuilt Bill and Lou 09:30 Hotline state'
          git push
