name: Contract v1.0 staged-publication amendment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contract-v1-amendment-2026-08-30.yml

jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply amendment
        env:
          AMENDMENT_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('BETTING_EDGE_CONTRACT.md')
          text=p.read_text()
          marker='# 15. Operational amendment — 2026-08-30 — fail-closed staged publication ownership'
          if marker not in text:
              header='**Promotion acceptance:** `BETTING_EDGE_V1.0_ACCEPTANCE_2026-08-22.md`\n'
              if header not in text:
                  raise SystemExit('Contract header marker not found')
              text=text.replace(header, header+'**Operational amendment:** 2026-08-30 — fail-closed staged publication ownership  \n', 1)
              amendment=base64.b64decode(os.environ['AMENDMENT_B64']).decode()
              p.write_text(text.rstrip()+'\n\n'+amendment.rstrip()+'\n')
          PY
      - name: Verify amendment
        run: |
          grep -Fq '# 15. Operational amendment — 2026-08-30 — fail-closed staged publication ownership' BETTING_EDGE_CONTRACT.md
          grep -Fq 'PUBLICATION BLOCKED — CANDIDATE NOT STORED' BETTING_EDGE_CONTRACT.md
          grep -Fq 'PUBLICATION PENDING — CANDIDATE STAGED' BETTING_EDGE_CONTRACT.md
          grep -Fq '06:00 OPEN / OVERNIGHT' BETTING_EDGE_CONTRACT.md
          grep -Fq '08:00 MAIN' BETTING_EDGE_CONTRACT.md
          grep -Fq '09:30 FINAL MORNING' BETTING_EDGE_CONTRACT.md
          grep -Fq '15:15 EVENING' BETTING_EDGE_CONTRACT.md
          grep -Fq '18:15 LATE / WEST COAST' BETTING_EDGE_CONTRACT.md
      - name: Commit amendment
        run: |
          set -euo pipefail
          if git diff --quiet -- BETTING_EDGE_CONTRACT.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BETTING_EDGE_CONTRACT.md
          git commit -m 'contract: add fail-closed staged publication amendment'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
