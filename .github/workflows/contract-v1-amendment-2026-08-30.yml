name: Contract v1.0 staged-publication amendment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contract-v1-amendment-2026-08-30.yml

jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v1.0 operational amendment
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('BETTING_EDGE_CONTRACT.md')
          text = path.read_text()
          marker = '**Operational amendment:** 2026-08-30 — fail-closed staged publication ownership  '
          if marker in text:
              print('Amendment already present; no content change required.')
              raise SystemExit(0)

          acceptance = '**Promotion acceptance:** `BETTING_EDGE_V1.0_ACCEPTANCE_2026-08-22.md`\n'
          if acceptance not in text:
              raise SystemExit('Contract header marker not found')
          text = text.replace(acceptance, acceptance + marker + '\n', 1)

          def replace_section(start, end, replacement):
              nonlocal_text = None
              return

          start = text.index('## 8.4 History failure isolation\n')
          end = text.index('## 8.5 Odds history authority\n', start)
          section_84 = '''## 8.4 Candidate / issuance boundary and publication failure isolation

A scheduled ChatGPT lane is a **candidate producer**, not durable-history authority. Completing handicapping and payload construction does not by itself create an issued report.

Before durable issuance, the lane must freeze the complete report candidate and matching schema-3 sidecar, then stage that pair only through the repository-controlled staging path. The scheduled lane must not directly create, update, delete, repair or index:

- `data/history/runs/**`;
- `data/history/research-fit/**`;
- `run-history.json`.

The production publisher owns permanent History. Before writing durable History it must require clean existing durable history and validate the frozen candidate through the current production gates, including Core 1.4 controlled-value/recomputation validation, recommendation/sidecar consistency, same-day selection continuity, tracked non-spread availability, spread lineage and normal report-publication integrity.

A candidate that fails any required publication gate is **not an issued report** and must not be written into permanent History. Surface:

`PUBLICATION BLOCKED — CANDIDATE NOT STORED`

If the candidate has been staged but the owning publication workflow has not completed by the end of the scheduled task, surface:

`PUBLICATION PENDING — CANDIDATE STAGED`

Do not release a compact short link, claim durable storage, or describe the candidate as issued while publication is blocked or pending.

Publication failure must not trigger a fresh odds pull, a rerun of the handicap, a replacement recommendation set, or mutation of the frozen candidate merely to make a gate pass. A later scheduled lane remains independent and proceeds under its own current preflight and feed.

Only after the publisher atomically writes the exact report payload, matching schema-3 sidecar and updated `run-history.json`, then successfully re-reads and verifies the durable artifacts from `main`, does the candidate become durable issued History.

'''
          text = text[:start] + section_84 + text[end:]

          start = text.index('## 8.8 Long fallback before history dependency\n')
          end = text.index('## 8.9 Primary compact share link\n', start)
          section_88 = '''## 8.8 Pre-publication transport is not issuance authority

A self-contained serialized/long payload may be retained as a diagnostic or recovery transport for a frozen candidate, but possession of that payload does not make the candidate an issued Betting Edge report and does not bypass staged publication.

For normal scheduled production after the 2026-08-30 amendment, a failed or pending staged publication must not be presented to the user as a successful issued report through a long-link fallback. Durable issuance and the primary share link require successful publisher ownership and remote read-back under Section 8.4.

'''
          text = text[:start] + section_88 + text[end:]

          start = text.index('# 11. Production delivery sequence\n')
          end = text.index('\n---\n\n# 12. Activation tracks', start)
          section_11 = '''# 11. Production delivery sequence

For every valid scheduled report:

1. production contract / runner preflight;
2. live-feed freshness, exact identity and basic executable-price eligibility validation;
3. Stage 1 Material Information Scan over the eligible current slate under `BETTING_EDGE_PERSONNEL_SWEEP.md`;
4. provisional independent current handicap, fair-value construction and value screen using the Stage 1 information;
5. Stage 2 Deep Personnel Sweep for serious candidates, candidates created or materially strengthened by Stage 1, and candidates materially dependent on unresolved personnel assumptions; validate the exact wager dependency, apply the sport-wide 3-to-5-source fallback completion rule when official material information remains unresolved, and resolve/record source conflict and decision sensitivity;
6. apply material Stage 2 findings back into the current handicap; reassess fair value, uncertainty/model error and `playTo`, record the pre-/post-Stage-2 state and decision impact, then form the provisional current recommendation;
7. Research Fit read-only pass;
8. construct the complete report candidate and matching schema-3 sidecar, then validate and freeze both objects without mutating durable History;
9. stage only the frozen candidate pair through the repository-controlled staging path; the scheduled task must not directly write `data/history/runs/**`, `data/history/research-fit/**`, or `run-history.json`;
10. the production publisher verifies existing durable History, recomputes/validates Core 1.4 controlled metadata and Walters authority, checks report/sidecar consistency, selection continuity, tracked non-spread availability, spread lineage and publication integrity;
11. only after all gates pass, the publisher atomically stores the exact issued payload, matching production-provenance sidecar and complete updated `run-history.json` without overwriting prior issued evidence;
12. fetch authoritative `main` again and remotely read back/verify the exact report, sidecar and History index;
13. after successful read-back, treat the candidate as issued and deliver deterministic compact `r.html?id=` link as primary;
14. if the publisher rejects the candidate before durable storage, surface `PUBLICATION BLOCKED — CANDIDATE NOT STORED`, do not release a short link and do not mutate/rerun the frozen candidate merely to make the gate pass;
15. if staged publication is still incomplete at scheduled-task end, surface `PUBLICATION PENDING — CANDIDATE STAGED`, do not claim issuance/storage success and do not release a short link.

History/share work may not create, change or suppress a betting decision inside the frozen candidate. Publication validation may only accept the frozen candidate unchanged or reject it fail-closed before issuance.
'''
          text = text[:start] + section_11 + text[end:]

          change_marker = 'Git history is the authoritative rollback system. Existing issued reports and sidecars are append-only historical evidence.\n'
          if change_marker not in text:
              raise SystemExit('Change-control insertion marker not found')
          change_record = '''### Operational change record — 2026-08-30 — fail-closed staged publication ownership

**Issue:** Scheduled report tasks could write report payloads, schema-3 sidecars and `run-history.json` into permanent History before the exact production validator recomputed Core 1.4 controlled metadata. A newly written bundle could therefore become durable first and only then fail verification because of malformed or drifted sidecar metadata such as an unsupported controlled value, missing WAIT qualification, or a recorded model-error state inconsistent with framework recomputation.

**Decision:** Establish a hard candidate/issuance boundary. Scheduled ChatGPT report lanes are candidate producers only and may stage a frozen report + schema-3 sidecar pair; they may not mutate durable report History directly. The repository-controlled publication workflow owns pre-publication clean-history verification, Core 1.4 recomputation, recommendation/sidecar consistency, selection continuity, non-spread availability, spread lineage, atomic report/sidecar/index storage and remote read-back. A candidate that fails those gates is not issued and is reported as `PUBLICATION BLOCKED — CANDIDATE NOT STORED`; a still-running publication is `PUBLICATION PENDING — CANDIDATE STAGED`. Compact sharing is released only after successful durable read-back.

**Classification:** This is a publication-integrity and governance hardening amendment within Contract v1.0. It does not change the five standard report lanes, supported books, 75-minute feed freshness, 30-minute executable-quote freshness, handicap methodology, Core 1.4 version, Research Library authority, Walters authority model, staking/exposure methodology, risk tolerance, odds-refresh cadence or API request budget.

'''
          text = text.replace(change_marker, change_record + change_marker, 1)

          declaration = 'Durable issued-report history, source-backed same-day lineage, compact archive-backed sharing, exact player-prop identity, fair-value confidence labeling, spread-lineage reconciliation, PRICE WATCH, the repository-controlled report-card target and the operational two-stage personnel-information process—including sport-wide Stage 2 source depth, exact-wager dependency validation, source-conflict handling, decision sensitivity and explicit re-handicapping—remain governed behavior.'
          replacement = declaration + ' The 2026-08-30 v1.0 amendment additionally makes fail-closed staged publication and publisher-owned durable issuance governed behavior.'
          if declaration not in text:
              raise SystemExit('Production declaration marker not found')
          text = text.replace(declaration, replacement, 1)

          path.write_text(text)
          print('Contract v1.0 staged-publication amendment applied.')
          PY
      - name: Sanity-check amendment text
        run: |
          grep -Fq 'Operational amendment:** 2026-08-30 — fail-closed staged publication ownership' BETTING_EDGE_CONTRACT.md
          grep -Fq 'PUBLICATION BLOCKED — CANDIDATE NOT STORED' BETTING_EDGE_CONTRACT.md
          grep -Fq 'PUBLICATION PENDING — CANDIDATE STAGED' BETTING_EDGE_CONTRACT.md
          grep -Fq 'Scheduled ChatGPT report lanes are candidate producers only' BETTING_EDGE_CONTRACT.md
          grep -Fq '06:00 OPEN / OVERNIGHT' BETTING_EDGE_CONTRACT.md
          grep -Fq '18:15 LATE / WEST COAST' BETTING_EDGE_CONTRACT.md
      - name: Commit amendment
        run: |
          set -euo pipefail
          if git diff --quiet -- BETTING_EDGE_CONTRACT.md; then
            echo 'No contract change needed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add BETTING_EDGE_CONTRACT.md
          git commit -m 'contract: add fail-closed staged publication amendment'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
