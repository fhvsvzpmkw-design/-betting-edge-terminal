name: Trim special desk duplicate heads once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trim-special-desk-heads-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate page names and subtitles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Pizza Plays + Crypto Specials
          p = Path('assets/special-desks-ui.js')
          s = p.read_text()

          old = 'const head=`<div class="specialHead pizzaHead"><div><h2>PIZZA PLAYS</h2><p>LOU TWO SLICE // ONE COMPELLED VIGSCOPE PLAY // ORANGE BOARD</p></div><div class="specialBadge pizzaBadge">${badge}</div></div>`;'
          new = 'const head=`<div class="specialHead pizzaHead"><div class="specialBadge pizzaBadge">${badge}</div></div>`;'
          assert old in s, 'Pizza duplicate heading not found'
          s = s.replace(old, new, 1)

          old = 'return `<div class="specialHead cryptoHead"><div><h2>CRYPTO SPECIALS</h2><p>DAILY WEB INTELLIGENCE // LEVEL 3 ANALYSIS // PRICE-AWARE SPECIALS BOARD</p></div><div class="specialBadge cryptoBadge">${badge}</div></div>'
          new = 'return `<div class="specialHead cryptoHead"><div class="specialBadge cryptoBadge">${badge}</div></div>'
          assert old in s, 'Crypto board duplicate heading not found'
          s = s.replace(old, new, 1)

          old = 'return `<div class="specialHead cryptoHead"><div><h2>${title}</h2><p>${desc}</p></div><div class="specialBadge cryptoBadge">${badge}</div></div>${items.length?'
          new = 'return `<div class="specialHead cryptoHead"><div class="specialBadge cryptoBadge">${badge}</div></div>${items.length?'
          assert old in s, 'Crypto shelf duplicate heading not found'
          s = s.replace(old, new, 1)

          # Remove heading-only CSS that no longer has markup to style.
          s, n = re.subn(r'\.specialHead h2\{[^}]*\}\.pizzaHead h2\{[^}]*\}\.cryptoHead h2\{[^}]*\}\.specialHead p\{[^}]*\}\.pizzaHead p\{[^}]*\}\.cryptoHead p\{[^}]*\}', '', s, count=1)
          assert n == 1, 'Special desk heading CSS not found'
          p.write_text(s)

          # Meat Desk
          p = Path('assets/season-previews-ui.js')
          s = p.read_text()
          old = 'return`<div class="mdHead"><div><h2>🥩 MEAT DESK</h2><p>PRIVATE PRESEASON TOUT + RESEARCH LIBRARY // FOUR ACTIVE SOURCE SHELVES</p></div><div class="mdBadge">${a.length}/${MAX} SOURCES LOADED // ${an} ANALYZED<br>REVIEW MODE: ${e(mode())} // MANUAL ONLY</div></div>'
          new = 'return`<div class="mdHead"><div class="mdBadge">${a.length}/${MAX} SOURCES LOADED // ${an} ANALYZED<br>REVIEW MODE: ${e(mode())} // MANUAL ONLY</div></div>'
          assert old in s, 'Meat Desk duplicate heading not found'
          s = s.replace(old, new, 1)
          s, n = re.subn(r'\.mdHead h2\{[^}]*\}\.mdHead p\{[^}]*\}', '', s, count=1)
          assert n == 1, 'Meat Desk heading CSS not found'
          p.write_text(s)

          # Guard against accidentally touching the top function-key bars.
          assert '🧠' not in ''  # no-op sanity line for a visible script boundary
          assert '[F7]' in Path('assets/season-previews-ui.js').read_text()
          assert 'PIZZA PLAYS' in Path('assets/special-desks-ui.js').read_text()
          assert 'CRYPTO SPECIALS' in Path('assets/special-desks-ui.js').read_text()
          PY

      - name: Commit layout cleanup
        run: |
          git config user.name "fhvsvzpmkw-design"
          git config user.email "fhvsvzpmkw@privaterelay.appleid.com"
          git add assets/special-desks-ui.js assets/season-previews-ui.js
          git diff --cached --check
          git commit -m "Remove repeated special desk headings"
          git push
