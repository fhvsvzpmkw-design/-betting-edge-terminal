name: Patch runner session applicability once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-runner-session-applicability-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runner session applicability
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('runner.html')
          text = path.read_text()
          old = """function sessionRuns(run){
            const day=localDateKey(run?.ts),map=new Map();
            const embedded=Array.isArray(run?.prior_runs)?run.prior_runs:[];
            [run,...embedded,...safeHistory()].forEach(x=>{
              if(!x||x.__error||!sessionKey(x))return;
              if(day&&localDateKey(x.ts)!==day)return;
              map.set(runKey(x),normalizeRun(withoutComparison(x)))
            });
            return [...map.values()]
          }
          """
          new = """const SESSION_MINUTES={'06:00':360,'08:00':480,'09:30':570,'15:15':915,'18:15':1095};
          function vancouverSessionNow(now=new Date()){
            try{
              const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Vancouver',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now);
              const value=t=>parts.find(p=>p.type===t)?.value||'';
              return {day:`${value('year')}-${value('month')}-${value('day')}`,minutes:Number(value('hour'))*60+Number(value('minute'))}
            }catch(e){return {day:'',minutes:-1}}
          }
          function sessionWindowApplicable(key,day,now=new Date()){
            const current=vancouverSessionNow(now),minutes=SESSION_MINUTES[key];
            if(!day||!Number.isFinite(minutes)||!current.day)return false;
            if(day<current.day)return true;
            if(day>current.day)return false;
            return current.minutes>=minutes
          }
          function sessionRuns(run){
            const day=localDateKey(run?.ts),map=new Map();
            const embedded=Array.isArray(run?.prior_runs)?run.prior_runs:[];
            [run,...embedded,...safeHistory()].forEach(x=>{
              const key=sessionKey(x);
              if(!x||x.__error||!key)return;
              if(day&&localDateKey(x.ts)!==day)return;
              if(day&&!sessionWindowApplicable(key,day))return;
              map.set(runKey(x),normalizeRun(withoutComparison(x)))
            });
            return [...map.values()]
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one sessionRuns block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Syntax-check runner script
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('runner.html').read_text()
          match = re.search(r'<script>([\s\S]*)</script>', text)
          if not match:
              raise SystemExit('runner script block not found')
          Path('/tmp/runner.js').write_text(match.group(1))
          PY
          node --check /tmp/runner.js
      - name: Commit patch
        run: |
          if git diff --quiet -- runner.html; then
            echo "No runner change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.html
          git commit -m "Time-gate runner session buttons by Vancouver schedule"
          git push origin HEAD:main
