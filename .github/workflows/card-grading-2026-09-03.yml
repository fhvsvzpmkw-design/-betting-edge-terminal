name: Isolated Betting Edge card grading 2026-09-03

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/card-grading-2026-09-03.yml"

permissions:
  contents: write

concurrency:
  group: betting-edge-card-grading-2026-09-03
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Grade previous Vancouver day and retry older unresolved cards
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const TARGET_DATE='2026-09-02';
          const VERIFIED_AT=new Date().toISOString();
          const OBS_ROOT='data/history/observations';
          const RUN_ROOT='data/history/runs';
          const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const mkdir=p=>fs.mkdirSync(p,{recursive:true});
          const apiFor=d=>`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${d}&hydrate=linescore,team`;
          const sourceFor=d=>({name:`MLB official Stats API schedule — ${d}`,url:apiFor(d)});
          const resultMethod={
            lifecycle:'ISSUED -> UNRESOLVED -> VERIFIED -> COMPLETE',
            scoreMarkets:['ml','spread','totals'],
            grades:['WIN','LOSS','PUSH','VOID','HALF_WIN','HALF_LOSS'],
            spreadHdpSemantics:'raw hdp is the home-side handicap; away selected handicap is the opposite sign',
            unsupportedMarkets:'remain unresolved unless exact settlement support exists',
            officialOnlyWhenStatus:'BET',
            issuedReportMutable:false
          };

          function parseMatchup(meta){
            const m=String(meta||'').match(/^MLB\s*\|\s*(.+?)\s+at\s+(.+?)\s*\|/i);
            return m?{away:m[1].trim(),home:m[2].trim()}:null;
          }
          function sourceDateFromRun(p){
            const m=String(p||'').match(/data\/history\/runs\/(\d{4}-\d{2}-\d{2})\//);
            return m?m[1]:null;
          }
          async function schedule(date,cache){
            if(cache.has(date)) return cache.get(date);
            const u=apiFor(date);
            const r=await fetch(u,{headers:{'User-Agent':'Betting-Edge-Result-Grader/1.0'}});
            if(!r.ok) throw Error(`MLB official schedule fetch failed ${r.status} for ${date}`);
            const j=await r.json();
            const games=(j.dates||[]).flatMap(d=>d.games||[]);
            cache.set(date,games);
            return games;
          }
          function isFinal(g){return /final|game over|completed early/i.test(String(g.status?.detailedState||''));}
          function matchGame(rec,games){
            const m=parseMatchup(rec.meta); if(!m) return null;
            let c=games.filter(g=>norm(g.teams?.away?.team?.name)===norm(m.away)&&norm(g.teams?.home?.team?.name)===norm(m.home));
            if(!c.length) return null;
            const t=Date.parse(rec.feed?.eventDate||'');
            if(c.length>1&&Number.isFinite(t)) c.sort((a,b)=>Math.abs(Date.parse(a.gameDate)-t)-Math.abs(Date.parse(b.gameDate)-t));
            return c[0];
          }
          function gradeRec(rec,g){
            const feed=rec.feed||{}, key=String(feed.marketKey||feed.market||'').toLowerCase(), side=String(feed.side||'').toLowerCase();
            const detail=String(rec.coreAssessment?.context?.marketDetail||'').toLowerCase();
            const title=String(rec.title||'').toLowerCase();
            if(/first\s*5|first five|f5|team total|1st\s*5/.test(`${detail} ${title}`)) return null;
            const hs=Number(g.teams?.home?.score), as=Number(g.teams?.away?.score);
            if(!Number.isFinite(hs)||!Number.isFinite(as)) return null;
            if(key==='ml'){
              if(!['home','away'].includes(side)) return null;
              const s=side==='home'?hs:as,o=side==='home'?as:hs; return s>o?'WIN':s<o?'LOSS':'PUSH';
            }
            if(key==='spread'||key==='spreads'){
              const raw=Number(feed.hdp??feed.line); if(!Number.isFinite(raw)||!['home','away'].includes(side)) return null;
              const h=side==='home'?raw:-raw,s=side==='home'?hs:as,o=side==='home'?as:hs,v=s+h-o;
              return v>0?'WIN':v<0?'LOSS':'PUSH';
            }
            if(key==='totals'||key==='total'){
              const line=Number(feed.hdp??feed.line); if(!Number.isFinite(line)||!['over','under'].includes(side)) return null;
              const tot=hs+as; if(tot===line)return'PUSH'; return side==='over'?(tot>line?'WIN':'LOSS'):(tot<line?'WIN':'LOSS');
            }
            return null;
          }
          function unresolved(rec,reason,previous){
            const old=previous?.completion||{};
            return {title:rec.title,status:rec.status,selectionKey:rec.feed?.selectionKey||null,commenceTime:rec.feed?.eventDate||null,completion:{state:'unresolved',reason,firstUnresolvedAt:old.firstUnresolvedAt||VERIFIED_AT,lastVerificationAttemptAt:VERIFIED_AT,verificationAttempts:Number(old.verificationAttempts||0)+1,nextRetryTier:'next_backlog_pass'}};
          }
          function complete(rec,g,grade,date,previous){
            const old=previous?.completion||{};
            return {title:rec.title,status:rec.status,selectionKey:rec.feed?.selectionKey||null,commenceTime:rec.feed?.eventDate||null,completion:{state:'complete',verificationState:'verified',grade,official:rec.status==='BET',hypothetical:rec.status!=='BET',verifiedAt:VERIFIED_AT,eventId:rec.feed?.eventId||null,finalScore:{home:g.teams.home.team.name,away:g.teams.away.team.name,homeScore:Number(g.teams.home.score),awayScore:Number(g.teams.away.score)},settlementMethod:'final_score',line:rec.feed?.hdp??rec.feed?.line??null,basis:null,observedValue:null,settlementComponents:null,source:sourceFor(date),firstUnresolvedAt:old.firstUnresolvedAt||null,lastVerificationAttemptAt:VERIFIED_AT,verificationAttempts:Number(old.verificationAttempts||0)+1,nextRetryTier:null}};
          }
          function american(price){
            const s=String(price??'').trim(); let m=s.match(/^([+-]\d+)$/)||s.match(/\(([+-]\d+)\)\s*$/); return m?Number(m[1]):null;
          }
          function units(grade,price){
            const a=american(price); if(!Number.isFinite(a)) return null;
            if(grade==='PUSH'||grade==='VOID')return 0; if(grade==='LOSS')return-1;
            if(grade==='WIN')return a>0?a/100:100/Math.abs(a); return null;
          }

          (async()=>{
            const cache=new Map();
            const targetGames=await schedule(TARGET_DATE,cache);
            const targetFinals=targetGames.filter(isFinal);
            if(!targetFinals.length) throw Error(`No official MLB finals returned for ${TARGET_DATE}`);
            const runsDir=path.join(RUN_ROOT,TARGET_DATE), outDir=path.join(OBS_ROOT,TARGET_DATE); mkdir(outDir);
            const runFiles=fs.readdirSync(runsDir).filter(f=>f.endsWith('.json')).sort();
            if(!runFiles.length)throw Error(`No issued runs found for ${TARGET_DATE}`);
            const target=[];
            for(const f of runFiles){
              const rp=path.join(runsDir,f), op=path.join(outDir,f), run=JSON.parse(fs.readFileSync(rp,'utf8'));
              const prior=fs.existsSync(op)?JSON.parse(fs.readFileSync(op,'utf8')):null;
              const pm=new Map((prior?.recommendations||[]).map(x=>[x.selectionKey,x]));
              const recs=[];
              for(const rec of run.recs||[]){
                const old=pm.get(rec.feed?.selectionKey), matchup=parseMatchup(rec.meta);
                let item;
                if(!matchup) item=unresolved(rec,'unsupported_or_unmatched_market',old);
                else {
                  const g=matchGame(rec,targetGames);
                  if(!g) item=unresolved(rec,'official_game_not_matched',old);
                  else if(!isFinal(g)) item=unresolved(rec,`official_status_${String(g.status?.detailedState||'not_final').replace(/\s+/g,'_').toLowerCase()}`,old);
                  else {const gr=gradeRec(rec,g); item=gr?complete(rec,g,gr,TARGET_DATE,old):unresolved(rec,'unsupported_or_ambiguous_settlement',old);}
                }
                recs.push(item); target.push({rec,item});
              }
              fs.writeFileSync(op,JSON.stringify({schemaVersion:1,kind:'issued-card-observations',sourceRun:rp,runId:run.ts||null,slot:run.slot||path.basename(rp).split('-')[0],resultMethod,recommendations:recs},null,2)+'\n');
            }

            let olderStart=0,olderClosed=0,olderRemain=0;
            for(const d of fs.readdirSync(OBS_ROOT).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)&&x<TARGET_DATE).sort()){
              const dir=path.join(OBS_ROOT,d);
              for(const f of fs.readdirSync(dir).filter(x=>x.endsWith('.json'))){
                const op=path.join(dir,f), obs=JSON.parse(fs.readFileSync(op,'utf8'));
                const unresolvedItems=(obs.recommendations||[]).filter(x=>x.completion?.state==='unresolved');
                if(!unresolvedItems.length)continue;
                olderStart+=unresolvedItems.length;
                const rp=obs.sourceRun; if(!rp||!fs.existsSync(rp)){olderRemain+=unresolvedItems.length;continue;}
                const run=JSON.parse(fs.readFileSync(rp,'utf8')), rm=new Map((run.recs||[]).map(r=>[r.feed?.selectionKey,r]));
                const date=sourceDateFromRun(rp)||d;
                let games;
                try{games=await schedule(date,cache);}catch{olderRemain+=unresolvedItems.length;continue;}
                let changed=false;
                obs.recommendations=obs.recommendations.map(item=>{
                  if(item.completion?.state!=='unresolved')return item;
                  const rec=rm.get(item.selectionKey); if(!rec||!parseMatchup(rec.meta)){olderRemain++;return item;}
                  const g=matchGame(rec,games); if(!g||!isFinal(g)){olderRemain++;return item;}
                  const gr=gradeRec(rec,g); if(!gr){olderRemain++;return item;}
                  olderClosed++;changed=true;return complete(rec,g,gr,date,item);
                });
                if(changed)fs.writeFileSync(op,JSON.stringify(obs,null,2)+'\n');
              }
            }

            const completeT=target.filter(x=>x.item.completion.state==='complete'), unresolvedT=target.length-completeT.length;
            const grades={WIN:0,LOSS:0,PUSH:0,VOID:0,HALF_WIN:0,HALF_LOSS:0};
            let priced=0,net=0;
            for(const x of completeT){grades[x.item.completion.grade]=(grades[x.item.completion.grade]||0)+1;const u=units(x.item.completion.grade,x.rec.price);if(u!==null){priced++;net+=u;}}
            const roi=priced?net/priced*100:0;
            console.log(`TARGET SUMMARY: date=${TARGET_DATE} runs=${runFiles.length} cards=${target.length} complete=${completeT.length} unresolved=${unresolvedT} WIN=${grades.WIN} LOSS=${grades.LOSS} PUSH=${grades.PUSH} priced=${priced} netUnits=${net.toFixed(2)} roiPct=${roi.toFixed(1)}`);
            console.log(`OLDER BACKLOG: start=${olderStart} closed=${olderClosed} remaining=${olderRemain}`);
            console.log(`OFFICIAL SOURCE: ${apiFor(TARGET_DATE)}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Rebuild downstream results index
        run: |
          node tools/build-results-index.mjs
          node tools/add-results-player-value.mjs
          node tools/add-results-shadow-v2.mjs

      - name: Verify schema and strict isolation
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='data/history/observations/2026-09-02';
          const files=fs.readdirSync(root).filter(f=>f.endsWith('.json'));
          if(files.length!==5)throw Error(`expected 5 Sep 2 observation files, found ${files.length}`);
          for(const f of files){const j=JSON.parse(fs.readFileSync(path.join(root,f),'utf8'));if(j.schemaVersion!==1||j.kind!=='issued-card-observations'||!Array.isArray(j.recommendations))throw Error(`bad observation schema ${f}`);for(const r of j.recommendations){if(!['complete','unresolved'].includes(r.completion?.state))throw Error(`bad state ${f}`);}}
          const idx=JSON.parse(fs.readFileSync('data/history/results-index.json','utf8'));
          if(idx.coverage?.lastDate!=='2026-09-02')throw Error(`results index lastDate ${idx.coverage?.lastDate}`);
          console.log(`RESULTS INDEX: cards=${idx.coverage?.cards} complete=${idx.coverage?.completeCards} unresolved=${idx.coverage?.unresolvedCards} unresolvedSelections=${idx.coverage?.unresolvedSelections} unresolvedEvents=${idx.coverage?.unresolvedEvents} lastDate=${idx.coverage?.lastDate}`);
          console.log(`PRICE ANALYTICS: pricedCards=${idx.priceAnalytics?.pricedCards} netUnits=${idx.priceAnalytics?.netUnits} roiPct=${idx.priceAnalytics?.roiPct}`);
          NODE
          bad=$(git diff --name-only | grep -Ev '^(data/history/observations/|data/history/results-index\.json$)' || true)
          if [ -n "$bad" ]; then echo "Unexpected changes outside historical grading outputs:"; echo "$bad"; exit 1; fi
          if git diff --name-only | grep -q '^data/history/runs/'; then echo 'Issued run mutation forbidden'; exit 1; fi

      - name: Commit historical grading outputs only
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history/observations data/history/results-index.json
          if git diff --cached --quiet; then echo "No grading changes to publish."; exit 0; fi
          git commit -m "Grade Sep 2 Betting Edge cards and refresh results index"
          git pull --rebase origin main
          git push
