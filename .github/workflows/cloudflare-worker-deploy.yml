name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker/**
      - .github/workflows/cloudflare-worker-deploy.yml
  workflow_dispatch:

# Repository secrets configured; this workflow is the production deploy path.
concurrency:
  group: betting-edge-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy cloudflare-worker/src/index.js --name betting-edge-terminal --compatibility-date 2026-08-22
