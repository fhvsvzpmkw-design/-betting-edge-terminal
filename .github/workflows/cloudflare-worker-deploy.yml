name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker/**
      - .github/workflows/cloudflare-worker-deploy.yml
  workflow_dispatch:

# Repository secrets configured; this workflow is the production deploy path.
concurrency:
  group: betting-edge-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Worker syntax
        run: |
          node --check cloudflare-worker/src/index.js
          node --check cloudflare-worker/src/index-main-site.js
          node tests/main-schedule.test.mjs

      - name: Deploy Worker with retired odds timers removed
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config cloudflare-worker/wrangler.jsonc

      - name: Verify live report-owned odds configuration
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch(`https://vigwirelabs.com/health?verify=${process.env.GITHUB_SHA}`);
          assert.equal(response.ok,true,'live health request must succeed');
          const health=await response.json();
          assert.equal(health.scheduler.mode,'report-owned');
          assert.equal(health.scheduler.scheduledDispatchEnabled,false);
          console.log('LIVE ODDS CONFIGURATION: report tasks own collection; Cloudflare dispatch retired');
          NODE

      - name: Verify live mutable-file cache policy
        shell: bash
        run: |
          set -euo pipefail

          verify_url() {
            local url="$1"
            local label="$2"
            local headers=""

            for attempt in $(seq 1 12); do
              headers="$(curl --silent --show-error --fail --head \
                "${url}?verify=${GITHUB_SHA}-${attempt}" || true)"

              if printf '%s\n' "$headers" | grep -Eiq '^cache-control:.*no-store' \
                && printf '%s\n' "$headers" | grep -Eiq '^cloudflare-cdn-cache-control:[[:space:]]*no-store' \
                && printf '%s\n' "$headers" | grep -Eiq '^cdn-cache-control:[[:space:]]*no-store' \
                && printf '%s\n' "$headers" | grep -Eiq '^x-vigwire-origin:[[:space:]]*github-pages'; then
                echo "LIVE CACHE VERIFY PASS: ${label}"
                return 0
              fi

              echo "Live cache headers not ready for ${label} (attempt ${attempt}/12)."
              printf '%s\n' "$headers"
              sleep 5
            done

            echo "LIVE CACHE VERIFY FAILED: ${label}"
            printf '%s\n' "$headers"
            return 1
          }

          verify_url "https://vigwirelabs.com/data/pizza-plays.json" "Pizza Plays JSON"
          verify_url "https://vigwirelabs.com/runner.html" "runner.html"
          verify_url "https://vigwirelabs.com/assets/special-desks-ui.js" "special-desks-ui.js"
