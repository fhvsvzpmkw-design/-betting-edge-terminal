name: One-time Walters history-evidence audit

on:
  push:
    branches: [history-wait-repair-20260829]
    paths:
      - .github/workflows/history-walters-evidence-audit-once-20260829.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: history-wait-repair-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate all Walters evidence-state defects
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const CORE_V14_FROM=Date.parse('2026-08-25T17:20:00-07:00');
          const MODES=new Set(['OFF','ADVISORY','BET_AUTHORITY']);
          const AVAILABILITY=new Set(['AVAILABLE','PARTIAL','UNAVAILABLE','OFF','NOT_APPLICABLE']);
          const CONTRIBUTION=new Set(['NONE','ADVISORY_ONLY','CORE_FAIR_INPUT','BET_ORIGINATOR']);
          const COMPARISON=new Set(['ALIGNED','MIXED','CONFLICT','NOT_COMPARABLE','UNAVAILABLE','OFF']);
          const index=JSON.parse(fs.readFileSync('run-history.json','utf8'));
          const issues=[]; let bundles=0; let recommendations=0;
          function nonEmpty(v){return typeof v==='string'&&v.trim().length>0;}
          function issue(entry,item,msg){issues.push(`${entry.ts} | ${entry.researchFitPath} | #${item?.ordinal??'?'} ${item?.title||'UNKNOWN'} | ${msg} | evidence=${JSON.stringify(item?.waltersEvidence)}`);}
          for(const entry of index.runs||[]){
            if(Date.parse(entry.ts)<CORE_V14_FROM||!entry.researchFitPath) continue;
            bundles++;
            const sidecar=JSON.parse(fs.readFileSync(entry.researchFitPath,'utf8'));
            const mode=sidecar.provenance?.waltersMode;
            if(!MODES.has(mode)) issues.push(`${entry.ts} | ${entry.researchFitPath} | provenance invalid waltersMode=${mode}`);
            for(const item of sidecar.recommendations||[]){
              recommendations++;
              const e=item.waltersEvidence;
              const a=item.coreAssessment;
              if(!e||typeof e!=='object'||Array.isArray(e)){issue(entry,item,'missing/invalid waltersEvidence');continue;}
              if(typeof e.applicable!=='boolean') issue(entry,item,'applicable must be boolean');
              if(e.mode!==mode) issue(entry,item,`mode=${e.mode} does not match provenance ${mode}`);
              if(!AVAILABILITY.has(e.availability)) issue(entry,item,`invalid availability=${e.availability}`);
              if(typeof e.originatedCandidate!=='boolean') issue(entry,item,'originatedCandidate must be boolean');
              if(!CONTRIBUTION.has(e.contribution)) issue(entry,item,`invalid contribution=${e.contribution}`);
              if(!COMPARISON.has(e.comparisonState)) issue(entry,item,`invalid comparisonState=${e.comparisonState}`);
              if(!nonEmpty(e.reviewImpact)) issue(entry,item,'reviewImpact missing');
              const context=a?.context||{};
              const eligible=context.sport==='NFL'&&['spread','moneyline'].includes(context.marketClass);
              if(eligible){
                if(e.applicable!==true) issue(entry,item,'NFL spread/moneyline must be Walters-applicable');
                if(mode==='OFF'){
                  if(e.availability!=='OFF') issue(entry,item,'OFF mode requires availability OFF');
                  if(e.originatedCandidate!==false) issue(entry,item,'OFF mode cannot originate candidate');
                } else if(!['AVAILABLE','PARTIAL','UNAVAILABLE'].includes(e.availability)) issue(entry,item,`eligible Walters market has unsupported availability=${e.availability}`);
              } else {
                if(e.applicable!==false) issue(entry,item,'non-NFL spread/moneyline must be applicable=false');
                if(e.availability!=='NOT_APPLICABLE') issue(entry,item,`non-Walters market must be NOT_APPLICABLE, got ${e.availability}`);
                if(e.originatedCandidate!==false) issue(entry,item,'non-Walters market cannot be originatedCandidate');
                if(e.contribution!=='NONE') issue(entry,item,`non-Walters market contribution must be NONE, got ${e.contribution}`);
              }
              if(e.originatedCandidate){
                if(mode!=='BET_AUTHORITY') issue(entry,item,'originated candidate requires BET_AUTHORITY');
                if(!(eligible&&e.availability==='AVAILABLE')) issue(entry,item,'originated candidate requires eligible AVAILABLE analysis');
                if(e.contribution!=='BET_ORIGINATOR') issue(entry,item,'originated candidate requires BET_ORIGINATOR');
                if(e.waltersFair===null||e.waltersFair===undefined) issue(entry,item,'originated candidate missing waltersFair');
                if(!nonEmpty(e.proposedMarket)||!nonEmpty(e.proposedSelection)) issue(entry,item,'originated candidate missing proposedMarket/proposedSelection');
                if(!nonEmpty(e.betRationale)) issue(entry,item,'originated candidate missing betRationale');
                if(!nonEmpty(e.sourceAsOf)||!Number.isFinite(Date.parse(e.sourceAsOf))) issue(entry,item,'invalid sourceAsOf');
                else if(Date.parse(e.sourceAsOf)>Date.parse(entry.ts)) issue(entry,item,'sourceAsOf after report issuance');
                if(!nonEmpty(e.generatedAt)||!Number.isFinite(Date.parse(e.generatedAt))) issue(entry,item,'invalid generatedAt');
                else if(Date.parse(e.generatedAt)>Date.parse(entry.ts)) issue(entry,item,'generatedAt after report issuance');
                if(context.fairValueBasis!=='INDEPENDENT_MODEL') issue(entry,item,'originated candidate requires INDEPENDENT_MODEL fairValueBasis');
              } else if(!(e.betRationale===null||e.betRationale===undefined||nonEmpty(e.betRationale))) issue(entry,item,'betRationale invalid');
              if(e.contribution==='CORE_FAIR_INPUT'){
                if(!(mode==='BET_AUTHORITY'&&e.availability==='AVAILABLE')) issue(entry,item,'CORE_FAIR_INPUT requires AVAILABLE BET_AUTHORITY');
                if(e.waltersFair===null||e.waltersFair===undefined) issue(entry,item,'CORE_FAIR_INPUT missing waltersFair');
                if(e.coreFairBeforeWalters===null||e.coreFairBeforeWalters===undefined) issue(entry,item,'CORE_FAIR_INPUT missing coreFairBeforeWalters');
                if(e.coreFairAfterWalters===null||e.coreFairAfterWalters===undefined) issue(entry,item,'CORE_FAIR_INPUT missing coreFairAfterWalters');
              }
            }
          }
          console.log(`WALTERS AUDIT BUNDLES ${bundles}`);
          console.log(`WALTERS AUDIT RECOMMENDATIONS ${recommendations}`);
          console.log(`WALTERS AUDIT ISSUE COUNT ${issues.length}`);
          for(const x of issues) console.log(`ISSUE ${x}`);
          if(issues.length) throw new Error(`Walters evidence audit found ${issues.length} issue(s)`);
          NODE
