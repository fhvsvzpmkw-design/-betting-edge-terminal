name: F3 Engine decouple once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/f3-engine-decouple-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy Engine dependency from F3
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          s = index_path.read_text()

          # F8 Results owns the engine route now. Remove the retired Engine panel
          # rather than keeping F3 coupled to DOM nodes that Results replaces.
          engine_start = s.index('<section id="engine" class="view pad hidden">')
          engine_end = s.index('<div class="f3sourcebar">', engine_start)
          s = s[:engine_start] + '<section id="engine" class="view pad hidden"></section>\n' + s[engine_end:]

          # Remove CSS that existed only for the retired Engine health panel.
          css_start = s.find('<style>\n.healthgrid')
          if css_start != -1:
              css_end = s.index('</style>', css_start) + len('</style>')
              s = s[:css_start] + s[css_end:]

          # F3 owns its own public-ledger validation badge. It no longer writes
          # the retired Engine validation counters.
          old_validation = "  $('invRows').textContent=(ok?'PASS // ':'FAIL // ')+count.toLocaleString();$('invRows').className=ok?'g':'r';$('invPages').textContent=(ok?'PASS // ':'FAIL // ')+pages;$('invPages').className=ok?'g':'r';\n"
          assert old_validation in s, 'F3 Engine validation coupling not found'
          s = s.replace(old_validation, '', 1)

          # Remove the complete retired System Health implementation. Results is
          # the sole F8 implementation; F3 must not launch Engine-side async work.
          health_start = s.index('function healthSet(')
          health_end = s.index("$('prev').onclick", health_start)
          s = s[:health_start] + s[health_end:]

          old_load = "loadLedger().then(()=>{init();loadSystemHealth()}).catch(error=>{$('qaCount').textContent='LEDGER: LOAD FAILED';$('qaCount').className='tag r';$('ledgerStatus').textContent='LEDGER LOAD FAILED // '+error.message;console.error(error);loadSystemHealth()});"
          new_load = "loadLedger().then(()=>{init()}).catch(error=>{$('qaCount').textContent='LEDGER: LOAD FAILED';$('qaCount').className='tag r';$('ledgerStatus').textContent='LEDGER LOAD FAILED // '+error.message;console.error(error)});"
          assert old_load in s, 'F3 ledger completion hook not found'
          s = s.replace(old_load, new_load, 1)

          assert 'loadSystemHealth' not in s
          assert 'invRows' not in s
          assert 'invPages' not in s
          assert '<section id="engine" class="view pad hidden"></section>' in s
          index_path.write_text(s)

          wrapper_path = Path('assets/report-dashboard-vigscope.js')
          w = wrapper_path.read_text()
          compat_start = w.index('  // F3 finishes its public-ledger initialization asynchronously.')
          compat_end = w.index('  // F8 Results replaces', compat_start)
          w = w[:compat_start] + w[compat_end:]
          assert 'runnerLegacyHealthCompat' not in w
          assert 'preserveLegacyHealthCompat' not in w
          wrapper_path.write_text(w)
          PY

      - name: Commit source cleanup
        run: |
          git config user.name "fhvsvzpmkw-design"
          git config user.email "fhvsvzpmkw@privaterelay.appleid.com"
          git add index.html assets/report-dashboard-vigscope.js
          git diff --cached --check
          git commit -m "Remove legacy Engine dependency from F3"
          git push
