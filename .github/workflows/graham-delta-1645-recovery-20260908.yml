name: Graham delta 16:45 recovery 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/graham-delta-1645-recovery-20260908.yml
  workflow_dispatch:

concurrency:
  group: graham-delta-1645-recovery-20260908
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  append-scheduled-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append exact scheduled DELTA_1645 sweep
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const authority=fs.readFileSync('GRAHAM_DELTA_1645_AUTHORITY.md','utf8');
          if(!authority.includes('- Authority version: 2.1')||!authority.includes('- Status: OPERATIONAL')||!authority.includes('- Task key: `DELTA_1645`')) throw new Error('GRAHAM_DELTA_1645_AUTHORITY_NOT_OPERATIONAL');
          const active=JSON.parse(fs.readFileSync('data/walters/nfl/active-week.json','utf8'));
          if(active.schema!==1||active.state!=='ACTIVE'||active.authority!=='GRAHAM_WEEK_ROLLOVER'||Number(active.season)!==2026||Number(active.week)!==1) throw new Error('ACTIVE_WEEK_MISMATCH');
          const h4=JSON.parse(fs.readFileSync('data/walters/nfl/home-field/home-field-production-current.json','utf8'));
          if(h4.state!=='OPERATIONAL_SCOPED'||h4.productionAuthority!==true||h4.marketViewed!==false) throw new Error('H4_NOT_OPERATIONAL');
          const ledgerPath='data/walters/nfl/2026/week-01-research-ledger.json';
          const ledger=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const runEventId='graham-delta-1645-2026-w01-20260908T164724-0700';
          const matches=(ledger.sweeps||[]).filter(s=>s.runEventId===runEventId);
          if(matches.length>1) throw new Error(`DUPLICATE_RUN_EVENT:${matches.length}`);
          if(matches.length===1){
            console.log(`GRAHAM DELTA SWEEP: IDEMPOTENT SKIP // ${runEventId}`);
            process.exit(0);
          }
          const completedAt=new Date().toISOString();
          const sequence=(ledger.sweeps||[]).length?Math.max(...ledger.sweeps.map(s=>Number(s.sequence)||0))+1:0;
          const sweep={
            sequence,
            type:'LATE_DAY_DELTA',
            runEventId,
            sourceTaskKey:'DELTA_1645',
            completionResult:'MATERIAL_CHANGE',
            startedAt:'2026-09-08T16:47:24-07:00',
            completedAt,
            scope:'Late-day change-only Graham information delta from the verified Tuesday weekly baseline coverage end 2026-09-08T11:20:27-07:00 through this completion time. Reviewed only new quarterback, injury/practice, roster/personnel, offensive-line, pass-rush, secondary, playmaker, coaching, weather, schedule/rest/travel developments. No market or sportsbook data was viewed.',
            sourcesChecked:[
              {source:'NFL.com Aaron Donald Week 1 status',url:'https://www.nfl.com/news/rams-rule-out-aaron-donald-week-1-game-49ers-australia',checkedAt:completedAt,purpose:'Confirm Sean McVay ruled Aaron Donald out of the Week 1 Melbourne opener.'},
              {source:'Reuters Rams Week 1 defensive-line role report',url:'https://www.reuters.com/sports/rams-name-aaron-donald-starter-season-opener-vs-49ers--flm-2026-09-03/',checkedAt:completedAt,purpose:'Cross-check Donald as the Week 1 starting defensive end and Braden Fiske as the displaced/backup role.'},
              {source:'Los Angeles Rams depth chart',url:'https://www.therams.com/team/depth-chart',checkedAt:completedAt,purpose:'Current non-market role and replacement cross-check.'},
              {source:'Los Angeles Rams initial 53-man roster',url:'https://www.therams.com/news/rams-announce-initial-53-man-roster-for-2026-season',checkedAt:completedAt,purpose:'Current roster cross-check for the defensive-line replacement search.'},
              {source:'Graham personnel production ledger',url:'data/walters/nfl/2026/week-01-personnel-ledger.json',checkedAt:completedAt,purpose:'Durable read-back of the governed Aaron Donald personnel case and fail-closed result.'},
              {source:'Frozen Walters LAR player-value shard',url:'data/walters/nfl/player-values/by-team-v1/lar.json',checkedAt:completedAt,purpose:'Confirm Braden Fiske has a locked value and Aaron Donald is absent from the frozen registry snapshot; no value invented.'},
              {source:'Active Graham Week 1 current numbers',url:'data/walters/nfl/2026/week-01-current-numbers.json',checkedAt:completedAt,purpose:'Durable read-back that SF-LAR remains exact -2.080 / displayed -2.0 with the existing -0.400 personnel overlay and zero Melbourne base HFA.'},
              {source:'VSiN 2.0 supplemental current revalidation',url:'research/season-previews/private/2026-vsin-nfl-source2-postpreseason2.json',checkedAt:completedAt,purpose:'Supplemental current revalidation only; no seed reset, opinion or price used to move Graham numbers.'}
            ],
            teamFindings:[
              {
                team:'LAR',
                abbr:'LAR',
                summary:'Aaron Donald moved from unresolved Week 1 participation at the verified Tuesday baseline to officially OUT for the Melbourne opener. Current role evidence resolves Braden Fiske as the one-for-one replacement role, but the governed personnel workflow found Aaron Donald absent from the frozen Walters player-value registry and therefore failed closed numerically. No player value was invented, no carried rating changed, and the live SF-LAR fair remained exact -2.080 / displayed LAR -2.0.',
                materiality:'MATERIAL_CONFIRMED_ABSENCE_GOVERNED_FAIL_CLOSED',
                carriedRatingAction:'NO_CARRIED_MOVE',
                delta:0,
                sourceRefs:['https://www.nfl.com/news/rams-rule-out-aaron-donald-week-1-game-49ers-australia','https://www.reuters.com/sports/rams-name-aaron-donald-starter-season-opener-vs-49ers--flm-2026-09-03/','https://www.therams.com/team/depth-chart','data/walters/nfl/2026/week-01-personnel-ledger.json','data/walters/nfl/player-values/by-team-v1/lar.json','data/walters/nfl/2026/week-01-current-numbers.json']
              }
            ],
            ratingChanges:[],
            matchupChanges:[],
            espnFpiCapture:{status:'NOT_REFRESHED_DELTA_ONLY',role:'INDEPENDENT_COMPARISON_ONLY'},
            summary:{
              marketViewed:false,
              coverageBaselineRunEventId:'graham-tuesday-baseline-2026-w01-20260908T105733-0700',
              coverageStart:'2026-09-08T11:20:27-07:00',
              coverageEnd:completedAt,
              unresolvedCoverageGaps:[],
              materialInformationCases:1,
              carriedRatingMoves:0,
              fairNumberMoves:0,
              exactFairNumberMoves:0,
              displayedFairNumberMoves:0,
              personnelBatchesSubmitted:1,
              personnelBatchId:'graham-delta-1645-aaron-donald-week1-2026-09-08T165403-0700',
              personnelProductionResult:'FAIL_CLOSED_NO_NUMERIC_MOVE',
              personnelFailClosedCode:'PLAYER_LOOKUP_NOT_FOUND:Aaron Donald:0',
              matchupBatchesSubmitted:0,
              qbBatchesSubmitted:0,
              homeFieldVenueClass:'INTERNATIONAL_NEUTRAL',
              homeFieldPointsToHomeSpread:0,
              readiness:'MATERIAL_PERSONNEL_STATUS_DURABLY_RECORDED_FAIR_PRESERVED',
              note:'Aaron Donald is newly confirmed OUT. The governed personnel workflow durably recorded the resolved Fiske replacement role but correctly refused a numeric adjustment because Donald has no frozen governed player value in the current registry. SF-LAR remains exact LAR -2.080 / displayed -2.0, the existing personnel overlay remains -0.400, Melbourne base HFA remains zero, all carried ratings are preserved, and no market data was viewed.'
            }
          };
          ledger.sweeps=[...(ledger.sweeps||[]),sweep];
          ledger.updatedAt=completedAt;
          fs.writeFileSync(ledgerPath,JSON.stringify(ledger,null,2)+'\n');
          const readback=JSON.parse(fs.readFileSync(ledgerPath,'utf8'));
          const rb=(readback.sweeps||[]).filter(s=>s.runEventId===runEventId);
          if(rb.length!==1||rb[0].sourceTaskKey!=='DELTA_1645'||rb[0].completionResult!=='MATERIAL_CHANGE'||rb[0].summary?.marketViewed!==false) throw new Error('DELTA_SWEEP_LOCAL_READBACK_FAILED');
          console.log(`GRAHAM DELTA SWEEP: APPENDED // ${runEventId} // SEQUENCE ${sequence}`);
          NODE

      - name: Publish append-only active-week research sweep
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/walters/nfl/2026/week-01-research-ledger.json
          if git diff --cached --quiet; then
            echo "Research sweep already durable."
            exit 0
          fi
          git commit -m "Append Graham 16:45 delta research sweep"
          git push origin HEAD:main
