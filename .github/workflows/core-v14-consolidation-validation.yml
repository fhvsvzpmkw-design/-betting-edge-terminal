name: Core 1.4 production validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'core/CORE_V1_4_CONSOLIDATION_PLAN_2026-08-25.md'
      - 'core/core-v1.4-production.json'
      - 'core/core-handicap-framework-v1.4.json'
      - 'core/walters-intelligence-interface-v1.4.json'
      - 'core/walters-authority-v1.4.json'
      - 'core/tests/core-handicap-framework-v1.4-cases.json'
      - 'core/tests/walters-interface-v1.4.test.mjs'
      - 'research/research-library.json'
      - 'research/staging/BILLY_WALTERS_SPREAD_BOX_SPEC_2026-08-15.md'
      - 'tools/core-handicap-framework.mjs'
      - 'tools/core-v14-publication-gate.mjs'
      - '.github/workflows/core-v14-consolidation-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Core 1.4 production controls
        run: |
          node -e "for(const f of ['core/core-v1.4-production.json','core/core-handicap-framework-v1.4.json','core/walters-intelligence-interface-v1.4.json','core/walters-authority-v1.4.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Core 1.4 production JSON OK')"
      - name: Validate operational model-error framework
        run: node tools/core-handicap-framework.mjs self-test
      - name: Validate Walters interface and BET authority boundaries
        run: node core/tests/walters-interface-v1.4.test.mjs
      - name: Validate production publication gate
        run: node tools/core-v14-publication-gate.mjs self-test
      - name: Verify Core 1.4 scope freeze
        run: |
          grep -q 'Results / CLV feedback learning loop' core/CORE_V1_4_CONSOLIDATION_PLAN_2026-08-25.md
          grep -q 'Shadow History activation' core/CORE_V1_4_CONSOLIDATION_PLAN_2026-08-25.md
          grep -q 'Learned player/team associations and personal-ledger calibration' core/CORE_V1_4_CONSOLIDATION_PLAN_2026-08-25.md
          grep -q 'Walters Intelligence Engine — REQUIRED 1.4 CAPABILITY' core/CORE_V1_4_CONSOLIDATION_PLAN_2026-08-25.md
          test "$(node -p "require('./core/core-v1.4-production.json').state")" = "OPERATIONAL"
          test "$(node -p "require('./core/walters-authority-v1.4.json').mode")" = "BET_AUTHORITY"
          echo 'Core 1.4 production scope OK'
