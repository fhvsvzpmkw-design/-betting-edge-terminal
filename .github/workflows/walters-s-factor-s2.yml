name: Walters S Factor S2 Calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/walters/nfl/s-factors/s-factor-calibration-v1.json'
      - 'data/walters/nfl/s-factors/s2-model-lock-v1.json'
      - 'data/walters/nfl/s-factors/registries/team-geography-v1.json'
      - 'tools/run-walters-s-factor-s2.py'
      - 'tools/apply-walters-s-factor-s2-family-gates.py'
      - '.github/workflows/walters-s-factor-s2.yml'

permissions:
  contents: write

concurrency:
  group: walters-s-factor-s2
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify S1 and H4 authority
        run: |
          set -euo pipefail
          node tools/graham-active-week.mjs --json >/dev/null
          python - <<'PY'
          import json
          s1=json.load(open('data/walters/nfl/s-factors/s-factor-calibration-v1.json'))
          h4=json.load(open('data/walters/nfl/home-field/home-field-production-current.json'))
          lock=json.load(open('data/walters/nfl/s-factors/s2-model-lock-v1.json'))
          assert s1['stage']=='S1' and s1['state']=='CONTRACT_LOCKED_SHADOW_ONLY' and s1['marketViewed'] is False
          assert h4['state']=='OPERATIONAL_SCOPED' and h4['productionAuthority'] is True and h4['marketViewed'] is False
          assert abs(h4['productionScope']['domesticLeagueBaseline']['homeLocationAdvantagePoints']-2.082)<1e-12
          assert lock['state']=='MODEL_LOCKED_BEFORE_HOLDOUT' and lock['marketViewed'] is False
          print('WALTERS S2 PREFLIGHT: PASS // S1 LOCKED // H4 2.082 // MARKET ISOLATED')
          PY

      - name: Snapshot protected artifact hashes
        id: before
        run: |
          set -euo pipefail
          ACTIVE_NUMBERS="$(node tools/graham-active-week.mjs --path currentNumbers)"
          ACTIVE_PERSONNEL="$(node tools/graham-active-week.mjs --path personnelLedger)"
          echo "numbers=$ACTIVE_NUMBERS" >> "$GITHUB_OUTPUT"
          echo "personnel=$ACTIVE_PERSONNEL" >> "$GITHUB_OUTPUT"
          sha256sum "$ACTIVE_NUMBERS" data/walters/nfl-power-ratings-ledger.json > /tmp/s2-protected-before.sha
          if [ -f "$ACTIVE_PERSONNEL" ]; then sha256sum "$ACTIVE_PERSONNEL" >> /tmp/s2-protected-before.sha; fi
          if [ -f data/walters/nfl/player-values/player-values-2026-v1.json ]; then sha256sum data/walters/nfl/player-values/player-values-2026-v1.json >> /tmp/s2-protected-before.sha; fi
          cat /tmp/s2-protected-before.sha

      - name: Run S2 current calibration
        run: |
          set -euo pipefail
          python -m py_compile tools/run-walters-s-factor-s2.py tools/apply-walters-s-factor-s2-family-gates.py
          python tools/run-walters-s-factor-s2.py
          python tools/apply-walters-s-factor-s2-family-gates.py

      - name: Validate generated S2 release
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          current=json.load(open('data/walters/nfl/s-factors/s2-current.json'))
          release=json.load(open('data/walters/nfl/s-factors/s-factor-release-2026-v1.json'))
          audit=json.load(open('data/walters/nfl/s-factors/s2-validation-audit-v1.json'))
          assert current['stage']=='S2' and current['productionAuthority'] is False and current['liveBoardMutationAllowed'] is False and current['marketViewed'] is False
          assert release['stage']=='S2' and release['productionAuthority'] is False and release['marketViewed'] is False
          assert audit['state']=='PASS' and audit['marketViewed'] is False and audit['source']['forbiddenFieldsReadAsValues']==[]
          assert release['trainingSeasons']==[2021,2022,2023,2024] and release['validationSeasons']==[2025]
          assert release['h4Control']['homeAdvantagePoints']==2.082
          assert release['sampleCounts']['primaryTraining']>=900 and release['sampleCounts']['validation']>=240
          assert release['familyGateImplementationCorrection']['coefficientsRefit'] is False
          assert release['familyGateImplementationCorrection']['thresholdsChanged'] is False
          forbidden={'away_moneyline','home_moneyline','spread_line','away_spread_odds','home_spread_odds','total_line','under_odds','over_odds'}
          with open('data/walters/nfl/s-factors/source/nflverse-schedules-sfactor-snapshot-2026-09-01.csv',newline='') as f:
              fields=set(next(csv.reader(f)))
          assert not (fields & forbidden), fields & forbidden
          print('WALTERS S2 RELEASE VERIFY: PASS // HOLDOUT 2025 // PRELOCKED FAMILY GATES // NO MARKET FIELDS // NO LIVE AUTHORITY')
          PY

      - name: Verify governed production artifacts unchanged
        run: |
          set -euo pipefail
          sha256sum "${{ steps.before.outputs.numbers }}" data/walters/nfl-power-ratings-ledger.json > /tmp/s2-protected-after.sha
          if [ -f "${{ steps.before.outputs.personnel }}" ]; then sha256sum "${{ steps.before.outputs.personnel }}" >> /tmp/s2-protected-after.sha; fi
          if [ -f data/walters/nfl/player-values/player-values-2026-v1.json ]; then sha256sum data/walters/nfl/player-values/player-values-2026-v1.json >> /tmp/s2-protected-after.sha; fi
          diff -u /tmp/s2-protected-before.sha /tmp/s2-protected-after.sha
          git diff --exit-code -- "${{ steps.before.outputs.numbers }}" data/walters/nfl-power-ratings-ledger.json
          if [ -f "${{ steps.before.outputs.personnel }}" ]; then git diff --exit-code -- "${{ steps.before.outputs.personnel }}"; fi
          echo 'WALTERS S2 PROTECTED ARTIFACT GUARD: PASS'

      - name: Publish S2 calibration artifacts
        run: |
          set -euo pipefail
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            data/walters/nfl/s-factors/source/nflverse-schedules-sfactor-snapshot-2026-09-01.csv \
            data/walters/nfl/s-factors/registries/surface-registry-2021-2026-v1.json \
            data/walters/nfl/s-factors/s2-derived-features-2021-2025.csv \
            data/walters/nfl/s-factors/s-factor-release-2026-v1.json \
            data/walters/nfl/s-factors/s2-validation-audit-v1.json \
            data/walters/nfl/s-factors/s2-current.json
          if git diff --cached --quiet; then
            echo 'S2 artifacts already current.'
            exit 0
          fi
          git commit -m "Publish Walters S-factor S2 calibration"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "S2 published on attempt $attempt"
              exit 0
            fi
            echo "S2 publish collision on attempt $attempt; aborting rather than recomputing holdout on a different model lock." >&2
            git fetch origin main
            sleep 2
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f data/walters/nfl/s-factors/s2-current.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          x=json.load(open('data/walters/nfl/s-factors/s2-current.json'))
          print('## Walters S-factor S2')
          print()
          print(f"- State: {x['state']}")
          print(f"- Aggregate selected model: {x['selectedModel']}")
          print(f"- S3 scoped model: {x.get('s3ScopedModel','n/a')}")
          print(f"- Current scalar points/S: {x['currentScalarSpreadPointsPerSUnit']}")
          print(f"- S3 numeric families: {', '.join(x['s3NumericFamilies']) if x['s3NumericFamilies'] else 'none'}")
          print(f"- Held-out scoped metrics: {x['s3ScopedValidation']}")
          print('- Live Graham mutations: 0')
          print('- Market viewed: false')
          PY
          fi
