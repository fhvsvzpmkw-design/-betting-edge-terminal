name: One-time runner iPad portrait F5 fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/runner-ipad-portrait-f5-fix.yml

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove nested-frame scrollIntoView clipping trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('runner.html')
          text = path.read_text(encoding='utf-8')
          target = ";if(f5)f5.scrollIntoView({block:'start',inline:'nearest',behavior:'auto'})"

          count = text.count(target)
          if count != 1:
              raise SystemExit(f'Expected one F5 scrollIntoView target, found {count}')

          path.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY

      - name: Validate the focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('runner.html').read_text(encoding='utf-8')
          assert 'function pinSyndicateTop' in text
          assert "f5.scrollIntoView({block:'start',inline:'nearest',behavior:'auto'})" not in text
          assert "d.defaultView.scrollTo({top:0,left:0,behavior:'auto'})" in text
          PY

      - name: Commit runner fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner.html
          if git diff --cached --quiet; then
            echo "No runner change required"
            exit 0
          fi
          git commit -m "Fix iPad portrait F5 top clipping"
          git push
