name: Sync Meat Desk sources

on:
  push:
    branches: [main]
    paths:
      - 'research/season-previews/source-pdfs/**'
      - 'research/season-previews/private/*-manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meat-desk-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild active Meat Desk manifest
        run: python3 scripts/sync_meat_desk_sources.py

      - name: Commit manifest changes
        shell: bash
        run: |
          if git diff --quiet -- research/season-previews/manifest.json; then
            echo 'Meat Desk manifest already matches the PDF folder.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '418982+github-actions[bot]@users.noreply.github.com'
          git add -- research/season-previews/manifest.json
          git commit -m 'Auto-sync Meat Desk source manifest'
          git push origin HEAD:main
