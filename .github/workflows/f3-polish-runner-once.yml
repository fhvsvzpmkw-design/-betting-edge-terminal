name: F3 polish runner one-time

on:
  push:
    branches: [main]
    paths:
      - 'tools/f3-polish-once.mjs'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final F3 polish
        run: node tools/f3-polish-once.mjs
      - name: Commit F3 polish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Polish F3 ledger presentation'
          git push origin HEAD:main
