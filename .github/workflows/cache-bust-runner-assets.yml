name: Cache bust runner assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-runner-assets.yml'

permissions:
  contents: write

jobs:
  patch-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add explicit UI asset version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('runner.html')
          s = p.read_text()
          old = '<script src="./assets/report-dashboard-vigscope.js"></script>'
          new = '<script src="./assets/report-dashboard-vigscope.js?v=20260821-1621"></script>'
          if old in s:
              p.write_text(s.replace(old, new))
          elif 'report-dashboard-vigscope.js?v=20260821-1621' not in s:
              raise SystemExit('runner asset script tag not found')
          PY
      - name: Commit cache bust
        shell: bash
        run: |
          if git diff --quiet -- runner.html; then
            echo 'runner.html already cache-busted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runner.html
          git commit -m 'Cache bust Meat Desk runner assets'
          git push origin main
