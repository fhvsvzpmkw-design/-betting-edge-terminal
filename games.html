<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Game Intelligence · Betting Edge</title>
<style>body{margin:0;background:#05100b;color:#d9f5e8;font:14px/1.5 ui-monospace,monospace}main{max-width:1120px;margin:0 auto;padding:18px}a{color:#8ce9ba}nav{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:22px;margin-bottom:5px}#status{color:#a8c9b6}button{font:inherit;background:#173c28;color:#d9f5e8;border:1px solid #397451;border-radius:5px;padding:8px;cursor:pointer}</style></head>
<body><main><nav><a href="./index.html">← Betting Edge reports</a><button id="refresh" type="button">Refresh board</button></nav><h1>BETTING EDGE // GAME INTELLIGENCE</h1><p id="status" role="status">Loading the shared game board…</p><div id="board"></div></main>
<script src="./assets/game-intelligence.js?v=1"></script><script>
async function load(){const status=document.getElementById('status'),button=document.getElementById('refresh');button.disabled=true;try{const response=await fetch('./data/game-intelligence/board.json',{cache:'no-store'});if(!response.ok)throw Error('Board unavailable');const board=await response.json();const panel=BettingEdgeIntelligence.render(document,board);if(!panel)throw Error('Board unavailable');document.getElementById('board').replaceChildren(panel);status.textContent='A shared view of model forecasts, internal fair lines, prices and research. Open a game to compare the evidence.';}catch{status.textContent='The game board is unavailable. Issued reports remain available through the link above.';}finally{button.disabled=false;}}document.getElementById('refresh').onclick=load;load();
</script></body></html>
