name: Refresh Betting Edge odds

on:
  workflow_dispatch:
  schedule:
    # One odds refresh per report window. Manual workflow_dispatch remains
    # available as the fallback if GitHub delays or misses a scheduled event.
    # GitHub Actions cron is UTC. Vancouver is UTC-7 during the 2026 report
    # season, so these are the UTC equivalents of the five Pacific targets.
    - cron: '45 12 * * *' # 05:45 Vancouver
    - cron: '45 14 * * *' # 07:45 Vancouver
    - cron: '15 16 * * *' # 09:15 Vancouver
    - cron: '55 21 * * *' # 14:55 Vancouver
    - cron: '55 0 * * *'  # 17:55 Vancouver

concurrency:
  group: betting-edge-odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull separate quota-balanced Bet365 + DraftKings odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}

        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const API_BASE = 'https://api.odds-api.io/v3';
          const API_KEY = process.env.ODDS_API_KEY;
          const BOOKMAKERS = ['Bet365', 'DraftKings'];

          const TARGET_SPORTS = [
            'football',              // soccer
            'american-football',     // NFL / NCAA / CFL
            'basketball',
            'baseball',
            'ice-hockey',
            'tennis',
            'boxing',
            'mma'
          ];

          const SCHEDULE_SLOTS = {
            '45 12 * * *': { id: '05:45', targetMinutes: 5 * 60 + 45 },
            '45 14 * * *': { id: '07:45', targetMinutes: 7 * 60 + 45 },
            '15 16 * * *': { id: '09:15', targetMinutes: 9 * 60 + 15 },
            '55 21 * * *': { id: '14:55', targetMinutes: 14 * 60 + 55 },
            '55 0 * * *': { id: '17:55', targetMinutes: 17 * 60 + 55 }
          };

          // Reject zombie scheduled jobs before they spend any Odds-API quota.
          // Primary jobs can intentionally arrive up to 2 minutes before the slot;
          // scheduled jobs more than 25 minutes after the slot are no longer useful.
          const MAX_SCHEDULE_LATENESS_MINUTES = 25;

          // Hard run ceiling. This is a maximum, not a spending target.
          const REQUEST_BUDGET = 90;
          const SAFETY_RESERVE = 5;
          const OPTIONAL_STOP_AT = REQUEST_BUDGET - SAFETY_RESERVE;

          // Budget planning. Discovery is dynamic; core and deep stages stop
          // early when the board is smaller than these allowances.
          const CORE_REQUEST_TARGET = 34;
          const DEEP_REQUEST_TARGET = 6;

          const HORIZON_HOURS = 30;
          const PROP_HORIZON_HOURS = 8;
          const EVENTS_PAGE_SIZE = 200;
          const MAX_EVENT_PAGES = 4;
          const MAX_MARKET_AGE_MINUTES = 90;
          // Retention is historical context; executable coverage remains <=30m.
          // Age is the last successful observation, not the last price change.
          const CORE_QUOTE_MAX_AGE_MINUTES = 30;
          const CORE_RECOVERY_CATEGORIES = new Set(['MLB', 'NHL', 'NBA', 'WNBA', 'NFL', 'NCAAF', 'CFL']);

          // 10 events/request on /odds/multi.
          const MAX_CORE_EVENTS = CORE_REQUEST_TARGET * 10;

          // Deep calls are one event/request.
          const MAX_DEEP_EVENTS = DEEP_REQUEST_TARGET;

          const OUTFILE = path.join('data', 'live-odds.json');
          const TMPFILE = path.join('data', 'live-odds.next.json');

          if (!API_KEY) {
            console.error('Missing GitHub Actions secret ODDS_API_KEY.');
            process.exit(2);
          }

          let requestsUsed = 0;
          const requestLog = [];

          function vancouverClock(date = new Date()) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'America/Vancouver',
              hour12: false,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            }).formatToParts(date);

            const obj = Object.fromEntries(parts.map(p => [p.type, p.value]));
            const hour = Number(obj.hour === '24' ? '0' : obj.hour);

            return {
              date: `${obj.year}-${obj.month}-${obj.day}`,
              hour,
              minute: Number(obj.minute),
              second: Number(obj.second),
              label:
                `${obj.year}-${obj.month}-${obj.day} ` +
                `${String(hour).padStart(2, '0')}:${obj.minute}:${obj.second} ` +
                `America/Vancouver`
            };
          }

          function scheduledSlot() {
            if (process.env.EVENT_NAME === 'workflow_dispatch') {
              return { id: 'MANUAL', targetMinutes: null, manual: true };
            }

            const schedule = String(process.env.EVENT_SCHEDULE || '').trim();
            return SCHEDULE_SLOTS[schedule] || null;
          }

          function scheduledTriggerIsTooLate(slot, clock) {
            if (!slot || slot.manual || slot.targetMinutes == null) return false;

            const currentMinutes = clock.hour * 60 + clock.minute;
            let lateness = currentMinutes - slot.targetMinutes;

            // Normalize across midnight so an old prior-day cron cannot appear
            // as a large negative number and accidentally pass the guard.
            if (lateness < -720) lateness += 1440;

            return lateness > MAX_SCHEDULE_LATENESS_MINUTES;
          }

          function snapshotCompletedSlot(existing, slot, clock) {
            if (!existing?.generatedAt || !slot || slot.manual) return false;

            const generatedClock = vancouverClock(new Date(existing.generatedAt));
            if (generatedClock.date !== clock.date) return false;

            const generatedMinutes =
              generatedClock.hour * 60 + generatedClock.minute;

            // A successful snapshot belongs to this slot if it landed from
            // two minutes before through fifteen minutes after the nominal
            // refresh time.
            return (
              generatedMinutes >= slot.targetMinutes - 2 &&
              generatedMinutes <= slot.targetMinutes + 15
            );
          }

          function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
          }

          function remainingBudget() {
            return Math.max(0, REQUEST_BUDGET - requestsUsed);
          }

          async function fetchJson(url, options = {}) {
            const {
              attempts = 2,
              optional = false,
              stage = 'api',
              observation = false
            } = options;

            let lastError;

            for (let attempt = 0; attempt < attempts; attempt++) {
              const ceiling = optional ? OPTIONAL_STOP_AT : REQUEST_BUDGET;

              if (requestsUsed >= ceiling) {
                const error = new Error(
                  `LOCAL_BUDGET_STOP ${stage}: ${requestsUsed}/${REQUEST_BUDGET}`
                );
                error.code = 'LOCAL_BUDGET_STOP';
                throw error;
              }

              requestsUsed++;
              requestLog.push({
                n: requestsUsed,
                stage,
                optional,
                url: url.replace(API_KEY, 'REDACTED')
              });

              try {
                const response = await fetch(url, {
                  headers: {
                    accept: 'application/json',
                    'user-agent': 'betting-edge-terminal/1.4'
                  }
                });

                if (response.ok) {
                  const payload = await response.json();
                  // Receipt after the full body is parsed. Only exact returned
                  // markets are stamped later, after their identity is checked.
                  return observation
                    ? { payload, observedAt: new Date().toISOString() }
                    : payload;
                }

                const body = await response.text();
                const error = new Error(
                  `${response.status} ${response.statusText}: ${body.slice(0, 400)}`
                );

                if (response.status === 429) {
                  error.code = 'RATE_LIMIT';
                  throw error;
                }

                if (response.status < 500) throw error;
                lastError = error;
              } catch (error) {
                if (error?.code === 'RATE_LIMIT') throw error;
                lastError = error;
              }

              if (attempt < attempts - 1) {
                await sleep(800 * (attempt + 1));
              }
            }

            throw lastError;
          }

          function apiUrl(endpoint, params = {}, authenticated = true) {
            const url = new URL(API_BASE + endpoint);

            if (authenticated) {
              url.searchParams.set('apiKey', API_KEY);
            }

            for (const [key, value] of Object.entries(params)) {
              if (value !== undefined && value !== null && value !== '') {
                url.searchParams.set(key, String(value));
              }
            }

            return url.toString();
          }

          function chunks(array, size) {
            const output = [];
            for (let i = 0; i < array.length; i += size) {
              output.push(array.slice(i, i + size));
            }
            return output;
          }

          function normalized(value) {
            return String(value || '')
              .trim()
              .toLowerCase()
              .replace(/\s+/g, ' ');
          }

          function canonicalToken(value) {
            return normalized(value)
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/&/g, ' and ')
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');
          }

          function canonicalMarketKey(value) {
            return canonicalToken(
              normalized(value)
                .replace(/\bmoneyline\b/g, 'ml')
                .replace(/\bstrikeouts?\b/g, 'strikeout')
                .replace(/\bhome runs?\b/g, 'home run')
                .replace(/\brbis?\b/g, 'rbi')
                .replace(/\btotal bases?\b/g, 'total base')
                .replace(/\bhits?\b/g, 'hit')
                .replace(/\bpassing yards?\b/g, 'passing yard')
                .replace(/\breceiving yards?\b/g, 'receiving yard')
                .replace(/\brushing yards?\b/g, 'rushing yard')
                .replace(/\bgoals?\b/g, 'goal')
                .replace(/\bshots?\b/g, 'shot')
                .replace(/\bpoints?\b/g, 'point')
                .replace(/\brebounds?\b/g, 'rebound')
                .replace(/\bassists?\b/g, 'assist')
            );
          }

          function identityRowLine(row) {
            for (const key of ['hdp', 'line', 'total', 'points']) {
              const value = Number(row?.[key]);
              if (Number.isFinite(value)) return value;
            }
            return null;
          }

          function identityRowLabel(row) {
            return row?.label || row?.player || row?.participant ||
              row?.name || row?.selection || '';
          }

          function enrichIdentity(event) {
            if (!event || typeof event !== 'object') return event;

            const eventId = String(event.id || '');
            const eventKey = eventId ? `odds-api-io:${eventId}` : '';
            const copy = {
              ...event,
              eventId,
              eventKey,
              identity: {
                ...(event.identity || {}),
                eventId,
                eventKey,
                sportKey: canonicalToken(event?.sport?.slug || event?.sport?.name || ''),
                leagueKey: canonicalToken(event?.league?.slug || event?.league?.name || ''),
                homeKey: canonicalToken(event.home || ''),
                awayKey: canonicalToken(event.away || ''),
                startTime: event.date || null
              },
              bookmakers: {}
            };

            for (const [bookmaker, markets] of Object.entries(event.bookmakers || {})) {
              if (!Array.isArray(markets)) continue;

              copy.bookmakers[bookmaker] = markets.map(market => {
                const marketKey = canonicalMarketKey(market?.name || '');
                const odds = Array.isArray(market?.odds)
                  ? market.odds.map(row => {
                      const labelKey = canonicalToken(identityRowLabel(row));
                      const line = identityRowLine(row);
                      const lineKey = line == null ? '' : String(line);
                      const selectionKeys = {};

                      for (const side of ['home', 'away', 'draw', 'over', 'under']) {
                        if (row?.[side] === undefined || row?.[side] === null) continue;
                        selectionKeys[side] = [
                          eventId,
                          marketKey,
                          side,
                          labelKey,
                          lineKey
                        ].join('|');
                      }

                      return {
                        ...row,
                        selectionKeys,
                        identity: {
                          ...(row?.identity || {}),
                          selectionKeys
                        }
                      };
                    })
                  : market?.odds;

                return {
                  ...market,
                  marketKey,
                  identity: {
                    ...(market?.identity || {}),
                    marketKey
                  },
                  odds
                };
              });
            }

            return copy;
          }

          function leagueText(event) {
            return normalized([
              event?.league?.name,
              event?.league?.slug,
              event?.tournament?.name,
              event?.sport?.name,
              event?.sport?.slug
            ].filter(Boolean).join(' '));
          }

          function sportSlug(event) {
            return normalized(event?.sport?.slug);
          }

          function eventHoursAway(event, now) {
            const timestamp = Date.parse(event?.date);
            if (!Number.isFinite(timestamp)) return Infinity;
            return (timestamp - now.getTime()) / 3600000;
          }

          function marketAgeMinutes(market, now) {
            const timestamp = Date.parse(market?.observedAt);
            if (!Number.isFinite(timestamp) || timestamp > now.getTime()) return Infinity;
            return (now.getTime() - timestamp) / 60000;
          }

          function filterFreshMarketsFromEvent(event, now, diagnostics) {
            if (!event || typeof event !== 'object') return event;

            const copy = {
              ...event,
              bookmakers: {}
            };

            for (const [bookmaker, markets] of Object.entries(event.bookmakers || {})) {
              if (!Array.isArray(markets)) continue;

              const fresh = markets.filter(market => {
                const okay =
                  marketAgeMinutes(market, now) <= MAX_MARKET_AGE_MINUTES;

                if (!okay) {
                  diagnostics.staleMarketsRemoved++;
                  diagnostics.removedMarkets ||= [];
                  diagnostics.removedMarkets.push({
                    eventId: String(event.id || ''), bookmaker,
                    marketKey: canonicalMarketKey(market?.name || market?.marketKey || ''),
                    observedAt: market?.observedAt || null,
                    updatedAt: market?.updatedAt || null,
                    reason: Number.isFinite(marketAgeMinutes(market, now))
                      ? 'STALE_BEYOND_RETENTION' : 'INVALID_OBSERVATION_TIMESTAMP'
                  });
                }
                return okay;
              });

              if (fresh.length) {
                copy.bookmakers[bookmaker] = fresh;
              }
            }

            return copy;
          }

          function marketCount(event) {
            return Object.values(event?.bookmakers || {}).reduce(
              (total, markets) =>
                total + (Array.isArray(markets) ? markets.length : 0),
              0
            );
          }

          function sameEventIdentity(candidate, returned) {
            if (!candidate || !returned) return false;
            if (String(candidate.id) !== String(returned.id)) return false;

            const ch = normalized(candidate.home);
            const ca = normalized(candidate.away);
            const rh = normalized(returned.home);
            const ra = normalized(returned.away);

            if (ch && rh && ch !== rh) return false;
            if (ca && ra && ca !== ra) return false;

            return true;
          }

          function primaryMarketSuspended(market) {
            return market?.suspended === true || market?.isSuspended === true ||
              market?.active === false || market?.isActive === false ||
              /^(suspended|closed|settled|inactive|canceled|cancelled|unavailable|disabled)$/i
                .test(String(market?.status || market?.state || ''));
          }

          function completeOddsResponse(event) {
            return event?.complete !== false && event?.partial !== true &&
              event?.isPartial !== true && event?.truncated !== true;
          }

          function observeReturnedEvent(event, observedAt, requestedBooks) {
            const bookmakers = {};
            for (const book of requestedBooks) {
              const markets = event?.bookmakers?.[book];
              if (!Array.isArray(markets)) continue;
              bookmakers[book] = markets.filter(market => market && typeof market === 'object')
                .map(market => ({
                  ...market,
                  observedAt,
                  ...(primaryMarketSuspended(event) || primaryMarketSuspended(market)
                    ? { suspended: true, odds: [] } : {})
                }));
            }
            return {
              ...event,
              bookmakers,
              bookmakerObservedAt: completeOddsResponse(event)
                ? Object.fromEntries(requestedBooks.map(book => [book, observedAt])) : {}
            };
          }

          function mergeMarketSnapshots(current = [], incoming = []) {
            const primaryKeys = new Set(['ml', 'spread', 'totals']);
            const merged = new Map();
            for (const market of [...current, ...incoming]) {
              const key = canonicalMarketKey(market?.name || market?.marketKey || '');
              if (!primaryKeys.has(key)) continue;
              const previous = merged.get(key);
              const stamp = Date.parse(market?.observedAt);
              const previousStamp = Date.parse(previous?.observedAt);
              // Replace the whole primary snapshot, never union alternate lines
              // or resurrect an older priced side after a newer incomplete one.
              if (!previous || !Number.isFinite(stamp) ||
                  !Number.isFinite(previousStamp) || stamp >= previousStamp) {
                merged.set(key, primaryMarketSuspended(market) ? { ...market, odds: [] } : market);
              }
            }
            // Preserve every row/market in non-primary collections, including
            // duplicate-named player markets. Their consumer gates stay separate.
            const incomingOtherKeys = new Set(incoming.map(market =>
              canonicalMarketKey(market?.name || market?.marketKey || '')
            ).filter(key => !primaryKeys.has(key)));
            const other = current.filter(market => {
              const key = canonicalMarketKey(market?.name || market?.marketKey || '');
              return !primaryKeys.has(key) && !incomingOtherKeys.has(key);
            }).concat(incoming.filter(market =>
              !primaryKeys.has(canonicalMarketKey(market?.name || market?.marketKey || ''))
            ));
            return [...merged.values(), ...other];
          }

          function mergeCoreEvent(map, candidate, incoming, options = {}) {
            if (!incoming?.id || !sameEventIdentity(candidate, incoming)) return false;
            const key = String(incoming.id);
            const current = map.get(key) || {};
            const bookmakers = { ...(current.bookmakers || {}) };
            // A successful full response is authoritative for requested books.
            // Absent books/markets must not reappear from the earlier core pull.
            for (const book of options.replaceBooks || []) delete bookmakers[book];
            for (const [book, markets] of Object.entries(incoming.bookmakers || {})) {
              if (!Array.isArray(markets)) continue;
              bookmakers[book] = mergeMarketSnapshots(bookmakers[book] || [], markets);
            }
            map.set(key, {
              ...current,
              ...incoming,
              bookmakerObservedAt: {
                ...(current.bookmakerObservedAt || {}), ...(incoming.bookmakerObservedAt || {})
              },
              urls: { ...(current.urls || {}), ...(incoming.urls || {}) },
              bookmakerIds: { ...(current.bookmakerIds || {}), ...(incoming.bookmakerIds || {}) },
              bookmakers
            });
            return true;
          }

          function corePrimaryMarketState(market, key, sides) {
            const priced = (row, side) => Number(row?.[side]) > 1.001 && Number.isFinite(Number(row?.[side]));
            let rows = (Array.isArray(market.odds) ? market.odds : [])
              .filter(row => !primaryMarketSuspended(row));
            if (key !== 'ml') {
              rows = rows.filter(row => identityRowLine(row) !== null);
              const marked = rows.filter(row => ['primary', 'isPrimary', 'main', 'isMain', 'mainLine', 'isMainLine'].some(flag => row?.[flag] === true));
              let candidates = marked;
              if (!candidates.length) {
                const scores = rows.filter(row => sides.every(side => priced(row, side))).map(row => ({
                  row, balance: Math.abs(1 / Number(row[sides[0]]) - 1 / Number(row[sides[1]]))
                }));
                if (!scores.length) return 'INCOMPLETE';
                const minimum = Math.min(...scores.map(item => item.balance));
                candidates = scores.filter(item => Math.abs(item.balance - minimum) <= 1e-8).map(item => item.row);
              }
              const lines = [...new Set(candidates.map(identityRowLine))];
              if (lines.length !== 1) return 'PRIMARY_LINE_UNRESOLVED';
              rows = rows.filter(row => Math.abs(identityRowLine(row) - lines[0]) <= 0.001);
            }
            return sides.every(side => rows.some(row => priced(row, side))) ? 'AVAILABLE' : 'INCOMPLETE';
          }

          function coreMarketAvailability(event, now) {
            const output = {};
            for (const key of ['ml', 'spread', 'totals']) {
              const sides = key === 'totals' ? ['over', 'under'] : ['home', 'away'];
              const books = {};
              const updatedAtByBook = {};
              const observedAtByBook = {};
              for (const book of BOOKMAKERS) {
                const market = (event?.bookmakers?.[book] || [])
                  .filter(item => canonicalMarketKey(item?.name || item?.marketKey || '') === key)
                  .sort((a, b) => (Date.parse(b.observedAt) || 0) - (Date.parse(a.observedAt) || 0))[0];
                const age = marketAgeMinutes(market, now);
                updatedAtByBook[book] = market?.updatedAt || null;
                observedAtByBook[book] = market?.observedAt || null;
                if (!market) books[book] = 'NOT_RETURNED';
                else if (!Number.isFinite(age)) books[book] = 'INVALID_OBSERVATION_TIMESTAMP';
                else if (age > MAX_MARKET_AGE_MINUTES) books[book] = 'STALE_BEYOND_RETENTION';
                else if (age > CORE_QUOTE_MAX_AGE_MINUTES) books[book] = 'STALE_RETAINED';
                else if (primaryMarketSuspended(market)) books[book] = 'SUSPENDED';
                else books[book] = corePrimaryMarketState(market, key, sides);
              }
              output[key] = { available: Object.values(books).includes('AVAILABLE'), books, updatedAtByBook, observedAtByBook };
            }
            return output;
          }

          function coreGapCount(event, now) {
            return Object.values(coreMarketAvailability(event, now)).filter(item => !item.available).length;
          }

          function isMajorLeague(event) {
            const text = leagueText(event);
            const sport = sportSlug(event);

            if (sport === 'baseball') {
              return /\bmlb\b|major league baseball/.test(text);
            }

            if (sport === 'ice-hockey') {
              return /\bnhl\b|national hockey league/.test(text);
            }

            if (sport === 'basketball') {
              return /\bnba\b|\bwnba\b|\bncaa\b|college/.test(text);
            }

            if (sport === 'american-football') {
              return /\bnfl\b|\bncaa\b|\bncaaf\b|college|\bcfl\b|canadian football/.test(text);
            }

            if (
              sport === 'boxing' ||
              sport === 'mma' ||
              /boxing|mma|mixed-martial|ufc/.test(sport)
            ) {
              return true;
            }

            return false;
          }

          function eventPriorityScore(event, now) {
            const sport = sportSlug(event);
            const text = leagueText(event);
            const hours = eventHoursAway(event, now);

            let score = 0;

            // Start-time urgency.
            if (hours >= 0 && hours <= 2) score += 100;
            else if (hours <= 4) score += 80;
            else if (hours <= 6) score += 60;
            else if (hours <= 12) score += 40;
            else if (hours <= HORIZON_HOURS) score += 20;

            // Major leagues / high-value sport families.
            if (/\bnfl\b|\bncaaf\b|\bncaa football\b/.test(text)) score += 55;
            if (/\bnhl\b|\bnba\b|\bmlb\b|\bwnba\b/.test(text)) score += 50;
            if (/\bcfl\b|canadian football/.test(text)) score += 40;
            if (sport === 'boxing' || /boxing/.test(sport)) score += 45;
            if (sport === 'mma' || /mma|mixed-martial|ufc/.test(sport)) score += 45;

            // Keep soccer and tennis relevant without letting either dominate.
            if (sport === 'football') score += 20;
            if (sport === 'tennis') score += 18;

            // General basketball/baseball/hockey/football fallback.
            if (sport === 'basketball') score += 15;
            if (sport === 'baseball') score += 15;
            if (sport === 'ice-hockey') score += 15;
            if (sport === 'american-football') score += 15;

            return score;
          }

          function propEligible(event) {
            return isMajorLeague(event);
          }

          function deepPriorityScore(event, now) {
            let score = eventPriorityScore(event, now);
            const hours = eventHoursAway(event, now);

            if (hours >= 0 && hours <= 1.5) score += 70;
            else if (hours <= 3) score += 50;
            else if (hours <= 5) score += 30;

            return score;
          }

          function deepMarkets(event) {
            const output = {};

            for (const [bookmaker, markets] of Object.entries(event?.bookmakers || {})) {
              if (!Array.isArray(markets)) continue;

              const selected = markets.filter(market => {
                const name = normalized(market?.name);
                if (!name) return false;

                return (
                  name.includes('player') ||
                  name.includes('props') ||
                  name.includes('strikeout') ||
                  name.includes('home run') ||
                  name.includes('total bases') ||
                  name.includes('rbi') ||
                  name.includes('shots') ||
                  name.includes('saves') ||
                  name.includes('passing') ||
                  name.includes('receiving') ||
                  name.includes('rushing') ||
                  name.includes('touchdown') ||
                  name.includes('receptions') ||
                  name.includes('points') ||
                  name.includes('rebounds') ||
                  name.includes('assists') ||
                  name.includes('method') ||
                  name.includes('round') ||
                  name.includes('decision') ||
                  name.includes('knockout') ||
                  name.includes('submission')
                );
              });

              if (selected.length) {
                output[bookmaker] = selected;
              }
            }

            return output;
          }

          function fingerprint(markets) {
            const rows = [];

            for (const bookmaker of Object.keys(markets).sort()) {
              for (const market of markets[bookmaker] || []) {
                rows.push({
                  bookmaker,
                  name: String(market?.name || ''),
                  odds: Array.isArray(market?.odds) ? market.odds : []
                });
              }
            }

            if (!rows.length) return null;

            return crypto
              .createHash('sha256')
              .update(JSON.stringify(rows))
              .digest('hex');
          }

          function categoryKey(event) {
            const sport = sportSlug(event);
            const text = leagueText(event);

            if (/\bmlb\b|major league baseball/.test(text)) return 'MLB';
            if (/\bnhl\b|national hockey league/.test(text)) return 'NHL';
            if (/\bnba\b/.test(text)) return 'NBA';
            if (/\bwnba\b/.test(text)) return 'WNBA';
            if (/\bnfl\b/.test(text)) return 'NFL';
            if (sport === 'american-football' && /\bncaaf\b|\bncaa\b|college/.test(text)) return 'NCAAF';
            if (/\bncaa\b|college basketball/.test(text) && sport === 'basketball') return 'NCAAB';
            if (/\bcfl\b|canadian football/.test(text)) return 'CFL';
            if (sport === 'boxing' || /boxing/.test(sport)) return 'BOXING';
            if (sport === 'mma' || /mma|mixed-martial|ufc/.test(sport)) return 'MMA';
            if (sport === 'football') return 'SOCCER';
            if (sport === 'tennis') return 'TENNIS';
            if (sport === 'baseball') return 'BASEBALL_OTHER';
            if (sport === 'basketball') return 'BASKETBALL_OTHER';
            if (sport === 'ice-hockey') return 'HOCKEY_OTHER';
            if (sport === 'american-football') return 'FOOTBALL_OTHER';
            return sport || 'OTHER';
          }

          // Minimum representation in the priced core board when events exist.
          // The remainder is filled globally by score.
          const CORE_CATEGORY_MINIMUMS = {
            MLB: 20,
            NHL: 20,
            NBA: 20,
            WNBA: 12,
            NFL: 20,
            NCAAF: 30,
            NCAAB: 24,
            CFL: 10,
            BOXING: 12,
            MMA: 16,
            SOCCER: 40,
            TENNIS: 40
          };

          function selectBalancedCore(candidates, now) {
            const byCategory = new Map();

            for (const event of candidates) {
              const key = categoryKey(event);
              if (!byCategory.has(key)) byCategory.set(key, []);
              byCategory.get(key).push({
                event,
                score: eventPriorityScore(event, now)
              });
            }

            for (const items of byCategory.values()) {
              items.sort(
                (a, b) =>
                  b.score - a.score ||
                  String(a.event.date || '').localeCompare(String(b.event.date || ''))
              );
            }

            const selected = [];
            const selectedIds = new Set();

            function take(item) {
              const id = String(item.event.id);
              if (selectedIds.has(id)) return;
              if (selected.length >= MAX_CORE_EVENTS) return;

              selectedIds.add(id);
              selected.push(item.event);
            }

            // Guaranteed representation first.
            for (const [category, minimum] of Object.entries(CORE_CATEGORY_MINIMUMS)) {
              const items = byCategory.get(category) || [];
              for (const item of items.slice(0, minimum)) take(item);
            }

            // Then fill remaining capacity by global relevance.
            const remaining = [];

            for (const items of byCategory.values()) {
              for (const item of items) {
                if (!selectedIds.has(String(item.event.id))) remaining.push(item);
              }
            }

            remaining.sort(
              (a, b) =>
                b.score - a.score ||
                String(a.event.date || '').localeCompare(String(b.event.date || ''))
            );

            for (const item of remaining) {
              if (selected.length >= MAX_CORE_EVENTS) break;
              take(item);
            }

            return selected.sort(
              (a, b) => String(a.date || '').localeCompare(String(b.date || ''))
            );
          }

          async function discoverSport(sport, now, to, diagnostics) {
            const merged = new Map();

            for (let page = 1; page <= MAX_EVENT_PAGES; page++) {
              const rows = await fetchJson(
                apiUrl('/events', {
                  sport,
                  status: 'pending',
                  from: now.toISOString(),
                  to: to.toISOString(),
                  limit: EVENTS_PAGE_SIZE,
                  page
                }),
                {
                  stage: `events:${sport}:p${page}`
                }
              );

              const list = Array.isArray(rows) ? rows : [];
              let added = 0;

              for (const event of list) {
                if (!event?.id) continue;

                if (!merged.has(String(event.id))) {
                  merged.set(String(event.id), event);
                  added++;
                }
              }

              if (list.length < EVENTS_PAGE_SIZE || added === 0) break;
            }

            diagnostics.eventCandidatesBySport[sport] = merged.size;
            return [...merged.values()];
          }

          function readExistingSnapshot() {
            try {
              if (!fs.existsSync(OUTFILE)) return null;

              const parsed = JSON.parse(fs.readFileSync(OUTFILE, 'utf8'));
              return parsed && typeof parsed === 'object' ? parsed : null;
            } catch {
              return null;
            }
          }

          function logErrors(errors) {
            for (const error of errors.slice(0, 30)) {
              console.error(JSON.stringify(error));
            }
          }

          (async () => {
            const clock = vancouverClock();
            const slot = scheduledSlot();

            if (!slot) {
              console.log(
                `Skipping unknown scheduled trigger ` +
                `${process.env.EVENT_SCHEDULE || '(unknown)'}.`
              );
              return;
            }

            if (scheduledTriggerIsTooLate(slot, clock)) {
              const currentMinutes = clock.hour * 60 + clock.minute;
              let lateness = currentMinutes - slot.targetMinutes;
              if (lateness < -720) lateness += 1440;

              console.log(
                `STALE SCHEDULED TRIGGER: slot ${slot.id} arrived ` +
                `${lateness} minute(s) late at ${clock.label}; ` +
                `exiting with 0 API requests.`
              );
              return;
            }

            const existing = readExistingSnapshot();

            if (snapshotCompletedSlot(existing, slot, clock)) {
              console.log(
                `Slot ${slot.id} already published at ` +
                `${existing.generatedAtVancouver || existing.generatedAt}; ` +
                `scheduled duplicate exits without API requests.`
              );
              return;
            }

            console.log(
              `${slot.manual ? 'Manual refresh' : `Scheduled slot ${slot.id}`} ` +
              `accepted at ${clock.label}.`
            );
            const existingCount = Number(
              existing?.eventCount ||
              existing?.events?.length ||
              0
            );

            const now = new Date();
            const to = new Date(now.getTime() + HORIZON_HOURS * 3600000);

            let sports = [];

            try {
              sports = await fetchJson(
                apiUrl('/sports', {}, false),
                {
                  attempts: 1,
                  stage: 'sports-public'
                }
              );
            } catch {
              sports = await fetchJson(
                apiUrl('/sports', {}, true),
                {
                  attempts: 1,
                  stage: 'sports-auth'
                }
              );
            }

            const availableSlugs = new Set(
              (Array.isArray(sports) ? sports : [])
                .map(sport => String(sport?.slug || ''))
                .filter(Boolean)
            );

            const selectedSports = TARGET_SPORTS.filter(
              sport => availableSlugs.has(sport)
            );

            for (const sport of availableSlugs) {
              if (
                /mma|mixed-martial|ufc|boxing/.test(sport) &&
                !selectedSports.includes(sport)
              ) {
                selectedSports.push(sport);
              }
            }

            const snapshot = {
              schema: 5,
              identitySchema: 1,
              quoteObservationVersion: 1,
              collectionStartedAt: now.toISOString(),
              generatedAt: null,
              generatedAtVancouver: null,
              source: 'Odds-API.io v3',
              bookmakers: BOOKMAKERS,
              horizonHours: HORIZON_HOURS,
              maxMarketAgeMinutes: MAX_MARKET_AGE_MINUTES,

              requestBudget: REQUEST_BUDGET,
              requestsUsed: 0,
              requestsRemaining: REQUEST_BUDGET,

              selectedSports,

              events: [],
              deepMarkets: [],
              baseballProps: [],

              diagnostics: {
                eventCandidatesBySport: {},
                eventCandidatesTotal: 0,

                coreCandidatesSelected: 0,
                coreSelectedByCategory: {},
                coreRequestsUsed: 0,
                bet365CoreRequests: 0,
                draftKingsCoreRequests: 0,
                bet365Retries: 0,
                draftKingsRetries: 0,
                mainOddsEvents: 0,
                mainOddsMarkets: 0,
                bet365Events: 0,
                bet365Markets: 0,
                draftKingsEvents: 0,
                draftKingsMarkets: 0,
                twoBookEvents: 0,
                twoBookCoveragePct: 0,
                draftKingsStatus: 'NOT CHECKED',

                deepCandidates: 0,
                deepEventsChecked: 0,
                deepEventsWithMarkets: 0,
                deepMarketsPublished: 0,
                deepEventsSkippedBudget: 0,
                deepEventsSkippedHorizon: 0,

                staleMarketsRemoved: 0,
                removedMarkets: [],
                identityRejects: 0,
                duplicateDeepRejects: 0,
                previousGoodEventCount: existingCount,
                coreRecovery: {
                  quoteMaxAgeMinutes: CORE_QUOTE_MAX_AGE_MINUTES,
                  requestLimit: DEEP_REQUEST_TARGET,
                  eventsChecked: 0,
                  recoveredMarketPairs: 0,
                  results: []
                },
                coreMarketAvailability: []
              },

              errors: []
            };

            const candidateMap = new Map();

            // PASS 1: broad discovery. Keep the universe broad.
            for (const sport of selectedSports) {
              if (requestsUsed >= OPTIONAL_STOP_AT) break;

              try {
                const rows = await discoverSport(
                  sport,
                  now,
                  to,
                  snapshot.diagnostics
                );

                for (const event of rows) {
                  candidateMap.set(String(event.id), event);
                }
              } catch (error) {
                snapshot.errors.push({
                  stage: 'events',
                  sport,
                  message: String(error?.message || error)
                });

                if (error?.code === 'RATE_LIMIT') break;
              }
            }

            const candidates = [...candidateMap.values()]
              .filter(event => {
                const hours = eventHoursAway(event, now);
                return hours >= -0.25 && hours <= HORIZON_HOURS;
              })
              .sort(
                (a, b) =>
                  String(a.date || '').localeCompare(String(b.date || ''))
              );

            snapshot.diagnostics.eventCandidatesTotal = candidates.length;

            // PASS 2: rank and balance BEFORE spending live-odds requests.
            const coreSelected = selectBalancedCore(candidates, now);

            snapshot.diagnostics.coreCandidatesSelected = coreSelected.length;

            for (const event of coreSelected) {
              const key = categoryKey(event);
              snapshot.diagnostics.coreSelectedByCategory[key] =
                (snapshot.diagnostics.coreSelectedByCategory[key] || 0) + 1;
            }

            const coreRequestStart = requestsUsed;
            let coreBatchesUsed = 0;
            let coreStopReason = 'CORE_LIMIT';
            const coreEventMap = new Map();
            const coreAcquisition = new Map(coreSelected.map(event => [
              String(event.id), Object.fromEntries(BOOKMAKERS.map(book => [book, 'NOT_ATTEMPTED']))
            ]));

            core_pull:
            for (const batch of chunks(coreSelected, 10)) {
              if (coreBatchesUsed >= CORE_REQUEST_TARGET) break;

              // Deliberately pull Bet365 first, then DraftKings separately.
              // A successful sparse response is accepted; retries are failure-only.
              const remainingForDeep = Math.max(0, DEEP_REQUEST_TARGET);
              if (
                remainingBudget() <=
                SAFETY_RESERVE + remainingForDeep + BOOKMAKERS.length
              ) {
                coreStopReason = 'BUDGET';
                break;
              }

              const eventIds = batch.map(event => event.id).join(',');
              if (!eventIds) continue;
              const candidatesById = new Map(
                batch.map(event => [String(event.id), event])
              );

              for (const bookmaker of BOOKMAKERS) {
                for (const event of batch) coreAcquisition.get(String(event.id))[bookmaker] = 'REQUEST_FAILED';
                const requestStart = requestsUsed;
                try {
                  const { payload: odds, observedAt } = await fetchJson(
                    apiUrl('/odds/multi', { eventIds, bookmakers: bookmaker }),
                    { attempts: 3, stage: `odds-multi:${bookmaker}`, observation: true }
                  );

                  const callsUsed = requestsUsed - requestStart;
                  const retries = Math.max(0, callsUsed - 1);
                  if (bookmaker === 'Bet365') {
                    snapshot.diagnostics.bet365CoreRequests += callsUsed;
                    snapshot.diagnostics.bet365Retries += retries;
                  } else {
                    snapshot.diagnostics.draftKingsCoreRequests += callsUsed;
                    snapshot.diagnostics.draftKingsRetries += retries;
                  }

                  for (const event of batch) coreAcquisition.get(String(event.id))[bookmaker] = 'INVALID_RESPONSE';
                  if (Array.isArray(odds)) {
                    const returnedIds = new Set(odds.map(event => String(event?.id || '')));
                    for (const candidate of batch) {
                      coreAcquisition.get(String(candidate.id))[bookmaker] = 'EVENT_NOT_RETURNED';
                      if (!returnedIds.has(String(candidate.id))) {
                        // An exact requested event omitted from a valid full
                        // multi response closes only that requested book scope.
                        const absent = observeReturnedEvent({ ...candidate, bookmakers: {} }, observedAt, [bookmaker]);
                        mergeCoreEvent(coreEventMap, candidate, absent, { replaceBooks: [bookmaker] });
                      }
                    }
                    for (const event of odds) {
                      const candidate = candidatesById.get(String(event?.id || ''));
                      if (!candidate || !sameEventIdentity(candidate, event)) {
                        snapshot.diagnostics.identityRejects++;
                        if (candidate) coreAcquisition.get(String(candidate.id))[bookmaker] = 'IDENTITY_REJECTED';
                      } else {
                        const observed = observeReturnedEvent(event, observedAt, [bookmaker]);
                        mergeCoreEvent(coreEventMap, candidate, observed, {
                          replaceBooks: completeOddsResponse(event) ? [bookmaker] : []
                        });
                        coreAcquisition.get(String(candidate.id))[bookmaker] = 'EVENT_RETURNED';
                      }
                    }
                  }
                } catch (error) {
                  const callsUsed = requestsUsed - requestStart;
                  const retries = Math.max(0, callsUsed - 1);
                  if (bookmaker === 'Bet365') {
                    snapshot.diagnostics.bet365CoreRequests += callsUsed;
                    snapshot.diagnostics.bet365Retries += retries;
                  } else {
                    snapshot.diagnostics.draftKingsCoreRequests += callsUsed;
                    snapshot.diagnostics.draftKingsRetries += retries;
                  }

                  snapshot.errors.push({
                    stage: `odds-multi:${bookmaker}`,
                    bookmaker,
                    eventIds,
                    message: String(error?.message || error)
                  });
                  if (
                    error?.code === 'RATE_LIMIT' ||
                    error?.code === 'LOCAL_BUDGET_STOP'
                  ) {
                    coreStopReason = error?.code === 'RATE_LIMIT' ? 'RATE_LIMIT' : 'BUDGET';
                    break core_pull;
                  }
                }
              }
              coreBatchesUsed++;
            }

            snapshot.diagnostics.coreRequestsUsed = requestsUsed - coreRequestStart;
            for (const receipt of coreAcquisition.values()) {
              for (const book of BOOKMAKERS) {
                if (receipt[book] === 'NOT_ATTEMPTED') receipt[book] = `NOT_ATTEMPTED_${coreStopReason}`;
              }
            }

            // PASS 3: reuse the same six supplemental calls for urgent primary
            // gaps first. Crypto watch boosts remain dominant; returned props
            // remain available to other consumers of the shared feed.
            const deepQueue = candidates
              .filter(event => {
                const hours = eventHoursAway(event, now);

                if (hours < 0 || hours > PROP_HORIZON_HOURS) {
                  snapshot.diagnostics.deepEventsSkippedHorizon++;
                  return false;
                }

                return propEligible(event);
              })
              .map(event => ({
                event,
                score: deepPriorityScore(event, now) + (
                  CORE_RECOVERY_CATEGORIES.has(categoryKey(event)) &&
                  coreGapCount(coreEventMap.get(String(event.id)), new Date()) > 0 ? 500 : 0
                )
              }))
              .sort(
                (a, b) =>
                  b.score - a.score ||
                  String(a.event.date || '').localeCompare(
                    String(b.event.date || '')
                  )
              )
              .slice(0, MAX_DEEP_EVENTS);

            snapshot.diagnostics.deepCandidates = deepQueue.length;

            const deepCandidates = [];
            const deepStart = requestsUsed;

            for (let i = 0; i < deepQueue.length; i++) {
              const { event, score } = deepQueue[i];

              if (
                requestsUsed >= OPTIONAL_STOP_AT ||
                requestsUsed - deepStart >= DEEP_REQUEST_TARGET
              ) {
                snapshot.diagnostics.deepEventsSkippedBudget +=
                  deepQueue.length - i;
                break;
              }

              snapshot.diagnostics.deepEventsChecked++;
              const recoverCore = CORE_RECOVERY_CATEGORIES.has(categoryKey(event));
              const before = recoverCore
                ? coreMarketAvailability(coreEventMap.get(String(event.id)), new Date()) : null;
              const recoveryResult = recoverCore ? {
                eventId: String(event.id), outcome: 'REQUEST_FAILED', recovered: [], before
              } : null;
              if (recoverCore) {
                snapshot.diagnostics.coreRecovery.eventsChecked++;
                snapshot.diagnostics.coreRecovery.results.push(recoveryResult);
              }

              try {
                const { payload: responseEvent, observedAt } = await fetchJson(
                  apiUrl('/odds', {
                    eventId: event.id,
                    bookmakers: BOOKMAKERS.join(',')
                  }),
                  {
                    optional: true,
                    attempts: 1,
                    stage: `deep:${sportSlug(event) || 'sport'}`,
                    observation: true
                  }
                );

                if (!responseEvent || typeof responseEvent !== 'object' || Array.isArray(responseEvent)) {
                  if (recoveryResult) recoveryResult.outcome = 'EVENT_NOT_RETURNED';
                  continue;
                }

                if (!sameEventIdentity(event, responseEvent)) {
                  if (recoveryResult) recoveryResult.outcome = 'IDENTITY_REJECTED';
                  snapshot.diagnostics.identityRejects++;

                  snapshot.errors.push({
                    stage: 'deep-identity',
                    requestedEventId: event.id,
                    returnedEventId: responseEvent.id,
                    message:
                      'Rejected deep-market response because event identity did not match.'
                  });

                  continue;
                }

                const raw = observeReturnedEvent(responseEvent, observedAt, BOOKMAKERS);
                // Full requested-book responses replace prior primary scope,
                // including omitted markets. Supplemental props still pass the
                // fingerprint quarantine before any collection exposes them.
                const primaryOnly = { ...raw, bookmakers: {} };
                for (const [book, markets] of Object.entries(raw.bookmakers || {})) {
                  if (!Array.isArray(markets)) continue;
                  primaryOnly.bookmakers[book] = markets.filter(market =>
                    ['ml', 'spread', 'totals'].includes(canonicalMarketKey(market?.name || market?.marketKey || ''))
                  );
                }
                mergeCoreEvent(coreEventMap, event, primaryOnly, {
                  replaceBooks: completeOddsResponse(responseEvent) ? BOOKMAKERS : []
                });
                if (recoverCore) {
                  const after = coreMarketAvailability(coreEventMap.get(String(event.id)), new Date());
                  const recovered = Object.keys(after).filter(key => !before[key].available && after[key].available);
                  snapshot.diagnostics.coreRecovery.recoveredMarketPairs += recovered.length;
                  Object.assign(recoveryResult, { outcome: 'MERGED', recovered, after });
                }

                const fresh = filterFreshMarketsFromEvent(
                  raw,
                  new Date(),
                  snapshot.diagnostics
                );

                const markets = deepMarkets(fresh);

                const count = Object.values(markets).reduce(
                  (total, rows) => total + rows.length,
                  0
                );

                if (!count) continue;

                deepCandidates.push({
                  id: fresh.id,
                  home: fresh.home,
                  away: fresh.away,
                  date: fresh.date,
                  sport: fresh.sport,
                  league: fresh.league,
                  urls: fresh.urls || {},
                  bookmakerIds: fresh.bookmakerIds || {},
                  bookmakerObservedAt: fresh.bookmakerObservedAt || {},
                  bookmakers: markets,
                  priorityScore: score,
                  _fingerprint: fingerprint(markets),
                  _marketCount: count
                });
              } catch (error) {
                if (error?.code === 'LOCAL_BUDGET_STOP') {
                  snapshot.diagnostics.deepEventsSkippedBudget +=
                    deepQueue.length - i;
                  break;
                }

                snapshot.errors.push({
                  stage: 'deep-markets',
                  eventId: event.id,
                  message: String(error?.message || error)
                });

                if (error?.code === 'RATE_LIMIT') break;
              }
            }

            const fingerprintMap = new Map();

            for (const item of deepCandidates) {
              if (!item._fingerprint) continue;

              if (!fingerprintMap.has(item._fingerprint)) {
                fingerprintMap.set(item._fingerprint, []);
              }

              fingerprintMap.get(item._fingerprint).push(String(item.id));
            }

            const duplicates = new Set(
              [...fingerprintMap.entries()]
                .filter(([, ids]) => new Set(ids).size > 1)
                .map(([fingerprint]) => fingerprint)
            );

            for (const item of deepCandidates) {
              if (
                item._fingerprint &&
                duplicates.has(item._fingerprint)
              ) {
                snapshot.diagnostics.duplicateDeepRejects++;
                continue;
              }

              const {
                _fingerprint,
                _marketCount,
                ...published
              } = item;

              snapshot.deepMarkets.push(published);
              snapshot.diagnostics.deepEventsWithMarkets++;
              snapshot.diagnostics.deepMarketsPublished += _marketCount;

              if (sportSlug(item) === 'baseball') {
                snapshot.baseballProps.push(published);
              }
            }

            const completedAt = new Date();
            snapshot.generatedAt = completedAt.toISOString();
            snapshot.generatedAtVancouver = vancouverClock(completedAt).label;

            // Record why a primary quote is absent BEFORE the 90m retention
            // filter removes it. Missing upstream and removed-stale are distinct.
            snapshot.diagnostics.coreMarketAvailability = coreSelected
              .filter(event => CORE_RECOVERY_CATEGORIES.has(categoryKey(event)))
              .map(event => ({
                eventId: String(event.id),
                category: categoryKey(event),
                startTime: event.date,
                acquisition: coreAcquisition.get(String(event.id)),
                markets: coreMarketAvailability(coreEventMap.get(String(event.id)), completedAt)
              }));

            snapshot.events = [...coreEventMap.values()];
            snapshot.events = [
              ...new Map(
                snapshot.events
                  .filter(event => event?.id)
                  .map(event => [
                    String(event.id),
                    filterFreshMarketsFromEvent(
                      event,
                      completedAt,
                      snapshot.diagnostics
                    )
                  ])
              ).values()
            ]
              .filter(event => marketCount(event) > 0 || Object.keys(event.bookmakerObservedAt || {}).length > 0)
              .sort(
                (a, b) =>
                  String(a.date || '').localeCompare(String(b.date || ''))
              );

            snapshot.diagnostics.mainOddsEvents = snapshot.events.filter(event => marketCount(event) > 0).length;

            snapshot.diagnostics.mainOddsMarkets =
              snapshot.events.reduce(
                (total, event) => total + marketCount(event),
                0
              );

            snapshot.diagnostics.bet365Events =
              snapshot.events.filter(
                event =>
                  Array.isArray(event?.bookmakers?.Bet365) &&
                  event.bookmakers.Bet365.length
              ).length;

            snapshot.diagnostics.bet365Markets =
              snapshot.events.reduce(
                (total, event) =>
                  total + (
                    Array.isArray(event?.bookmakers?.Bet365)
                      ? event.bookmakers.Bet365.length
                      : 0
                  ),
                0
              );

            snapshot.diagnostics.draftKingsEvents =
              snapshot.events.filter(
                event =>
                  Array.isArray(event?.bookmakers?.DraftKings) &&
                  event.bookmakers.DraftKings.length
              ).length;

            snapshot.diagnostics.draftKingsMarkets =
              snapshot.events.reduce(
                (total, event) =>
                  total + (
                    Array.isArray(event?.bookmakers?.DraftKings)
                      ? event.bookmakers.DraftKings.length
                      : 0
                  ),
                0
              );

            snapshot.diagnostics.twoBookEvents =
              snapshot.events.filter(
                event =>
                  Array.isArray(event?.bookmakers?.Bet365) &&
                  event.bookmakers.Bet365.length &&
                  Array.isArray(event?.bookmakers?.DraftKings) &&
                  event.bookmakers.DraftKings.length
              ).length;

            snapshot.diagnostics.twoBookCoveragePct =
              snapshot.diagnostics.bet365Events > 0
                ? Math.round(
                    1000 * snapshot.diagnostics.twoBookEvents /
                    snapshot.diagnostics.bet365Events
                  ) / 10
                : 0;

            snapshot.diagnostics.draftKingsStatus =
              snapshot.diagnostics.draftKingsEvents > 0
                ? 'PRICES RETURNED'
                : 'REQUESTED — ZERO PRICES RETURNED';

            // Add canonical identity without changing the existing schema-5 shapes.
            // Older runners can ignore these fields; newer runners use them first.
            snapshot.events = snapshot.events.map(enrichIdentity);
            snapshot.deepMarkets = snapshot.deepMarkets.map(enrichIdentity);
            snapshot.baseballProps = snapshot.baseballProps.map(enrichIdentity);

            snapshot.eventCount = snapshot.events.length;
            snapshot.deepMarketEventCount = snapshot.deepMarkets.length;
            snapshot.baseballPropEventCount = snapshot.baseballProps.length;

            snapshot.requestsUsed = requestsUsed;
            snapshot.requestsRemaining = remainingBudget();

            snapshot.requestPolicy = {
              hardBudget: REQUEST_BUDGET,
              optionalStopAt: OPTIONAL_STOP_AT,
              safetyReserve: SAFETY_RESERVE,
              coreRequestTarget: CORE_REQUEST_TARGET,
              deepRequestTarget: DEEP_REQUEST_TARGET,
              maxCoreEvents: MAX_CORE_EVENTS,
              maxDeepEvents: MAX_DEEP_EVENTS,
              propHorizonHours: PROP_HORIZON_HOURS,
              coreQuoteMaxAgeMinutes: CORE_QUOTE_MAX_AGE_MINUTES,
              quoteAgeBasis: 'observedAt',
              providerChangeTimestamp: 'updatedAt',
              fullBookScopeTimestamp: 'bookmakerObservedAt',
              supplementalPriority: 'Crypto exact fight watch; major-sport missing/stale primary recovery; ordinary deep markets',
              supplementalPrimarySnapshotsMerged: true,
              strategy:
                'broad discovery; separate sequential Bet365/DraftKings core pulls; merged by exact event identity; deep markets by league/start-time priority'
            };

            snapshot.complete =
              snapshot.eventCount > 0 &&
              !snapshot.errors.some(error =>
                /RATE_LIMIT|429|identity/i.test(
                  String(error.message || '')
                )
              );

            console.log(
              `Requests ${requestsUsed}/${REQUEST_BUDGET}; ` +
              `discovered ${snapshot.diagnostics.eventCandidatesTotal}; ` +
              `core selected ${snapshot.diagnostics.coreCandidatesSelected}; ` +
              `core requests ${snapshot.diagnostics.coreRequestsUsed}; ` +
              `core events ${snapshot.eventCount}; ` +
              `core markets ${snapshot.diagnostics.mainOddsMarkets}; ` +
              `deep candidates ${snapshot.diagnostics.deepCandidates}; ` +
              `deep checked ${snapshot.diagnostics.deepEventsChecked}; ` +
              `deep events ${snapshot.deepMarketEventCount}; ` +
              `deep markets ${snapshot.diagnostics.deepMarketsPublished}; ` +
              `stale removed ${snapshot.diagnostics.staleMarketsRemoved}; ` +
              `errors ${snapshot.errors.length}.`
            );

            console.log(
              `Book coverage: Bet365 ${snapshot.diagnostics.bet365Events} events / ` +
              `${snapshot.diagnostics.bet365Markets} markets; DraftKings ` +
              `${snapshot.diagnostics.draftKingsEvents} events / ` +
              `${snapshot.diagnostics.draftKingsMarkets} markets; both books ` +
              `${snapshot.diagnostics.twoBookEvents} events ` +
              `(${snapshot.diagnostics.twoBookCoveragePct}% of Bet365 coverage).`
            );

            console.log(
              `Core requests: Bet365 ${snapshot.diagnostics.bet365CoreRequests} ` +
              `(retries ${snapshot.diagnostics.bet365Retries}); DraftKings ` +
              `${snapshot.diagnostics.draftKingsCoreRequests} ` +
              `(retries ${snapshot.diagnostics.draftKingsRetries}).`
            );

            if (snapshot.diagnostics.draftKingsEvents === 0) {
              console.warn(
                'DRAFTKINGS WARNING: DraftKings was explicitly requested but returned zero usable prices.'
              );
            }

            if (snapshot.eventCount === 0) {
              logErrors(snapshot.errors);

              console.error(
                `REFRESH REJECTED: 0 usable core events. ` +
                `Published feed unchanged; previous feed had ` +
                `${existingCount} event(s).`
              );

              process.exit(1);
            }

            fs.mkdirSync('data', { recursive: true });

            fs.writeFileSync(
              TMPFILE,
              JSON.stringify(snapshot, null, 2) + '\n',
              'utf8'
            );

            const verify = JSON.parse(
              fs.readFileSync(TMPFILE, 'utf8')
            );

            if (
              !Array.isArray(verify.events) ||
              Number(verify.eventCount) <= 0 ||
              !Array.isArray(verify.bookmakers) ||
              !verify.bookmakers.includes('DraftKings') ||
              typeof verify?.diagnostics?.draftKingsEvents !== 'number' ||
              Number(verify.identitySchema) !== 1 ||
              Number(verify.quoteObservationVersion) !== 1 ||
              !Number.isFinite(Date.parse(verify.collectionStartedAt)) ||
              Date.parse(verify.collectionStartedAt) > Date.parse(verify.generatedAt) ||
              ![...verify.events, ...verify.deepMarkets, ...verify.baseballProps].every(event =>
                Object.values(event.bookmakerObservedAt || {}).every(observedAt =>
                  Number.isFinite(Date.parse(observedAt)) &&
                  Date.parse(observedAt) >= Date.parse(verify.collectionStartedAt) &&
                  Date.parse(observedAt) <= Date.parse(verify.generatedAt)
                ) && Object.values(event.bookmakers || {}).every(markets =>
                  markets.every(market => Number.isFinite(Date.parse(market.observedAt)) &&
                    Date.parse(market.observedAt) >= Date.parse(verify.collectionStartedAt) &&
                    Date.parse(market.observedAt) <= Date.parse(verify.generatedAt))
                )
              ) ||
              !verify.events.every(event =>
                String(event?.eventId || '') === String(event?.id || '') &&
                typeof event?.identity?.eventKey === 'string'
              )
            ) {
              throw new Error(
                'Safety validation failed: generated snapshot is not usable.'
              );
            }

            fs.renameSync(TMPFILE, OUTFILE);

            console.log(
              `Published schema 5: ` +
              `${snapshot.eventCount} core events, ` +
              `${snapshot.deepMarketEventCount} deep-market events, ` +
              `${requestsUsed}/${REQUEST_BUDGET} requests used.`
            );

            if (snapshot.errors.length) {
              logErrors(snapshot.errors);
            }
          })().catch(error => {
            try {
              if (fs.existsSync(TMPFILE)) {
                fs.unlinkSync(TMPFILE);
              }
            } catch {}

            console.error(error);
            process.exit(1);
          });

          NODE

      - name: Publish snapshot
        run: |
          git config user.name "betting-edge-bot"
          git config user.email "actions@users.noreply.github.com"

          # Preserve the exact snapshot that already passed validation. A push
          # collision must never cause another Odds-API pull or silently lose it.
          candidate="$(mktemp)"
          cp data/live-odds.json "$candidate"

          candidate_epoch="$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const t=Date.parse(d.generatedAt||""); if(!Number.isFinite(t)) process.exit(2); process.stdout.write(String(t));' "$candidate")"

          for attempt in 1 2 3 4; do
            git fetch origin main

            remote_epoch="$(git show origin/main:data/live-odds.json 2>/dev/null | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{try{const j=JSON.parse(s); const t=Date.parse(j.generatedAt||""); process.stdout.write(Number.isFinite(t)?String(t):"0")}catch{process.stdout.write("0")}})')"

            # Never overwrite a snapshot that is already as new or newer.
            if [ "${remote_epoch:-0}" -ge "$candidate_epoch" ]; then
              echo "Remote live odds are already equal/newer; no publish needed."
              exit 0
            fi

            # Rebuild only the validated live-odds change on the newest main.
            # Other concurrent repository updates remain intact.
            git reset --hard origin/main
            cp "$candidate" data/live-odds.json
            git add data/live-odds.json

            if git diff --cached --quiet; then
              echo "No validated odds changes to publish."
              exit 0
            fi

            git commit -m "Refresh Betting Edge live odds"

            if git push origin HEAD:main; then
              echo "Validated odds snapshot published on attempt $attempt."
              exit 0
            fi

            echo "Publish collision on attempt $attempt; syncing main and retrying the same validated snapshot."
          done

          echo "Validated odds snapshot could not be published after 4 attempts."
          exit 1
