<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VigScope Terminal UI v1.3 Runner</title>
<style>
:root{--bg:#01040a;--fade-ms:320ms}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#core{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;transition:opacity var(--fade-ms) ease}
#core.ready{opacity:1}
#splash2{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:#01040a;opacity:1;transition:opacity var(--fade-ms) ease;overflow:hidden}
#splash2.fade{opacity:0;pointer-events:none}
#splash2 img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#01040a}
#splash2:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 4px)}
@media(prefers-reduced-motion:reduce){#core,#splash2{transition:none}}
</style>
</head>
<body>
<iframe id="core" title="VigScope Terminal UI v1.3"></iframe>
<div id="splash2" aria-label="VigWire Labs boot screen">
  <img src="./assets/splash-02-vigwire-labs-v2.webp" alt="VigWire Labs Market Intelligence terminal boot screen with syndicate loading messages, vinegar bottle, terminal, and pickle illustration">
</div>
<script>
// BOOT SCREEN 2 — locked VigWire Labs V2 splash.
// Screen 1 remains owned by r.html; this wrapper only inserts Screen 2 before the preserved runner core.
const SCREEN2_MIN_MS=2200;
const FADE_MS=320;
const core=document.getElementById('core');
const splash2=document.getElementById('splash2');
let coreLoaded=false;
let screen2Elapsed=false;
let screen2Started=false;

function maybeRevealCore(){
  if(!coreLoaded||!screen2Elapsed)return;
  core.classList.add('ready');
  splash2.classList.add('fade');
  setTimeout(()=>splash2.remove(),FADE_MS+80);
}
function startScreen2Clock(){
  if(screen2Started)return;
  screen2Started=true;
  setTimeout(()=>{screen2Elapsed=true;maybeRevealCore()},SCREEN2_MIN_MS);
}
function waitUntilActuallyVisible(){
  try{
    const host=window.frameElement;
    if(!host){startScreen2Clock();return}
    const opacity=Number.parseFloat(getComputedStyle(host).opacity||'1');
    if(opacity>.01){startScreen2Clock();return}
  }catch(e){startScreen2Clock();return}
  requestAnimationFrame(waitUntilActuallyVisible);
}
core.addEventListener('load',()=>{coreLoaded=true;maybeRevealCore()},{once:true});
core.src='./runner-core.html'+location.search+location.hash;
if(document.readyState==='complete')waitUntilActuallyVisible();
else window.addEventListener('load',waitUntilActuallyVisible,{once:true});
</script>
</body>
</html>
