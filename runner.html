<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="vigscope-ui-version" content="1.3.1">
<title>VigScope Terminal UI v1.3.1 Runner</title>
<style>
:root{--bg:#01040a;--fade-ms:320ms;--green:#58ff88}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#core{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:0;transition:opacity var(--fade-ms) ease}
#core.ready{opacity:1}
#splash2{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:var(--bg);opacity:1;transition:opacity var(--fade-ms) ease;overflow:hidden}
#splash2.fade{opacity:0;pointer-events:none}
#splash2art{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:var(--bg)}
#fallback{display:none;color:var(--green);font:700 clamp(14px,2.2vw,24px) ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.08em;text-align:center}
#splash2.asset-error #splash2art{display:none}
#splash2.asset-error #fallback{display:block}
@media(prefers-reduced-motion:reduce){#core,#splash2{transition:none}}
</style>
</head>
<body>
<iframe id="core" title="VigScope Terminal UI v1.3.1"></iframe>
<div id="splash2" aria-label="VigWire Labs boot screen">
  <img id="splash2art" src="./assets/splash-02-vigwire-labs-v2v2.png" alt="VigWire Labs Market Intelligence boot screen">
  <div id="fallback">VIGWIRE LABS // LOADING VIGSCOPE</div>
</div>
<script>
const UI_VERSION='1.3.1';
const UI_TITLE=`VIGSCOPE TERMINAL UI v${UI_VERSION}`;
const UI_BUILD=`CHATGPT LIVE-RUNNER // v${UI_VERSION} UI`;
const SCREEN2_MS=3000,FADE_MS=320;
const core=document.getElementById('core'),splash=document.getElementById('splash2'),art=document.getElementById('splash2art');
let coreLoaded=false,timerDone=false,started=false,hierarchyObserver=null,hierarchyFrame=null;
function reveal(){if(!coreLoaded||!timerDone)return;core.classList.add('ready');splash.classList.add('fade');setTimeout(()=>splash.remove(),FADE_MS+80)}
function startWhenVisible(){if(started)return;try{const host=window.frameElement;if(host){const style=getComputedStyle(host);if(Number.parseFloat(style.opacity||'1')<=.01||style.visibility==='hidden'){requestAnimationFrame(startWhenVisible);return}}}catch(e){}started=true;setTimeout(()=>{timerDone=true;reveal()},SCREEN2_MS)}
function innerAppFrame(){try{return core.contentDocument&&core.contentDocument.getElementById('app')}catch(e){return null}}
function scheduleHierarchyPatch(){if(hierarchyFrame)return;hierarchyFrame=requestAnimationFrame(()=>{hierarchyFrame=null;applyHierarchyPatch()})}
function meterRow(d,label,value,note){const row=d.createElement('div');row.className='waltersMeterRow';const head=d.createElement('div');head.className='waltersMeterHead';const left=d.createElement('span');left.textContent=label;const right=d.createElement('b');right.textContent=value;head.append(left,right);const track=d.createElement('div');track.className='waltersMeterTrack';const fill=d.createElement('i');const n=Math.max(0,Math.min(100,Number.parseFloat(value)||0));fill.style.width=n+'%';track.appendChild(fill);const small=d.createElement('div');small.className='waltersMeterNote';small.textContent=note;row.append(head,track,small);return row}
function buildSyndicateWorkspace(d,navPad){
  let box=d.getElementById('runnerSyndicateWorkspace');if(box)return box;
  box=d.createElement('section');box.id='runnerSyndicateWorkspace';box.setAttribute('aria-label','Loaded syndicate workspace');
  const tabs=d.createElement('div');tabs.className='syndicateTabs';
  ['WALTERS','EMPTY 2','EMPTY 3','EMPTY 4','EMPTY 5'].forEach((name,i)=>{const b=d.createElement('button');b.type='button';b.className='syndicateTab'+(i===0?' active':'');b.dataset.syndicateTab=String(i);b.textContent=name;tabs.appendChild(b)});
  const pane=d.createElement('div');pane.className='syndicatePane';
  const title=d.createElement('div');title.className='syndicateTitle';title.innerHTML='<span>💵 WALTERS INTELLIGENCE // SYNDICATE 01</span><b>MARKET DISCIPLINE PROTOTYPE</b>';
  const sub=d.createElement('div');sub.className='syndicateSub';sub.textContent='ARCHIVED MARKET LINEAGE • PRICE DISCIPLINE • BW FAIR CHANNEL RESERVED';
  const meters=d.createElement('div');meters.className='waltersMeters';
  meters.append(
    meterRow(d,'PRICE DISCIPLINE','96','No marginal position forced into BET.'),
    meterRow(d,'INFORMATION DISCIPLINE','95','Stale execution correctly held until fresh verification.'),
    meterRow(d,'THRESHOLD TRACKING','94','Documented buy points preserved through the day.'),
    meterRow(d,'MARKET LINEAGE','92','Archived lane sequence supports movement analysis.'),
    meterRow(d,'LINE SHOPPING','88','Best-book differences identified without manufacturing value.')
  );
  const foot=d.createElement('div');foot.className='syndicateFoot';foot.innerHTML='<b>BW FAIR:</b> RESERVED FOR INDEPENDENT FOOTBALL LINE ENGINE &nbsp;•&nbsp; <b>KEY-NUMBER WEIGHT:</b> PENDING &nbsp;•&nbsp; <b>MARKET PATH:</b> READY FOR ARCHIVED SNAPSHOTS';
  pane.append(title,sub,meters,foot);
  box.append(tabs,pane);
  tabs.addEventListener('click',e=>{const b=e.target.closest('[data-syndicate-tab]');if(!b)return;tabs.querySelectorAll('.syndicateTab').forEach(x=>x.classList.toggle('active',x===b));const idx=Number(b.dataset.syndicateTab);if(idx===0){pane.innerHTML='';pane.append(title,sub,meters,foot)}else{pane.innerHTML=`<div class="blankSyndicate"><b>SYNDICATE 0${idx+1}</b><span>UNASSIGNED // SLOT AVAILABLE</span></div>`}});
  navPad.insertAdjacentElement('afterend',box);return box;
}
function applyHierarchyPatch(){
  const app=innerAppFrame();let d=null;try{d=app&&app.contentDocument}catch(e){return false}if(!d||!d.head||!d.body)return false;
  d.documentElement.dataset.uiVersion=UI_VERSION;if(d.title!==`VigScope Terminal UI v${UI_VERSION}`)d.title=`VigScope Terminal UI v${UI_VERSION}`;if(app&&app.title!==`VigScope Terminal UI v${UI_VERSION}`)app.title=`VigScope Terminal UI v${UI_VERSION}`;if(core.title!==`VigScope Terminal UI v${UI_VERSION}`)core.title=`VigScope Terminal UI v${UI_VERSION}`;
  let style=d.getElementById('runnerHierarchyPatch130');if(!style){style=d.createElement('style');style.id='runnerHierarchyPatch130';style.textContent=`
    .stats{display:none!important}.runnerNavPad{padding-top:10px!important;padding-bottom:8px!important}
    #runnerBankrollCompact{display:inline-flex;align-items:baseline;gap:8px;margin-top:7px;padding:4px 8px;border:1px solid var(--line);background:#020912;line-height:1;white-space:nowrap}
    #runnerBankrollCompact .runnerBankrollKey{color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.09em}#runnerBankrollCompact .runnerBankrollValue{color:var(--green);font-size:14px;font-weight:950}
    .runnerRiskMini{display:flex;justify-content:center;align-items:baseline;gap:6px;margin-top:7px;padding-top:6px;border-top:1px dotted var(--line);color:var(--muted);font-size:8px;font-weight:900;letter-spacing:.08em;line-height:1}.runnerRiskMini .runnerRiskValue{display:inline!important;margin:0!important;color:var(--text)!important;font-size:10px!important;line-height:1!important}
    #runnerSyndicateF5{border-color:#d8ad38!important;color:#ffd86a!important;background:linear-gradient(180deg,#211902,#0c0900)!important;box-shadow:inset 0 0 0 1px rgba(255,216,106,.08),0 0 12px rgba(216,173,56,.12)!important;text-shadow:0 0 7px rgba(255,216,106,.35)!important}
    #runnerSyndicateF5:hover,#runnerSyndicateF5.loaded{border-color:#ffe27a!important;color:#fff1ad!important;box-shadow:inset 0 0 0 1px rgba(255,235,150,.15),0 0 18px rgba(255,210,80,.24)!important}
    #runnerSyndicateWorkspace{display:none;margin:0 12px 12px;padding:12px;border:1px solid #7e6b27;background:linear-gradient(180deg,#090903,#020505);box-shadow:inset 0 0 26px rgba(208,170,42,.035);color:var(--text)}
    body.runnerSyndicateLoaded #runnerSyndicateWorkspace{display:block}body.runnerSyndicateLoaded #runnerSyndicateWorkspace~*{display:none!important}
    .syndicateTabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px;overflow-x:auto}.syndicateTab{min-height:38px;border:1px solid #4e4a26;background:#050705;color:#8f956e;font:900 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.syndicateTab.active{border-color:#e0b84f;color:#ffe07d;background:#161204;box-shadow:inset 0 0 12px rgba(224,184,79,.08)}
    .syndicatePane{border:1px solid #353722;background:#020503;padding:14px}.syndicateTitle{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#ffe07d;font-size:12px;font-weight:950;letter-spacing:.07em}.syndicateTitle b{color:#8d9372;font-size:9px}.syndicateSub{margin-top:6px;color:#777f67;font-size:9px;letter-spacing:.08em}.waltersMeters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}.waltersMeterRow{padding:10px;border:1px solid #292f22;background:#020704}.waltersMeterHead{display:flex;justify-content:space-between;gap:8px;color:#aeb98c;font-size:9px;font-weight:900;letter-spacing:.04em}.waltersMeterHead b{color:#ffe07d;font-size:13px}.waltersMeterTrack{height:7px;margin-top:8px;background:#0b100d;border:1px solid #222b24;overflow:hidden}.waltersMeterTrack i{display:block;height:100%;background:linear-gradient(90deg,#8b6f1e,#f1c451);box-shadow:0 0 8px rgba(241,196,81,.3)}.waltersMeterNote{margin-top:7px;color:#717967;font-size:8px;line-height:1.35}.syndicateFoot{margin-top:12px;padding-top:10px;border-top:1px dotted #454324;color:#777f67;font-size:8px;line-height:1.5;letter-spacing:.04em}.syndicateFoot b{color:#c0a754}.blankSyndicate{min-height:210px;display:grid;place-items:center;align-content:center;gap:10px;color:#6f755f;text-align:center}.blankSyndicate b{color:#b79a45;font-size:14px}.blankSyndicate span{font-size:9px;letter-spacing:.1em}
    @media(min-width:721px){.runnerNavPad .tabs{grid-template-columns:repeat(5,minmax(0,1fr))!important}.runnerCounts{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
    @media(max-width:900px){.waltersMeters{grid-template-columns:repeat(2,minmax(0,1fr))}.waltersMeterRow:last-child{grid-column:span 2}}
    @media(max-width:720px){.runnerNavPad .tabs{grid-template-columns:repeat(2,minmax(0,1fr))!important}.runnerNavPad .btn{min-height:50px;padding:9px 6px}#runnerSyndicateF5{grid-column:1/-1!important}.runnerCounts{grid-template-columns:repeat(2,minmax(0,1fr))!important}.syndicateTabs{grid-template-columns:repeat(5,110px)}.syndicateTitle{align-items:flex-start;flex-direction:column}.waltersMeters{grid-template-columns:1fr}.waltersMeterRow:last-child{grid-column:auto}}
    @media(max-width:560px){#runnerBankrollCompact{margin-top:6px}#runnerSyndicateWorkspace{margin-left:7px;margin-right:7px;padding:8px}.syndicatePane{padding:10px}}
  `;d.head.appendChild(style)}
  const top=d.querySelector('.top'),terminalTitle=top&&top.querySelector('.title');if(terminalTitle&&terminalTitle.textContent!==UI_TITLE)terminalTitle.textContent=UI_TITLE;const build=top&&top.querySelector('.small.muted');if(build&&build.textContent!==UI_BUILD)build.textContent=UI_BUILD;const footer=d.querySelector('.foot');if(footer){const nextFooter=footer.textContent.replace(/VIGSCOPE TERMINAL UI v\d+(?:\.\d+)+/i,UI_TITLE);if(nextFooter!==footer.textContent)footer.textContent=nextFooter}
  const tabs=d.querySelector('.tabs'),navPad=tabs&&tabs.parentElement;if(top&&navPad){navPad.classList.add('runnerNavPad');if(top.nextElementSibling!==navPad)top.insertAdjacentElement('afterend',navPad)}
  if(tabs&&!d.getElementById('runnerSyndicateF5')){const f5=d.createElement('button');f5.type='button';f5.id='runnerSyndicateF5';f5.className='btn';f5.innerHTML='<b>F5</b>&nbsp; 💵 LOAD SYNDICATE 💵';f5.setAttribute('aria-pressed','false');f5.addEventListener('click',()=>{const loaded=!d.body.classList.contains('runnerSyndicateLoaded');if(loaded)buildSyndicateWorkspace(d,navPad);d.body.classList.toggle('runnerSyndicateLoaded',loaded);f5.classList.toggle('loaded',loaded);f5.setAttribute('aria-pressed',String(loaded));f5.innerHTML=loaded?'<b>F5</b>&nbsp; 💵 SYNDICATE LOADED 💵':'<b>F5</b>&nbsp; 💵 LOAD SYNDICATE 💵'});tabs.appendChild(f5)}
  const stats=d.querySelector('.stats'),statValues=stats?[...stats.querySelectorAll('.stat b')]:[];if(stats)stats.setAttribute('aria-hidden','true');const titleGroup=top&&top.firstElementChild;let bankroll=d.getElementById('runnerBankrollCompact');if(titleGroup&&!bankroll){bankroll=d.createElement('div');bankroll.id='runnerBankrollCompact';bankroll.setAttribute('aria-label','Current bankroll');const key=d.createElement('span');key.className='runnerBankrollKey';key.textContent='BANKROLL';const value=d.createElement('b');value.className='runnerBankrollValue';bankroll.append(key,value);titleGroup.appendChild(bankroll)}const bankrollValue=bankroll&&bankroll.querySelector('.runnerBankrollValue'),nextBankroll=statValues[0]&&statValues[0].textContent||'$0.00';if(bankrollValue&&bankrollValue.textContent!==nextBankroll)bankrollValue.textContent=nextBankroll;
  const betCount=d.querySelector('.runnerCounts .runnerCount');let riskMini=betCount&&betCount.querySelector('.runnerRiskMini');if(betCount&&!riskMini){riskMini=d.createElement('div');riskMini.className='runnerRiskMini';const key=d.createElement('span');key.textContent='NEW RISK';const value=d.createElement('b');value.className='runnerRiskValue';riskMini.append(key,value);betCount.appendChild(riskMini)}const riskValue=riskMini&&riskMini.querySelector('.runnerRiskValue'),nextRisk=statValues[1]&&statValues[1].textContent||'$0.00';if(riskValue&&riskValue.textContent!==nextRisk)riskValue.textContent=nextRisk;return true
}
function watchHierarchy(){const app=innerAppFrame();if(!app){setTimeout(watchHierarchy,50);return}const attach=()=>{let d=null;try{d=app.contentDocument}catch(e){return}if(!d||!d.body){setTimeout(attach,30);return}if(hierarchyObserver)hierarchyObserver.disconnect();applyHierarchyPatch();hierarchyObserver=new MutationObserver(scheduleHierarchyPatch);hierarchyObserver.observe(d.body,{subtree:true,childList:true,characterData:true})};app.addEventListener('load',attach);if(app.contentDocument&&app.contentDocument.readyState!=='loading')setTimeout(attach,0)}
art.addEventListener('error',()=>splash.classList.add('asset-error'),{once:true});core.addEventListener('load',()=>{coreLoaded=true;watchHierarchy();reveal()},{once:true});core.src='./runner-core.html'+location.search+location.hash;startWhenVisible();
</script>
</body>
</html>
