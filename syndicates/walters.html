<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Walters Intelligence</title>
<style>
:root{--bg:#020503;--panel:#030804;--line:#303526;--amber:#ffe07d;--amber2:#c9a84a;--text:#d9dfc8;--muted:#7e876f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}body{padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border:1px solid #51481f;background:#080803;padding:12px}.title{color:var(--amber);font-size:14px;font-weight:950;letter-spacing:.08em}.sub{margin-top:5px;color:var(--muted);font-size:9px;letter-spacing:.08em}.tag{color:#9f9362;font-size:9px;border:1px solid #51481f;padding:5px 7px;white-space:nowrap}.meters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}.meter{border:1px solid var(--line);background:var(--panel);padding:10px}.mh{display:flex;justify-content:space-between;gap:8px;color:#aeb98c;font-size:9px;font-weight:900}.mh b{color:var(--amber);font-size:13px}.track{height:7px;margin-top:8px;border:1px solid #242b23;background:#0b100d;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#8c6f1d,#edc454);box-shadow:0 0 8px rgba(237,196,84,.3)}.note{margin-top:7px;color:var(--muted);font-size:8px;line-height:1.35}.empty{min-height:250px;display:grid;place-items:center;align-content:center;gap:10px;border:1px solid var(--line);background:var(--panel);margin-top:12px;text-align:center}.empty b{color:var(--amber);font-size:15px;letter-spacing:.08em}.empty span{color:var(--muted);font-size:9px;letter-spacing:.08em}.notes{margin-top:12px;border:1px solid var(--line);background:var(--panel);padding:10px}.notes div+div{margin-top:8px}.foot{margin-top:12px;padding:10px;border:1px dotted #51481f;color:var(--muted);font-size:8px;line-height:1.5}.foot b{color:var(--amber2)}
@media(max-width:900px){.meters{grid-template-columns:repeat(2,minmax(0,1fr))}.meter:last-child{grid-column:span 2}}@media(max-width:620px){body{padding:9px}.head{flex-direction:column}.meters{grid-template-columns:1fr}.meter:last-child{grid-column:auto}}
</style>
</head>
<body>
<div id="app" class="empty"><b>WALTERS</b><span>LOADING REPORT DATA</span></div>
<script>
const DATA_URL='../data/walters/latest.json';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function meterHtml(m){const n=Math.max(0,Math.min(100,Number(m&&m.value)||0));return `<div class="meter"><div class="mh"><span>${esc(m&&m.label||'METER')}</span><b>${esc(m&&m.display??n)}</b></div><div class="track"><i style="width:${n}%"></i></div><div class="note">${esc(m&&m.note||'')}</div></div>`}
function render(data){const app=document.getElementById('app');const meters=Array.isArray(data&&data.meters)?data.meters:[];const notes=Array.isArray(data&&data.notes)?data.notes:[];if(String(data&&data.status||'').toUpperCase()==='EMPTY'&&!meters.length&&!notes.length){app.className='empty';app.innerHTML=`<b>${esc(data&&data.title||'WALTERS')}</b><span>${esc(data&&data.summary||'REPORT SLOT READY')}</span>`;return}app.className='';app.innerHTML=`<div class="head"><div><div class="title">💵 ${esc(data&&data.title||'WALTERS')} // ${esc(data&&data.subtitle||'SYNDICATE 01')}</div><div class="sub">${esc(data&&data.summary||'')}</div></div><div class="tag">${esc(data&&data.status||'ACTIVE')}</div></div>${meters.length?`<div class="meters">${meters.map(meterHtml).join('')}</div>`:''}${notes.length?`<div class="notes">${notes.map(n=>`<div>${esc(n)}</div>`).join('')}</div>`:''}<div class="foot">${esc(data&&data.footer||'')}</div>`}
fetch(`${DATA_URL}?v=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`data ${r.status}`);return r.json()}).then(render).catch(err=>{const app=document.getElementById('app');app.className='empty';app.innerHTML=`<b>WALTERS LOAD FAILED</b><span>${esc(err.message||err)}</span>`});
</script>
</body>
</html>
