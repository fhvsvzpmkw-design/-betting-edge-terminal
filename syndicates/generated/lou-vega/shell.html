<!doctype html>
<html lang="en" data-hotline-shell="vegas-by-the-slice" data-shell-version="1">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vegas by the Slice — Hotline Shell</title>
<!-- HOTLINE SHELL v1 // APPROVED + LOCKED
NORMAL UPDATE RULE: REFRESH THE EDITION; PRESERVE THE PAGE.
Replace content zones only. Menu-board masthead, coupon/floor architecture, route-card hierarchy and responsive rules change only in a new shell version. -->
<style>
:root{--cream:#fff0c2;--red:#d4472f;--green:#3e8c66;--gold:#e8b744;--ink:#241b14;--dark:#1c2525;--blue:#376f87}
*{box-sizing:border-box}html,body{margin:0;background:#202827;color:var(--ink)}body{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:linear-gradient(135deg,#1d2423,#323b37)}main{max-width:1040px;margin:auto;padding:12px}.menu{background:#f4e6b7;border:5px solid #9b2f23;box-shadow:0 0 0 4px #e8b744,0 20px 55px #000;padding:15px}.head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-bottom:4px double #60392d;padding-bottom:10px}.head h1{margin:0;color:#b52f25;font:italic 54px/.88 Georgia,serif;text-shadow:2px 2px #dfbe69}.head p{margin:6px 0 0;font-weight:bold}.ticket{border:2px dashed #7b442d;padding:8px;background:#fff4cc;transform:rotate(.5deg);font-size:9px}.ticker{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{border:2px solid #6b4431;border-radius:20px;padding:4px 8px;background:#e9d698;font-size:9px;font-weight:bold}.board{background:#203531;color:#f8f0d2;border:4px ridge #ad8d4b;padding:11px}.board h2{margin:0 0 8px;color:#ffd97d;font-size:16px}.item{margin:8px 0;border-bottom:1px dashed #819188;padding:0 0 8px}.coupon-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;margin-top:11px}.coupons,.floor{border:2px solid #7a4934;background:#fff3c9;padding:10px}.coupons h2,.floor h2{margin:0 0 7px;font-size:14px;color:#9d3025}.coupon{margin:7px 0;padding:8px;border:2px dashed #a75a35;background:#f8e8b7}.routegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.route{padding:10px;border:2px solid #547166;background:#d8e2d1}.dinner{padding:10px;border:2px solid #9c753c;background:#f7d993}.foot{margin-top:9px;color:#675747;font-size:9px}@media(max-width:700px){.head{grid-template-columns:1fr}.head h1{font-size:43px}.coupon-grid,.routegrid{grid-template-columns:1fr}}
</style></head><body><main><article class="menu">
<header class="head" data-zone="masthead"><div><h1>VEGAS BY THE SLICE</h1><p>{{LOU_DECK}}</p></div><div class="ticket" data-zone="issue-meta">{{ISSUE_TICKET}}</div></header>
<div class="ticker">{{ROUTE_TICKER}}</div>
<section class="board" data-zone="menu-board"><h2>{{MENU_TITLE}}</h2><div data-zone="recommendations">{{RECOMMENDATION_ITEMS}}</div></section>
<div class="coupon-grid"><section class="coupons" data-zone="coupon-book"><h2>COUPON BOOK</h2>{{COUPONS}}</section><aside class="floor" data-zone="floor-walk"><h2>FLOOR WALK</h2>{{FLOOR_WALK}}</aside></div>
<div class="routegrid">{{DINNER_CARD}}{{BEST_NUMBER_CARD}}</div>
<div class="route" data-zone="last-stop">{{LAST_STOP}}</div>
<div class="foot" data-zone="footer">{{AUTHORITY_FOOTER}}</div>
</article></main></body></html>
