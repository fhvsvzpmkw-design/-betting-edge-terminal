<!doctype html>
<html lang="en" data-hotline-shell="delphoria-counter-sheet" data-shell-version="2">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Desk // Hotel Delphoria — Hotline Shell v2</title>
<!-- HOTLINE SHELL v2 // EDITABLE
IMAGE-RICH CLASSIC ADVENTURE PACK UPGRADE.
NORMAL UPDATE RULE: REFRESH THE EDITION; PRESERVE THE PAGE AFTER APPROVAL. -->
<style>
:root{--paper:#d9c78e;--ink:#211b12;--red:#8a231b;--black:#17130e;--blue:#263e52;--dirty:#b8a46f}*{box-sizing:border-box}html,body{margin:0;background:#18130e;color:var(--ink)}body{font:13px/1.45 "Courier New",monospace;background:radial-gradient(circle at 50% 0,#493e2e,#17120d 70%)}main{max-width:960px;margin:auto;padding:13px}.paper{position:relative;overflow:hidden;padding:18px 22px 30px;background:linear-gradient(96deg,#c8b579 0,#e0cf98 8%,#dac98f 62%,#c7b373 100%);border:1px solid #756544;box-shadow:0 24px 60px #000}.paper:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 3px,#5a4c31 4px)}.paper>*{position:relative;z-index:1}.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--black);padding-bottom:7px;font-size:9px;font-weight:bold}.other{border:2px solid var(--red);color:var(--red);padding:2px 6px;transform:rotate(-1deg)}.mast{text-align:center;margin:8px 0 5px}.mast-logo{display:block;width:min(760px,100%);height:auto;margin:0 auto;filter:drop-shadow(2px 3px 0 rgba(65,45,25,.25))}.sub{text-align:center;font-weight:bold;border-block:1px solid #615337;padding:6px 0}.issue{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}.stamp{border:2px solid #6d5b3a;padding:4px 7px;background:rgba(255,255,255,.14);font-size:9px;font-weight:bold}.hero{margin:11px -22px 14px;border-block:4px solid #211b12;background:#100d0a}.hero img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:center}.story,.house,.last,.back{margin:11px 0;border:2px solid #5b4c32;background:rgba(244,228,170,.42);padding:10px}.story h2,.house h2,.board h2,.last h2,.back h2{margin:0 0 6px;font-size:13px;text-transform:uppercase}.slip{margin:8px 0;padding:7px 9px;border-left:5px solid var(--red);background:#ead9a5}.board{margin-top:12px}.card{margin:8px 0;border:2px solid #5b4c32;border-left:8px solid var(--red);background:rgba(245,230,180,.48);padding:9px;box-shadow:3px 3px 0 rgba(55,45,28,.25)}.card.wait{border-left-color:#7b6515;background:rgba(246,225,132,.62)}.status{font-weight:bold;border:2px solid currentColor;padding:1px 7px;transform:rotate(-1deg);color:var(--red)}.status.wait{color:#6b5710}.team{font:bold 22px/1.05 Georgia,serif;margin:5px 0}.facts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.fact{border:1px solid #7d6c46;padding:5px;background:rgba(255,250,220,.34)}.jesse{margin-top:7px;padding:7px 9px;background:var(--black);color:#f0dfad;font-weight:bold}.phone{margin-top:6px;padding:6px;border:1px dashed #57492f;background:#ccb982}.house{border-style:dashed}.house h2{color:var(--red)}.house-grid,.back-grid{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center}.prop-img{display:block;width:100%;max-width:180px;height:auto;margin:auto;filter:drop-shadow(2px 3px 1px rgba(31,22,13,.28))}.back{border-left:7px solid var(--black)}.last{border:3px double var(--black)}.footer{margin-top:10px;font-size:8px;color:#584b35}@media(max-width:650px){main{padding:6px}.paper{padding:12px 10px 22px}.mast-logo{width:100%}.hero{margin:9px -10px 12px}.hero img{aspect-ratio:16/10;object-position:center}.facts{grid-template-columns:1fr 1fr}.house-grid,.back-grid{grid-template-columns:1fr}.prop-img{max-width:220px}.team{font-size:19px}}
</style></head><body><main><article class="paper">
<div class="topline"><span class="other">LYTTON'S OTHER PAPER</span><span>{{COUNTER_DATE}}</span></div>
<header class="mast" data-zone="masthead"><img class="mast-logo" src="../../assets/syndicates/delphoria-logo.png?v=2" alt="Hotel Delphoria Sports Desk"></header>
<div class="sub">BACK-ROOM NUMBERS · PHONE TRAFFIC · JESSE BAINS UPSTAIRS</div>
<div class="issue" data-zone="issue-meta">{{ISSUE_STAMPS}}</div>
<div class="hero" data-zone="hero"><img src="../../assets/syndicates/delphoria-hero.png?v=2" alt="Jesse Bains at the Hotel Delphoria sports desk"></div>
<section class="story" data-zone="story">{{STORY}}</section>
<section class="board" data-zone="recommendations">{{RECOMMENDATIONS}}</section>
<section class="house" data-zone="house-note"><div class="house-grid"><img class="prop-img" src="../../assets/syndicates/delphoria-house-badge.png?v=2" alt="Hotel Delphoria house badge">{{HOUSE_NOTE}}</div></section>
<section class="back" data-zone="back-room"><div class="back-grid"><img class="prop-img" src="../../assets/syndicates/delphoria-phone-badge.png?v=2" alt="Hotel Delphoria phone slip">{{BACK_ROOM}}</div></section>
<section class="last" data-zone="last-word">{{LAST_WORD}}</section>
<div class="footer" data-zone="footer">{{AUTHORITY_FOOTER}}</div>
</article></main></body></html>
