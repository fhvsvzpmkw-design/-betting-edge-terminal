<!doctype html>
<html lang="en" data-hotline-shell="{{SHELL_ID}}" data-shell-version="1">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{PUBLICATION}} — Hotline Shell</title>
<!-- GENERATED HOTLINE SHELL v1 // EDITABLE
NORMAL UPDATE RULE: REFRESH THE EDITION; PRESERVE THE PAGE.
This shell may be deliberately redesigned before approval. Once approved/locked, normal Hotline editions replace content zones only. -->
<style>
:root{--bg:#071016;--panel:#0b1820;--ink:#edf7f8;--muted:#8aa0a8;--accent:{{ACCENT}}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}body{font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}main{max-width:980px;margin:auto;padding:12px}.shell{border:2px solid var(--accent);background:var(--panel);box-shadow:0 18px 50px #0008}.mast{padding:18px;border-bottom:2px solid var(--accent)}.mast small{display:block;color:var(--accent);font-weight:900;letter-spacing:.1em}.mast h1{margin:5px 0 4px;font-size:clamp(34px,7vw,62px);line-height:.95}.meta{color:var(--muted);font-size:11px}.summary,.board,.voice,.foot{margin:12px;padding:12px;border:1px solid #344650}.board{display:grid;gap:9px}.card{padding:11px;border:1px solid #53636b;background:#081219}.voice{border-color:var(--accent)}.foot{color:var(--muted);font-size:9px}
</style>
</head><body><main><article class="shell">
<header class="mast" data-zone="masthead"><small>{{DISPLAY_NAME}}</small><h1>{{PUBLICATION}}</h1><div>{{THEME}}</div><div class="meta" data-zone="issue-meta">{{ISSUE_META}}</div></header>
<section class="summary" data-zone="report-summary">{{REPORT_SUMMARY}}</section>
<section class="board" data-zone="recommendations">{{RECOMMENDATION_CARDS}}</section>
<section class="voice" data-zone="character-voice">{{CHARACTER_VOICE}}</section>
<footer class="foot" data-zone="footer">{{AUTHORITY_FOOTER}}</footer>
</article></main></body></html>
