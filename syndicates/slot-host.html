<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Syndicate Slot</title>
<style>
:root{--bg:#01040a;--line:#1b3039;--text:#c8d8df;--muted:#718791;--green:#58ff88;--gold:#ffe17b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
body{display:grid;grid-template-rows:auto 1fr;min-height:100vh}
.slotbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 9px;border-bottom:1px solid var(--line);background:#020912;position:sticky;top:0;z-index:5}
.slotlabel{display:flex;align-items:baseline;gap:8px;min-width:0}.slotlabel b{color:var(--gold);font-size:10px;letter-spacing:.08em}.slotlabel span{color:var(--muted);font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;align-items:center;gap:6px}.controls label{color:var(--muted);font-size:8px;font-weight:900;letter-spacing:.08em}.controls select{max-width:190px;border:1px solid #53636b;background:#071016;color:#e6f0f3;padding:5px 7px;font:900 9px ui-monospace,SFMono-Regular,Menlo,monospace}
#content{position:relative;min-height:0}
.frame{display:block;width:100%;height:calc(100vh - 43px);border:0;background:#01040a}
.empty{display:grid;place-items:center;align-content:center;gap:8px;min-height:calc(100vh - 43px);padding:20px;text-align:center;background:radial-gradient(circle at 50% 20%,#07131a,#01040a 65%)}.empty b{color:var(--gold);font-size:18px}.empty span{color:var(--muted);font-size:10px;letter-spacing:.08em}
.shareHotline{position:fixed;left:50%;right:auto;bottom:14px;z-index:20;width:clamp(150px,32vw,240px);border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transform:translateX(-50%)}.shareHotline img{display:block;width:100%;height:auto;border:0}.shareHotline:active{transform:translateX(-50%) scale(.98)}
.fullscreenClose{display:none;position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:31;min-width:116px;min-height:50px;border:2px solid var(--gold);border-radius:4px;background:#020912;color:var(--gold);padding:12px 16px;font:950 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;box-shadow:0 0 0 1px #000,0 4px 16px #0009;cursor:pointer;-webkit-tap-highlight-color:transparent}.fullscreenClose:active{transform:scale(.97);background:#161305}
body.hotlineFullscreen{display:block;overflow:hidden}body.hotlineFullscreen .slotbar{display:none}body.hotlineFullscreen #content{position:fixed;inset:0;z-index:25;background:var(--bg)}body.hotlineFullscreen .frame{width:100%;height:100vh}body.hotlineFullscreen .shareHotline{z-index:30}body.hotlineFullscreen .fullscreenClose{display:block}
@media(max-width:520px){.slotbar{align-items:flex-start;flex-direction:column}.controls{width:100%}.controls select{flex:1;max-width:none;width:100%}.frame{height:calc(100vh - 70px)}.empty{min-height:calc(100vh - 70px)}.shareHotline{left:50%;right:auto;bottom:12px;transform:translateX(-50%);width:min(78vw,230px)}.shareHotline:active{transform:translateX(-50%) scale(.98)}.fullscreenClose{min-width:108px;min-height:50px;padding:12px 14px;font-size:14px}}
</style>
</head>
<body>
<div class="slotbar">
  <div class="slotlabel"><b id="slotName">SYNDICATE SLOT</b><span id="currentName">LOADING</span></div>
  <div class="controls"><label for="profileSelect">LOAD</label><select id="profileSelect" aria-label="Select syndicate profile"></select></div>
</div>
<div id="content"></div>
<button id="shareHotline" class="shareHotline" type="button" aria-label="Share hotline" hidden><img id="shareHotlineArt" alt="Share Hotline"></button>
<button id="fullscreenClose" class="fullscreenClose" type="button" aria-label="Close full screen hotline">CLOSE ×</button>
<script>
const MANIFEST='../data/syndicates.json';
const STORAGE_KEY='bettingEdge.syndicateSlots.v3';
const FALLBACK_DEFAULTS=['eddie-numbers','vic-fremont','lou-vega',null];
const SHARE_ASSET='../assets/syndicates/IMG_0388.png';
const params=new URLSearchParams(location.search);
const slotIndex=Math.min(3,Math.max(0,(Number(params.get('slot'))||1)-1));
const slotName=document.getElementById('slotName');
const currentName=document.getElementById('currentName');
const select=document.getElementById('profileSelect');
const content=document.getElementById('content');
const shareHotline=document.getElementById('shareHotline');
const shareHotlineArt=document.getElementById('shareHotlineArt');
const fullscreenClose=document.getElementById('fullscreenClose');
let currentProfile=null,currentTarget=null;
shareHotlineArt.src=`${SHARE_ASSET}?v=${Date.now()}`;
slotName.textContent=`F${slotIndex+1} // SYNDICATE SLOT`;
function initials(label,index){const v=String(label||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();return v||String(index+1).padStart(2,'0')}
function normalizeProfile(p,i){const label=String(p&&(p.name||p.label)||`PROFILE ${i+1}`);return{id:String(p&&p.id||`profile-${i+1}`),label,subtitle:String(p&&(p.title||p.subtitle||p.tagline)||'PRIVATE WIRE'),status:String(p&&p.status||'LIVE'),enabled:Boolean(p&&p.enabled!==false&&p.url),url:p&&p.url?String(p.url):null,avatar:String(p&&(p.fallback||p.avatar||p.initials)||initials(label,i)),avatarUrl:p&&(p.headshot||p.avatarUrl)?String(p.headshot||p.avatarUrl):null,avatarAlt:String(p&&(p.headshotAlt||p.avatarAlt)||`${label} headshot`),avatarPosition:String(p&&(p.headshotPosition||p.avatarPosition)||'50% 32%'),accent:String(p&&p.accent||'#c9a43b')}}
function normalizedDefaults(raw){const source=Array.isArray(raw&&raw.defaults)&&raw.defaults.length===4?raw.defaults:FALLBACK_DEFAULTS;return source.map(v=>v==null?null:String(v))}
function loadAssignments(defaults){try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(raw)&&raw.length===4)return raw.map(v=>v==null?null:String(v))}catch(e){}return defaults.slice()}
function saveAssignments(a){localStorage.setItem(STORAGE_KEY,JSON.stringify(a))}
function resolveProjectUrl(path){return new URL(path,new URL('../',location.href)).href}
function emptyProfile(index){return{id:null,label:`EMPTY ${index+1}`,subtitle:'SLOT AVAILABLE',status:'OPEN',enabled:false,url:null,avatar:String(index+1).padStart(2,'0'),avatarUrl:null,avatarAlt:'Empty syndicate slot',avatarPosition:'50% 32%',accent:'#53636b'}}
function updateParentTab(tab,p,index){if(!tab)return;tab.style.setProperty('--syndicate-accent',p.accent);tab.setAttribute('aria-label',`${p.label} — ${p.subtitle} — ${p.status}`);const avatar=tab.querySelector('.syndicateAvatar');if(avatar){avatar.style.setProperty('--avatar-position',p.avatarPosition);avatar.textContent=p.avatar||String(index+1).padStart(2,'0');if(p.avatarUrl){const img=document.createElement('img');img.src=resolveProjectUrl(p.avatarUrl);img.alt=p.avatarAlt;img.loading='eager';img.decoding='async';img.onerror=()=>img.remove();avatar.appendChild(img)}}const name=tab.querySelector('.syndicateName');if(name)name.textContent=p.label;const subtitle=tab.querySelector('.syndicateSubtitle');if(subtitle)subtitle.textContent=p.subtitle;const status=tab.querySelector('.syndicateStatus');if(status)status.textContent=p.status}
function refreshParentTabs(profiles,assignments){try{const d=window.parent.document;assignments.forEach((id,i)=>{const p=profiles.find(x=>x.id===id)||emptyProfile(i);updateParentTab(d.querySelector(`[data-syndicate-tab="${i}"]`),p,i)})}catch(e){}}
function buildSelector(profiles,assignments){select.innerHTML='';const empty=document.createElement('option');empty.value='';empty.textContent='EMPTY';select.appendChild(empty);profiles.filter(p=>p.enabled).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.label;const used=assignments.some((id,i)=>i!==slotIndex&&id===p.id);o.disabled=used;select.appendChild(o)});select.value=assignments[slotIndex]||''}
function ensureParentFullscreenStyle(){try{const d=window.parent.document;if(d.getElementById('syndicateHotlineFullscreenStyle'))return;const style=d.createElement('style');style.id='syndicateHotlineFullscreenStyle';style.textContent='body.syndicateHotlineFullscreen #runnerSyndicateWorkspace{position:fixed!important;inset:0!important;z-index:9999!important;margin:0!important;padding:0!important;border:0!important;background:#01040a!important}body.syndicateHotlineFullscreen #runnerSyndicateWorkspace .syndicateTabs{display:none!important}body.syndicateHotlineFullscreen #runnerSyndicateWorkspace .syndicatePane{height:100vh!important;min-height:100vh!important;border:0!important;padding:0!important}body.syndicateHotlineFullscreen #runnerSyndicateWorkspace .syndicateFrame{display:block!important;width:100%!important;height:100vh!important;min-height:100vh!important;border:0!important}';d.head.appendChild(style)}catch(e){}}
function enterFullscreen(){if(document.body.classList.contains('hotlineFullscreen'))return;document.body.classList.add('hotlineFullscreen');try{ensureParentFullscreenStyle();window.parent.document.body.classList.add('syndicateHotlineFullscreen')}catch(e){}}
function exitFullscreen(){document.body.classList.remove('hotlineFullscreen');try{window.parent.document.body.classList.remove('syndicateHotlineFullscreen')}catch(e){}}
function bindHotlineTap(frame){frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d||d.documentElement.dataset.hotlineTapBound==='1')return;d.documentElement.dataset.hotlineTapBound='1';d.addEventListener('click',e=>{const t=e.target;if(t&&t.closest&&t.closest('a,button,input,select,textarea,label,[role="button"],[contenteditable="true"]'))return;enterFullscreen()})}catch(e){}})}
async function shareCurrentHotline(){if(!currentProfile||!currentTarget)return;const data={title:`${currentProfile.label} Hotline`,text:`${currentProfile.label} — ${currentProfile.subtitle}`,url:currentTarget};try{if(navigator.share){await navigator.share(data);return}}catch(err){if(err&&err.name==='AbortError')return}window.open(currentTarget,'_blank','noopener')}
function renderProfile(profile){exitFullscreen();content.innerHTML='';currentProfile=null;currentTarget=null;shareHotline.hidden=true;if(!profile||!profile.enabled||!profile.url){currentName.textContent='EMPTY // SLOT AVAILABLE';const blank=document.createElement('div');blank.className='empty';blank.innerHTML='<b>EMPTY SYNDICATE SLOT</b><span>SELECT A SAVED CHARACTER ABOVE</span>';content.appendChild(blank);return}currentProfile=profile;currentName.textContent=`${profile.label} // ${profile.subtitle}`;const frame=document.createElement('iframe');frame.className='frame';frame.title=profile.label;const target=resolveProjectUrl(profile.url);currentTarget=target;frame.src=target+(target.includes('?')?'&':'?')+'v='+Date.now();bindHotlineTap(frame);content.appendChild(frame);shareHotline.hidden=false}
shareHotline.addEventListener('click',e=>{e.stopPropagation();shareCurrentHotline()});
fullscreenClose.addEventListener('click',exitFullscreen);
document.addEventListener('keydown',e=>{if(e.key==='Escape')exitFullscreen()});
async function boot(){const res=await fetch(`${MANIFEST}?v=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(`manifest ${res.status}`);const raw=await res.json();const profiles=(Array.isArray(raw.profiles)?raw.profiles:Array.isArray(raw.slots)?raw.slots:[]).map(normalizeProfile);const defaults=normalizedDefaults(raw);let assignments=loadAssignments(defaults);assignments=assignments.map(id=>profiles.some(p=>p.id===id)?id:null);saveAssignments(assignments);refreshParentTabs(profiles,assignments);buildSelector(profiles,assignments);renderProfile(profiles.find(p=>p.id===assignments[slotIndex]));select.addEventListener('change',()=>{const next=select.value||null;if(next&&assignments.some((id,i)=>i!==slotIndex&&id===next)){buildSelector(profiles,assignments);return}assignments[slotIndex]=next;saveAssignments(assignments);refreshParentTabs(profiles,assignments);buildSelector(profiles,assignments);renderProfile(profiles.find(p=>p.id===next));});window.addEventListener('storage',e=>{if(e.key!==STORAGE_KEY)return;assignments=loadAssignments(defaults);refreshParentTabs(profiles,assignments);buildSelector(profiles,assignments);renderProfile(profiles.find(p=>p.id===assignments[slotIndex]));})}
boot().catch(err=>{currentName.textContent='LOAD FAILED';shareHotline.hidden=true;content.innerHTML=`<div class="empty"><b>SYNDICATE LOAD FAILED</b><span>${String(err.message||err)}</span></div>`});
</script>
</body>
</html>
