<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Syndicate Slot</title>
<style>
:root{--bg:#01040a;--panel:#020912;--line:#1b3039;--line2:#38505a;--text:#c8d8df;--muted:#718791;--green:#58ff88;--gold:#ffe17b;--gold2:#c9a43b;--cyan:#39e7ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}body{display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
.syndicateHero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 14px;border-bottom:1px solid #5d4d22;background:radial-gradient(circle at 20% -40%,#40340b 0,#141306 34%,#020912 78%);box-shadow:inset 0 -1px 0 #000,0 8px 20px #0008}.heroCopy{min-width:0}.heroEyebrow{color:var(--gold2);font-size:8px;font-weight:950;letter-spacing:.15em}.syndicateHero h1{margin:2px 0 1px;color:var(--gold);font-size:clamp(20px,3.4vw,31px);line-height:.95;letter-spacing:.04em;text-shadow:0 0 12px #d6b34133}.heroDeck{color:#9f986f;font-size:8px;font-weight:900;letter-spacing:.1em}.heroCount{min-width:110px;text-align:center;border:1px solid var(--gold2);background:#090b04;padding:7px 10px;box-shadow:inset 0 0 12px #e1b84b0d}.heroCount b{display:block;color:var(--gold);font-size:18px}.heroCount span{display:block;color:#92885f;font-size:7px;font-weight:950;letter-spacing:.12em}
.slotbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 9px;border-bottom:1px solid var(--line);background:#020912;position:relative;z-index:7}.slotlabel{display:flex;align-items:baseline;gap:8px;min-width:0}.slotlabel b{color:var(--gold);font-size:10px;letter-spacing:.08em}.slotlabel span{color:var(--muted);font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.manageBtn{border:1px solid var(--gold2);background:#111004;color:var(--gold);padding:6px 9px;font:950 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;cursor:pointer}.manageBtn:active{transform:scale(.98)}
#content{position:relative;min-height:0;height:100%}.frame{display:block;width:100%;height:100%;border:0;background:#01040a}.empty{display:grid;place-items:center;align-content:center;gap:9px;height:100%;padding:20px;text-align:center;background:radial-gradient(circle at 50% 20%,#07131a,#01040a 65%)}.empty b{color:var(--gold);font-size:18px}.empty span{color:var(--muted);font-size:10px;letter-spacing:.08em}.empty button{margin-top:4px;border:2px solid var(--gold2);background:#111004;color:var(--gold);padding:10px 15px;font:950 10px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.libraryPanel{position:fixed;z-index:18;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(86px,calc(env(safe-area-inset-top) + 74px));max-height:calc(100vh - 105px);overflow:auto;border:2px solid var(--gold2);background:#02070b;box-shadow:0 22px 60px #000,inset 0 0 28px #e3b9480b;padding:10px}.libraryPanel[hidden]{display:none}.libraryHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:4px 3px 10px;border-bottom:1px solid #4b4120}.libraryHead b{display:block;color:var(--gold);font-size:13px;letter-spacing:.08em}.libraryHead span{display:block;margin-top:3px;color:var(--muted);font-size:8px}.libraryClose{border:1px solid #53636b;background:#071016;color:#b7c7cc;font:950 10px ui-monospace,SFMono-Regular,Menlo,monospace;padding:6px 9px;cursor:pointer}.profilePicker{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:9px}.profileCard{--accent:#c9a43b;position:relative;min-height:92px;border:1px solid #35505b;background:linear-gradient(135deg,#061019,#02070b);color:#d9e7ea;padding:8px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;text-align:left;font:inherit;cursor:pointer}.profileCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}.profileCard:hover,.profileCard.active{border-color:var(--accent);background:linear-gradient(135deg,#101407,#030903)}.profileCard:disabled{opacity:.42;cursor:not-allowed}.profileAvatar{position:relative;width:64px;height:74px;border:1px solid var(--accent);border-radius:5px;display:grid;place-items:center;color:var(--accent);font-size:17px;font-weight:950;overflow:hidden;background:#050b0f}.profileAvatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--avatar-position,50% 32%)}.profileName{display:block;color:#f3e9b5;font-size:11px;font-weight:950}.profileSub{display:block;margin-top:4px;color:#8ea4ad;font-size:7px;line-height:1.35}.profileUse{display:block;margin-top:7px;color:var(--gold2);font-size:7px;font-weight:950;letter-spacing:.08em}.emptyCard{grid-template-columns:1fr;place-items:center;text-align:center;min-height:92px}.emptyCard .profileName{color:#9eb0b7}
.shareHotline{position:fixed;left:50%;right:auto;bottom:14px;z-index:20;width:clamp(150px,32vw,240px);border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transform:translateX(-50%)}.shareHotline img{display:block;width:100%;height:auto;border:0}.shareHotline:active{transform:translateX(-50%) scale(.98)}.fullscreenClose{display:none;position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:31;min-width:116px;min-height:50px;border:2px solid var(--gold);border-radius:4px;background:#020912;color:var(--gold);padding:12px 16px;font:950 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;box-shadow:0 0 0 1px #000,0 4px 16px #0009;cursor:pointer;-webkit-tap-highlight-color:transparent}.fullscreenClose:active{transform:scale(.97);background:#161305}
body.hotlineFullscreen{display:block;overflow:hidden}body.hotlineFullscreen .syndicateHero,body.hotlineFullscreen .slotbar,body.hotlineFullscreen .libraryPanel{display:none!important}body.hotlineFullscreen #content{position:fixed;inset:0;z-index:25;background:var(--bg)}body.hotlineFullscreen .frame{width:100%;height:100vh}body.hotlineFullscreen .shareHotline{z-index:30}body.hotlineFullscreen .fullscreenClose{display:block}
@media(max-width:560px){.syndicateHero{padding:9px 10px;gap:8px}.heroDeck{letter-spacing:.04em}.heroCount{min-width:84px;padding:6px}.heroCount b{font-size:15px}.slotbar{gap:7px}.slotlabel{display:block}.slotlabel span{display:block;margin-top:2px;max-width:220px}.manageBtn{padding:7px 8px}.libraryPanel{top:max(80px,calc(env(safe-area-inset-top) + 68px));left:6px;right:6px;max-height:calc(100vh - 92px)}.profilePicker{grid-template-columns:1fr}.shareHotline{bottom:12px;width:min(78vw,230px)}.fullscreenClose{min-width:108px;min-height:50px;padding:12px 14px;font-size:14px}}
</style>
</head>
<body>
<header class="syndicateHero" aria-label="Build your Syndicate">
  <div class="heroCopy"><div class="heroEyebrow">PRIVATE ROSTER BOARD // FOUR LINES MAX</div><h1>BUILD YOUR SYNDICATE</h1><div class="heroDeck">SELECT FROM YOUR CHARACTER LIBRARY // TAP A SLOT ABOVE TO MOVE BETWEEN LINES</div></div>
  <div class="heroCount"><b id="loadedCount">0 / 4</b><span>LINES ACTIVE</span></div>
</header>
<div class="slotbar">
  <div class="slotlabel"><b id="slotName">SYNDICATE SLOT</b><span id="currentName">LOADING</span></div>
  <button id="manageButton" class="manageBtn" type="button">CHANGE CHARACTER</button>
</div>
<div id="libraryPanel" class="libraryPanel" hidden>
  <div class="libraryHead"><div><b>CHARACTER LIBRARY</b><span>Choose one saved character for this line. A character can occupy only one F-slot at a time.</span></div><button id="libraryClose" class="libraryClose" type="button">CLOSE ×</button></div>
  <div id="profilePicker" class="profilePicker"></div>
</div>
<div id="content"></div>
<button id="shareHotline" class="shareHotline" type="button" aria-label="Share hotline" hidden><img id="shareHotlineArt" alt="Share Hotline"></button>
<button id="fullscreenClose" class="fullscreenClose" type="button" aria-label="Close full screen hotline">CLOSE ×</button>
<script>
const MANIFEST='../data/syndicates.json';
const STORAGE_KEY='bettingEdge.syndicateSlots.v4';
const FALLBACK_DEFAULTS=['eddie-numbers','lou-vega','vic-fremont',null];
const SHARE_ASSET='../assets/syndicates/vigwire-hotline-share.png';
const params=new URLSearchParams(location.search);
const slotIndex=Math.min(3,Math.max(0,(Number(params.get('slot'))||1)-1));
const slotName=document.getElementById('slotName');
const currentName=document.getElementById('currentName');
const loadedCount=document.getElementById('loadedCount');
const manageButton=document.getElementById('manageButton');
const libraryPanel=document.getElementById('libraryPanel');
const libraryClose=document.getElementById('libraryClose');
const profilePicker=document.getElementById('profilePicker');
const content=document.getElementById('content');
const shareHotline=document.getElementById('shareHotline');
const shareHotlineArt=document.getElementById('shareHotlineArt');
const fullscreenClose=document.getElementById('fullscreenClose');
let currentProfile=null,currentTarget=null,profiles=[],assignments=[];
shareHotlineArt.src=`${SHARE_ASSET}?v=${Date.now()}`;
slotName.textContent=`F${slotIndex+1} // SYNDICATE SLOT`;
function initials(label,index){const v=String(label||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();return v||String(index+1).padStart(2,'0')}
function normalizeProfile(p,i){const label=String(p&&(p.name||p.label)||`PROFILE ${i+1}`);return{id:String(p&&p.id||`profile-${i+1}`),label,subtitle:String(p&&(p.title||p.subtitle||p.tagline)||'PRIVATE WIRE'),status:String(p&&p.status||'LIVE'),enabled:Boolean(p&&p.enabled!==false&&p.url),url:p&&p.url?String(p.url):null,avatar:String(p&&(p.fallback||p.avatar||p.initials)||initials(label,i)),avatarUrl:p&&(p.headshot||p.avatarUrl)?String(p.headshot||p.avatarUrl):null,avatarAlt:String(p&&(p.headshotAlt||p.avatarAlt)||`${label} headshot`),avatarPosition:String(p&&(p.headshotPosition||p.avatarPosition)||'50% 32%'),accent:String(p&&p.accent||'#c9a43b')}}
function normalizedDefaults(raw){const source=Array.isArray(raw&&raw.defaults)&&raw.defaults.length===4?raw.defaults:FALLBACK_DEFAULTS;return source.map(v=>v==null?null:String(v))}
function loadAssignments(defaults){try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(raw)&&raw.length===4)return raw.map(v=>v==null?null:String(v))}catch(e){}return defaults.slice()}
function saveAssignments(a){localStorage.setItem(STORAGE_KEY,JSON.stringify(a))}
function resolveProjectUrl(path){return new URL(path,new URL('../',location.href)).href}
function emptyProfile(index){return{id:null,label:`EMPTY ${index+1}`,subtitle:'SLOT AVAILABLE',status:'OPEN',enabled:false,url:null,avatar:String(index+1).padStart(2,'0'),avatarUrl:null,avatarAlt:'Empty syndicate slot',avatarPosition:'50% 32%',accent:'#53636b'}}
function updateLoadedCount(){loadedCount.textContent=`${assignments.filter(Boolean).length} / 4`}
function updateParentTab(tab,p,index){if(!tab)return;tab.style.setProperty('--syndicate-accent',p.accent);tab.setAttribute('aria-label',`${p.label} — ${p.subtitle} — ${p.status}`);const avatar=tab.querySelector('.syndicateAvatar');if(avatar){avatar.style.setProperty('--avatar-position',p.avatarPosition);avatar.textContent=p.avatar||String(index+1).padStart(2,'0');avatar.querySelectorAll('img').forEach(img=>img.remove());if(p.avatarUrl){const img=document.createElement('img');img.src=resolveProjectUrl(p.avatarUrl);img.alt=p.avatarAlt;img.loading='eager';img.decoding='async';img.onerror=()=>img.remove();avatar.appendChild(img)}}const name=tab.querySelector('.syndicateName');if(name)name.textContent=p.label;const subtitle=tab.querySelector('.syndicateSubtitle');if(subtitle)subtitle.textContent=p.subtitle;const status=tab.querySelector('.syndicateStatus');if(status)status.textContent=p.status}
function refreshParentTabs(){try{const d=window.parent.document;assignments.forEach((id,i)=>{const p=profiles.find(x=>x.id===id)||emptyProfile(i);updateParentTab(d.querySelector(`[data-syndicate-tab="${i}"]`),p,i)})}catch(e){}}
function openLibrary(){buildPicker();libraryPanel.hidden=false}
function closeLibrary(){libraryPanel.hidden=true}
function profileAvatarNode(p){const avatar=document.createElement('span');avatar.className='profileAvatar';avatar.style.setProperty('--avatar-position',p.avatarPosition);avatar.textContent=p.avatar||'◻';if(p.avatarUrl){const img=document.createElement('img');img.src=resolveProjectUrl(p.avatarUrl);img.alt=p.avatarAlt;img.loading='eager';img.decoding='async';img.onerror=()=>img.remove();avatar.appendChild(img)}return avatar}
function buildPicker(){profilePicker.innerHTML='';const empty=document.createElement('button');empty.type='button';empty.className='profileCard emptyCard'+(assignments[slotIndex]==null?' active':'');empty.innerHTML='<span><span class="profileName">EMPTY THIS SLOT</span><span class="profileSub">Leave this F-line available for another character later.</span></span>';empty.addEventListener('click',()=>assignToSlot(null));profilePicker.appendChild(empty);profiles.filter(p=>p.enabled).forEach(p=>{const usedAt=assignments.findIndex((id,i)=>i!==slotIndex&&id===p.id);const card=document.createElement('button');card.type='button';card.className='profileCard'+(assignments[slotIndex]===p.id?' active':'');card.style.setProperty('--accent',p.accent);card.disabled=usedAt>=0;card.appendChild(profileAvatarNode(p));const copy=document.createElement('span');const name=document.createElement('span');name.className='profileName';name.textContent=p.label;const sub=document.createElement('span');sub.className='profileSub';sub.textContent=`${p.subtitle} // ${p.status}`;const use=document.createElement('span');use.className='profileUse';use.textContent=usedAt>=0?`IN USE // F${usedAt+1}`:(assignments[slotIndex]===p.id?'LOADED HERE':'LOAD TO THIS SLOT');copy.append(name,sub,use);card.appendChild(copy);card.addEventListener('click',()=>assignToSlot(p.id));profilePicker.appendChild(card)})}
function assignToSlot(next){if(next&&assignments.some((id,i)=>i!==slotIndex&&id===next))return;assignments[slotIndex]=next;saveAssignments(assignments);refreshParentTabs();updateLoadedCount();renderProfile(profiles.find(p=>p.id===next));closeLibrary()}
function ensureParentFullscreenStyle(){try{const d=window.parent.document;if(d.getElementById('syndicateHotlineFullscreenStyle'))return;const style=d.createElement('style');style.id='syndicateHotlineFullscreenStyle';style.textContent='body.syndicateHotlineFullscreen #runnerSyndicateWorkspace{position:fixed!important;inset:0!important;z-index:9999!important;margin:0!important;padding:0!important;border:0!important;background:#01040a!important}body.syndicateHotlineFullscreen #runnerSyndicateWorkspace .syndicateTabs{display:none!important}body.syndicateHotlineFullscreen #runnerSyndicateWorkspace .syndicatePane{height:100vh!important;min-height:100vh!important;border:0!important;padding:0!important}body.syndicateHotlineFullscreen #runnerSyndicateWorkspace .syndicateFrame{display:block!important;width:100%!important;height:100vh!important;min-height:100vh!important;border:0!important}';d.head.appendChild(style)}catch(e){}}
function enterFullscreen(){if(document.body.classList.contains('hotlineFullscreen'))return;closeLibrary();document.body.classList.add('hotlineFullscreen');try{ensureParentFullscreenStyle();window.parent.document.body.classList.add('syndicateHotlineFullscreen')}catch(e){}}
function exitFullscreen(){document.body.classList.remove('hotlineFullscreen');try{window.parent.document.body.classList.remove('syndicateHotlineFullscreen')}catch(e){}}
function bindHotlineTap(frame){frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d||d.documentElement.dataset.hotlineTapBound==='1')return;d.documentElement.dataset.hotlineTapBound='1';d.addEventListener('click',e=>{const t=e.target;if(t&&t.closest&&t.closest('a,button,input,select,textarea,label,[role="button"],[contenteditable="true"]'))return;enterFullscreen()})}catch(e){}})}
async function shareCurrentHotline(){if(!currentProfile||!currentTarget)return;const data={title:`${currentProfile.label} Hotline`,text:`${currentProfile.label} — ${currentProfile.subtitle}`,url:currentTarget};try{if(navigator.share){await navigator.share(data);return}}catch(err){if(err&&err.name==='AbortError')return}window.open(currentTarget,'_blank','noopener')}
function renderProfile(profile){exitFullscreen();content.innerHTML='';currentProfile=null;currentTarget=null;shareHotline.hidden=true;if(!profile||!profile.enabled||!profile.url){currentName.textContent='EMPTY // SLOT AVAILABLE';manageButton.textContent='CHOOSE CHARACTER';const blank=document.createElement('div');blank.className='empty';blank.innerHTML='<b>EMPTY SYNDICATE SLOT</b><span>THIS LINE IS OPEN // SELECT A SAVED CHARACTER FROM YOUR LIBRARY</span>';const choose=document.createElement('button');choose.type='button';choose.textContent='CHOOSE CHARACTER';choose.addEventListener('click',openLibrary);blank.appendChild(choose);content.appendChild(blank);return}currentProfile=profile;manageButton.textContent='CHANGE CHARACTER';currentName.textContent=`${profile.label} // ${profile.subtitle}`;const frame=document.createElement('iframe');frame.className='frame';frame.title=profile.label;const target=resolveProjectUrl(profile.url);currentTarget=target;frame.src=target+(target.includes('?')?'&':'?')+'v='+Date.now();bindHotlineTap(frame);content.appendChild(frame);shareHotline.hidden=false}
manageButton.addEventListener('click',()=>libraryPanel.hidden?openLibrary():closeLibrary());libraryClose.addEventListener('click',closeLibrary);shareHotline.addEventListener('click',e=>{e.stopPropagation();shareCurrentHotline()});fullscreenClose.addEventListener('click',exitFullscreen);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!libraryPanel.hidden)closeLibrary();else exitFullscreen()}});
async function boot(){const res=await fetch(`${MANIFEST}?v=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(`manifest ${res.status}`);const raw=await res.json();profiles=(Array.isArray(raw.profiles)?raw.profiles:Array.isArray(raw.slots)?raw.slots:[]).map(normalizeProfile);const defaults=normalizedDefaults(raw);assignments=loadAssignments(defaults);assignments=assignments.map(id=>profiles.some(p=>p.id===id)?id:null);saveAssignments(assignments);refreshParentTabs();updateLoadedCount();renderProfile(profiles.find(p=>p.id===assignments[slotIndex]));window.addEventListener('storage',e=>{if(e.key!==STORAGE_KEY)return;assignments=loadAssignments(defaults);refreshParentTabs();updateLoadedCount();buildPicker();renderProfile(profiles.find(p=>p.id===assignments[slotIndex]))})}
boot().catch(err=>{currentName.textContent='LOAD FAILED';shareHotline.hidden=true;content.innerHTML=`<div class="empty"><b>SYNDICATE LOAD FAILED</b><span>${String(err.message||err)}</span></div>`});
</script>
</body>
</html>
