name: V1.8 SmartStake Full Audit

on:
  push:
    paths:
      - '.github/workflows/v18-smartstake-full-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb==1.5.5 huggingface_hub

      - name: Execute full SmartStake audit
        env:
          HF_HUB_DISABLE_XET: '0'
        run: python research/staging/run_v18_smartstake_full_audit.py

      - name: Commit audit results
        run: |
          git config user.name "betting-edge-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/staging/V1_8_SMARTSTAKE_MLB_AUDIT_RESULTS.json
          git add research/staging/V1_8_SMARTSTAKE_MLB_AUDIT_RESULTS.md
          if git diff --cached --quiet; then
            echo "No audit-result changes to commit."
            exit 0
          fi
          git commit -m "Record v1.8 SmartStake MLB full audit results"
          git pull --rebase origin main
          git push origin HEAD:main
